# CodeRabbit configuration for Hoserva (issue #143).
#
# Scopes automated PR review to this repo's own conventions instead of
# un-tuned defaults: reviews are grounded in CLAUDE.md, generated and
# recorded-experiment paths are excluded from review noise, and the repo's
# own lint tooling is reused rather than a second, inconsistent opinion.
language: en-US

tone_instructions: >
  Hoserva is a home server platform for mixed-size disks. When referencing
  other projects (e.g. Unraid) in review comments, be factual only — no
  disparaging remarks about other projects or their users.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "CLAUDE.md"

reviews:
  profile: "chill"
  auto_review:
    enabled: true
  path_filters:
    # Recorded experiment evidence, not maintained code (CLAUDE.md,
    # "Spikes") — the same exclusion .golangci.yml already makes for lint.
    - "!spikes/**"
    # Generated API types and DB migrations — reviewed as large mechanical
    # diffs, never hand-edited (docs/internal/12-repo-architecture.md).
    - "!api/gen/**"
    - "!internal/store/migrations/**"
  path_instructions:
    - path: "internal/disk/**"
      instructions: >
        Flag any shell interpolation of user or template input (e.g.
        sh -c with a built string). Commands must be parsed into structured
        arguments and executed with exec as an argv, never through a shell.
    - path: "internal/store/migrations/**"
      instructions: >
        These files are generated by `make db-migration` and are immutable
        once committed. Flag any hand-edit to an existing migration file,
        and flag any migration that drops data or changes a column type
        without the data already having a new home (expand/contract only).
    - path: "internal/store/schema/**"
      instructions: >
        Schema changes must be paired with a generated migration via
        `make db-migration` — flag a schema change with no corresponding
        migration in the same PR.
    - path: "api/openapi.yaml"
      instructions: >
        This is the hand-written API contract and the whole API (D18).
        Flag any handler-side capability that doesn't appear here first,
        and any generated client bypass in web/ or cmd/hoserva/.
  tools:
    golangci-lint:
      enabled: true
      config_file: ".golangci.yml"
    actionlint:
      enabled: true
