# CodeRabbit configuration for Hoserva (issue #143).
#
# Scopes automated PR review to this repo's own conventions instead of
# un-tuned defaults: reviews are grounded in CLAUDE.md and the area docs,
# generated and recorded-experiment paths are excluded from review noise,
# and the repo's own lint tooling is reused rather than a second opinion.
#
# path_filters also drive CodeRabbit's sparse-checkout. Do not exclude a
# path that another instruction needs to inspect (PRs #166, #177, #182:
# excluding migrations made every schema.sql pairing check a false positive).
language: en-US

tone_instructions: >
  Hoserva is a home server platform for mixed-size disks. When referencing
  other projects (e.g. Unraid) in review comments, be factual only — no
  disparaging remarks about other projects or their users.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "CLAUDE.md"
      - files: "docs/internal/02-storage-engine.md"
        applyTo: "internal/{disk,pool,parity,cache}/**"
      - files: "docs/internal/03-webui-spec.md"
        applyTo: "web/**"

reviews:
  profile: "chill"
  auto_review:
    enabled: true
  instructions: >
    Do not request comments, JSDoc, or docstrings. Hoserva comments only
    when the why is non-obvious.

    Do not reopen settled decisions (D1–D20 in CLAUDE.md / doc 00). Flag a
    divergence from a decision, not a preference for a different one.

    Do not flag work the PR, linked issue, or in-code comment defers to a
    later phase or a separately tracked issue.

    Never interpolate user or template input into a shell command. Commands
    must be parsed into structured arguments and executed with exec as an
    argv, never sh -c.
  path_filters:
    # Recorded experiment evidence, not maintained code (CLAUDE.md, "Spikes")
    # — the same exclusion .golangci.yml already makes for lint.
    - "!spikes/**"
    # Generated API types — large mechanical diffs, never hand-edited
    # (docs/internal/12-repo-architecture.md). Default !**/gen/** also
    # covers this; kept explicit.
    - "!api/gen/**"
    # sqlc-generated Go (D16 / Q60). Review internal/store/queries/ instead.
    - "!internal/store/db/**"
  path_instructions:
    - path: "internal/store/migrations/**"
      instructions: >
        These files are generated by `make db-migration` and are immutable
        once committed. Do not review generated SQL for style, naming, or
        formatting. Flag only: (1) a modification of an already-committed
        migration file (new files in this PR are expected); (2) a DROP
        TABLE, DROP COLUMN, or column type change whose data does not
        already have a new home (expand/contract only).
    - path: "internal/store/schema/**"
      instructions: >
        schema.sql is the only hand-edited schema (D16). A change here must
        be paired with a *new* file under internal/store/migrations/ in the
        same PR — look in the checkout and the PR file list; do not treat
        that directory as empty. If a new timestamped *.sql exists there,
        pairing is satisfied: do not comment. Flag only when schema.sql
        changed and no new migration file is present. Never ask anyone to
        hand-write a migration; the generator is `make db-migration`. CI
        `make db-check` is the source of truth for journal/schema agreement.
    - path: "internal/store/queries/**"
      instructions: >
        Hand-written sqlc input. Put a query's only comment, if any, above
        its `-- name:` line, never between that line and the SQL. Keep these
        files ASCII-only, or confine non-ASCII to the file's last query
        (sqlc v1.31.1 otherwise truncates later queries with no build error).
    - path: "api/openapi.yaml"
      instructions: >
        This is the hand-written API contract and the whole API (D18).
        Flag any handler-side capability that doesn't appear here first,
        and any generated client bypass in web/ or cmd/hoserva/.
    - path: "web/src/components/ui/**"
      instructions: >
        These are coss UI primitives added with the shadcn CLI (D15), not
        Hoserva application code. Do not flag generic accessibility, styling,
        or API nits that belong upstream. Flag only Hoserva-local edits that
        diverge from the registry without a documented reason.
    - path: "web/src/**"
      instructions: >
        Every user-visible string goes through the i18n catalog (Q48). Do
        not introduce a second component library, and do not hand-roll a
        control coss already provides (D15). Call the API only through the
        generated client (D18).
  finishing_touches:
    docstrings:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  tools:
    golangci-lint:
      enabled: true
      config_file: ".golangci.yml"
    actionlint:
      enabled: true
