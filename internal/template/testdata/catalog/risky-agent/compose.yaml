# Test fixture, not a curated template: asks for everything the privilege
# summary reports. It declares none of it; the summary is read from here.
services:
  agent:
    image: registry.example.com/agent/agent:1.0.0
    privileged: true
    network_mode: host
    pid: host
    cgroup: host
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA}/agent:/config
      - ${HOST_DATA}:/host-data:ro
    restart: unless-stopped

x-hoserva:
  schema: 1
  id: risky-agent
  revision: 1
  title: Risky agent
  categories: [system]
  icon: icon.svg
  docs: https://example.com/agent/docs
  inputs:
    APPDATA:   { kind: path, role: appdata, default: /mnt/cache/appdata }
    HOST_DATA: { kind: path, role: share, default: /mnt/user/data }
