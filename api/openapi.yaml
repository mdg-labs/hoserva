        name:
          type: string
        health:
          $ref: '#/components/schemas/AppHealth'
        image:
          type: string
          description: The image repository, without its tag.
        tag:
          type: string
        state:
          $ref: '#/components/schemas/AppState'
        status:
          type: string
          description: Human-readable Engine status, e.g. "Up 3 hours".
        ports:
          type: array
          items:
            $ref: '#/components/schemas/AppPort'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/AppMount'

    ListAppsOK:
      type: object
      required: [available, apps]
      properties:
        available:
          type: boolean
          description: False when the Docker Engine is not reachable (doc 04 §3).
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        apps:
          type: array
          items:
            $ref: '#/components/schemas/App'

    ListAppUpdatesOK:
      type: object
      required: [available, updates]
      properties:
        available:
          type: boolean
          description: False when the Docker Engine is not reachable (doc 04 §3).
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        updates:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdate'

    AppUpdate:
      type: object
      required: [container, image, tag, status]
      properties:
        container:
          type: string
          description: The container's name.
        bulkExcluded:
          type: boolean
          description: >-
            True when the container opted out of bulk updates
            (`setAppUpdatePolicy`); `startAppUpdates` with no named
            containers skips it. The daemon always sets it.
        image:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [up_to_date, update_available, skipped, failed, not_checked]
        kind:
          type: string
          enum: [new_build, new_version]
          description: >-
            Set with status update_available. new_build: the registry serves
            a different build under the same tag (the `latest` case).
            new_version: a newer version tag exists, named by availableTag.
        availableTag:
          type: string
          description: Set with kind new_version.
        message:
          type: string
          description: Why the check was skipped or failed, or what it could not look for.
        checkedAt:
          type: string
          format: date-time
          description: When the image was last checked; absent when no check has reached the image.

    StartAppUpdatesRequest:
      type: object
      properties:
        containers:
          type: array
          items:
            type: string
          description: >-
            Container names or Engine IDs to update. Omitted or empty means
            every container with an update available that has not opted out.
          uniqueItems: true

    StartAppUpdatesOK:
      type: object
      required: [containers, skipped]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        containers:
          type: array
          items:
            type: string
          description: The containers the job updates, in the order it does.
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdateSkipped'

    AppUpdateSkipped:
      type: object
      required: [container, reason]
      properties:
        container:
          type: string
        reason:
          type: string
          description: Why a bulk update left the container out.

    SetAppUpdatePolicyRequest:
      type: object
      required: [bulkExcluded]
      properties:
        bulkExcluded:
          type: boolean

    AppUpdatePolicy:
      type: object
      required: [container, bulkExcluded]
      properties:
        container:
          type: string
          description: The container's name.
        bulkExcluded:
          type: boolean

    AppSettings:
      type: object
      required: [imageKeepDays]
      properties:
        imageKeepDays:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            How many days the image a container ran before an update is kept
            locally for a revert.

    AppUpdateRecord:
      type: object
      required: [id, container, image, previousImageId, updatedAt, keepUntil, revertible]
      properties:
        id:
          type: integer
          format: int64
        container:
          type: string
          description: The container's name.
        image:
          type: string
          description: The image reference the container runs, "repository:tag".
        previousImageId:
          type: string
          description: The Engine ID of the image the container ran before the update.
        snapshotArchive:
          type: string
          description: >-
            The appdata archive taken just before the update; absent when the
            container has no appdata on the cache disk.
        snapshotDestinationId:
          type: string
          description: The backup destination that holds `snapshotArchive`.
        updatedAt:
          type: string
          format: date-time
        keepUntil:
          type: string
          format: date-time
          description: Until when the previous image is kept.
        revertedAt:
          type: string
          format: date-time
          description: When the update was reverted; absent until it was.
        revertible:
          type: boolean

    ListAppUpdateHistoryOK:
      type: object
      required: [available, records]
      properties:
        available:
          type: boolean
          description: False when the Docker Engine is not reachable (doc 04 §3).
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        records:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdateRecord'

    AppImage:
      type: object
      required: [id, repoTags, sizeBytes]
      properties:
        id:
          type: string
        repoTags:
          type: array
          items:
            type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    ListAppImagesOK:
      type: object
      required: [available, images]
      properties:
        available:
          type: boolean
          description: False when the Docker Engine is not reachable (doc 04 §3).
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        images:
          type: array
          items:
            $ref: '#/components/schemas/AppImage'

    MetricResolution:
      type: string
      enum: [raw, hourly, daily]
      description: Q74 retention tier used for this response.

    MetricPoint:
      type: object
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
          format: double

    MetricSeries:
      type: object
      required: [metric, subject, resolution, from, to, points]
      properties:
        metric:
          type: string
        subject:
          type: string
        resolution:
          $ref: '#/components/schemas/MetricResolution'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    SystemStatus:
      type: object
      required: [healthy, summary]
      properties:
        healthy:
          type: boolean
        summary:
          type: string
        maintenanceMode:
          type: boolean
        arrayDegraded:
          type: boolean
          description: >-
            True whenever any disk `hoservad` expects is currently missing
            by identity (doc 02 §1, Q69) — including once the user has
            acknowledged the degraded state through `POST
            /array/degraded/acknowledge`. It clears only once the missing
            disk actually reappears; `arrayDegradedAcknowledged` is what
            distinguishes an acknowledged degraded array from one still
            waiting on the user.
        arrayDegradedAcknowledged:
          type: boolean
          description: >-
            True once the user has acknowledged the current degraded state
            (`hoserva array acknowledge-degraded`) — only meaningful while
            `arrayDegraded` is also true. It resets the moment the missing
            disk reappears, the same way the acknowledgement itself does.
            It can be true while `storageServicesReleased` is still false:
            the acknowledgement stands even when the transition it
            triggers does not actually start anything (maintenance mode,
            or a mount failure, `array_services_not_started`) — a client
            must never read this field alone as "services are running"
            (#385 finding 2).
        storageServicesReleased:
          type: boolean
          description: >-
            True once `hoservad`'s storage-target gate has actually
            released Samba, NFS, Docker and libvirt — read live from the
            same runtime flag (`/run/hoserva/storage-ready`) hoservad
            itself sets only after mounting and confirming the pool — and
            the array is not currently in maintenance mode. This is the
            field a client checks before ever telling the user services
            are running; `arrayDegradedAcknowledged` alone only reports
            the acknowledgement, not whether it took effect (#385 finding
            2). It goes false again the moment `array stop` enters
            maintenance mode, even while the runtime flag from an earlier
            acknowledgement is still set — an explicit stop takes those
            services back down, so a standing acknowledgement must never
            be read as "still running".
        parityBlocked:
          type: boolean
        activeJobs:
          type: integer
          format: int32

    PoolDiskEntry:
      type: object
      required: [device, mountPoint, role, state]
      properties:
        device:
          type: string
        mountPoint:
          type: string
        role:
          type: string
          enum: [data, parity, cache, boot, external, unassigned]
        state:
          $ref: '#/components/schemas/DiskState'
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        usedBytes:
          type:
            - integer
            - "null"
          format: int64
        freeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Free space from statfs(2) on this disk's mountpoint (doc 09 §5)
            — never a directory walk. Null for a non-data disk, or when
            free-space accounting is unavailable (no array topology yet).
        nearMinFreeSpace:
          type: boolean
          description: >-
            True once this disk's free space is at or below the pool's
            configured minfreespace (doc 09 §1) — the point mergerfs itself
            excludes it from create-policy placement. Omitted when
            freeBytes is not being reported for this disk.
        removalState:
          oneOf:
            - $ref: '#/components/schemas/DiskRemovalState'
            - type: "null"
          description: >-
            doc 09 §4 step 2's own removal state (#359) for this disk.
            Null for a disk that is not currently in removal.
        finishConfirmation:
          type: string
          description: >-
            The exact typed phrase `finishDiskRemoval` requires for this
            disk (#361), set whenever `removalState` is set. Reading it
            here rather than from `planDiskEvacuation` is what lets
            Finish removal be retried once the disk has left the pool
            (`unpooled`/`unlisted`) — `planDiskEvacuation` itself refuses
            those states with `disk_leaving_array`, since evacuating a
            disk that has already left the pool makes no sense, but the
            confirmation phrase does not depend on evacuating it again.

    PoolStatus:
      type: object
      required: [mounted, disks]
      properties:
        mounted:
          type: boolean
        disks:
          type: array
          items:
            $ref: '#/components/schemas/PoolDiskEntry'
        poolFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Sum of data-disk free space (doc 09 §5) — distinct from a `df`
            on the pool mount, which reports the same misleading pool-wide
            total this field exists to be shown alongside rather than
            replace. Null when no array topology is configured yet.
        largestDiskFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            The largest single data disk's free space — the real answer to
            "what is the biggest file I can write" (doc 09 §5).
        largestDiskPath:
          type:
            - string
            - "null"
          description: Mountpoint of the disk largestDiskFreeBytes refers to.

    SpinTransition:
      type: object
      required: [device, fromState, toState, at]
      properties:
        device:
          type: string
          description: e.g. `/dev/sdb` — as recorded, never accepted back as input (doc 01 §7).
        fromState:
          type: string
          enum: [active, standby]
        toState:
          type: string
          enum: [active, standby]
        at:
          type: string
          format: date-time
        awakeDurationSeconds:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Present when this row is a wake (standby → active) and a later
            active → standby transition exists for the same device; seconds
            until that transition.

    DailyWakeCount:
      type: object
      required: [device, date, count]
      properties:
        device:
          type: string
        date:
          type: string
          format: date
          description: UTC calendar day the wakes occurred on.
        count:
          type: integer
          format: int32
          minimum: 0

    WakeEventsResponse:
      type: object
      required: [events, dailyWakeCounts]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpinTransition'
        dailyWakeCounts:
          type: array
          items:
            $ref: '#/components/schemas/DailyWakeCount'

    DiskInventoryEntry:
      type: object
      required: [device, sizeBytes, boot]
      properties:
        device:
          type: string
        sizeBytes:
          type: integer
          format: int64
        model:
          type: string
        serial:
          type: string
        wwn:
          type: string
        boot:
          type: boolean
        failed:
          type: boolean
        weakIdentity:
          type: boolean
        filesystem:
          type: string
          description: >-
            Cached filesystem type from udev (`ID_FS_TYPE`), never probed
            in a way that wakes a standby disk (doc 02 §1, §4, doc 03 §3.1).
        label:
          type: string
          description: Cached filesystem label from udev (`ID_FS_LABEL`).
        smartStatus:
          type: string
          description: >-
            SMART summary from a standby-respecting poll. `standby` when
            the disk was left asleep; `ok` or `failing` from a real read.
        containsData:
          type: boolean
          description: True when udev reports an existing filesystem on the disk.
        looksLikeUnraid:
          type: boolean
          description: >-
            True when the filesystem label matches Unraid's `diskN` /
            `parity` / `cache` naming (doc 05) — a conservative heuristic
            that never mounts the disk to look for `super.dat`.

    ExternalDiskLabel:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      description: Path segment under `/mnt/disks/` (Q72).

    ExternalDisk:
      type: object
      required: [label, device, mountPoint, containerPath, mounted, backupDestination, boot]
      properties:
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        device:
          type: string
        mountPoint:
          type: string
          description: >-
            /mnt/disks/<label> — mounted on request, never automatically.
        containerPath:
          type: string
          description: >-
            The same /mnt/disks/<label> path, exposed as a stable
            bind-mount source for a container (Q72, Unraid Unassigned
            Devices convention).
        mounted:
          type: boolean
        backupDestination:
          type: boolean
          description: Whether this disk's mount is a local backup destination (doc 10 §1).
        boot:
          type: boolean
          description: Always false — the boot device is never offered as external.
        filesystem:
          type: string
        fsUuid:
          type: string
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        model:
          type: string
        serial:
          type: string

    RegisterExternalDiskRequest:
      type: object
      required: [device, label]
      properties:
        device:
          type: string
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        backupDestination:
          type: boolean
          default: false

    UpdateExternalDiskRequest:
      type: object
      properties:
        backupDestination:
          type: boolean

    FormatExternalDiskRequest:
      type: object
      required: [confirmation]
      properties:
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this disk
            (`disk.TopologyPlan.Confirmation`): `ERASE /dev/sdX`. A wrong
            or missing string is refused and formats nothing.

    ArrayDiskRole:
      type: string
      description: A role the array-setup wizard assigns (doc 03 §3.1 step 2). Ignore is omitted — those disks never appear in the plan.
      enum: [parity, data, cache]

    ArrayDiskFilesystem:
      type: string
      description: Filesystem to format with, or to verify when adopt is true (Q23). Parity is always xfs (Q20).
      enum: [xfs, ext4, btrfs]

    ArrayCreatePolicy:
      type: string
      description: Default mergerfs create policy for new shares (doc 02 §1, Q11).
      enum: [mspmfs, mfs, lfs, ff]

    ArrayDiskAssignment:
      type: object
      required: [device, role]
      properties:
        device:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (data and cache only; Q20 forbids this on parity).

    CreateArrayRequest:
      type: object
      required: [disks, confirmation]
      properties:
        disks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ArrayDiskAssignment'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        minFreeSpace:
          type: string
          description: >-
            mergerfs minfreespace in its size-suffix syntax (doc 02 §1),
            e.g. `50G`. Omitted uses the engine default.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this plan (doc 03 §3.1 step 6):
            `ERASE /dev/sda, /dev/sdb` listing every device that will be
            formatted, sorted, or `ADOPT ONLY — NOTHING ERASED` when every
            assigned disk is adopted. A wrong or missing string is refused
            and formats nothing.

    AddDiskPlanRequest:
      type: object
      required: [device]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (Q23).

    AddDiskPlan:
      type: object
      required: [device, filesystem, adopt, mountpoint, confirmation]
      properties:
        device:
          type: string
        model:
          type: string
          description: The target disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The disk's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        mountpoint:
          type: string
          description: >-
            The next free `/mnt/diskN` this disk will be mounted at
            (doc 02 §4 "Adding a disk" step 4).
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `addDisk` requires for this plan:
            `ERASE <device>`, or `ADOPT ONLY — NOTHING ERASED` when adopt
            is true.

    AddDiskRequest:
      type: object
      required: [device, confirmation]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskAdd` call.
            A wrong or missing string is refused and formats nothing.

    ReplaceDiskPlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: The existing data disk slot being replaced, e.g. `/mnt/disk2`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (Q23).

    ReplaceDiskPlan:
      type: object
      required: [mountpoint, previousDevice, replacementDevice, filesystem, adopt, rebuild, confirmation]
      properties:
        mountpoint:
          type: string
        previousDevice:
          type: string
          description: The device on record for this slot before the replacement.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        rebuild:
          type: string
          description: >-
            The SnapRAID command this plan's own apply call runs to
            reconstruct the slot's contents from parity (doc 02 §4
            "Replacing a failed disk" step 4), e.g. `snapraid fix -d d2`.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `replaceDisk` requires for this plan:
            `ERASE <replacementDevice>`, or `ADOPT ONLY — NOTHING ERASED`
            when adopt is true.

    ReplaceDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskReplace`
            call. A wrong or missing string is refused and formats
            nothing.

    DiskUpgradePlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: >-
            The existing array slot being upgraded, data or parity, e.g.
            `/mnt/disk2` or `/mnt/parity1`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
          description: >-
            Data-disk upgrades only (default xfs); a parity disk is
            always formatted XFS (Q20) regardless of this field.

    DiskUpgradePlan:
      type: object
      required: [mountpoint, role, previousDevice, replacementDevice, filesystem, steps, confirmation]
      properties:
        mountpoint:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        previousDevice:
          type: string
          description: The device on record for this slot before the upgrade.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          description: >-
            Parity upgrades only: the fresh `/mnt/parityN` slot the new
            disk will be formatted, mounted and verified at independently
            of the old one (Q71), submitted back unchanged to `upgradeDisk`.
        steps:
          type: array
          items:
            type: string
          description: >-
            The copy/verify/remount steps (data) or copy/verify/switch/check
            steps (parity) this plan's own apply call runs, in order.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `upgradeDisk` requires for this plan:
            `ERASE <replacementDevice>`.

    UpgradeDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          description: >-
            Required, and must equal the matching `planDiskUpgrade` call's
            own `newMountpoint`, when `mountpoint` names a parity slot.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskUpgrade`
            call. A wrong or missing string is refused and formats
            nothing.

    RebalanceMove:
      type: object
      description: One file a rebalance or evacuation plan moves (doc 09 §3-4).
      required: [share, relPath, sourceBranch, targetBranch, sizeBytes]
      properties:
        share:
          type: string
        relPath:
          type: string
          description: Path relative to the share root.
        sourceBranch:
          type: string
          description: >-
            The share-scoped branch directory the file currently lives on,
            e.g. `/mnt/disk1/media`.
        targetBranch:
          type: string
        sizeBytes:
          type: integer
          format: int64

    RebalanceWarning:
      type: object
      description: >-
        A condition a rebalance or evacuation plan surfaces for review
        before it runs (doc 09 §3's path-preserving caveat) — never
        something the plan itself acts on.
      required: [share, reason]
      properties:
        share:
          type: string
        reason:
          type: string

    RebalancePlan:
      type: object
      required: [moves, warnings, confirmation]
      properties:
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `startRebalance` requires for this
            plan (`REBALANCE`).

    StartRebalanceRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planRebalance`
            call (`REBALANCE`). A wrong or missing string is refused and
            nothing runs.

    EvacuationPlan:
      type: object
      required: [mountpoint, moves, warnings, nonSharePaths, confirmation]
      properties:
        mountpoint:
          type: string
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        nonSharePaths:
          type: array
          items:
            type: string
          description: >-
            Every top-level entry on the disk's own mountpoint that is
            neither a configured share's own branch there nor SnapRAID's
            own bookkeeping (`lost+found`, `snapraid.content*`) — content
            doc 09 §4 has no procedure for moving (#367). Always empty on
            a plan this operation actually returns: any such content
            refuses the plan outright (`EvacuationPlanRefusal`) instead.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `evacuateDisk` requires for this
            plan (`REMOVE <mountpoint>`).

    EvacuationPlanRefusal:
      type: object
      required: [code, message, nonSharePaths]
      description: >-
        `planDiskEvacuation`'s 400 refusal (#367): the shared `Error`
        schema has no room for `nonSharePaths`, so a refusal caused by
        non-share content on the disk gets its own body naming every
        offending path structurally, not only in `message`.
      properties:
        code:
          type: string
        message:
          type: string
        nonSharePaths:
          type: array
          items:
            type: string
          description: >-
            Every top-level entry on the disk's own mountpoint that is
            neither a configured share's own branch there nor SnapRAID's
            own bookkeeping — empty when the refusal has a different
            cause (no other branch, an unsupported entry, or the
            remaining disks not having room).

    EvacuateDiskPlanRequest:
      type: object
      required: [mountpoint]
      properties:
        mountpoint:
          type: string
          description: The data disk slot to evacuate, e.g. `/mnt/disk3`.

    FinishDiskRemovalRequest:
      type: object
      required: [mountpoint, confirmation]
      properties:
        mountpoint:
          type: string
          description: The evacuated data disk's slot, e.g. `/mnt/disk3`.
        confirmation:
          type: string
          description: >-
            `REMOVE <mountpoint>` — the phrase `planDiskEvacuation`
            returned for this disk. A wrong or missing string is refused
            and nothing runs.

    CancelDiskRemovalRequest:
      type: object
      required: [mountpoint]
      properties:
        mountpoint:
          type: string
          description: The data disk slot to stop removing, e.g. `/mnt/disk3`.

    EvacuateDiskRequest:
      type: object
      required: [mountpoint, confirmation]
      properties:
        mountpoint:
          type: string
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching
            `planDiskEvacuation` call. A wrong or missing string is
            refused and nothing runs.

    ParityFreshness:
      type: string
      description: Parity age from `snapraid status` (doc 02 §2).
      enum: [green, amber, red]

    ParityGuardTrigger:
      type: string
      enum: [removed-count, removed-updated-percent, zero-files]

    ParityZeroFilesDisk:
      type: object
      required: [disk, filesBefore]
      properties:
        disk:
          type: string
          description: Data-disk mount point.
        filesBefore:
          type: integer
          format: int32

    ParityGuardState:
      type: object
      required: [wouldBlock]
      properties:
        wouldBlock:
          type: boolean
          description: True when the threshold guard would block a sync (doc 02 §2).
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/ParityGuardTrigger'
        removedCount:
          type: integer
          format: int32
          description: Accounted-for removals compared against the removed-count threshold.
        removedUpdatedPercent:
          type: number
          format: float
          description: Accounted removals plus updated, as a percent of files before the diff.
        zeroFilesDisks:
          type: array
          items:
            $ref: '#/components/schemas/ParityZeroFilesDisk'
        summary:
          type: string
          description: Plain-language why the guard would block, when wouldBlock is true.

    ParityDiffCategory:
      type: string
      description: One doc 02 §2 diff group; moved-by-Hoserva is Q15's relocation manifest match.
      enum: [removed, updated, added, moved, copied, moved_by_hoserva]

    ParityDiffGroup:
      type: object
      required: [category, count, paths]
      properties:
        category:
          $ref: '#/components/schemas/ParityDiffCategory'
        count:
          type: integer
          format: int32
        paths:
          type: array
          items:
            type: string
          description: >-
            `mount/relative` paths when SnapRAID named individual files.
            Empty when only an aggregate count is known (updated, moved).

    ParitySnapshot:
      type: object
      required: [freshness]
      properties:
        freshness:
          $ref: '#/components/schemas/ParityFreshness'
        lastSyncAt:
          type: string
          format: date-time
          description: Last successful sync, when known.
        changedSinceSync:
          type: integer
          format: int32
          description: Files changed since last sync (`status` / change journal).
        dataDisks:
          type: integer
          format: int32
        parityDisks:
          type: integer
          format: int32
        guard:
          $ref: '#/components/schemas/ParityGuardState'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
          description: Present after the last explicit run-diff; omitted until then.

    ParityDiffResult:
      type: object
      required: [groups, guard]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
        guard:
          $ref: '#/components/schemas/ParityGuardState'

    StartSyncRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        confirm:
          type: boolean
          default: false
          description: Required true to sync past a tripped threshold guard.

    StartScrubRequest:
      type: object
      properties:
        percent:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Scrub percentage cap (doc 01 §3 `hoserva scrub [--percent N]`).

    StartFixRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — fix rewrites data from parity.
        disk:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Data disk number N (`/mnt/diskN`), fixed only on that disk
            (`hoserva fix --disk N`).

    StartShareRelocationRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [cache, array]
          description: >-
            Relocation direction (doc 09 §2, `hoserva share relocate
            <share> --to cache|array`).

    StopArrayRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: >-
            Must be true after reviewing the Q70 stop list the `/storage`
            confirm dialog already shows: refuse new jobs and interrupt
            non-resumable jobs, shut down running VMs, stop containers,
            stop Samba and NFS, then unmount share paths, the catch-all
            and data disks.

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256

    ShareName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      description: >-
        A share name is a single path segment on every branch and under
        `/mnt/user` (`pool.ValidateShareName`).

    ShareCacheMode:
      type: string
      description: Per-share cache mode (doc 02 §3, Q12).
      enum: [cache-then-move, cache-only, array-only]

    ShareSMB:
      type: object
      required: [enabled, guest, readOnly, browseable, recycle, timeMachine]
      properties:
        enabled:
          type: boolean
        guest:
          type: boolean
        readOnly:
          type: boolean
        browseable:
          type: boolean
        recycle:
          type: boolean
        timeMachine:
          type: boolean
        timeMachineMaxSize:
          type:
            - string
            - "null"
          description: >-
            Samba `fruit:time machine max size` (Q73), e.g. `500G`.
            Required when timeMachine is true; omitted otherwise.

    ShareNFS:
      type: object
      required: [enabled, hosts, squash]
      properties:
        enabled:
          type: boolean
        hosts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 253
          description: >-
            Allowed NFS clients: DNS hostnames, IPv4 or IPv6 addresses,
            or CIDR subnets (doc 03 §4.2). Required when enabled is true.
        squash:
          type: string
          description: NFS squash option (doc 03 §4.2).
          enum: [root_squash, no_root_squash, all_squash]
        fsid:
          type: string
          format: uuid
          readOnly: true
          description: >-
            The fsid= value RenderNFSExports writes for this share's
            export line (#350, #351). Derived from the share name only;
            ignored on a create or update request. Always present on a
            response — a draft preview can use the saved share's fsid
            because a share cannot be renamed.

    ShareDiskUsage:
      type: object
      required: [disk, bytes]
      properties:
        disk:
          type: string
          description: Data disk mount point currently holding files for this share.
        bytes:
          type: integer
          format: int64
          minimum: 0

    ShareUsage:
      type: object
      required: [totalBytes, perDisk, asOf]
      description: >-
        Bytes used and per-disk distribution as of the last sync
        (doc 02 §1 line 78, doc 03 §4.1-4.2, #223) — computed once as a
        step of the sync job, from SnapRAID's own tracked state, never a
        live directory walk.
      properties:
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        perDisk:
          type: array
          items:
            $ref: '#/components/schemas/ShareDiskUsage'
          description: >-
            Which disks currently hold this share's files, and how much
            (doc 03 §4.2). A disk this share does not currently occupy is
            simply absent, not a zero entry.
        asOf:
          type: string
          format: date-time
          description: When the sync that produced these figures completed.

    MoverSkippedEntry:
      type: object
      required: [share, path, result]
      description: >-
        One file the mover chose not to move (or could not move), with
        why (doc 09 §2, doc 03 §3.6's skipped-because-in-use list).
      properties:
        share:
          type: string
        path:
          type: string
          description: Path relative to the share root.
        bytes:
          type: integer
          format: int64
          minimum: 0
        result:
          type: string
          description: >-
            The mover's own result code (e.g. skipped_open,
            skipped_grace_period, conflict).
        reason:
          type: string
          description: Optional human detail (error text or skip reason).

    MoverRunResult:
      type: object
      required: [startedAt, finishedAt, durationMs, filesMoved, bytesMoved, interrupted, skipped]
      description: >-
        Structured outcome of one finished mover run (#273, doc 09 §2),
        persisted in SQLite rather than only in the job log.
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
        filesMoved:
          type: integer
          format: int32
          minimum: 0
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
        interrupted:
          type: boolean
          description: True when the run stopped early (cancel, stop, or context).
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MoverSkippedEntry'

    CacheUsageBreakdown:
      type: object
      required: [appdataBytes, pendingMovesBytes, otherBytes, computedAt]
      description: >-
        Cache disk byte breakdown for the cache page (doc 03 §3.6),
        computed as a by-product of each mover run (Q87) — never a live
        directory walk on a timer (Q13).
      properties:
        appdataBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes under cache-only shares (appdata and similar).
        pendingMovesBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Bytes still under cache-then-move shares, waiting for a
            future mover pass.
        otherBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Remaining used bytes on the cache filesystem (statfs used
            minus appdata and pending), including non-share paths.
        computedAt:
          type: string
          format: date-time

    Share:
      type: object
      required: [name, path, cacheMode, createPolicy, smb, nfs, usage, createdAt, updatedAt]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        path:
          type: string
          description: The share's mount path (`/mnt/user/<name>`, D10).
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ShareUsage'
          description: >-
            Null when this share has not been through a sync since it was
            created — an honest "not yet synced" state (doc 03 §4.1-4.2),
            never a zero or placeholder that looks like real data.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateShareRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    UpdateShareRequest:
      type: object
      properties:
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    ConfirmShareRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — removes the share definition only.

    DeleteShareDataRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must equal the share name (doc 03 §4.2 typed-confirm).

    ShareBrowseEntry:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, directory]
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        disk:
          type: string
          description: >-
            Holding disk from mergerfs `user.mergerfs.basepath`. Empty
            when the xattr is absent.

    ShareBrowseResult:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
          description: Listed directory, relative to the share root.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShareBrowseEntry'

    UserSummary:
      type: object
      required: [id, username, role, totpEnrolled, hasCredential, lastLogin, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.
        hasCredential:
          type: boolean
          description: >-
            Whether a Samba/password credential (SMB access) is currently
            provisioned for this account (doc 03 §7). Set the first time
            setUserPassword succeeds for it; there is no separate action
            that clears it short of deleting the account.
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this account last completed sign-in, tracked at
            authentication time — never derived from whether a session is
            still live (doc 03 §7). Null when it has never signed in.
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        role:
          type: string
          description: Defaults to share-only when omitted (Q27).
          enum: [viewer, share-only]

    UpdateUserRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, share-only]

    SetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 127
          description: >-
            Capped at 127 characters, not LoginRequest's 1024: this
            password is also written to the Samba passdb entry, and
            smbpasswd/pdbedit's own NTLM hash has never supported more.

    ShareAccessLevel:
      type: string
      description: Q27, doc 03 §7 — a user or group's access to one share.
      enum: [none, read-only, read-write]

    UserSharePermission:
      type: object
      required: [shareName, access]
      properties:
        shareName:
          $ref: '#/components/schemas/ShareName'
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    UserSharePermissionsResult:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UpdateUserSharePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UserPermissionEntry:
      type: object
      required: [userId, username, access]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    GroupPermissionEntry:
      type: object
      required: [groupId, name, access]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    SharePermissionsResult:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserPermissionEntry'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPermissionEntry'

    UpdateSharePermissionsRequest:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            type: object
            required: [userId, access]
            properties:
              userId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'
        groups:
          type: array
          items:
            type: object
            required: [groupId, access]
            properties:
              groupId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'

    UserGroup:
      type: object
      required: [id, name, memberUserIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberUserIds:
          type: array
          items:
            type: string
            format: uuid

    CreateUserGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    SetUserGroupMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid

    Session:
      type: object
      required: [id, userId, username, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: The session's token hash — never the raw session token.
        userId:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ApiTokenRole:
      type: string
      description: >-
        Q43: a token's own scope, always admin or viewer — never
        share-only, since a share-only account has no API access to
        scope (Q27).
      enum: [admin, viewer]

    CreateApiTokenRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A caller-chosen label distinguishing this token from an account's others.
        role:
          $ref: '#/components/schemas/ApiTokenRole'

    ApiTokenSummary:
      type: object
      required: [id, userId, username, name, role, createdAt]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time

    ApiTokenCreated:
      type: object
      required: [id, userId, username, name, role, createdAt, token]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: >-
            The raw bearer value — shown once, on creation, and never
            retrievable again (doc 01 §7).

    BackupDestinationType:
      type: string
      enum: [local, smb, s3, sftp, webdav, rclone]
      description: >-
        `local` is a directory — the boot device, the pool, or an external
        disk's mount (Q72). Every other type is written through rclone:
        `smb`, `s3` (any S3-compatible store), `sftp`, `webdav`, or
        `rclone` for a remote already set up in rclone's own config. An NFS
        share is a local destination at the path the host has mounted it.

    BackupRetention:
      type: object
      required: [daily, weekly, monthly]
      properties:
        daily:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        weekly:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        monthly:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000

    BackupDestination:
      type: object
      required: [id, name, type, path, enabled, encrypt, retention, hasSecrets, stale, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/BackupDestinationType'
        path:
          type: string
          description: >-
            The directory for a local destination; for a remote one, the
            path within it (bucket and prefix, share and folder).
        options:
          type: object
          additionalProperties:
            type: string
          description: The non-secret rclone settings of a remote destination.
        enabled:
          type: boolean
        encrypt:
          type: boolean
          description: Always true for a remote destination (Q80).
        retention:
          $ref: '#/components/schemas/BackupRetention'
        hasSecrets:
          type: boolean
          description: Whether credentials are stored for this destination.
        lastSuccessfulBackupAt:
          type: string
          format: date-time
          description: Absent until a backup has been written here.
        stale:
          type: boolean
          description: >-
            An enabled destination that has gone two days without a
            successful backup, counted from its creation until its first.
        createdAt:
          type: string
          format: date-time

    CreateBackupDestinationRequest:
      type: object
      required: [name, type, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/BackupDestinationType'
        path:
          type: string
          description: >-
            An absolute directory for `local`. For a remote type, the path
            within it: `smb` needs the share name first, `s3` the bucket.
        options:
          type: object
          additionalProperties:
            type: string
          description: >-
            rclone's own option names. `smb`: `host`, `user`, `port`,
            `domain`. `s3`: `access_key_id`, `provider`, `endpoint`,
            `region`. `sftp`: `host`, `user`, `port`, `key_file`, `known_hosts_file`
            (without it rclone does not verify the host key). `webdav`:
            `url`, `user`, `vendor`. `rclone`: `remote`, the name of a
            configured rclone remote. Any other key is refused.
        secrets:
          type: object
          additionalProperties:
            type: string
          description: >-
            `smb`, `webdav` and `sftp`: `pass`. `s3`: `secret_access_key`.
            Write-only.
        enabled:
          type: boolean
          description: Defaults to true.
        encrypt:
          type: boolean
          description: >-
            Opt-in for a local destination. A remote destination is always
            encrypted; sending false is refused.
        retention:
          $ref: '#/components/schemas/BackupRetention'

    UpdateBackupDestinationRequest:
      type: object
      properties:
        enabled:
          type: boolean
        retention:
          $ref: '#/components/schemas/BackupRetention'

    BackupDestinationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: Why the test failed, present only when success is false.

    RestoreDrill:
      type: object
      properties:
        lastRun:
          $ref: '#/components/schemas/RestoreDrillRun'

    RestoreDrillRun:
      type: object
      required: [ranAt, passed, destinations]
      properties:
        ranAt:
          type: string
          format: date-time
        passed:
          type: boolean
          description: >-
            True only when the newest archive on every enabled destination
            verified.
        error:
          type:
            - string
            - "null"
          description: >-
            Why the drill could not test any destination at all (none is
            enabled, the destinations could not be listed, or the drill could
            not be started). Absent when it tested them.
        destinations:
          type: array
          description: What the drill found on each destination it tested.
          items:
            $ref: '#/components/schemas/RestoreDrillDestination'

    RestoreDrillDestination:
      type: object
      required: [destinationId, destinationName, passed]
      properties:
        destinationId:
          type: string
        destinationName:
          type: string
        passed:
          type: boolean
        archive:
          type:
            - string
            - "null"
          description: >-
            The archive that was fetched and verified. Absent when the
            destination held none.
        error:
          type:
            - string
            - "null"
          description: Why the destination failed. Absent when it passed.

    AppdataBackupContainer:
      type: object
      required: [name, image, running, stop, included, databaseImage]
      properties:
        name:
          type: string
        image:
          type: string
          description: The container's image repository, without its tag.
        running:
          type: boolean
        stop:
          type: boolean
          description: >-
            Whether the backup stops the container while its appdata is
            copied. Only a running container is stopped.
        included:
          type: boolean
        databaseImage:
          type: boolean
          description: >-
            Whether the image is a known database (Postgres, MariaDB, MySQL,
            MongoDB, Redis and similar).
        warning:
          type:
            - string
            - "null"
          description: >-
            Present when a known database image is included but not stopped.

    AppdataBackupConfig:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/AppdataBackupContainer'

    SetAppdataBackupContainerRequest:
      type: object
      required: [stop, included]
      properties:
        stop:
          type: boolean
        included:
          type: boolean

    StartAppdataBackupRequest:
      type: object
      properties:
        containers:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Limits the run to these containers; omit for every included one.

    AppdataArchive:
      type: object
      required: [name, container, destinationId, destinationName, createdAt, size, encrypted]
      properties:
        name:
          type: string
          description: The archive's file name on the destination.
        container:
          type: string
        destinationId:
          type: string
        destinationName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: The archive's modification time on the destination.
        size:
          type: integer
          format: int64
        encrypted:
          type: boolean
        reason:
          type:
            - string
            - "null"
          description: >-
            `pre-restore` for the snapshot a restore took of the appdata it
            replaced, `pre-update` for the snapshot taken before a container
            update; absent for an ordinary backup.

    ListAppdataArchivesOK:
      type: object
      required: [archives, unavailable]
      properties:
        archives:
          type: array
          items:
            $ref: '#/components/schemas/AppdataArchive'
        unavailable:
          type: array
          description: Destinations that could not be listed, and why.
          items:
            type: object
            required: [destinationId, message]
            properties:
              destinationId:
                type: string
              message:
                type: string

    PreviewAppdataRestoreRequest:
      type: object
      required: [container, archive, destinationId]
      properties:
        container:
          type: string
          minLength: 1
          maxLength: 255
        archive:
          type: string
          minLength: 1
          maxLength: 512
          description: An archive name from listAppdataArchives.
        destinationId:
          type: string
          minLength: 1
          maxLength: 64

    ConfigImportBlocker:
      type: object
      required: [code, message]
      description: >-
        A refusal `importConfig` would return for this archive.
      properties:
        code:
          type: string
          enum: [incompatible_archive, archive_newer_version, archive_other_installation, archive_array_mismatch, restore_path_unsafe]
        message:
          type: string

    ConfigImportNote:
      type: object
      required: [code, message]
      description: >-
        Something about an import that holds whatever the archive contains, or,
        for `host_files_replaced`, about what a bare-metal restore does to this
        server's own files: it names each Samba or NFS file already on the
        server that the restore replaces, which the backup taken first saves.
      properties:
        code:
          type: string
          enum: [sessions_replaced, array_state_kept, host_files_replaced]
        message:
          type: string

    ConfigImportChange:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum:
            - share
            - share_user_permission
            - share_group_permission
            - user
            - user_group
            - user_group_member
            - api_token
            - schedule_chain
            - schedule_job
            - notification_channel
            - notification_route
            - notification_severity
            - notification_quiet_hours
            - backup_destination
            - appdata_backup_container
            - backup_recipient
            - acme
            - ups
            - array_settings
            - host_config
            - external_disk
            - hostname
            - timezone
            - backup_passphrase
            - update_channel
            - update_check
            - custom_config_file
            - template_file
            - stack_file
        name:
          type: string
          description: >-
            What a user calls it: a share name, a username, a schedule job,
            a destination name; `share / user` for a permission,
            `group / user` for a membership, `user / token name` for an
            API token, `event / channel` for a route, the label of an
            external disk, the kind of a host configuration decision, the
            path of a custom config file or template relative to its
            directory, `stack/file` for a stack's compose or `meta.json`
            file.
            Empty for the settings that exist once. A secret or a
            passphrase is reported as changed, never by its value.

    ConfigImportGroup:
      type: object
      required: [category, added, changed, removed]
      properties:
        category:
          type: string
          enum: [shares, accounts, schedules, notifications, backup, system, custom_config, templates, stacks]
        added:
          type: array
          description: In the archive, not in the live configuration.
          items:
            $ref: '#/components/schemas/ConfigImportChange'
        changed:
          type: array
          description: In both, with different content.
          items:
            $ref: '#/components/schemas/ConfigImportChange'
        removed:
          type: array
          description: In the live configuration, not in the archive.
          items:
            $ref: '#/components/schemas/ConfigImportChange'

    ConfigImportArchive:
      type: object
      required: [timestamp, host, hoservaVersion, schemaVersion]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the archive was taken.
        host:
          type: string
        hoservaVersion:
          type: string
        schemaVersion:
          type: string
          description: The database schema version of the archive.

    ConfigImportSecretsStatus:
      type: string
      enum: [none, opened, no_passphrase, passphrase_incorrect]
      description: >-
        `none`: the archive has no passphrase-protected section (it was built
        without a backup passphrase). `opened`: the passphrase available
        opens it. `no_passphrase`: it has one and no passphrase is
        available. `passphrase_incorrect`: it has one and the passphrase
        available does not open it.

    ConfigImportSecrets:
      type: object
      required: [status, stacks]
      properties:
        status:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
        identity:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
          description: >-
            The same status for the archive's `identity.age`, the backup
            recipient's private identity: `opened` means a bare-metal
            restore adopts the archive's recipient; otherwise this box keeps
            its own. Always present in a response; an in-place import never
            replaces the recipient, so it only reports.
        stacks:
          type: array
          description: >-
            The stacks of the archive whose `.env` files would not be
            restored; empty when `status` is `opened`.
          items:
            type: string

    ConfigImportPreview:
      type: object
      required: [archive, liveSchemaVersion, blockers, groups, secrets, notes]
      properties:
        archive:
          $ref: '#/components/schemas/ConfigImportArchive'
        liveSchemaVersion:
          type: string
        blockers:
          type: array
          description: >-
            Refusals `importConfig` would return for this archive; empty
            when it would go ahead (a running job, which is not a property
            of the archive, refuses it too).
          items:
            $ref: '#/components/schemas/ConfigImportBlocker'
        groups:
          type: array
          description: >-
            One entry per category, in a fixed order, each listing what an
            import would add, change or remove. History and runtime tables
            (jobs, the audit log, spin events, notification deliveries and
            alerts, usage, mover and cache results) are not listed. Empty
            when the schema versions differ.
          items:
            $ref: '#/components/schemas/ConfigImportGroup'
        secrets:
          $ref: '#/components/schemas/ConfigImportSecrets'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/ConfigImportNote'
        bareMetal:
          $ref: '#/components/schemas/ConfigImportBareMetal'

    ConfigImportDiskState:
      type: string
      enum: [matched, absent, replaced, ambiguous]
      description: >-
        `matched`: exactly one attached disk carries the recorded identity
        (WWN, else serial; a weak-identity disk by filesystem UUID and
        size, Q21) and its filesystem is the recorded one. `absent`: no
        attached disk is it. `replaced`: the identity or the filesystem
        differs, either an attached disk holds the recorded filesystem with
        another identity or the disk with the recorded identity holds
        another filesystem. `ambiguous`: more than one attached disk
        matches, a disk and its clone. A disk that is not `matched` stays a
        row of the restored array with its recorded filesystem, is never
        mounted or adopted by the restore, and leaves the array degraded.

    ConfigImportDisk:
      type: object
      required: [name, role, roleIndex, mountpoint, fsUuid, weakIdentity, state]
      description: One array disk the archive records, and what it matched.
      properties:
        name:
          type: string
          description: >-
            What a user calls it: the role and index, its mountpoint and the
            identity it was recorded with.
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        roleIndex:
          type: integer
          format: int64
          minimum: 1
        mountpoint:
          type: string
        fsUuid:
          type: string
          description: The filesystem UUID the archive records for the slot.
        wwn:
          type: string
        serial:
          type: string
        byIdName:
          type: string
        weakIdentity:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/ConfigImportDiskState'
        device:
          type: string
          description: >-
            The attached disk it matched, or the disk holding its filesystem
            when `replaced`; absent for `absent` and `ambiguous`.

    ConfigImportDiskMappingEntry:
      type: object
      required: [role, roleIndex, device]
      properties:
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        roleIndex:
          type: integer
          format: int64
          minimum: 1
        device:
          type: string
          minLength: 1
          maxLength: 256
          description: The attached disk the slot was matched to.

    ConfigImportDiskMapping:
      type: object
      required: [disks]
      description: >-
        The mapping of the archive's array disks to the attached disks that
        a user confirms: one entry per `matched` disk, and none for any
        other. An empty list confirms an archive that records no array
        disks, or that none of its disks is attached.
      properties:
        disks:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/ConfigImportDiskMappingEntry'

    ConfigImportBareMetal:
      type: object
      required: [schemaUpgrade, disks, diskMapping]
      description: >-
        The bare-metal restore of an archive onto a fresh install (doc 10
        §1), present when the installation has no array configured and the
        archive's schema is not newer.
      properties:
        schemaUpgrade:
          type: boolean
          description: >-
            The archive's database is older than the running schema and is
            upgraded, on a staged copy, by the migration runner.
        disks:
          type: array
          items:
            $ref: '#/components/schemas/ConfigImportDisk'
        diskMapping:
          $ref: '#/components/schemas/ConfigImportDiskMapping'

    ConfigImportRestored:
      type: object
      required: [category, added, changed, removed]
      description: >-
        What one category of the import brought in: `added` was in the
        archive and not on this machine, `changed` differed, `removed` was
        on this machine and not in the archive. What was identical is not
        counted.
      properties:
        category:
          type: string
          enum: [shares, accounts, schedules, notifications, backup, system, custom_config, templates, stacks, stack_env]
          description: >-
            The categories of `ConfigImportGroup`, and `stack_env`, the
            stacks' `.env` files, counted by stack, of which `removed` is
            always 0.
        added:
          type: integer
          format: int64
        changed:
          type: integer
          format: int64
        removed:
          type: integer
          format: int64

    ConfigImportNotRestored:
      type: object
      required: [kind, name, reason, message]
      properties:
        kind:
          type: string
          enum: [stack_env, disk, database_secret, backup_recipient]
        name:
          type: string
          description: >-
            The stack whose `.env` file it is (`stack_env`), the array disk
            by its `ConfigImportDisk.name` (`disk`), the table and column
            of a database secret cleared by a bare-metal restore, with the
            row it was in (`database_secret`), or `backup_recipient`, the
            archive's backup recipient, which a bare-metal restore adopts
            only when `identity.age` opens and otherwise leaves this box's
            own in place.
        reason:
          type: string
          enum: [no_secrets, no_passphrase, passphrase_incorrect, stack_not_in_archive, left_in_place, disk_absent, disk_replaced, disk_ambiguous, sealed_under_other_key]
          description: >-
            `no_secrets`, `no_passphrase` and `passphrase_incorrect`: the
            archive's passphrase-protected section could not be opened (see
            `ConfigImportSecretsStatus`; for `backup_recipient`, its
            `identity.age`). `stack_not_in_archive`: that
            section holds an `.env` for a stack the archive has no files of.
            `left_in_place`: the `.env` on this machine was kept because the
            archive holds none for that stack. `disk_absent`,
            `disk_replaced` and `disk_ambiguous`: a bare-metal restore did
            not match the array disk (see `ConfigImportDiskState`), so it
            stays a row of the restored array, unmounted, and the array is
            degraded: nothing mounts, matched disks included, until the
            degraded array is acknowledged or the replace flow (doc 09 §4)
            adopts a replacement disk. `sealed_under_other_key`: the
            secret was sealed under the machine key of the installation the
            archive came from, which this machine does not have, and the
            archive holds no copy of it it could be sealed again from (no
            passphrase opened its `secrets.age`, or it never carried this
            secret, like TOTP), so a bare-metal restore cleared it.
        message:
          type: string

    ConfigImportPreImportSecrets:
      type: string
      enum: [none, request, configured]
      description: >-
        Which passphrase the pre-import archive's `secrets.age` is sealed
        with. `request`: the one given with the import, which opened the
        imported archive's secrets. `configured`: the configured backup
        passphrase. `none`: the pre-import archive has no `secrets.age`.

    ConfigImportReport:
      type: object
      required: [restored, notRestored, secrets, preImportArchive, preImportSecrets]
      properties:
        restored:
          type: array
          description: One entry per category, in a fixed order.
          items:
            $ref: '#/components/schemas/ConfigImportRestored'
        notRestored:
          type: array
          description: >-
            Everything the import did not restore, each with why. Empty when
            everything in the archive was restored.
          items:
            $ref: '#/components/schemas/ConfigImportNotRestored'
        secrets:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
        preImportArchive:
          type: string
          description: >-
            The name of the archive of the configuration as it was before
            the import, which a restore can go back to. Empty when no backup
            destination was written to.
        preImportSecrets:
          $ref: '#/components/schemas/ConfigImportPreImportSecrets'

    AppdataRestorePreviewGroup:
      type: object
      required: [files, bytes, sample]
      properties:
        files:
          type: integer
          format: int64
          description: >-
            How many files are in this group. Symbolic links and other
            non-directory entries count as files; directories do not.
        bytes:
          type: integer
          format: int64
          description: >-
            Total size of those files: for `replaced` and `removed` the size
            of the live files that would be lost, for `added` the size of
            the archive's files.
        sample:
          type: array
          description: >-
            The first paths of the group in path order, relative to the
            directory, at most 20. `files` is the full count.
          maxItems: 20
          items:
            type: string

    AppdataRestorePreviewDirectory:
      type: object
      required: [directory, replaced, added, removed]
      properties:
        directory:
          type: string
          description: >-
            The archived directory, relative to the appdata location
            (`jellyfin/config`).
        replaced:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'
        added:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'
        removed:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'

    AppdataRestorePreview:
      type: object
      required: [container, archive, destinationId, createdAt, directories]
      properties:
        container:
          type: string
        archive:
          type: string
        destinationId:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When the archive was taken.
        directories:
          type: array
          items:
            $ref: '#/components/schemas/AppdataRestorePreviewDirectory'

    RestoreAppdataRequest:
      type: object
      required: [container, archive, destinationId, confirm]
      properties:
        container:
          type: string
          minLength: 1
          maxLength: 255
        archive:
          type: string
          minLength: 1
          maxLength: 512
          description: An archive name from listAppdataArchives.
        destinationId:
          type: string
          minLength: 1
          maxLength: 64
        confirm:
          type: boolean
          description: >-
            Must be true, because the restore overwrites the container's
            appdata.
