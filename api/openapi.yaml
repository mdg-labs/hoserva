openapi: 3.1.0
info:
  title: Hoserva API
  version: "1.0.0"
  description: >-
    The Hoserva API (doc 01 §5, D18). This file is the whole API — every
    capability the web UI or the CLI has is a documented operation here, and
    nothing else. Go server interfaces, the CLI's Go client and the web UI's
    TypeScript client are generated from it (`make gen`); handlers in
    `internal/api/` implement the generated interfaces, and both clients call
    the API only through their generated code.

    This first version covers the foundation every later feature area builds
    on: `/api/v1/` versioning, the two auth schemes named in doc 01 §5, the
    shared error model, the job resource and its lifecycle (doc 01 §4), and
    every Server-Sent Events event type on `/api/v1/events`. Disk, pool,
    share, container and VM operations arrive with the issues that design
    those subsystems (doc 07 §1) — this spec is extended, never replaced, as
    they land.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Hoserva
    url: https://github.com/mdg-labs/hoserva

tags:
  - name: jobs
    description: The job system (doc 01 §4) — every long-running operation.
  - name: events
    description: Live data over Server-Sent Events (doc 01 §5).
  - name: status
    description: Overall system health (`hoserva status`, doc 01 §3).
  - name: metrics
    description: >-
      Downsampled time series from metrics.db (Q74, doc 02 §4) — throughput,
      CPU, RAM, SMART history. Read-only; never probes block devices.
  - name: pool
    description: Pool topology and per-disk breakdown (`hoserva pool status`).
  - name: disks
    description: Disk inventory and lifecycle (`hoserva disk`, doc 01 §3).
  - name: array
    description: >-
      Array start and stop / maintenance mode (Q70, `hoserva array
      stop|start`), and acknowledging a degraded array (Q69, `hoserva array
      acknowledge-degraded`).
  - name: parity
    description: SnapRAID sync, scrub and fix through the threshold guard (doc 02 §2).
  - name: mover
    description: >-
      The write cache's mover (doc 09 §2, `hoserva mover run`) — moves a
      cache-then-move share's files onto the array. Reachable on a schedule
      (the nightly chain), a cache-usage threshold, or this manual trigger;
      never continuous.
  - name: config
    description: Config archive export and import (doc 10 §1).
  - name: backup
    description: >-
      Where config backups are written (doc 10 §1) — local paths, an
      external disk, and remote destinations through rclone — and whether
      each one is reachable.
  - name: doctor
    description: Prerequisite and sanity checks (`hoserva doctor`, doc 01 §3).
  - name: users
    description: >-
      Accounts, roles and Samba credentials (Q27, doc 03 §7): the admin,
      viewer and share-only roles, per-account passwords (which write the
      UI credential and the Samba passdb entry together), user groups and
      session list/revoke. Account recovery over the Unix socket (Q78) and
      personal API tokens (Q43) are also under this tag.
  - name: auth
    description: >-
      First-run setup, sessions and TOTP over TCP (doc 01 §5, §7, Q9, Q10,
      Q28, Q44, doc 03 §1). The Unix socket needs none of this — it is
      peer-credential trusted (Q44) — but these operations still run on
      it, unauthenticated, exactly as they do on TCP, since the same
      handlers serve both transports (doc 01 §5).
  - name: notifications
    description: >-
      Alerting channels (email, Gotify, ntfy, Discord webhook, generic
      webhook), per-event routing and quiet hours (doc 03 §8.3, doc 01 §7,
      Q28). Credentials are write-only: a channel response never carries
      the secret it holds, only whether one is configured.
  - name: settings
    description: >-
      General installation settings shared by onboarding and `/settings`
      (doc 03 §1, §8.1). The backup passphrase is write-only (Q28): a
      response never carries it, only whether one is configured. UPS
      connection and shutdown thresholds live under `/settings/ups`
      (doc 03 §8.1, Q77); UPS passwords are write-only (Q28). Self-update,
      rollback and Debian update status live under `/settings/updates`
      (doc 03 §8.6, Q67, Q68). Host networking, TLS certificate expiry,
      LAN-only access scope (Q10) and the listen port live under
      `/settings/network` (doc 03 §8.2, Q75).
  - name: shares
    description: >-
      User shares as first-class SQLite state (D4, doc 03 §4): each share
      has its own mergerfs mount (doc 02 §1, Q12) and Samba is generated
      from the same rows. Per-user and per-group share access (Q27, doc
      03 §7) is stored here too, editable from either the share or the
      user/group; enforcing it in generated Samba/mergerfs config is a
      later issue.
  - name: stacks
    description: >-
      Docker Compose stacks (doc 04 §2, D4): one `stacks` row per stack,
      from which `docker-compose.yml`, `.env` and `meta.json` under the
      stacks directory (`<state dir>/stacks/<name>/`, `/var/lib/hoserva/
      stacks/<name>/` on an installed system) are generated. A stack's
      Compose project is run with `docker compose`, never through a shell.
  - name: templates
    description: >-
      Installing a catalog template (`hoserva app install`, doc 04 §7): the
      `x-hoserva` inputs are resolved, the privilege summary is computed
      from the Compose content, and the result is stored as a stack.
  - name: apps
    description: >-
      Docker Engine containers and images (`hoserva app list`, doc 04 §2,
      §3): every container the Engine reports, managed and unmanaged
      alike, with the same lifecycle actions for both (doc 04 §1, §2):
      start, stop, restart, recreate, remove, logs and stats. The Compose
      stack model is a later issue. `available` is false, with no error,
      whenever Docker itself is not reachable: a missing prerequisite is
      Apps' normal state, not a failed request.

# Two transports (doc 01 §5): a Unix socket for the local root/`hoserva`-group
# CLI, and TLS-only TCP for the web UI and remote/scripted use. Same handlers,
# different auth middleware — the Unix socket is peer-credential trusted and
# carries no bearer/cookie credential of its own, which is why its entry below
# has no `x-hoserva-transport-auth` value: there is nothing for a client to
# attach. The TCP server's operations still declare `security` below; that
# security only applies on this transport.
servers:
  - url: https://{host}:8008/api/v1
    description: TCP, TLS-only. Session cookie for the web UI, personal API tokens (Q43) for scripts and the remote CLI.
    variables:
      host:
        default: localhost
  - url: unix:///run/hoserva/hoserva.sock/api/v1
    description: >-
      Unix socket. Root and the `hoserva` group only (Q44); accepted with no
      auth token because the kernel already vouches for the caller's identity
      via `SO_PEERCRED` — there is no bearer or cookie credential on this
      transport. Used by the local CLI.
    x-hoserva-transport-auth: peer-credentials-trusted

security:
  - sessionCookie: []
  - apiToken: []

paths:
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs
      description: >-
        Every long-running operation is a job (doc 01 §4). Filterable by
        class and status so the UI's jobs page and `hoserva logs` can scope
        what they render without walking the whole history.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: class
          in: query
          schema:
            $ref: '#/components/schemas/JobClass'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The jobs matching the filter, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: Get a job
      description: A single job's current state, by id.
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a job
      description: >-
        Only meaningful where the underlying tool supports cancellation
        (doc 01 §4); a job that cannot be cancelled reports that in its
        `cancellable` field rather than accepting this call and doing
        nothing. A queued or running job is stopped; an interrupted,
        cancellable job is ended `cancelled`. For a data-disk upgrade
        this is the abort (doc 02 §4 E3): refused with
        `job_not_cancellable` once its checkpoint is at releasing,
        whether queued, running or interrupted. A running upgrade is
        answered with the running job and records its outcome once it
        has unmounted everything. A queued or interrupted upgrade is
        unwound first; if that fails it stays interrupted and the call
        is refused with `disk_upgrade_cleanup_failed`, naming what is
        still mounted. `job_abort_in_progress` refuses a second cancel
        while one runs. `job_resume_in_progress` refuses a cancel while
        a resume of the same job is still repairing its log; retry in a
        moment.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, now in a cancelling or cancelled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      summary: Resume a checkpointed job
      description: >-
        Only resumable job types (mover, rebalance, evacuation, share
        relocation, data- and parity-disk upgrade) persist a checkpoint to
        resume from (Q29). Jobs are never resumed automatically after a
        restart — this operation is always an explicit user action. A
        data-disk upgrade resumes only in maintenance mode (doc 02 §4
        E5); one resumed at its releasing checkpoint is not cancellable.
        Refused with `job_abort_in_progress` while a cancel of the same
        job is unwinding it, and with `job_resume_in_progress` while
        another resume of the same job is still repairing its log
        (retry in a moment). Resuming an interrupted mover job is refused
        with 409 `on_battery` while the on-battery hold is active
        (doc 02 §6, Q77).
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, resumed from its last checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/log:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJobLog
      summary: Download a job's captured stdout/stderr
      description: >-
        Kept for 90 days (Q74). With `follow` true on a job that has not
        finished, the response stays open and carries the gzip stream of the
        log as it grows (each write is flushed as it arrives, so a client
        decompressing on the fly prints every line at once), and ends when
        the job reaches a terminal state, when the client disconnects, or on
        a read error; a clean end carries the gzip trailer. `follow` on a
        finished job is the same as omitting it.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The job's captured output, compressed.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /events:
    get:
      operationId: streamEvents
      summary: Stream live events
      description: >-
        Server-Sent Events for job progress, disk state changes, container
        state changes and new notifications (doc 01 §5). Every event type is
        a schema below (`Event`'s member types).

        ogen generates only SSE *clients*, not a server-side encoder for
        `text/event-stream` (confirmed against ogen v1.24.0 — see Q63), so
        `make gen` excludes this one operation from the generated `apiv1`
        server interface and client (`ogen.yml`'s `ignore_not_implemented`).
        The `Event` schema and its variants are still generated code, though:
        `make gen` runs ogen's `jschemagen` against `api/event-schema-root.yaml`
        to produce typed Go structs in `api/gen/go/events`, plus a small
        generated SSE-frame reader alongside them, so a Go client reads this
        stream only through generated types (D18, doc 01 §5). The server-side
        write loop for this route — framing each `Event` over
        `text/event-stream` — is hand-written in `internal/api`
        (`EventsHandler`, issue #19), mounted beside the generated router
        rather than inside it, since ogen generates no security hook for a
        route it doesn't generate a server for either; it is gated by an
        `Authenticate` seam #22 wires to real session/token validation. The
        job system publishes `job_progress` events on every state and
        progress change; disk/container state and notifications arrive with
        the issues that add those subsystems.
      tags: [events]
      x-hoserva-role: viewer
      responses:
        "200":
          description: An unbounded stream of `Event` frames.
          content:
            text/event-stream:
              x-ogen-sse-event-shape: full
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check whether the first-run admin account exists
      description: >-
        Reachable before an admin exists: this operation, createFirstAdmin
        and the SPA's static assets are the only routes that don't refuse
        every request with a "setup required" error while `adminExists` is
        false (#22).
      tags: [auth]
      x-hoserva-role: public
      security: []
      responses:
        "200":
          description: Whether the first-run admin account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        default:
          $ref: '#/components/responses/Error'

  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account
      description: >-
        Reachable only before an admin exists; refused once one does.
        Creating the admin is atomic — a race between two concurrent
        requests can never create two admins (#22). Signs the new admin in
        on success, exactly like login.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirstAdminRequest'
      responses:
        "200":
          description: The admin account, now signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: >-
        Username is matched case-insensitively, using simple lowercasing
        (Go's `strings.ToLower`) rather than full Unicode case folding.
        Password, plus a TOTP code once the account has TOTP enrolled
        (doc 01 §7). Rate-limited and lockout-protected per account and
        per source address (doc 01 §7): an unknown username and a wrong
        password against a real one get the same status and error code
        (`invalid_credentials`), reach lockout (`rate_limited`) at the
        same failure threshold, and cost the same bounded argon2id-shaped
        work either way, for similar timing, under ordinary load — under
        a sustained flood large enough to fill and evict from the
        unknown-username table's own 10,000-entry cap, an unknown
        username's lockout can lift early, where a real account's own
        (never capped or evicted) would not. Once the password is
        correct, `totp_required` (no code supplied) versus `totp_invalid`
        (a wrong one) does reveal that an account has TOTP enrolled — an
        unavoidable, rate-limited signal, not one this API tries to hide.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the current session server-side and clears the cookie.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session's user
      description: The signed-in user this session cookie belongs to.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start TOTP enrolment for the signed-in user
      description: >-
        Generates a new secret (RFC 6238), stored encrypted with the
        machine key (Q28) but not yet active — the account's existing
        active credential, if any, is untouched until confirmTotp
        activates the new one. Enrolling again before confirming replaces
        the still-pending secret. Once TOTP is already active on this
        account, replacing it requires proving the caller still holds the
        account: exactly one of the current password or a current TOTP
        code, in TotpEnrollRequest. Omitting both while TOTP is active is
        refused (totp_reverify_required); supplying both is refused too
        (totp_reverify_ambiguous), since each is one guess at the active
        credential and honouring both would spend two for the price of
        one request. Neither is required for a first enrolment.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        "200":
          description: The new secret, pending confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm TOTP enrolment
      description: >-
        Activates the pending secret enrollTotp created, once a code
        proves the signed-in user actually has it.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "204":
          description: TOTP is now active on this account.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels:
    get:
      operationId: listNotificationChannels
      summary: List notification channels
      description: Every configured alerting destination (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every configured channel.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createNotificationChannel
      summary: Add a notification channel
      description: >-
        A credential supplied in `secret` (Q28) is encrypted with the
        machine key before it reaches the database and is never returned
        by any later read — `hasSecret` on the response is the only trace
        of it.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getNotificationChannel
      summary: Get a notification channel
      description: A single channel's current configuration, by id, secret excluded.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationChannel
      summary: Replace a notification channel's configuration
      description: >-
        A full replace, like the request body of createNotificationChannel:
        every type-specific field the request omits is cleared, not left
        as it was. `secret` is tri-state — omitted keeps the existing
        credential, `null` clears it, a string replaces it — since this is
        the one field a response never echoes back for a client to resend
        unchanged (Q28).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationChannelRequest'
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: Also removes every routing entry that named this channel.
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: sendTestNotification
      summary: Send a test notification through a channel
      description: >-
        Sent immediately, outside the delivery queue and its retry policy
        — this is a synchronous probe of the channel's own configuration,
        not a routed event, so it reports success or the delivery error
        directly rather than being retried and logged like a routed
        notification (doc 03 §8.3: "untested notification config is the
        same as no notification config").
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the test notification was delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing:
    get:
      operationId: getNotificationRouting
      summary: Get the full per-event routing matrix
      description: >-
        One entry per event type in doc 03 §8.3's fixed catalog, in the
        order that doc lists them — every event type appears even before
        it has ever been routed anywhere, with its compiled-in default
        severity and an empty channel list.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The routing matrix.
          content:
            application/json:
              schema:
                type: object
                required: [routing]
                properties:
                  routing:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing/{eventType}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    put:
      operationId: updateNotificationRoute
      summary: Set one event type's severity and routed channels
      description: >-
        A full replace of eventType's own row in the matrix: the channel
        list becomes exactly channelIds, and the severity becomes exactly
        severity — including reverting to the compiled-in default when the
        request's severity matches it, and un-routing every channel by
        sending an empty list, e.g. for `sync_succeeded`'s opt-in,
        off-by-default event (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRouteRequest'
      responses:
        "200":
          description: The event type's updated routing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/quiet-hours:
    get:
      operationId: getQuietHours
      summary: Get the quiet hours configuration
      description: The current quiet hours window and the always-on critical override (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateQuietHours
      summary: Set the quiet hours window
      description: >-
        `criticalAlwaysDelivers` is not part of the request body: doc
        03 §8.3's override that critical alerts always deliver cannot be
        disabled, so there is nothing for a client to set — the response
        always reports it `true`.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuietHoursRequest'
      responses:
        "200":
          description: The updated quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notification alerts
      description: >-
        Unread alerts first, grouped by event type (doc 03 §2). Reads only
        the central database — never probes block devices.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Grouped in-app alerts and the unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsOK'
        default:
          $ref: '#/components/responses/Error'

  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark in-app alerts read
      description: >-
        Marks every alert whose id is listed, or every alert when `all` is
        true (doc 03 §2's mark-all-read). Omitted ids with `all` false is a
        no-op that returns the current unread count.
      tags: [notifications]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        "200":
          description: The unread count after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationsReadOK'
        default:
          $ref: '#/components/responses/Error'

  /settings/general:
    get:
      operationId: getGeneralSettings
      summary: Get general installation settings
      description: >-
        Hostname, timezone and whether a backup passphrase is configured
        (doc 03 §1, §8.1). The passphrase itself is never returned (Q28).
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateGeneralSettings
      summary: Set general installation settings
      description: >-
        Persists hostname, timezone and/or the backup passphrase. Each
        field is optional: omitted leaves that value unchanged. An empty
        `hostname` clears a previously set hostname. `backupPassphrase` is
        write-only and never echoed back — skipping it during onboarding
        is valid (Q28).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralSettingsRequest'
      responses:
        "200":
          description: The updated general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/apps:
    get:
      operationId: getAppSettings
      summary: Get the container update settings
      description: >-
        How long the image a container ran before an update is kept for a
        revert (doc 04 §6): 7 days until it is set.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current container update settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAppSettings
      summary: Set the container update settings
      description: >-
        Sets how many days the image a container ran before an update is kept
        for a revert, from 1 to 365. It applies to updates made afterwards;
        an update already made keeps the deadline it was made with.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSettings'
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/ups:
    get:
      operationId: getUPSSettings
      summary: Get UPS / NUT settings
      description: >-
        Doc 03 §8.1's UPS card on `/settings` General: connection mode
        (USB or a network NUT server), driver fields, and USB-only
        shutdown thresholds (Q77). Passwords are never returned — only
        `monitorPasswordSet` / `networkPasswordSet` (Q28). When no UPS
        is configured, `configured` is false and every other field is
        omitted.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current UPS settings, or an empty configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUPSSettings
      summary: Set UPS / NUT settings
      description: >-
        Persists UPS settings to SQLite, generates NUT config through
        `WriteUPS` (D4, Q77), and reloads the NUT units. Passwords are
        write-only (Q28): omit to keep an existing secret; a first
        configure must supply the password the connection mode needs.
        USB-only thresholds are ignored for network mode. Validation
        failures and `ErrInvalidUPSField` return 400; unmanaged or
        existing host NUT files and a missing `nut` group return 409.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUPSSettingsRequest'
      responses:
        "200":
          description: The updated UPS settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network:
    get:
      operationId: getNetworkSettings
      summary: Host network, TLS and access-scope settings
      description: >-
        Current network backend, interfaces, any in-flight confirm-or-revert
        window, the TLS certificate's expiry, LAN-only access scope (Q10)
        and the listen port (doc 03 §8.2, Q75). Editing address, DNS or
        gateway is only possible when the backend is ifupdown; otherwise
        `editable` is false and `readOnlyReason` says why.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current network settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: applyNetworkSettings
      summary: Apply host network, access-scope or listen-port changes
      description: >-
        Address, DNS and gateway changes are written to one managed
        ifupdown file under `/etc/network/interfaces.d/` and applied with
        a 60-second confirm-or-revert (Q75): unless `confirmNetworkSettings`
        is called over the new configuration before the window expires
        (or the daemon dies), the previous file is restored. Access scope
        and listen port apply without that window — access scope takes
        effect immediately; a listen-port change is persisted and used on
        the next daemon start. Addressing fields are refused when the
        backend is not ifupdown.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyNetworkSettingsRequest'
      responses:
        "200":
          description: Settings after the apply, including any pending confirm window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/confirm:
    post:
      operationId: confirmNetworkSettings
      summary: Keep the pending network configuration
      description: >-
        Called over the new configuration during the confirm-or-revert
        window (Q75). Keeps the managed ifupdown file. An unreachable
        address cannot be confirmed because this request never arrives.
        After the window expires, or if the daemon died before confirm,
        the previous configuration has already been restored and this
        returns `network_confirm_expired`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after confirm; `pending` is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/certificate:
    post:
      operationId: regenerateTLSCertificate
      summary: Regenerate the self-signed TLS certificate
      description: >-
        Replaces the daemon's TLS certificate with a freshly generated
        self-signed certificate (Q9) and hot-reloads it so new connections
        use the new cert. If Let's Encrypt DNS-01 is configured, unattended
        renewal is disarmed so this self-signed cert is not overwritten
        without another explicit setup. Let's Encrypt issue and renew are
        handled by `configureLetsEncrypt`, not by this operation.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings including the new certificate expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/lets-encrypt:
    post:
      operationId: configureLetsEncrypt
      summary: Configure Let's Encrypt DNS-01 and issue a certificate
      description: >-
        Stores the domain and DNS-01 provider credentials (encrypted at
        rest, Q28) and queues an `acme_issue` job that talks to the ACME
        directory over DNS-01 only. Ports 80 and 443 are never claimed
        (Q9). HTTP-01 and TLS-ALPN-01 are not offered. On success the
        issued certificate replaces the self-signed cert on `:8008`.
        Unattended renewal stays armed while `letsEncrypt.enabled` is
        true. A failed issue or renew keeps serving the existing
        certificate and notifies; it never silently falls back to a new
        self-signed cert.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureLetsEncryptRequest'
      responses:
        "200":
          description: The queued or running ACME issue job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableLetsEncrypt
      summary: Stop unattended Let's Encrypt renewal
      description: >-
        Disarms unattended renewal. The certificate currently served on
        `:8008` is left in place — this does not generate a self-signed
        replacement. DNS credentials remain stored until overwritten by
        a later `configureLetsEncrypt` or cleared by regenerating a
        self-signed certificate.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after renewal is disarmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules:
    get:
      operationId: getSchedules
      summary: List recurring job schedules
      description: >-
        The nightly maintenance chain (Q30, doc 03 §8.4) and every separately
        scheduled job, with server-computed next-run times, human-readable
        schedule previews and conflict warnings from DetectConflict (doc 01
        §4). Chain step order is server-defined and not writable.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: All recurring schedules and any detected conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/chain:
    put:
      operationId: updateMaintenanceChainSchedule
      summary: Update the nightly maintenance chain schedule
      description: >-
        Persists the chain's start time, weekly scrub day and per-step
        enabled flags (doc 03 §8.4). Step order is fixed by Q30 and cannot
        be changed. Omitted step entries leave that step's enabled state
        unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceChainScheduleRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OtherScheduleJobId'
    put:
      operationId: updateScheduledJob
      summary: Update a separately scheduled job
      description: >-
        Persists enabled state, frequency and start time for one of the
        recurring jobs outside the nightly chain (doc 03 §8.4).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledJobRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates:
    get:
      operationId: getUpdateStatus
      summary: Hoserva and Debian update status
      description: >-
        Current Hoserva version, any newer release on the configured
        channel, update-check on/off, pending Debian updates and whether
        a reboot is required (doc 03 §8.6, Q67, Q68). The update check
        reads only the signed release index on the project site — never
        the GitHub API and never a system-wide `apt update` (Q67, Q49).
        When the check is disabled, `availableVersion` is omitted rather
        than fetched.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUpdateSettings
      summary: Set update channel and check-enabled
      description: >-
        Persists the update channel (stable / beta) and whether the
        outbound update check is enabled (Q49, Q67). Omitted fields are
        left unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUpdateSettingsRequest'
      responses:
        "200":
          description: The updated update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/check:
    post:
      operationId: checkForUpdate
      summary: Check the signed release index for a newer Hoserva
      description: >-
        Fetches the signed release index for the configured channel
        (Q67). A user-initiated check runs even when the periodic
        outbound check is disabled. Never calls the GitHub API or
        `apt update`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Update status after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/apply:
    post:
      operationId: applyUpdate
      summary: Download, verify and install the available Hoserva release
      description: >-
        Downloads the `.deb` named by the signed release index, verifies
        it against the signed SHA256SUMS, runs a config backup, and
        installs it in a transient systemd unit (Q67, doc 10 §1).
        Refused while a Parity, Array-write or Topology job is running;
        the error names that job. A `.deb` whose checksum does not match
        is never installed, and a notification is raised.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The update has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/rollback:
    post:
      operationId: rollbackUpdate
      summary: Roll back to the previous Hoserva release and its snapshot
      description: >-
        Downloads and verifies the previous release's `.deb`, restores
        that version's pre-migration database snapshot, and installs the
        previous package (Q67, D16). There are no down migrations —
        rollback is previous package plus its snapshot. Refused while a
        Parity, Array-write or Topology job is running; the error names
        that job.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The rollback has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/reboot:
    post:
      operationId: rebootHost
      summary: Reboot after waiting for storage jobs and a clean shutdown
      description: >-
        Waits for any running Parity, Array-write or Topology job, runs
        the Q70 clean shutdown sequence, then reboots. Hoserva never
        reboots on its own — this is always the user's action (Q68).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: Reboot has been started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /status:
    get:
      operationId: getStatus
      summary: Overall system health
      description: >-
        One-screen health summary for the dashboard and `hoserva status`
        (doc 01 §3, §5).
      tags: [status]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /metrics:
    get:
      operationId: getMetrics
      summary: Metric time series
      description: >-
        Returns downsampled samples from metrics.db for one metric/subject
        over a time window (Q74, doc 03 §2). Resolution is chosen from the
        window — raw for up to 48 hours, hourly for up to 90 days, daily
        beyond — so clients cannot force a full raw scan. A missing or
        empty metrics.db yields an empty series, not an array-health error.
      tags: [metrics]
      x-hoserva-role: viewer
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
          description: >-
            Metric identifier, e.g. `disk_throughput_bytes_per_sec` or
            `network_throughput_bytes_per_sec` for dashboard charts.
        - name: subject
          in: query
          schema:
            type: string
          description: >-
            Device path for a per-disk metric (SMART, temperature) or omit
            for a host-wide metric (CPU, RAM, pool throughput).
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window start (inclusive), UTC.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window end (inclusive), UTC.
      responses:
        "200":
          description: The matching series, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        default:
          $ref: '#/components/responses/Error'

  /pool:
    get:
      operationId: getPool
      summary: Pool status
      description: >-
        Per-disk pool breakdown for `hoserva pool status` (doc 01 §3),
        including each disk's own `removalState` (doc 09 §4 step 2, #359)
        where one is in progress.
      tags: [pool]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Pool topology and disk breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatus'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance/plan:
    post:
      operationId: planRebalance
      summary: Preview rebalancing the pool
      description: >-
        Computes the rebalance plan (doc 09 §3): for every share with at
        least two branches, the files `cache.PlanRebalance` would move
        from that share's own most-full disk to its own least-full disk
        to bring them within the skew tolerance, plus any path-preserving
        warnings, and the exact typed confirmation `startRebalance`
        requires. A data disk in removal (any `removalState`) is left out
        of every share's branches: the plan neither moves a file off it
        nor onto it. Read-only: nothing is copied, synced or deleted.
      tags: [pool]
      x-hoserva-role: admin
      responses:
        "200":
          description: The rebalance plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancePlan'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance:
    post:
      operationId: startRebalance
      summary: Rebalance the pool
      description: >-
        Recomputes the rebalance plan (never trusting a client-supplied
        one — a stale plan can only omit or skip files at run time, never
        misdirect a copy or delete) and, once `confirmation` matches the
        exact phrase the matching `planRebalance` call returned, queues a
        resumable `job.TypeRebalance` job that runs it through
        `cache.RunRebalance` unchanged: copy and verify every batch,
        sync through the threshold guard, delete the batch's sources,
        sync again (Q14), batched so no trailing sync this run makes can
        ever trip the guard after sources are already gone (doc 09 §3). The
        recomputed plan leaves out a data disk in removal the same way
        `planRebalance` does. A wrong or missing confirmation is refused
        (`confirmation_required`) before anything runs.
      tags: [pool]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRebalanceRequest'
      responses:
        "200":
          description: The queued, resumable rebalance job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares:
    get:
      operationId: listShares
      summary: List shares
      description: >-
        Every configured share (doc 03 §4.1). Does not walk data disks;
        size and per-disk distribution are later issues.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Configured shares, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShare
      summary: Create a share
      description: >-
        Persists the share (D4), creates its directory tree on the
        branches its cache mode uses, writes the per-share mergerfs
        mount through the existing pool renderer, and regenerates
        `smb.conf` (doc 02 §1, doc 03 §4). Refused with 409
        `maintenance_mode` while the array is stopped (Q70): create
        would mkdir under bare disk mountpoints on the root filesystem,
        and the next array start would hide those writes.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
      responses:
        "200":
          description: The created share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getShare
      summary: Get a share
      description: One share by name (doc 03 §4.2).
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateShare
      summary: Update a share
      description: >-
        Updates cache mode, create policy and SMB options, then
        regenerates the per-share mount and `smb.conf`. Does not relocate
        existing files (doc 09 §2). Refused with 409 `maintenance_mode`
        while the array is stopped (Q70): update would mkdir and remount
        under bare disk mountpoints on the root filesystem.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShareRequest'
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShare
      summary: Delete a share definition
      description: >-
        Removes the share row and regenerates mounts and `smb.conf`.
        Leaves the share's files on disk (doc 03 §4.2 danger zone).
        `confirm: true` is required. Deleting the data is
        `deleteShareData`. Refused with 409 `maintenance_mode` while the
        array is stopped (Q70): delete would unmount and rewrite share
        mounts against bare disk mountpoints on the root filesystem.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: Share definition removed.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/data/delete:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: deleteShareData
      summary: Delete a share's files
      description: >-
        Deletes this share's files on the branches that hold it, and
        nothing else — not other shares, not the parity file, not disks
        that do not hold this share (doc 03 §4.2). The definition is
        left in place. `confirmation` must equal the share name.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteShareDataRequest'
      responses:
        "204":
          description: Share data deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/relocate:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: startShareRelocation
      summary: Relocate a share between cache and array
      description: >-
        Queues a `share_relocation` job moving name's files between its
        cache path and the array (doc 09 §2, Q14, Q15) —
        `hoserva share relocate <share> --to cache|array`. Cache to array
        behaves as a mover run limited to this share, ignoring the grace
        period; array to cache follows the two-phase copy-verify-sync-
        delete-sync order, through the same threshold guard every other
        sync goes through. There is no second relocation-invocation path.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartShareRelocationRequest'
      responses:
        "200":
          description: The queued or running share relocation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/browse:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: browseShare
      summary: List a share directory
      description: >-
        Lists one directory of the share, including the holding disk per
        entry from mergerfs `user.mergerfs.basepath` (doc 03 §4.2). This
        is an explicit call and may wake disks — it is never polled.
      tags: [shares]
      x-hoserva-role: viewer
      parameters:
        - name: path
          in: query
          description: Directory relative to the share root. Empty is the share root.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareBrowseResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShareFile
      summary: Delete a file or empty directory from the share
      description: >-
        Deletes one file or empty directory within the share, given a
        path relative to the share root (doc 03 §4.2 Browse tab). Refuses
        the share root itself and any path that would resolve outside the
        share's root, including through a symlink. `confirm: true` is
        required.
      tags: [shares]
      x-hoserva-role: admin
      parameters:
        - name: path
          in: query
          required: true
          description: File or empty directory to delete, relative to the share root.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: File or directory deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/permissions:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getSharePermissions
      summary: Get a share's per-user and per-group access
      description: >-
        Every user and every user group with an explicit access level on
        this share (Q27, doc 03 §7). A user or group with no row here is
        not represented.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This share's per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSharePermissions
      summary: Replace a share's per-user and per-group access
      description: >-
        A full replace: this share's access is set to exactly the users
        and groups listed, and every user or group previously granted an
        explicit level but missing from the request loses its row
        entirely (doc 03 §7: "editable from either side" — this is the
        share-side editor).
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSharePermissionsRequest'
      responses:
        "200":
          description: This share's updated per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /disks:
    get:
      operationId: listDisks
      summary: List disks
      description: Every block device Hoserva knows about (doc 02 §4).
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Disk inventory.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiskInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /disks/external:
    get:
      operationId: listExternalDisks
      summary: List external disks
      description: >-
        Disks outside the array (Q72, doc 02 §4, doc 03 §3.3): Ignore-role
        or a later USB disk, never a pool or parity member. Registered
        external disks plus inventory disks that are not the boot device
        and not in the array. Nothing is mounted by this call.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: External disks.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerExternalDisk
      summary: Register a disk as external
      description: >-
        Assigns a non-array, non-boot disk the Ignore/external role (Q72)
        with a label used as `/mnt/disks/<label>`. Does not mount or
        format. The boot device is refused.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalDiskRequest'
      responses:
        "200":
          description: The registered external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    patch:
      operationId: updateExternalDisk
      summary: Update an external disk
      description: >-
        Sets whether this disk's `/mnt/disks/<label>` mount is a local
        backup destination (doc 10 §1).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalDiskRequest'
      responses:
        "200":
          description: The updated external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/mount:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: mountExternalDisk
      summary: Mount an external disk
      description: >-
        Mounts the disk by filesystem UUID at `/mnt/disks/<label>` (Q21,
        Q72). Nothing mounts automatically on plug-in. The boot device
        and array disks are refused.
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The mounted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/eject:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: ejectExternalDisk
      summary: Eject an external disk
      description: >-
        Unmounts `/mnt/disks/<label>`, then spins the disk down (Q72).
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The ejected external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/format:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: formatExternalDisk
      summary: Format an external disk
      description: >-
        Formats the disk after the same typed confirmation array setup
        uses (`disk.TopologyPlan.Confirmation`, doc 03 §3.1 step 6). The
        boot device is never offered. A wrong or missing confirmation is
        refused with `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatExternalDiskRequest'
      responses:
        "200":
          description: The formatted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/wake-events:
    get:
      operationId: listWakeEvents
      summary: List spin-state wake events
      description: >-
        Reads persisted spin-state transitions from the central database
        only — never probes block devices (Q32, doc 03 §3.3a Phase 1).
        Returns every recorded transition plus per-device wake counts
        grouped by UTC day so the wake-events page can show when each
        disk woke, how long it stayed awake, and how often it woke.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Spin-state transition log and daily wake counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeEventsResponse'
        default:
          $ref: '#/components/responses/Error'

  /disks/array:
    post:
      operationId: createArray
      summary: Create the storage array
      description: >-
        Queues a Topology job that formats or adopts the assigned disks
        (doc 03 §3.1 step 6, doc 02 §4). The request is the wizard's role
        assignments, per-disk filesystem (including adopt/keep), pool
        options, and the same typed confirmation string
        `disk.TopologyPlan.Confirmation` produces. A wrong or missing
        confirmation is refused with `confirmation_required` and formats
        nothing. The handler calls `disk.FormatPlan` — never a second
        formatter (D1).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrayRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add/plan:
    post:
      operationId: planDiskAdd
      summary: Preview adding a data disk
      description: >-
        Computes the add plan (doc 02 §4 "Adding a disk"): the target
        disk's own identity (model, WWN or serial, size, its existing
        filesystem if any), its assigned mountpoint
        (`disk.NextDataMountpoint`) and the exact typed confirmation
        `addDisk` requires. Refuses (Q20) a disk that would leave a parity
        disk smaller than the array's largest data disk, and (Q21) a
        device already identified as one of the array's own members by WWN
        or serial, reusing `disk.TopologyPlan.Validate` over the resulting
        data set — the same check array setup runs. Read-only: nothing is
        formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskPlanRequest'
      responses:
        "200":
          description: The add plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add:
    post:
      operationId: addDisk
      summary: Add a data disk to the running array
      description: >-
        Queues a Topology job (`job.TypeDiskAdd`) that formats or adopts
        the disk, then regenerates mount units, the pool and
        `snapraid.conf` from SQLite (D4, doc 02 §4 "Adding a disk"). The
        confirmation must be the exact string the matching `planDiskAdd`
        call returned; a wrong or missing one is refused with
        `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace/plan:
    post:
      operationId: planDiskReplace
      summary: Preview replacing a data disk
      description: >-
        Computes the replace plan (doc 02 §4 "Replacing a failed disk"):
        the replacement's own identity (model, WWN or serial, size, its
        existing filesystem if any), the SnapRAID `fix` command that
        reconstructs the slot's contents after it is formatted, and the
        exact typed confirmation `replaceDisk` requires. Refuses
        (`slot_disk_present`) unless the slot's own recorded disk is
        genuinely gone — not merely unmounted, but absent from a fresh disk
        inventory by identity (doc 02 §4 steps 1-2; a healthy disk goes
        through the upgrade flow instead, #289) — and (Q20) a replacement
        that would leave a parity disk smaller than the array's largest
        data disk. Refuses (`disk_leaving_array`, 409) a slot whose disk is
        still `evacuating` or already `unlisted`: the replacement would
        inherit that state. A slot that is `evacuated` or `unpooled` is
        allowed once the slot's own disk is genuinely missing, refused
        with `slot_disk_present` otherwise like any other slot — replace
        abandons the removal and rebuilds the disk's recorded files from
        parity (#384). Read-only: nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskPlanRequest'
      responses:
        "200":
          description: The replace plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace:
    post:
      operationId: replaceDisk
      summary: Replace a data disk
      description: >-
        Queues a Topology job (`job.TypeDiskReplace`) that formats or
        adopts the replacement at the same mountpoint, regenerates mount
        units, the pool and `snapraid.conf` from SQLite, confirms the
        mountpoint is genuinely backed by the replacement before touching
        parity, then runs `snapraid fix` to reconstruct its contents from
        parity and the remaining disks (doc 02 §4 "Replacing a failed
        disk"). Identity is re-checked at format time and the boot disk is
        always refused. Refuses (`slot_disk_present`) the same way
        `planDiskReplace` does when the slot's own disk is still mounted or
        still present by identity, and (`disk_leaving_array`, 409) a slot
        still `evacuating` or already `unlisted`. A slot that is
        `evacuated` or `unpooled` is allowed once the slot's own disk is
        genuinely missing: the job clears the removal state as part of
        adopting the replacement, so the disk rejoins the array as an
        ordinary member and its recorded files rebuild from parity
        (#384). The confirmation must be the exact string the matching
        `planDiskReplace` call returned; a wrong or missing one is refused
        with `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade/plan:
    post:
      operationId: planDiskUpgrade
      summary: Preview upgrading a data or parity disk to a larger one
      description: >-
        Computes the upgrade plan (doc 02 §4 "Larger data disk"/"Larger
        parity disk") for the existing array slot at
        `mountpoint`, whichever role it holds: the replacement's own
        identity (model, WWN or serial, size, its existing filesystem if
        any), the copy/verify/remount steps a data-disk upgrade runs or
        the copy/verify/switch/check steps a parity-disk upgrade runs, and
        the exact typed confirmation `upgradeDisk` requires. For a data
        disk, refuses (`invalid_plan`) a replacement that would leave a
        parity disk smaller than it (Q20) — offering the parity upgrade
        flow first, the same rule `disk.DataDiskUpgradeExceedsParity`
        checks — and any of `planDiskReplace`'s own Q19/Q20/Q21/Q23
        checks. For a parity disk, `newMountpoint` is the fresh
        `/mnt/parityN` slot the new disk will be formatted, mounted and
        verified at independently of the old one (Q71) — never the old
        disk's own mountpoint. Refuses (`disk_leaving_array`, 409) a data
        disk in removal (any `removalState`): the new disk would inherit
        that state. Read-only: nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskUpgradePlanRequest'
      responses:
        "200":
          description: The upgrade plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskUpgradePlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade:
    post:
      operationId: upgradeDisk
      summary: Upgrade a data or parity disk to a larger one
      description: >-
        Starts a resumable Topology job (`job.TypeDiskUpgradeData` or
        `job.TypeDiskUpgradeParity`, resolved from the slot's role). The
        confirmation must be the exact string the matching
        `planDiskUpgrade` call returned; a wrong or missing one is refused
        with `confirmation_required` and formats nothing. A data disk in
        removal is refused (`disk_leaving_array`, 409) as
        `planDiskUpgrade` refuses it. A data-disk
        upgrade follows doc 02 §4's state machine: it is admitted only
        once `stopArray` has completed (otherwise `array_not_stopped`)
        and while no other data-disk upgrade is pending (otherwise
        `disk_upgrade_pending`, naming it). It requires a clean
        `snapraid diff` before formatting, copies and verifies the old
        disk, mounts the new one at the same mountpoint, requires
        `snapraid diff` to show no removed or updated files, and only
        then names the new disk in SQLite; the array stays stopped until
        the user starts it. A parity-disk upgrade runs with the array
        started (refused with `maintenance_mode` while it is stopped): it
        copies the parity file, verifies it byte for byte, switches the
        configuration and passes `snapraid check` before releasing the
        old parity disk (Q71). The old disk is never written to or
        released until its verification gate passes.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDiskRequest'
      responses:
        "200":
          description: The queued, resumable Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate/plan:
    post:
      operationId: planDiskEvacuation
      summary: Preview evacuating a data disk before removal
      description: >-
        Computes the evacuation plan for the data disk at `mountpoint`
        (doc 09 §4 steps 1-3, "mechanically a rebalance targeting one
        specific source disk"): every file `cache.PlanEvacuation` would
        move from that disk onto the pool's remaining disks, any
        path-preserving warnings, and the exact typed confirmation
        `evacuateDisk` requires. Refused (`invalid_plan`) when a share on
        this disk has no other branch to evacuate onto, when an entry on
        the disk is something the evacuation copy path cannot move (a
        symlink, fifo, socket or device node), when the remaining disks
        do not have room even after each one's own minimum free space is
        kept, or when the disk holds any top-level entry that is neither
        a configured share's own branch there nor SnapRAID's own
        bookkeeping (`lost+found`, `snapraid.content*`) — doc 09 §4 has no
        procedure for moving such content, so evacuation refuses to start
        rather than leave it behind unreported (#367); that refusal's own
        400 body, `EvacuationPlanRefusal`, names every offending path in
        `nonSharePaths`. Read-only: nothing is copied, synced or deleted,
        and this preview does not itself put the disk into doc 09 §4 step 2's own
        `removing`/no-create state — `evacuateDisk`'s own job does that,
        before its first copy, so the disk keeps taking new writes only
        until that job starts, never for as long as it runs. Refused
        (`disk_leaving_array`, 409) when the disk is already `unpooled` or
        `unlisted` — only `finishDiskRemoval` takes it further — and
        (`disk_removal_in_progress`) while a different disk is already in
        removal. An `evacuating` or `evacuated` disk is planned again, as
        the source of a resumed or repeated evacuation. No other disk in
        removal is ever a target. This operation carries out doc 09 §4
        steps 1 and 3-6 (moving the disk's own already-present files off, protected
        through the threshold guard, Q14); step 2's own no-create switch
        is applied by `evacuateDisk`'s job, not by this preview, and the
        mergerfs branch-list removal, SnapRAID removal and unmount in
        steps 7-9 are not performed by either.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskPlanRequest'
      responses:
        "200":
          description: The evacuation plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvacuationPlan'
        "400":
          description: >-
            The disk holds content outside every configured share;
            `nonSharePaths` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvacuationPlanRefusal'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate:
    post:
      operationId: evacuateDisk
      summary: Evacuate a data disk before removal
      description: >-
        Recomputes the evacuation plan for `mountpoint` (never trusting a
        client-supplied one, `startRebalance`'s own reasoning) and, once
        `confirmation` matches the exact phrase the matching
        `planDiskEvacuation` call returned, queues a resumable
        `job.TypeEvacuation` job. Before copying anything — and again on
        every resume — the job marks the disk `evacuating` (persisted in
        SQLite, D4) and applies no-create to its own branch in every pool
        mount, live (doc 09 §4 step 2); a failure to apply that fails the
        job before any copy. It then runs the plan through
        `cache.RunRebalance` unchanged: copy and verify every batch, sync
        through the threshold guard (each such sync naming this disk in
        the guard's own zero-files exemption, Q15, since the batch that
        finally empties it would otherwise trip that rule), delete the
        batch's sources, sync again (Q14) — then, once the whole plan
        finishes without being interrupted, `cache.EvacuationPostCheck`
        confirms the disk's own share branches hold nothing but empty
        directories (doc 09 §4 step 6) and the job marks the disk
        `evacuated` before reporting success. A wrong or missing
        confirmation is refused (`confirmation_required`) before anything
        runs, a disk already `unpooled` or `unlisted` is refused
        (`disk_leaving_array`, 409) as `planDiskEvacuation` refuses it, a
        second disk is refused (`disk_removal_in_progress`)
        while one is already in removal, and any new evacuation is
        refused (`evacuation_pending`) while another evacuation job is
        queued, running or interrupted. The removal state belongs to the
        job that set it: cancelling that job — queued, running or
        interrupted — clears it and puts the disk back to taking writes,
        and cancelling any other job never does. A job that fails leaves
        the disk `evacuating`; evacuating it again takes the state over,
        and cancelling that run clears it. Success
        here means the disk's data as this job saw it is safely off it
        and it is no longer taking new writes, not that it is empty of
        every file or safe to physically remove: doc 09 §4 steps 7-9
        (mergerfs branch-list removal, SnapRAID removal, unmount) are
        `finishDiskRemoval`'s.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskRequest'
      responses:
        "200":
          description: The queued, resumable evacuation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/remove/finish:
    post:
      operationId: finishDiskRemoval
      summary: Finish removing an evacuated data disk
      description: >-
        Queues a `job.TypeDiskRemove` Topology job that takes an evacuated
        data disk out of the array (doc 09 §4 steps 7-9). The confirmation
        is the same `REMOVE <mountpoint>` phrase `planDiskEvacuation`
        returned for the disk. Refused synchronously with
        `disk_slot_not_found` when no data disk occupies `mountpoint`,
        `disk_not_evacuated` when its removal state is not `evacuated`,
        `unpooled` or `unlisted`, and `confirmation_required` for a wrong
        or missing confirmation; `not_configured` when the daemon has no
        parity engine. Before changing anything the job checks all of that
        again, that the array without the disk still has a data disk and
        room for every content-file copy (Q18), that the disk is mounted
        by its own filesystem, and that nothing but empty directories and
        SnapRAID's own content files is left anywhere on it. It then marks
        the disk `unpooled` and takes it out of every pool mount, live
        (step 7; a failed live update fails the job); removes the empty
        directories the evacuation left, since SnapRAID records those too
        (rmdir only); runs a sync through the threshold guard with only
        this disk exempt from the zero-files rule, while its data line is
        still in snapraid.conf, and confirms SnapRAID tracks no file on it;
        marks it `unlisted`, regenerates snapraid.conf without it and
        checks SnapRAID accepts the result (step 8); then stops its mount
        unit, removes the unit file and deletes the disk from the array
        (step 9). The job's result names the disk
        as safe to physically remove; its filesystem is never wiped. A job
        that fails or is interrupted leaves the disk in the last state it
        reached, and running this operation again carries on from there —
        once `unlisted`, it never syncs again. A tripped guard leaves the
        disk `unpooled`, still listed and mounted, with nothing synced.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishDiskRemovalRequest'
      responses:
        "200":
          description: The queued disk-removal job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/remove/cancel:
    post:
      operationId: cancelDiskRemoval
      summary: Cancel a data disk's removal and return it to normal use
      description: >-
        Clears `mountpoint`'s doc 09 §4 removal state synchronously — no
        job — and re-applies the pool live so the disk's branches go back
        to RW (#361). Refused with `disk_slot_not_found` (404) when no
        data disk occupies `mountpoint`. Refused with
        `disk_removal_not_cancellable` (409) when the disk is not
        currently in removal; when it is `unpooled` or `unlisted` — it has
        already left the pool, so the only way forward is
        `finishDiskRemoval`, never back (doc 09 §4's own Open questions);
        or when it is `evacuating` and its evacuation job is still queued,
        running or interrupted — that job owns the state, so cancel it
        (`DELETE /jobs/{jobId}` — `jobs/{jobId}/cancel`) instead. An
        `evacuating` disk whose evacuation job has already ended (no
        longer queued, running or interrupted — including a job the store
        no longer has a record of) is cancelled the same as an `evacuated`
        one: the copy it ran already stopped, and cancelling here is how
        the disk gets back to ordinary use instead of sitting stuck until
        it is evacuated again. A live-update failure while re-applying the
        pool is an internal error, and the removal state is left cleared
        — the same as the disk-topology jobs' own live-apply failures —
        rather than silently reporting success with the disk still
        no-create.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDiskRemovalRequest'
      responses:
        "204":
          description: The removal is cancelled; the disk takes writes again.
        default:
          $ref: '#/components/responses/Error'

  /array/stop:
    post:
      operationId: stopArray
      summary: Stop the array
      description: >-
        Enters maintenance mode (Q70, doc 02 §4, `hoserva array stop`):
        refuse new jobs and interrupt non-resumable jobs, shut down
        running VMs, stop containers, stop Samba and NFS, then unmount
        share paths, the catch-all and data disks — the same list the
        `/storage` Stop array confirm dialog already shows. The handler
        calls `job.ArraySequence.Stop` and does not write parity. A
        failure leaves maintenance mode active so nothing new starts
        against a half-stopped array. `confirm: true` is required.
        Refused with `disk_upgrade_pending` while a data-disk upgrade is
        pending (doc 02 §4 E7): the array is already stopped for it, and
        nothing is stopped, signalled or unmounted.
      tags: [array]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopArrayRequest'
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/start:
    post:
      operationId: startArray
      summary: Start the array
      description: >-
        Reverses `stopArray` (Q70, doc 02 §4, `hoserva array start`):
        mount disks, the catch-all and share paths, then start services
        in the reverse of stop order, and exit maintenance mode only
        once every step succeeds. The handler calls
        `job.ArraySequence.Start`. Refused with `storage_not_ready`
        when the storage gate is not ready (Q69, `ErrStorageNotReady`)
        — nothing is mounted. Also refused with `disk_upgrade_pending`
        while a data-disk upgrade is pending — queued, running or
        interrupted at any checkpoint (doc 02 §4 E6); the error names
        the job to resume or cancel, and nothing is mounted. Once the
        disks are mounted, each must hold the filesystem SQLite names
        for it before the pool or any service starts (UR9); otherwise it
        is refused with `array_disk_mismatch`, the disks are unmounted
        again and maintenance mode stays on.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is false
            on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/degraded/acknowledge:
    post:
      operationId: acknowledgeDegradedArray
      summary: Acknowledge a degraded array
      description: >-
        Records the user's explicit choice to proceed while the array is
        degraded (doc 02 §1, Q69, `hoserva array acknowledge-degraded`):
        the handler calls `disk.StorageGate.Acknowledge` on the daemon's
        live gate and then runs the exact not-ready→ready transition a
        returning disk reaches (`storageTargetSync.UpdateOrError`) —
        mounting and confirming the pool, then starting every enabled,
        unmasked unit in `pool.DependentServiceUnits` (Samba, NFS, Docker,
        libvirtd), never `sh -c` and never a second mechanism. The
        acknowledgement itself survives every later rebuild of the
        daemon's array sequence (a share change, a disk-topology change, a
        SIGHUP) for as long as the same disk stays missing. Refused with
        `array_not_degraded` (409, `disk.ErrNothingToAcknowledge`) when
        nothing is currently missing — acknowledging a degraded state that
        does not exist would let a stale acknowledgement outlive the
        situation it was about. Refused with `array_services_not_started`
        (409) when the acknowledgement itself succeeds but the transition
        it triggers does not actually start anything — the array is in
        maintenance mode (`hoserva array stop`), or mounting or confirming
        the pool fails — so this never reports success over services that
        never came up — in that refusal case `arrayDegradedAcknowledged` on
        a later `GetStatus` still reports true (the acknowledgement
        stands) while `storageServicesReleased` stays false, so a client
        must check both before ever telling the user services are
        running. `arrayDegraded` on the returned status stays true for as
        long as the disk is still missing — acknowledging never reports a
        degraded array as healthy — and `arrayDegradedAcknowledged`
        becomes true instead, the field the persistent banner and top-bar
        pill use to show "acknowledged, running degraded" rather than
        clearing the warning outright.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after acknowledging. `arrayDegraded` stays true
            while the disk is still missing; `arrayDegradedAcknowledged` is
            true; `storageServicesReleased` is true only once the
            transition actually started the gated services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /parity:
    get:
      operationId: getParity
      summary: Parity status and guard state
      description: >-
        Reads SnapRAID status from the boot-device content file only — does
        not run `snapraid diff` or wake data disks (doc 02 §2, Q13).
        Threshold-guard state and grouped diff rows reflect the last
        explicit `POST /parity/diff` (or a sync job's own pre-sync diff)
        until the next one runs.
      tags: [parity]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current parity freshness and guard snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParitySnapshot'
        default:
          $ref: '#/components/responses/Error'

  /parity/diff:
    post:
      operationId: runParityDiff
      summary: Run a SnapRAID diff
      description: >-
        Runs `snapraid diff` on every data disk — an explicit user action
        that wakes every data disk (doc 02 §2, Q13). Returns grouped
        changes and threshold-guard evaluation for the parity page; never
        polled on a timer.
      tags: [parity]
      x-hoserva-role: admin
      responses:
        "200":
          description: Grouped diff and guard evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityDiffResult'
        default:
          $ref: '#/components/responses/Error'

  /parity/sync:
    post:
      operationId: startSync
      summary: Start a SnapRAID sync
      description: >-
        Queues a sync job through the threshold guard (doc 02 §2). A
        non-dry-run sync past a tripped guard requires `confirm: true`
        after reviewing the diff. Refused with 409 `on_battery` while
        the on-battery hold is active (doc 02 §6, Q77) — scheduled syncs
        are held until power returns.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
      responses:
        "200":
          description: The queued or running sync job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/scrub:
    post:
      operationId: startScrub
      summary: Start a SnapRAID scrub
      description: Queues a scrub job (`hoserva scrub`, doc 01 §3).
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScrubRequest'
      responses:
        "200":
          description: The queued or running scrub job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/fix:
    post:
      operationId: startFix
      summary: Start a SnapRAID fix
      description: >-
        Queues a fix job (`hoserva fix`, doc 01 §3). Requires
        `confirm: true` — fix rewrites data from parity.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFixRequest'
      responses:
        "200":
          description: The queued or running fix job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/run:
    post:
      operationId: startMover
      summary: Start a manual mover run
      description: >-
        Queues a mover job (`hoserva mover run`, doc 09 §2's manual trigger)
        — the same `TypeMover` job the threshold poll and the nightly chain
        submit; there is no second mover-invocation path. Refused with 409
        `on_battery` while the on-battery hold is active (doc 02 §6, Q77) —
        the mover is paused until power returns.
      tags: [mover]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running mover job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/last-run:
    get:
      operationId: getLastMoverRun
      summary: Most recent finished mover run
      description: >-
        The structured result of the most recent finished mover run
        (doc 09 §2's honest reporting, doc 03 §3.6): files moved, bytes,
        duration, and every skipped entry with its reason. Persisted in
        SQLite by the mover job itself (#273), not reconstructed from the
        job log. Null when no mover job has ever finished.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The last finished mover run, or null when none has finished yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/MoverRunResult'
        default:
          $ref: '#/components/responses/Error'

  /cache/usage:
    get:
      operationId: getCacheUsage
      summary: Cache usage breakdown
      description: >-
        Appdata / pending-moves / other byte breakdown for the cache disk
        (doc 03 §3.6). Computed as a by-product of each mover run (Q87),
        never a live directory walk on a timer (Q13). Null when no mover
        run has computed it yet.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The latest persisted breakdown, or null when none has been
            computed yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/CacheUsageBreakdown'
        default:
          $ref: '#/components/responses/Error'

  /config/export:
    post:
      operationId: exportConfig
      summary: Export a config archive
      description: >-
        Builds and returns doc 10 §1's `hoserva-config-*.tar.zst` archive.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The config archive.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /config/backup:
    post:
      operationId: runConfigBackup
      summary: Back up the config to the destinations now
      description: >-
        Queues a `config_backup` job (service class): the config archive
        the nightly chain writes, taken now. It writes one archive to every
        enabled backup destination, verifies it, and prunes each
        destination's own retention, counting the archive like a scheduled
        one — it never takes the slot of a pre-import, pre-update or
        pre-topology archive. It is serialized with the other config
        backups, so one asked for while another runs queues rather than
        failing. The job succeeds when at least one destination was written
        and its log names each destination written and each that failed
        (the stale-destination alert covers one that keeps failing), and
        fails, with a `config_backup_failed` notification, when none was.
        Refused with 409 `backup_no_destination` before anything is queued
        while no destination is enabled, and with 501 `not_configured`
        when this daemon has no backup service. To download an archive
        instead of writing one to the destinations, use `exportConfig`.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running config backup job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /config/import:
    post:
      operationId: importConfig
      summary: Import a config archive
      description: >-
        Restores from doc 10 §1's archive format. Requires `confirm: true`
        — this replaces the running configuration: the database, the custom
        config files (`*.custom.conf`), the installed app templates and each
        stack's compose and `meta.json` files, after which every managed
        config file is regenerated from the restored database and the result
        applied to the running pool. It also restores the passphrase-protected
        part of the archive, its stacks' `.env` files: with the optional
        `passphrase` if one is given, otherwise with the configured backup
        passphrase. Without a passphrase that opens it, everything else is
        restored and the report says the `.env` files were not. When the
        import restores `.env` files, the pre-import archive's own
        `secrets.age` is sealed with the passphrase that opened the imported
        archive's, so it holds every `.env` the import replaces; a failure
        to write it refuses the import. The answer is
        the restore report: what was restored per category, what was not and
        why, the name of the pre-import archive and which passphrase seals its
        secrets. Every refusal happens
        before anything is written, including the pre-import backup: 400
        `invalid_archive` (it does not unpack or checksum, holds a file its
        manifest does not list or lacks one it lists, holds a link,
        device, FIFO or duplicate entry, or has a `secrets.age` or
        `identity.age` that is not readable, which shows once a passphrase
        is tried against it), 400 `backup_passphrase_incorrect` (a `passphrase`
        was given and it does not open the archive's `secrets.age` or, for
        an archive with an `identity.age` and no `secrets.age`, its
        `identity.age`; one that opens `secrets.age` but not `identity.age`
        is not refused), 400
        `incompatible_archive` (another
        schema version), 409 `job_in_progress`, 409
        `archive_other_installation` (its machine key check value differs
        from this installation's or is missing; a different installation's
        archive is restored only onto a fresh install) and 409
        `archive_array_mismatch` (its disks, their removal state or the
        relocation in flight differ from the live array; the message names
        each difference), and 409 `restore_path_unsafe` (a file it would
        restore lands on a symbolic link or on something that is not a
        regular file, or it names a path outside the directory it is
        restored into; nothing is followed). A bare-metal restore that
        would replace a Samba or NFS file already on this server also
        refuses with 409 `host_files_not_saved` when no backup destination
        is enabled to take the copy of it that the pre-import archive
        carries. A failure to stage the files
        answers 500 `import_failed` with nothing changed; a failure once the
        database has been replaced answers 500 `import_failed` naming the
        pre-import archive to restore from and which of the file categories
        were restored and which left as they were. The
        array's own state, running, in maintenance
        mode or stopped, is kept as it is, never restored from the archive,
        so an import cannot return a stopped array to normal operation.


        On a fresh install, one with no array configured, whatever admin
        accounts it has, the import is the bare-metal restore (doc 10 §1)
        of another installation's archive. It takes the archive's array
        disks from `state.db` and matches each against the attached disks
        by identity; the mapping is what `previewConfigImport` shows, and
        the import refuses with 409 `disk_mapping_required` without
        `diskMapping`, the mapping the user confirmed, and with 409
        `disk_mapping_stale` when it no longer matches the attached disks.
        An archive from an older schema version is upgraded on a staged
        copy of its database by the same migration runner a normal upgrade
        uses; one from a newer version is refused with 409
        `archive_newer_version`. This box's own machine key check is kept,
        so `hoservad` starts. With a backup passphrase that opens the
        archive's `secrets.age`, every database secret in it (ACME, UPS,
        backup destination and notification channel credentials) is sealed
        under this box's machine key and written back into its own table,
        column and row, and the stack `.env` files are restored; the
        passphrase becomes this box's backup passphrase; and, when it opens
        `identity.age`, the archive's backup recipient replaces this box's
        own, so archives written from then on are encrypted to it. Without
        such a passphrase everything else is restored, this box keeps its own
        backup recipient (reported as `backup_recipient`), and every secret
        sealed under the archive's key is cleared and reported in
        `notRestored`. TOTP enrolment and any secret the archive does not
        carry are always cleared and reported, so the next sign-in of an
        account with TOTP enrols again. A `passphrase` given that does not
        open the archive's `secrets.age`, or, for an archive with an
        `identity.age` and no `secrets.age`, its `identity.age`, is refused
        with 400 `backup_passphrase_incorrect` before anything is written;
        one that opens `secrets.age` but not `identity.age` is restored, and
        the report says the recipient was kept. Only
        matched disks are mounted; an absent, replaced
        or ambiguous disk stays a row of the restored array, unmounted, and
        is reported in `notRestored` (the replace flow adopts a replacement
        disk), and no disk is ever formatted or partitioned. While no admin account exists this operation and
        `previewConfigImport` are served on the Unix socket only; the TCP
        listener answers 409 `setup_required`.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, confirm]
              properties:
                archive:
                  type: string
                  format: binary
                confirm:
                  type: boolean
                  description: Must be true — import is destructive.
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: >-
                    The backup passphrase the archive's `secrets.age` and
                    `identity.age` were sealed under. Optional: omitted, the
                    configured backup passphrase is tried. On a fresh
                    install it also becomes this box's backup passphrase.
                diskMapping:
                  type: string
                  minLength: 1
                  maxLength: 65536
                  description: >-
                    The JSON of a `ConfigImportDiskMapping`: the mapping the
                    user confirmed, which is `previewConfigImport`'s
                    `bareMetal.diskMapping` as it was shown. Required when
                    the installation has no array (409
                    `disk_mapping_required` without it) and refused with
                    409 `disk_mapping_not_applicable` otherwise, since an
                    import into an array restores no disks. Sent as a JSON
                    string, not a JSON part, because the generated clients
                    send an empty part for an unset optional object; one that
                    is not a valid mapping is refused as 400
                    `invalid_disk_mapping`.
      responses:
        "200":
          description: Import completed; what it restored and what it did not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportReport'
        default:
          $ref: '#/components/responses/Error'

  /config/import/preview:
    post:
      operationId: previewConfigImport
      summary: Preview a config import
      description: >-
        Reads the same archive upload as `importConfig` and reports what an
        in-place import would change, without changing anything: it writes
        no database row, no pre-import archive, takes no job hold, and
        leaves no file behind. `blockers` lists the refusals `importConfig`
        would return for this archive, with the same codes and messages
        (400 `incompatible_archive`, 409 `archive_other_installation`, 409
        `archive_array_mismatch`, 409 `restore_path_unsafe`); `groups`
        compares the archive's database with the live one per category, and
        lists the custom config files, app templates and app stack files
        the import would replace, add and remove; it is empty when the
        archive's schema version differs, since the two cannot be compared.
        `secrets` says whether the archive has a passphrase-protected section
        (`status`, for `secrets.age`) and whether the passphrase available
        opens it and `identity.age` (`identity`), and if not, which stacks'
        `.env` files would not be restored. The optional `passphrase`
        is tried as `importConfig` tries it: one that does not open the
        archive's `secrets.age`, or, for an archive with an `identity.age`
        and no `secrets.age`, its `identity.age`, is refused as 400
        `backup_passphrase_incorrect`; one that opens `secrets.age` but not
        `identity.age` is not refused, and `identity` reports
        `passphrase_incorrect`. Without a `passphrase` the configured one
        is tried, and one that is absent or does not open the files shows
        only in `secrets`, never as a refusal; an archive with neither file has nothing to check a
        `passphrase` against. An
        archive that cannot be read is refused as `importConfig` refuses it
        (400 `invalid_archive`, 413 `archive_too_large`), and a daemon with
        no config backup wired answers 501 `not_configured`. Nothing on a
        data disk is read.


        On a fresh install, one with no array configured, `bareMetal`
        reports the bare-metal restore (see `importConfig`): whether the
        archive's database would be upgraded, and one entry per array disk
        the archive records, with the attached disk it matched, or none,
        and a state of `matched`, `absent`, `replaced` or `ambiguous`.
        `bareMetal.diskMapping` is the mapping to confirm, ready to send as
        `importConfig`'s `diskMapping`. An archive from a newer schema
        version is a blocker (`archive_newer_version`) with no `bareMetal`.
        The refusals for another installation's archive or a different
        array (`archive_other_installation`, `archive_array_mismatch`) apply
        to an installation that has an array only. While no admin account
        exists this operation is served on the Unix socket only.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: >-
                    The backup passphrase the archive's `secrets.age` and
                    `identity.age` were sealed under. Optional: omitted, the
                    configured backup passphrase is tried.
      responses:
        "200":
          description: What the import would change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportPreview'
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations:
    get:
      operationId: listBackupDestinations
      summary: List backup destinations
      description: >-
        Every place a config backup is written, with its last successful
        backup and whether it is stale (doc 10 §1). Credentials are never
        returned — `hasSecrets` is the only trace of them (Q28).
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every destination.
          content:
            application/json:
              schema:
                type: object
                required: [destinations]
                properties:
                  destinations:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBackupDestination
      summary: Add a backup destination
      description: >-
        A remote destination (`smb`, `s3`, `sftp`, `webdav`, `rclone`) is
        written through rclone and is always encrypted (Q80). It is refused
        with 400 `backup_passphrase_required` while no backup passphrase is
        set, and with 424 `rclone_missing` — whose `message` carries the
        install command (Q41) — when rclone is not installed. Credentials in
        `secrets` are sealed under the machine key before they reach the
        database. Local destinations work without rclone.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupDestinationRequest'
      responses:
        "201":
          description: The new destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations/{destinationId}:
    parameters:
      - $ref: '#/components/parameters/DestinationId'
    patch:
      operationId: updateBackupDestination
      summary: Change a backup destination's enabled flag or retention
      description: >-
        Changes `enabled` and `retention` in place; a field left out is left
        as it is. Its type, path, options and credentials cannot be
        changed — remove the destination and add it again. Disabling never
        removes an archive or the credentials, and the next backup run uses
        the new values without a restart. Retention is bounded as in
        `createBackupDestination` (each count 0 to 1000, at least one
        archive kept) and, as always, applies only to archives this
        installation wrote. Switching a disabled destination back on
        restarts its staleness clock, so it is not reported stale until two
        days after that. 404 `backup_destination_not_found` for an unknown
        id; 400 `backup_destination_invalid` for a retention out of bounds.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBackupDestinationRequest'
      responses:
        "200":
          description: The destination as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBackupDestination
      summary: Remove a backup destination
      description: >-
        Removes the destination's configuration. Archives already written
        to it are left where they are.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations/{destinationId}/test:
    parameters:
      - $ref: '#/components/parameters/DestinationId'
    post:
      operationId: testBackupDestination
      summary: Test a backup destination
      description: >-
        Writes a small file to the destination, reads it back and deletes
        it (doc 10 §1: an untested backup destination is decoration). A
        destination that cannot be reached is a `200` with `success` false
        and the reason; a missing rclone is a `424` `rclone_missing`.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the write, read-back and delete all worked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestinationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /backup/drill:
    get:
      operationId: getRestoreDrill
      summary: Last restore drill
      description: >-
        The result of the most recent restore drill (doc 10 §1): whether the
        newest config archive on each enabled backup destination could be
        fetched, opened the way a restore opens it, and verified, and when.
        `lastRun` is absent until a drill has run. 501 `not_configured` when
        this daemon has no backup service. When the next drill is due is in
        `getSchedules`, under the `restore_drill` job.
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The last drill's result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreDrill'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startRestoreDrill
      summary: Run a restore drill now
      description: >-
        Queues a `restore_drill` job (service class), the job the monthly
        schedule queues. It fetches the newest config archive this
        installation wrote to each enabled destination, opens it the way a
        restore would (an encrypted one through its identity sidecar and the
        backup passphrase alone), checks its checksums and that `state.db`
        opens and passes `PRAGMA integrity_check`, and discards everything it
        fetched. It never writes to a destination and never reads the live
        database. A destination that cannot be read, or holds no archive
        written by this installation, fails the drill. The result replaces
        the one `getRestoreDrill` returns, and a failed drill publishes a
        `restore_drill_failed` notification. A drill behind another one queues
        rather than failing.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running restore drill job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup:
    get:
      operationId: getAppdataBackup
      summary: Appdata backup policy
      description: >-
        Every container with a bind-mounted directory inside the appdata
        location (the cache disk's `appdata` directory), each with whether
        the backup stops it while its directory is copied and whether it is
        in the backup at all (doc 10 §2). A container the operator has not
        configured is stopped and included. A known database image that is
        not stopped carries `warning`: copying a database's files while it
        runs can produce an archive that does not restore. 501
        `not_configured` when this daemon has no Docker Engine client, and
        503 when the Engine is not reachable.
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The containers in scope and their policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataBackupConfig'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startAppdataBackup
      summary: Start an appdata backup
      description: >-
        Queues an `appdata_backup` job (service class): every container that
        is running and set to be stopped is stopped, each included
        container's appdata directories are archived, one archive per
        container, on the same device as the appdata location, the stopped
        containers are started again in reverse order, and only then are the
        archives verified and written to the enabled backup destinations
        (never the boot device's default destination, which is too small for
        appdata). `containers` limits the run to the named containers; omit
        it for every included one. Refused with 409 `array_stopped` while the
        array is stopped or its storage is not ready — with the cache disk
        unmounted the appdata directories are empty — and 404
        `container_not_found` for a name that is not in scope. A run that
        fails publishes an `appdata_backup_failed` notification.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppdataBackupRequest'
      responses:
        "200":
          description: The queued or running appdata backup job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/containers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
        description: The container's name.
    put:
      operationId: setAppdataBackupContainer
      summary: Set a container's appdata backup policy
      description: >-
        Replaces the container's policy. Opting a known database image out
        of being stopped is allowed, and the response carries `warning`
        saying why that is a bad idea. 404 `container_not_found` for a name
        with no appdata directory in scope.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppdataBackupContainerRequest'
      responses:
        "200":
          description: The container with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataBackupContainer'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/archives:
    get:
      operationId: listAppdataArchives
      summary: List appdata archives
      description: >-
        The appdata archives this installation wrote to each enabled backup
        destination, newest first, optionally for one container. It lists the
        destinations when asked — a remote destination is reached through
        rclone — and a destination that could not be listed is reported in
        `unavailable` instead of being read as having no archives.
      tags: [backup]
      x-hoserva-role: admin
      parameters:
        - name: container
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: The archives found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppdataArchivesOK'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore:
    post:
      operationId: restoreAppdata
      summary: Restore one container's appdata
      description: >-
        Queues an `appdata_restore` job (service class). The archive is
        fetched, decrypted and verified before anything is changed. Then the
        container is stopped if it is running, a snapshot of its current
        appdata is written to the enabled backup destinations, and only when
        that snapshot is written is the appdata replaced by the archive's
        content; if the snapshot cannot be written the live appdata is not
        touched. The container is started again afterwards. Requires
        `confirm: true`: the restore overwrites the container's appdata
        (400 `confirmation_required` otherwise). 404 `archive_not_found` for
        an archive the named destination does not hold, and 409
        `array_stopped` while the array is stopped or its storage is not
        ready.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreAppdataRequest'
      responses:
        "200":
          description: The queued or running appdata restore job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore/preview:
    post:
      operationId: previewAppdataRestore
      summary: Preview restoring one container's appdata
      description: >-
        Queues an `appdata_restore_preview` job (service class, scoped to the
        container) that reports what `restoreAppdata` would overwrite for the
        same archive on the same destination, before anything is changed.
        Read the result with `getAppdataRestorePreview` once the job has
        succeeded. The job fetches, decrypts and verifies the archive
        exactly as the restore does and fails with the restore's own error
        when the archive is corrupt, is another container's, names a
        directory outside the appdata location, or holds entries a restore
        could not unpack. It
        then compares each archived directory with the live one, walking the
        live appdata only for this job: files present in both are
        `replaced`, files only in the archive are `added`, and files only in
        the live appdata are `removed`, because the restore replaces each
        directory as a whole. It stops no container, writes nothing under the
        appdata location and leaves no fetched archive on disk, on success or
        failure. It queues behind a backup or restore of the same container
        and runs beside those of others. Cancelling it stops the fetch, the
        reading of the archive and the walk of the live directories; the
        decryption and the verification read that follow the fetch run to
        their end first. 404 `archive_not_found` for an archive the named
        destination does not hold, 404 `backup_destination_not_found`, 400
        `appdata_archive_invalid` for a request that names no archive of
        this installation and container, and 409 `array_stopped` while the
        array is stopped or its storage is not ready.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewAppdataRestoreRequest'
      responses:
        "200":
          description: The queued or running preview job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore/preview/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getAppdataRestorePreview
      summary: Get a restore preview
      description: >-
        The result of the `appdata_restore_preview` job `previewAppdataRestore`
        queued. The daemon holds the sixteen most recent results in memory, so
        a result is gone after a restart and after sixteen newer previews:
        preview again. 404 `job_not_found` for an id that is not a restore
        preview job, 409 `appdata_preview_not_ready` while the job is queued
        or running, 409 `appdata_preview_failed` when it failed, was
        cancelled or was interrupted (the message says why; `getJob` and
        `getJobLog` have the rest), and 404 `appdata_preview_gone` when the
        job succeeded but its result is no longer held.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: What restoring the archive would overwrite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataRestorePreview'
        default:
          $ref: '#/components/responses/Error'

  /doctor:
    get:
      operationId: runDoctor
      summary: Run prerequisite checks
      description: >-
        Docker, mergerfs, SnapRAID, mounts, parity freshness, SMART,
        free space and permission sanity (`hoserva doctor`, doc 01 §3),
        plus existing host configuration (Samba shares, NFS exports,
        fstab mounts, Docker containers and images) for onboarding (Q76).
      tags: [doctor]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Plain-language check results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        default:
          $ref: '#/components/responses/Error'

  /doctor/host-config:
    post:
      operationId: applyHostConfig
      summary: Apply onboarding choices for existing host configuration
      description: >-
        Q76: each detected Samba file, NFS exports file, fstab, Docker
        containers list and images list is imported into the database or
        left unmanaged under the drift model (doc 01 §2). Existing host
        files are never overwritten unless the caller chose import.
        Docker's data-root stays at `/var/lib/docker` when containers or
        images exist, or when there is no cache disk (Q62).
      tags: [doctor]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyHostConfigRequest'
      responses:
        "200":
          description: Applied choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyHostConfigResult'
        default:
          $ref: '#/components/responses/Error'

  /apps:
    get:
      operationId: listApps
      summary: List containers
      description: >-
        Every container the Docker Engine reports, managed and unmanaged
        alike (doc 04 §2) — Compose stack installs and the
        managed/unmanaged distinction against an installed stack are a
        later issue (#278). available is false, with no error, whenever
        Docker itself is not reachable (doc 04 §3).
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Container inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppsOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/images:
    get:
      operationId: listAppImages
      summary: List images
      description: Every image the Docker Engine holds locally.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Image inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppImagesOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/updates:
    get:
      operationId: listAppUpdates
      summary: Container update status
      description: >-
        What the daily registry check (doc 04 §6, Q81) last found for each
        container's image: a new build of the same tag (`new_build`) is
        reported apart from a newer version tag (`new_version`, named by
        `availableTag`). The check asks each registry for manifests and tag
        names only, never a pull. `skipped` means the registry was rate
        limiting requests and is asked again at the next check, `failed`
        that the check could not tell, and `not_checked` that no check has
        reached the image yet or that it could not look: the registry wants a
        login (registries are checked anonymously only) or the container is
        pinned to an image digest, so there is no tag to update. The
        `message` says which. None of them means up to date. available is
        false, with no error, whenever Docker itself is not reachable.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: One entry per container, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppUpdatesOK'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startAppUpdates
      summary: Update several containers
      description: >-
        Queues one `container_update` job (service class) that updates the
        named containers one after another, each as `updateApp` does: an
        appdata snapshot first when its appdata sits on the cache disk, then
        the update, keeping the image it ran before for a revert. One
        container's failure does not stop the others; the job fails, naming
        each, once they have all been tried, and a container that failed is
        left on its previous image. With no `containers`, the targets are
        the containers the last update check found a newer image for, minus
        those that opted out of bulk updates (`setAppUpdatePolicy`); those
        come back in `skipped`. Naming a container updates it whether or not
        it opted out. When there is nothing to update no job is queued and
        `job` is absent. Refused with 409 `array_stopped` while the array is
        stopped (maintenance mode) or its storage is not ready, and with 503
        `array_state_unknown` if the array's state cannot be read; no job is
        queued. An unknown container is 404 and queues nothing.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppUpdatesRequest'
      responses:
        "200":
          description: The queued job and what was left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAppUpdatesOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/updates/history:
    get:
      operationId: listAppUpdateHistory
      summary: Container updates that can be reverted
      description: >-
        Every update Hoserva made that kept the image the container ran
        before it, newest first: when it was made, the previous image, the
        appdata snapshot taken just before it (absent for a container with
        no appdata on the cache disk) and until when the previous image is
        kept (`keepUntil`, set by `imageKeepDays` in the app settings).
        `revertible` says whether `revertApp` would go ahead now: only the
        newest update of a container can be reverted, once, within the keep
        period and while the previous image is still held and the container
        still runs the image it was updated to. A snapshot that has gone
        from its destination only shows when the revert is tried. available
        is false, with no error, whenever Docker itself is not reachable.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The recorded updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppUpdateHistoryOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getApp
      summary: Inspect a container
      description: >-
        One container's current state, health, image, tag, ports and
        mounts (doc 04 §3).
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeApp
      summary: Remove a container
      description: >-
        Removes a stopped container (`app_running`, 409, for one that is
        not stopped). The container's appdata is kept unless
        `deleteAppdata` is explicitly true: then the bind-mount
        directories strictly inside the appdata location (the cache
        disk's `appdata` directory) are deleted, together with the
        container's anonymous volumes. Anything outside that location, the
        location itself, and any directory another container mounts, or
        that lies inside a directory of appdata another container mounts,
        is never deleted — a request that would delete one is refused
        (`appdata_shared`, 409) and removes nothing. `deleteAppdata` with no appdata location is refused
        (`appdata_unavailable`, 409). `deleteAppdata` is refused with 409
        `array_stopped` while the array is stopped (maintenance mode) or its
        storage is not ready, because the cache disk is not mounted and the
        appdata on it could not be deleted, and with 503
        `array_state_unknown` if the array's state cannot be read. A remove
        that keeps appdata is allowed on a stopped array. Every refusal
        happens before the container is removed.
      tags: [apps]
      x-hoserva-role: admin
      parameters:
        - name: deleteAppdata
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Also delete the container's appdata. Never implied by anything
            else; absent means false.
      responses:
        "200":
          description: The container was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAppResult'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: startApp
      summary: Start a container
      description: >-
        Starts the container and returns its state afterwards, and
        publishes a `container_state` event. Managed and unmanaged
        containers alike. Refused with 409 `array_stopped`, before the
        Engine is called, while the array is stopped (maintenance mode) or
        its storage is not ready: a container started then would write
        onto the boot device under `/mnt/user` and `/mnt/cache`. If the
        array's state cannot be read the start is refused too, with 503
        `array_state_unknown`.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after starting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: stopApp
      summary: Stop a container
      description: >-
        Stops the container (the Engine's own grace period, then a kill)
        and returns its state afterwards, and publishes a
        `container_state` event.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after stopping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/restart:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: restartApp
      summary: Restart a container
      description: >-
        Restarts the container and returns its state afterwards, and
        publishes a `container_state` event. Refused with 409
        `array_stopped`, before the Engine is called, while the array is
        stopped (maintenance mode) or its storage is not ready, and with
        503 `array_state_unknown` if the array's state cannot be read —
        the same refusal as `startApp`.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after restarting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/recreate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: recreateApp
      summary: Recreate a container
      description: >-
        Queues a `container_recreate` job (service class): it pulls the
        container's image again and replaces the container with one built
        from the same configuration, volumes and networks. If the pull or
        the creation of the replacement fails, or the replacement does not
        start, the original container is left as it was — same name and
        volumes, running again if it was running. A container started with
        `--rm` cannot be recreated: the Engine deletes it the moment it
        stops, so the job fails before changing anything. Refused with 409
        `array_stopped` while the array is stopped (maintenance mode) or
        its storage is not ready, and with 503 `array_state_unknown` if
        the array's state cannot be read; no job is queued. The job checks
        again when it runs and fails, changing nothing, if the array has
        stopped since.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/update:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: updateApp
      summary: Update a container
      description: >-
        Queues a `container_update` job (service class) that updates the
        container. The job pulls the container's image again first, which
        changes nothing about the container: a failed pull, or one that
        finds nothing newer, ends the job with no snapshot taken and the
        container left alone. Otherwise, when its appdata sits on the cache
        disk, a snapshot of it is written (a `pre-update` archive on the
        appdata backup's destinations) and the update does not go ahead if
        that snapshot cannot be written; then the container is replaced by
        one built from the pulled image with the same configuration, volumes
        and networks, as `recreateApp` does, and the image it ran before is
        kept locally for `imageKeepDays`. If any step after the pull fails,
        the container is left on its previous image, with the image tag the
        pull moved pointed back at it and the update's record removed, so
        nothing is left to revert. A container pinned to an image digest
        cannot be updated. Refused with 409 `array_stopped`
        while the array is stopped (maintenance mode) or its storage is not
        ready, and with 503 `array_state_unknown` if the array's state
        cannot be read; no job is queued. The job checks again when it runs.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: revertApp
      summary: Revert a container's last update
      description: >-
        Queues a `container_update` job (service class) that puts the
        container back on the image it ran before its latest update and
        restores the appdata snapshot taken just before it. A running
        container is stopped first, so it never runs the updated image
        against the restored data; the snapshot is restored, writing a
        snapshot of the appdata it replaces (`pre-restore`), so anything
        written since the update is kept in an archive; the container is
        recreated from the kept image without pulling; then it is started,
        once, on the previous image. A container that was stopped stays
        stopped. A revert deletes nothing from the pool. Refused with 409
        `nothing_to_revert` when the container has no update to revert (see
        `listAppUpdateHistory`), with 409 `revert_unavailable` when the
        update is on record but can no longer be undone (the previous image
        was removed, its keep period ended, or the snapshot is gone from its
        destination), and with 409 `array_stopped` / 503
        `array_state_unknown` while the array is stopped or unreadable; no
        job is queued and nothing is changed. If the job fails after it has
        stopped the container, the container is left stopped, because the
        restore may already have replaced its data and the updated image must
        not run against that; reverting again finishes it, while the
        snapshot is still on its destination, after which the container is
        started by hand.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/update-policy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    put:
      operationId: setAppUpdatePolicy
      summary: Include or exclude a container from bulk updates
      description: >-
        Sets whether `startAppUpdates` with no named containers skips this
        container. The policy is kept by container name. It does not stop
        the container being updated by name.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppUpdatePolicyRequest'
      responses:
        "200":
          description: The container's policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpdatePolicy'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getAppLogs
      summary: Read a container's logs
      description: >-
        The container's stdout and stderr as plain text: the last `tail`
        lines, then, with `follow` true, every new line as it is written
        until the client disconnects or the container exits (each line is
        flushed as it arrives).
      tags: [apps]
      x-hoserva-role: admin
      parameters:
        - name: tail
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 10000
            default: 200
          description: How many trailing lines to start from.
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The container's log text.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getAppStats
      summary: Read a container's resource use
      description: >-
        CPU, memory, network and block I/O for a running container
        (`app_not_running`, 409, for one that is not running — a stopped
        container is never reported as using nothing).
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The container's current resource use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStats'
        default:
          $ref: '#/components/responses/Error'

  /stacks:
    get:
      operationId: listStacks
      summary: List Compose stacks
      description: >-
        Every stack Hoserva has a row for, sorted by name. A stack's
        `.env` is never returned: it holds generated secrets.
      tags: [stacks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The stacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStacksOK'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createStack
      summary: Create a Compose stack
      description: >-
        Stores the stack's row (D4, `.env` sealed under the machine key) and
        generates `docker-compose.yml`, `.env` and `meta.json` into the
        directory named after the stack, then checks the result with
        `docker compose config`. Nothing is started. Refused with 409
        `stack_exists` when a stack of that name exists. A directory of
        that name already under the stacks directory (what a removed
        stack's own files left behind) is used as it is, and only the three
        generated files are written into it; it is refused with 409
        `stack_dir_exists` when it holds a `docker-compose.yml`, which is
        never overwritten. A name that is not 1 to 63 lowercase letters,
        digits, `-` or `_`, starting with a letter or digit, is refused
        with 400 `invalid_stack_name` before anything is touched. A Compose
        file that `docker compose config` rejects is refused with 400
        `invalid_stack`, and leaves no row and no generated file behind.
      tags: [stacks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStackRequest'
      responses:
        "200":
          description: The created stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        default:
          $ref: '#/components/responses/Error'

  /stacks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The stack's name.
    get:
      operationId: getStack
      summary: Get a Compose stack
      description: One stack's row, without its `.env`.
      tags: [stacks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeStack
      summary: Remove a Compose stack
      description: >-
        Runs `docker compose down` for the stack (its containers and
        networks are removed; named volumes are kept), deletes its generated
        `docker-compose.yml`, `.env` and `meta.json`, and then its row; the
        stack's directory goes too if nothing else is in it, so the name
        can be used again and a file the stack keeps there stays. Taking
        the stack down does not need its `.env`. `docker compose down`
        removes every container and network of the stack's Compose project
        name, and with `--volumes` its named volumes, whichever file or
        directory they were started from. So before docker runs, every
        container of that project must be one Compose started from the
        stack's own directory: a project of the same name that something
        else runs (a hand-run `~/immich/compose.yml` is project `immich`) is
        refused with 409 `stack_project_shared`, whether or not the stack
        has its `.env` and whether or not appdata is deleted. Since that
        cannot be checked otherwise, a remove is also refused, as any
        docker failure is, when the project's containers cannot be listed
        (503 `docker_unavailable` when Docker is not reachable). Appdata is
        deleted only when `deleteAppdata` is explicitly true: then the
        stack's named volumes are removed with `docker compose down
        --volumes`, each bind-mount directory of the stack's containers
        that lies strictly inside an appdata location (the cache disk's
        `appdata` directory) and is used by no other container is deleted,
        and so is the stack's whole directory, before the row. Nothing is
        deleted if one of the stack's containers is still there after
        `docker compose down`. That needs the array running, like a
        container remove that deletes appdata: refused with 409
        `array_stopped` (or 503 `array_state_unknown`) before anything is
        changed, with 409 `appdata_unavailable` when no appdata location
        is known, and with 409 `appdata_shared` when a directory is used
        by another container or another container binds a place inside the
        stack's directory. A name that is not a valid stack name is
        refused with 400 `invalid_stack_name` before anything is touched.
        A `docker compose down` that fails, or a directory that cannot be
        deleted, leaves the row in place so the remove can be retried.
      tags: [stacks]
      x-hoserva-role: admin
      parameters:
        - name: deleteAppdata
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Also delete the stack's appdata (its named volumes and the
            bind-mount directories inside the appdata location that no
            other container uses) and its whole directory. Never implied by
            anything else; absent means false.
      responses:
        "200":
          description: The stack was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveStackResult'
        default:
          $ref: '#/components/responses/Error'

  /templates/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    post:
      operationId: previewTemplateInstall
      summary: Preview installing a catalog template
      description: >-
        Resolves the template's inputs the way an install would, without
        creating or writing anything: paths default to the template's own
        default or, with none, to the existing share of the input's role
        (`/mnt/user/<role>`) and list the existing shares as suggestions;
        a port that a running container publishes or the host listens on
        resolves to the next free port above it, with the port asked for in
        `requestedValue`; a timezone with no value takes the host's; a
        `device` input with role `gpu` lists the host's render devices
        (`/dev/dri/renderD*`) as suggestions. A secret is never given a
        value here: it is marked `generated` and is generated by the
        install. The privilege summary is computed from the Compose content
        with these values substituted — privileged mode, host networking,
        the host PID or cgroup namespace, device cgroup rules, the Docker
        socket and host paths outside the pool and cache — never from
        anything the template declares. `compose` is the file an install
        would write. An input that is not the template's, a value that does
        not fit its kind, or a path input with no value and no default is
        refused with 400 `invalid_template_input`; a name that is not a valid
        stack name with 400 `invalid_stack_name`; an unknown template with
        404 `template_not_found`; a catalog entry that fails the template
        rules with 422 `template_invalid`; a GPU the host cannot give to a
        container (no `render` group) with 409 `gpu_unavailable`; no free
        port above a conflicting one with 409 `no_free_port`; Docker not
        reachable, which the port check needs, with 503 `docker_unavailable`.
      tags: [templates]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInstallRequest'
      responses:
        "200":
          description: What an install would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInstallPlan'
        default:
          $ref: '#/components/responses/Error'

  /templates/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    post:
      operationId: installTemplate
      summary: Install a catalog template as a stack
      description: >-
        Resolves the inputs exactly as `previewTemplateInstall` does, and
        generates each secret that has no value of its own (48 hexadecimal
        characters). A port that is taken is moved to the next free port
        and reported in the result's `requestedValue`, never refused. Then
        it creates the stack as `createStack` does: the stack's row
        records the template's source, id and revision, and
        `docker-compose.yml` (the template with its `x-hoserva` block kept,
        plus the `/dev/dri` device and the host's `render` group for a GPU
        that was chosen), `.env` (every input; secrets only here) and
        `meta.json` are generated and checked with `docker compose config`.
        Nothing is started. The result carries the privilege summary, so a
        template that asks for privileged mode or the Docker socket is
        reported with its install. The stack errors of `createStack`
        apply (409 `stack_exists`, 409 `stack_dir_exists`, 400
        `invalid_stack`), as do those of `previewTemplateInstall`.
      tags: [templates]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInstallRequest'
      responses:
        "200":
          description: The installed stack and what it was installed with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInstallResult'
        default:
          $ref: '#/components/responses/Error'

  /users:
    get:
      operationId: listUsers
      summary: List accounts
      description: Every account, sorted by username (Q27, doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Create an account
      description: >-
        Defaults to the share-only role when omitted (Q27): a new account
        has no UI login until an admin promotes it. No password is set by
        this call — setUserPassword provisions the UI credential and the
        Samba account together, in a separate action. Never creates an
        admin account (users_one_admin_idx allows exactly one, created only
        by createFirstAdmin).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUser
      summary: Change an account's role
      description: >-
        Viewer or share-only only (Q27) — the sole admin account is never
        reachable through this operation.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: >-
        Removes the account, its sessions, its group memberships and its
        per-share permissions. Refuses the sole admin account.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Account deleted.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: setUserPassword
      summary: Set an account's password
      description: >-
        Writes the UI credential hash and the Samba passdb entry together
        (Q27, doc 03 §7): if the Samba write fails, the UI credential is
        rolled back to its previous value, and nothing is left updated on
        only one side. This is the ordinary admin-driven password action
        on `/users` — distinct from resetUserPassword (Q78), which is
        root-only recovery for a locked-out account over the Unix socket
        and never touches the Samba passdb.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
      responses:
        "204":
          description: Password set on both the UI credential and the Samba account.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserSharePermissions
      summary: Get one account's per-share access
      description: >-
        Every share this account has an explicit access level for (Q27,
        doc 03 §7). A share with no row here is not represented — none
        of the three levels is assumed.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This account's per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUserSharePermissions
      summary: Replace one account's per-share access
      description: >-
        A full replace: the account's access is set to exactly the shares
        and levels listed, and every share this account previously had an
        explicit level for but that is missing from the request loses its
        row entirely (doc 03 §7: "editable from either side" — this is the
        user-side editor).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSharePermissionsRequest'
      responses:
        "200":
          description: This account's updated per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /user-groups:
    get:
      operationId: listUserGroups
      summary: List user groups
      description: Every user group, sorted by name (Q27, doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every user group.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUserGroup
      summary: Create a user group
      description: >-
        A named collection of accounts, purely for bulk share-permission
        assignment (Q27, doc 03 §7) — distinct from the fixed `users`
        system group (GID 100, Q26) that every share's files belong to.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserGroupRequest'
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    delete:
      operationId: deleteUserGroup
      summary: Delete a user group
      description: Also removes its memberships and its per-share permissions.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Group deleted.
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    put:
      operationId: setUserGroupMembers
      summary: Replace a user group's membership
      description: A full replace of the group's member list.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserGroupMembersRequest'
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      description: Every session across every account, with revoke (doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every active session.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: >-
        Ends this session immediately, server-side — the same effect as
        that session's own logout, forced by an admin.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/tokens:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: createApiToken
      summary: Create a personal API token
      description: >-
        A personal API token (Q43), scoped to admin or viewer, for
        scripting and the remote CLI over TCP. The raw token is returned
        only here, once — only its SHA-256 is ever stored afterward,
        mirroring how a session cookie is handled (doc 01 §7). Refused
        for a share-only account (share-only has no API access at all,
        Q27), and refused when role exceeds the account's own role: a
        token can narrow an account's access (an admin can hand out a
        viewer-scoped token to reduce a script's own blast radius), never
        widen it.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        "201":
          description: The new token, with its raw value shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens:
    get:
      operationId: listApiTokens
      summary: List personal API tokens
      description: Every account's tokens, most recently created first (doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every personal API token.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenSummary'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/ApiTokenId'
    delete:
      operationId: revokeApiToken
      summary: Revoke a personal API token
      description: >-
        Ends this token immediately — the request it would have
        authenticated next is refused the moment this returns, since
        every request looks the token up fresh (no caching).
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Token revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically — the `hoserva` group and TCP are refused.
        Audit-logged and announced through every notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        "204":
          description: Password reset.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/disable-totp:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: disableUserTotp
      summary: Disable a user's TOTP
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically. Audit-logged and announced through every
        notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: TOTP disabled.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/unlock:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: unlockUser
      summary: Clear login lockout
      description: >-
        Clears the account's login rate-limiter lockout (doc 01 §7, Q78).
        Root-only over the Unix socket, checked against the peer's uid 0
        specifically. Audit-logged like the other recovery commands.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: Lockout cleared.
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9:_-]*$'

    EventType:
      name: eventType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationEventType'

    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ApiTokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ShareName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ShareName'

    ExternalLabel:
      name: label
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExternalDiskLabel'

  responses:
    Error:
      description: An error response (doc 01 §5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hoserva_session
      description: Web UI session, issued at login over TCP.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: personal-api-token
      description: >-
        Personal API token (Q43), scoped to a role (admin/viewer). For
        scripts and the remote CLI over TCP.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            A stable, machine-readable identifier, e.g. `job_not_found`.
            Every auth-related operation (#22) can also return one of:
            `setup_required` (409 — no admin account exists yet; every
            operation but getSetupStatus/createFirstAdmin refuses with
            this while it's true), `setup_complete` (409, createFirstAdmin
            — an admin account already exists), `rate_limited` (429 — the
            account or source address is currently locked out after
            repeated failures; `message` gives a retry-after),
            `too_busy` (503 — the bounded password-hashing worker pool is
            saturated; safe to retry shortly), `invalid_credentials` (401,
            login — an unknown username or wrong password, deliberately
            indistinguishable), `totp_required` (401, login — the account
            has TOTP enrolled and no code was supplied), `totp_invalid`
            (401, login and confirmTotp — a code was supplied but is
            wrong, expired or already used; a missing login code is
            `totp_required` instead, never this), `totp_reverify_required`
            (403, enrollTotp — TOTP is already active and the caller
            didn't prove they still hold the account: no password or code
            was supplied, or the one supplied was wrong; 403 rather than
            401 since the session itself is valid, only the
            reverification is missing or failed), `totp_reverify_ambiguous`
            (400, enrollTotp — TOTP is already active and *both* the
            current password and a current TOTP code were supplied;
            supply exactly one), `totp_not_pending` (409, confirmTotp — no
            pending secret to confirm), `unauthorized` (401 — no
            credential, or one that no longer validates), `forbidden`
            (403 — a valid credential whose role doesn't satisfy the
            operation), `no_session` (404 — the Unix socket's
            peer-credential-trusted local access has no signed-in user for
            an operation that needs one), `request_too_large` (413 — the
            request body exceeded the server's size limit), `bad_request`
            (400 — the request body could not be decoded), `not_found`
            (404 — no such API route), `api_token_not_found` (404,
            revokeApiToken — no token with that id), `invalid_token_role`
            (400, createApiToken — the requested role is neither admin nor
            viewer; share-only is never a valid token role),
            `share_only_no_api_token` (403, createApiToken — the target
            account has SMB/NFS access only and no API access at all, Q27)
            and `token_role_exceeds_account` (403, createApiToken — the
            requested role is wider than the target account's own role; a
            token can only narrow an account's access, never widen it).
        message:
          type: string
          description: A human-readable explanation, safe to show in the UI or CLI.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which field failed validation.

    UserRole:
      type: string
      description: >-
        Q27: admin (full UI), viewer (read-only UI), or share-only
        (SMB/NFS only, no UI login at all — the default for a new
        account). A share-only account can still sign in with this role
        on a session that predates a role change; every operation but the
        public ones refuses it (RoleViewer/RoleAdmin never satisfy it),
        and login itself refuses a share-only account outright.
      enum: [admin, viewer, share-only]

    User:
      type: object
      required: [id, username, role, totpEnrolled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.

    SetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    CreateFirstAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totpCode:
          type: string
          maxLength: 16
          description: Required once the account has TOTP enrolled; omitted otherwise.

    TotpEnrollRequest:
      type: object
      description: >-
        Both fields are optional for a first enrolment. Once TOTP is
        already active on the account, exactly one must prove the caller
        still holds it — the current password, or a current TOTP code —
        or enrollTotp is refused; supplying both is refused too (doc
        01 §7).
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    TotpEnrollResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret (RFC 6238), for manual entry.
        otpauthUri:
          type: string
          description: An otpauth:// URI, for the enrolment QR code (doc 03 §1).

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    JobType:
      type: string
      description: Every job type named in doc 01 §4's mutually-exclusive-class table.
      enum:
        # Parity
        - sync
        - scrub
        - fix
        - check
        # Array-write
        - rebalance
        - evacuation
        - share_relocation
        - mover
        - vm_disk_relocation
        # Topology
        - disk_format
        - disk_add
        - disk_remove
        - disk_replace
        - disk_upgrade_data
        - disk_upgrade_parity
        - pool_remount
        # Service
        - appdata_backup
        - appdata_restore
        - appdata_restore_preview
        - restore_drill
        - config_backup
        - container_update
        - container_recreate
        - acme_issue
        # VM
        - vm_start
        - vm_stop
        - vm_create
        - vm_delete
        - vm_snapshot
        - vm_clone
        - vm_migration_import

    JobClass:
      type: string
      description: The mutually exclusive job class the scheduler enforces (doc 01 §4).
      enum: [parity, array_write, topology, service, vm]

    JobStatus:
      type: string
      description: >-
        `interrupted` is set on an in-flight job by a daemon restart and is
        never cleared automatically (doc 01 §4) — resuming or re-running it
        is always an explicit user action.
      enum: [queued, running, interrupted, succeeded, failed, cancelled]

    Job:
      type: object
      required:
        - id
        - type
        - class
        - status
        - resumable
        - cancellable
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 100
          description: Null when the job type or tool reports no meaningful percentage.
        resumable:
          type: boolean
          description: Whether this job type persists a checkpoint to resume from (Q29).
        cancellable:
          type: boolean
          description: Whether the underlying tool honestly supports cancelling this job.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: "null"

    DiskState:
      type: string
      description: >-
        `wrong_filesystem` (#388) is `PoolDiskEntry`-only: a disk matched
        to an array slot by identity (Q21: serial/WWN) whose filesystem
        UUID does not match what SQLite recorded for that slot — a
        replacement disk that kept the original disk's serial/WWN (a
        cloned or reused drive) but was formatted differently, or not at
        all. Distinct from `missing`: the disk is genuinely present, so
        the pool's own slot list must say so rather than report it
        `active`. The storage gate treats it exactly like a missing disk
        (not ready, no mount attempted for that slot) and never emits it
        on `DiskStateEvent`, since it is not a spindown state.


        `mount_failed` (#398) is also `PoolDiskEntry`-only, and covers the
        case `wrong_filesystem` deliberately does not: a disk matched to
        a slot by identity whose filesystem UUID was never positively
        read at all — most commonly a genuinely blank same-serial
        replacement, the literal #388 scenario — so the storage gate's
        own identity/FSUUID check reports the array ready for it, but
        hoservad's own bounded attempt to mount that slot's disk still
        failed or timed out. Never derived from a device probe on this
        state's own read path (Q13) — it reflects the daemon's last
        actual mount attempt, recorded when it happened. The web/CLI
        Replace disk flow offers this slot's own device as its only
        replacement target, the same way it does for `wrong_filesystem`;
        the replace job's own one-off probe of that exact device is what
        actually confirms it is blank before formatting it. Never emitted
        on `DiskStateEvent`, since it is not a spindown state.
      enum: [active, standby, spinning_up, missing, failed, wrong_filesystem, mount_failed]

    DiskRemovalState:
      type: string
      description: >-
        doc 09 §4's own disk-removal state machine (#359, #358):
        `evacuating` from before an evacuation's first copy until its
        post-check passes — every pool mount marks this disk no-create
        for the whole time (step 2); `evacuated` once that copy and
        post-check finish, but the disk is still in every mergerfs branch
        list, SnapRAID layout and mount table (steps 7-9 have not run
        yet, still no-create); `unpooled` once `finishDiskRemoval`'s job
        has taken it out of every pool mount (step 7) — still in
        snapraid.conf and mounted; `unlisted` once a sync has recorded it
        empty and it is out of snapraid.conf too (step 8) — only its
        unmount and removal from the array are left. A disk that finished
        leaves the pool and the array altogether.
      enum: [evacuating, evacuated, unpooled, unlisted]

    NotificationLevel:
      type: string
      enum: [info, warning, error, critical]

    # `full`-shape SSE envelopes (ogen's x-ogen-sse-event-shape): each member
    # carries the discriminator in its own `event` field, so a client can
    # switch on the wire value without decoding `data` first. `const`, not a
    # single-value `enum`, on purpose: ogen names a named enum type after its
    # schema plus property (e.g. `DiskStateEvent`'s `event` property would be
    # `DiskStateEventEvent`), which collides with the identical naming ogen's
    # own discriminator codegen uses for `Event`'s variant tags once `Event`
    # itself is generated (api/event-schema-root.yaml, jschemagen) — `const`
    # inlines the field as a plain validated string instead of a named type,
    # so there is nothing left to collide.
    JobProgressEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: job_progress
        data:
          $ref: '#/components/schemas/Job'

    DiskStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: disk_state
        data:
          type: object
          required: [diskId, device, state, at]
          properties:
            diskId:
              type: string
            device:
              type: string
              description: e.g. `/dev/sdb` — as reported, never accepted back as input (doc 01 §7).
            state:
              $ref: '#/components/schemas/DiskState'
            at:
              type: string
              format: date-time

    ContainerStateEvent:
      type: object
      description: >-
        A container's state or health changed — sent when the Engine
        reports it (a start, die, pause, unpause or health check result,
        including a container killed from outside Hoserva) and when a
        start, stop, restart or recreate through the API finishes. `state`
        is the Engine's own vocabulary. `health` is present only when the
        event carries a health check result (or the container's health
        after an API action); a start, stop or die resets the check and
        the Engine's event omits it.
      required: [event, data]
      properties:
        event:
          type: string
          const: container_state
        data:
          type: object
          required: [containerId, name, state, at]
          properties:
            containerId:
              type: string
            name:
              type: string
            state:
              $ref: '#/components/schemas/AppState'
            health:
              $ref: '#/components/schemas/AppHealth'
            at:
              type: string
              format: date-time

    NotificationEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: notification
        data:
          type: object
          required: [id, eventType, level, title, message, createdAt]
          properties:
            id:
              type: string
            eventType:
              $ref: '#/components/schemas/NotificationEventType'
            level:
              $ref: '#/components/schemas/NotificationLevel'
            title:
              type: string
            message:
              type: string
            createdAt:
              type: string
              format: date-time

    Event:
      description: The full set of `/api/v1/events` SSE event types (doc 01 §5).
      oneOf:
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/DiskStateEvent'
        - $ref: '#/components/schemas/ContainerStateEvent'
        - $ref: '#/components/schemas/NotificationEvent'
      discriminator:
        propertyName: event
        mapping:
          job_progress: '#/components/schemas/JobProgressEvent'
          disk_state: '#/components/schemas/DiskStateEvent'
          container_state: '#/components/schemas/ContainerStateEvent'
          notification: '#/components/schemas/NotificationEvent'

    NotificationEventType:
      type: string
      description: >-
        The fixed event catalog doc 03 §8.3 lists, in that doc's own order.
        internal/notify assigns every one of these a compiled-in default
        severity (NotificationLevel); notify_event_severity overrides it
        per event type.
      enum:
        - smart_warning
        - smart_failure
        - disk_offline
        - array_degraded
        - sync_succeeded
        - sync_failed
        - sync_blocked_threshold
        - scrub_errors_found
        - pool_above_threshold
        - disk_near_minfreespace
        - cache_above_threshold
        - mover_skipping_files
        - config_drift_detected
        - container_unhealthy
        - container_update_available
        - hoserva_update_available
        - hoserva_update_failed
        - reboot_required
        - ups_on_battery
        - ups_battery_low
        - login_failure_burst
        - credential_reset
        - certificate_expiring
        - certificate_renewal_failed
        - config_backup_failed
        - appdata_backup_failed
        - backup_destination_stale
        - restore_drill_failed

    NotificationChannelType:
      type: string
      enum: [email, gotify, ntfy, discord, webhook]

    NotificationWebhookMethod:
      type: string
      enum: [POST, PUT]

    NotificationWebhookHeaders:
      type: object
      additionalProperties:
        type: string

    NotificationChannel:
      type: object
      description: >-
        Never carries a credential (Q28) — `hasSecret` is the only signal
        that one is configured. Only the properties relevant to `type` are
        meaningful; the rest are absent.
      required: [id, name, type, enabled, hasSecret, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: Whether a credential is configured for this channel.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string
          description: >-
            The header carrying the generic webhook's credential, e.g.
            `Authorization` — the header's value is `secret`, never a
            plain property here.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNotificationChannelRequest:
      type: object
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type: string
          description: >-
            The channel's credential, e.g. an SMTP password, a Gotify app
            token, an ntfy auth token, a Discord webhook URL, or a generic
            webhook's auth header value. Encrypted with the machine key
            before it reaches the database (Q28) and never returned by any
            later read.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    UpdateNotificationChannelRequest:
      type: object
      description: >-
        Same shape as CreateNotificationChannelRequest, a full replace,
        except `secret` is tri-state: omitted keeps the existing
        credential, `null` clears it, a string replaces it.
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type:
            - string
            - "null"
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    NotificationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: The delivery error, present only when success is false.

    NotificationRoutingEntry:
      type: object
      required: [eventType, severity, channelIds]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateNotificationRouteRequest:
      type: object
      required: [severity, channelIds]
      properties:
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationAlert:
      type: object
      required: [id, eventType, level, title, message, createdAt, read]
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        level:
          $ref: '#/components/schemas/NotificationLevel'
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationGroup:
      type: object
      required: [eventType, alerts]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAlert'

    ListNotificationsOK:
      type: object
      required: [groups, unreadCount]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NotificationGroup'
        unreadCount:
          type: integer
          minimum: 0

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        all:
          type: boolean

    MarkNotificationsReadOK:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    NotificationQuietHours:
      type: object
      required: [enabled, start, end, criticalAlwaysDelivers]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 24-hour local time, e.g. "22:00".
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        criticalAlwaysDelivers:
          type: boolean
          description: >-
            Always true (doc 03 §8.3) — critical alerts deliver regardless
            of quiet hours, and this cannot be disabled, so there is no
            request field that ever sets it otherwise.

    UpdateQuietHoursRequest:
      type: object
      required: [enabled, start, end]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    GeneralSettings:
      type: object
      required: [backupPassphraseSet]
      properties:
        hostname:
          type: string
          description: Configured host name, if any.
        timezone:
          type: string
          description: IANA timezone name, e.g. "Europe/Berlin".
        backupPassphraseSet:
          type: boolean
          description: >-
            Whether a backup passphrase is configured. The passphrase itself
            is never returned (Q28).

    UpdateGeneralSettingsRequest:
      type: object
      properties:
        hostname:
          type: string
          description: >-
            Host name for this server. An empty string clears a previously
            set value. Omitted leaves hostname unchanged.
        timezone:
          type: string
          description: IANA timezone name. Omitted leaves timezone unchanged.
        backupPassphrase:
          type: string
          minLength: 1
          description: >-
            Write-only. Sets or replaces the backup passphrase (Q28).
            Omitted leaves any existing passphrase unchanged.

    UPSConnection:
      type: string
      enum: [usb, network]
      description: >-
        Doc 03 §8.1 connection choice-cards: a USB-attached UPS Hoserva
        drives locally, or a remote NUT server this host monitors (Q77).

    UPSSettings:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >-
            Whether a UPS configuration row exists. False means the card
            shows the optional empty state; every other field is omitted.
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          description: NUT driver name for a USB UPS (e.g. usbhid-ups).
        port:
          type: string
          description: Driver port for a USB UPS (commonly "auto").
        monitorPasswordSet:
          type: boolean
          description: >-
            Whether a local monitor password is stored. The password
            itself is never returned (Q28).
        networkHost:
          type: string
          description: Remote NUT server hostname or address.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT server port (default 3493 when omitted on write).
        networkUpsName:
          type: string
          description: UPS name on the remote NUT server.
        networkUsername:
          type: string
          description: Monitoring username on the remote NUT server.
        networkPasswordSet:
          type: boolean
          description: >-
            Whether a network monitoring password is stored. The password
            itself is never returned (Q28).
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >-
            USB-only. Charge percent that marks the battery low for a
            clean shutdown (Q77). Omitted or zero leaves NUT's driver
            default.
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          description: >-
            USB-only. Estimated runtime seconds remaining that mark the
            battery low (Q77). Omitted or zero leaves NUT's driver default.

    UpdateUPSSettingsRequest:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          minLength: 1
          description: Required for USB. NUT driver name (e.g. usbhid-ups).
        port:
          type: string
          minLength: 1
          description: Required for USB. Driver port (commonly "auto").
        monitorPassword:
          type: string
          minLength: 1
          description: >-
            Write-only. Required on first USB configure; omit on later
            updates to keep the stored secret (Q28).
        networkHost:
          type: string
          minLength: 1
          description: Required for network. Remote NUT server host.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT port. Defaults to 3493 when omitted.
        networkUpsName:
          type: string
          minLength: 1
          description: Required for network. UPS name on the remote server.
        networkUsername:
          type: string
          minLength: 1
          description: Required for network. Monitoring username.
        networkPassword:
          type: string
          minLength: 1
          description: >-
            Write-only. Required on first network configure; omit on later
            updates to keep the stored secret (Q28).
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: USB-only low-battery charge percent (Q77).
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          description: USB-only low-battery runtime seconds (Q77).

    NetworkBackend:
      type: string
      enum: [ifupdown, networkmanager, systemd-networkd, unknown]
      description: Detected host network backend (Q75).

    NetworkAddressMethod:
      type: string
      enum: [dhcp, static]
      description: How this interface obtains its address.

    NetworkInterface:
      type: object
      required: [name, method, state]
      properties:
        name:
          type: string
          description: Kernel interface name, e.g. `enp1s0`.
        mac:
          type: string
          description: Hardware address, if known.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
        address:
          type: string
          description: Configured IPv4 or IPv6 address without prefix.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for `address`.
        gateway:
          type: string
          description: Default gateway for this interface, if any.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers used with this configuration.
        state:
          type: string
          enum: [up, down]
          description: Link operational state.

    NetworkPending:
      type: object
      required: [interface, expiresAt, remainingSeconds]
      properties:
        interface:
          type: string
          description: Interface the pending confirm-or-revert applies to.
        expiresAt:
          type: string
          format: date-time
          description: When the previous configuration is restored if unconfirmed.
        remainingSeconds:
          type: integer
          minimum: 0
          description: Whole seconds left in the confirm window.

    TLSCertificateKind:
      type: string
      enum: [self_signed, lets_encrypt]
      description: How the current TLS certificate was issued (Q9).

    TLSCertificateInfo:
      type: object
      required: [kind, notAfter, daysRemaining]
      properties:
        kind:
          $ref: '#/components/schemas/TLSCertificateKind'
        notAfter:
          type: string
          format: date-time
          description: Certificate expiry instant.
        daysRemaining:
          type: integer
          description: Whole days until expiry; negative if already expired.
        domain:
          type: string
          description: >-
            DNS name the Let's Encrypt certificate covers. Absent for a
            self-signed certificate.

    DNS01Provider:
      type: string
      enum: [cloudflare, rfc2136]
      description: >-
        DNS-01 providers in v1: Cloudflare's API and generic RFC 2136.
        HTTP-01 and TLS-ALPN-01 are not offered (Q9).

    LetsEncryptStatus:
      type: object
      required: [configured, enabled]
      properties:
        configured:
          type: boolean
          description: True when DNS-01 credentials are stored.
        enabled:
          type: boolean
          description: True when unattended renewal is armed.
        domain:
          type: string
          description: Hostname configured for DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        hasSecret:
          type: boolean
          description: True when a DNS credential is stored (Q28); the secret itself is never returned.
        lastError:
          type: string
          description: Last issue or renewal failure. Omitted after a success.

    ConfigureLetsEncryptRequest:
      type: object
      required: [domain, provider]
      properties:
        domain:
          type: string
          minLength: 1
          description: Hostname the certificate will cover, challenged via DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        cloudflareAPIToken:
          type: string
          description: >-
            Cloudflare API token with Zone.DNS Edit. Write-only (Q28).
            Required when `provider` is cloudflare and no token is stored yet.
        rfc2136Nameserver:
          type: string
          description: RFC 2136 nameserver as host:port. Required when `provider` is rfc2136.
        rfc2136TsigKeyName:
          type: string
          description: TSIG key name. Required when `provider` is rfc2136.
        rfc2136TsigSecret:
          type: string
          description: >-
            TSIG secret. Write-only (Q28). Required when `provider` is
            rfc2136 and no secret is stored yet.
        rfc2136TsigAlgorithm:
          type: string
          description: TSIG algorithm. Defaults to hmac-sha256.

    NetworkSettings:
      type: object
      required: [backend, editable, interfaces, certificate, allowAllSources, listenPort, letsEncrypt]
      properties:
        backend:
          $ref: '#/components/schemas/NetworkBackend'
        editable:
          type: boolean
          description: True only when the backend is ifupdown (Q75).
        readOnlyReason:
          type: string
          description: Why addressing cannot be edited, when `editable` is false.
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        pending:
          $ref: '#/components/schemas/NetworkPending'
        certificate:
          $ref: '#/components/schemas/TLSCertificateInfo'
        letsEncrypt:
          $ref: '#/components/schemas/LetsEncryptStatus'
        allowAllSources:
          type: boolean
          description: >-
            When false (default), the TCP listener accepts only LAN-ish
            sources (Q10). When true, every source address is accepted.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: TCP port the TLS UI/API currently listens on (Q9).
        listenPortRestartRequired:
          type: boolean
          description: True when a persisted listen-port change has not been bound yet.

    ApplyNetworkSettingsRequest:
      type: object
      properties:
        interface:
          type: string
          minLength: 1
          description: >-
            Interface to reconfigure. Required when any of `method`,
            `address`, `prefix`, `gateway` or `dns` is set.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
          description: >-
            Required when any of `interface`, `address`, `prefix`,
            `gateway` or `dns` is set — the managed ifupdown stanza is
            always rewritten in full.
        address:
          type: string
          description: Static address without prefix. Required when `method` is static.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for a static address. Required when `method` is static.
        gateway:
          type: string
          description: Default gateway. Empty string clears a previously set gateway.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers. Empty array clears them.
        allowAllSources:
          type: boolean
          description: Set the Q10 access-scope toggle. Omitted leaves it unchanged.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Persist a new listen port for the next daemon start. Omitted leaves it unchanged.

    UpdateChannel:
      type: string
      enum: [stable, beta]
      description: Release channel the update check reads from the signed index (Q67).

    UpdateStatus:
      type: object
      required: [currentVersion, channel, checkEnabled, rebootRequired, pendingDebianUpdates, dependencies]
      properties:
        currentVersion:
          type: string
          description: Installed Hoserva package version.
        availableVersion:
          type: string
          description: Newer version on the configured channel, if any.
        availableTag:
          type: string
          description: Git tag of availableVersion, if any.
        changelog:
          type: string
          description: Release notes for availableVersion, if the index carries them.
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean
          description: Whether the periodic outbound update check is enabled (Q49).
        previousVersion:
          type: string
          description: Version rollback would restore, if an upgrade has been applied.
        rebootRequired:
          type: boolean
          description: Whether `/run/reboot-required` is present (Q68).
        pendingDebianUpdates:
          type: array
          items:
            $ref: '#/components/schemas/DebianPackageUpdate'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/PackageDependencyStatus'
        blockingJob:
          $ref: '#/components/schemas/BlockingJob'
          description: >-
            A running Parity, Array-write or Topology job that would refuse
            an update, rollback or (until it finishes) a reboot.

    DebianPackageUpdate:
      type: object
      required: [name, installedVersion, candidateVersion]
      properties:
        name:
          type: string
        installedVersion:
          type: string
        candidateVersion:
          type: string

    PackageDependencyStatus:
      type: object
      required: [name, installedVersion, testedFloor, inRange]
      properties:
        name:
          type: string
          description: Debian package name (mergerfs, snapraid).
        installedVersion:
          type: string
        testedFloor:
          type: string
          description: Lowest version this Hoserva release was tested against (Q7).
        inRange:
          type: boolean
          description: True when installedVersion is at or above testedFloor.

    BlockingJob:
      type: object
      required: [id, type, class]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'

    UpdateUpdateSettingsRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean

    ConfirmUpdateRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true; the UI/CLI confirm dialog is what sets this.

    MaintenanceChainStepId:
      type: string
      enum: [mover, diff_guard, sync, scrub, config_backup]
      description: One step in Q30's fixed nightly maintenance chain order.

    OtherScheduleJobId:
      type: string
      enum: [smart_self_test, appdata_backup, restore_drill, container_update_check]
      description: A recurring job scheduled outside the nightly chain (doc 03 §8.4).

    ScheduleFrequency:
      type: string
      enum: [daily, weekly, monthly]

    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: Day of week, 0=Sunday through 6=Saturday.

    MaintenanceChainStep:
      type: object
      required: [id, enabled]
      properties:
        id:
          $ref: '#/components/schemas/MaintenanceChainStepId'
        enabled:
          type: boolean

    MaintenanceChainSchedule:
      type: object
      required: [startTime, weeklyScrubDay, schedulePreview, nextRun, steps]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time the chain starts (Q30 default 02:00).
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        schedulePreview:
          type: string
          description: Human-readable summary, e.g. "every day at 02:00".
        nextRun:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: Q30 order — mover, diff_guard, sync, scrub, config_backup.

    ScheduledJob:
      type: object
      required: [id, enabled, frequency, time, schedulePreview, nextRun]
      properties:
        id:
          $ref: '#/components/schemas/OtherScheduleJobId'
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        schedulePreview:
          type: string
        nextRun:
          type: string
          format: date-time

    ScheduleConflict:
      type: object
      required: [jobA, jobB]
      properties:
        jobA:
          type: string
          description: >-
            Identifier of the first colliding schedule — `maintenance_chain`
            or an OtherScheduleJobId value.
        jobB:
          type: string
          description: Identifier of the second colliding schedule.

    Schedules:
      type: object
      required: [chain, otherJobs, conflicts]
      properties:
        chain:
          $ref: '#/components/schemas/MaintenanceChainSchedule'
        otherJobs:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJob'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleConflict'

    UpdateMaintenanceChainScheduleRequest:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: >-
            Per-step enabled flags only — order is ignored; Q30's order is
            always server-defined.

    UpdateScheduledJobRequest:
      type: object
      properties:
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    DoctorCheckStatus:
      type: string
      enum: [pass, warn, fail]

    DoctorCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
        name:
          type: string
          description: Plain-language label for the check.
        status:
          $ref: '#/components/schemas/DoctorCheckStatus'
        message:
          type: string
        remediation:
          type:
            - string
            - "null"
          description: What to run or change when status is not pass.

    DoctorReport:
      type: object
      required: [checks, overall]
      properties:
        overall:
          $ref: '#/components/schemas/DoctorCheckStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DoctorCheck'

    HostConfigID:
      type: string
      enum: [host_samba, host_nfs, host_fstab, host_docker_containers, host_docker_images]
      description: Q76 onboarding category, matching DoctorCheck.id.

    HostConfigDecision:
      type: string
      enum: [import, leave]
      description: >-
        import persists parsed facts in SQLite so a later generate may
        take ownership; leave marks the host file unmanaged so Generator
        never writes it (doc 01 §2).

    HostConfigChoice:
      type: object
      required: [id, decision]
      properties:
        id:
          $ref: '#/components/schemas/HostConfigID'
        decision:
          $ref: '#/components/schemas/HostConfigDecision'

    ApplyHostConfigRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'

    ApplyHostConfigResult:
      type: object
      required: [files, dockerDataRoot]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'
        dockerDataRoot:
          type: string
          description: >-
            Docker's data-root after this apply (Q62, Q76). Always
            `/var/lib/docker` when containers, images or named volumes
            exist, when there is no cache disk, or when the caller did
            not accept a move.

    AppState:
      type: string
      enum: [created, running, paused, restarting, removing, exited, dead]
      description: The Docker Engine's own container state vocabulary.

    AppHealth:
      type: string
      enum: [none, starting, healthy, unhealthy]
      description: >-
        The container's HEALTHCHECK result, in the Engine's own
        vocabulary; `none` when the container defines no health check.

    AppStats:
      type: object
      required: [at, cpuPercent, memoryBytes, memoryLimitBytes, networkRxBytes, networkTxBytes, blockReadBytes, blockWriteBytes]
      properties:
        at:
          type: string
          format: date-time
        cpuPercent:
          type: number
          format: double
          description: >-
            Share of the host's CPU time the container used since the
            previous sample, times the CPUs online (100 is one full core).
        memoryBytes:
          type: integer
          format: int64
          description: Memory in use, without reclaimable page cache.
        memoryLimitBytes:
          type: integer
          format: int64
        networkRxBytes:
          type: integer
          format: int64
        networkTxBytes:
          type: integer
          format: int64
        blockReadBytes:
          type: integer
          format: int64
        blockWriteBytes:
          type: integer
          format: int64

    RemoveAppResult:
      type: object
      required: [deletedPaths]
      properties:
        deletedPaths:
          type: array
          items:
            type: string
          description: >-
            The appdata directories deleted. Empty unless `deleteAppdata`
            was requested — and possibly empty then too, when none of the
            container's mounts lay inside the appdata location.

    StackTemplate:
      type: object
      required: [source, id, revision]
      properties:
        source:
          type: string
          description: Where the template came from; empty for a stack no template installed.
        id:
          type: string
        revision:
          type: string

    Stack:
      type: object
      required: [name, template, installedAt]
      properties:
        name:
          type: string
        template:
          $ref: '#/components/schemas/StackTemplate'
        installedAt:
          type: string
          format: date-time

    ListStacksOK:
      type: object
      required: [stacks]
      properties:
        stacks:
          type: array
          items:
            $ref: '#/components/schemas/Stack'

    CreateStackRequest:
      type: object
      required: [name, compose]
      properties:
        name:
          type: string
          description: >-
            1 to 63 lowercase letters, digits, `-` or `_`, starting with a
            letter or digit. It is the stack's directory name and its
            Compose project name.
        compose:
          type: string
          description: The `docker-compose.yml` text.
        env:
          type: string
          description: >-
            The `.env` text. Write-only: it is stored sealed under the
            machine key and never returned. Absent means an empty `.env`.
        template:
          $ref: '#/components/schemas/StackTemplate'

    RemoveStackResult:
      type: object
      required: [deletedPaths]
      properties:
        deletedPaths:
          type: array
          items:
            type: string
          description: >-
            The appdata directories and the stack directory deleted. Empty
            unless `deleteAppdata` was requested.

    TemplateInstallRequest:
      type: object
      properties:
        name:
          type: string
          description: >-
            The stack's name, under the rules of `createStack`. Absent means
            the template's id.
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            Input name to value. An input with no entry, or an empty one,
            takes its default. An entry for a name that is not one of the
            template's inputs is refused.

    TemplateInput:
      type: object
      required: [name, kind, generated]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [path, port, string, secret, timezone, device]
        role:
          type: string
          enum: [appdata, share, media, downloads, gpu]
        label:
          type: string
        description:
          type: string
        value:
          type: string
          description: >-
            What the input resolves to. Absent for a secret, whose value is
            only ever written to the stack's `.env`; empty for a `device`
            input with no GPU chosen.
        requestedValue:
          type: string
          description: >-
            Present on a `port` input whose requested port is taken: the port
            asked for, while `value` is the next free port instead.
        generated:
          type: boolean
          description: A secret that the install generates.
        suggestions:
          type: array
          items:
            type: string
          description: >-
            The existing shares' paths for a `path` input that is not
            appdata; the host's `/dev/dri` render devices for a `device`
            input.

    TemplatePrivilege:
      type: object
      required: [kind, service, description]
      properties:
        kind:
          type: string
          enum: [privileged, host_network, host_pid, host_cgroup, device_cgroup_rules, docker_socket, host_path]
        service:
          type: string
          description: The Compose service that asks for it.
        detail:
          type: string
          description: >-
            The path, process namespace or rules concerned; absent for
            `privileged`, `host_network` and `host_cgroup`.
        description:
          type: string
          description: Plain-language explanation of what it grants.

    TemplateInstallPlan:
      type: object
      required: [template, title, name, inputs, privileges, compose]
      properties:
        template:
          $ref: '#/components/schemas/StackTemplate'
        title:
          type: string
        name:
          type: string
          description: The stack's name.
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TemplateInput'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePrivilege'
          description: Empty when the template asks for nothing beyond an ordinary container.
        compose:
          type: string
          description: The `docker-compose.yml` text that an install writes.

    TemplateInstallResult:
      type: object
      required: [stack, plan]
      properties:
        stack:
          $ref: '#/components/schemas/Stack'
        plan:
          $ref: '#/components/schemas/TemplateInstallPlan'

    AppPort:
      type: object
      required: [containerPort, protocol]
      properties:
        hostIP:
          type: string
        hostPort:
          type: integer
          description: Absent when this container port is not published to the host.
        containerPort:
          type: integer
        protocol:
          type: string
          enum: [tcp, udp, sctp]

    AppMount:
      type: object
      required: [destination, readWrite]
      properties:
        source:
          type: string
        destination:
          type: string
        mode:
          type: string
        readWrite:
          type: boolean

    App:
      type: object
      required: [id, name, image, tag, state, status, health, ports, mounts]
