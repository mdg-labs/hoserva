openapi: 3.1.0
info:
  title: Hoserva API
  version: "1.0.0"
  description: >-
    The Hoserva API (doc 01 §5, D18). This file is the whole API — every
    capability the web UI or the CLI has is a documented operation here, and
    nothing else. Go server interfaces, the CLI's Go client and the web UI's
    TypeScript client are generated from it (`make gen`); handlers in
    `internal/api/` implement the generated interfaces, and both clients call
    the API only through their generated code.

    This first version covers the foundation every later feature area builds
    on: `/api/v1/` versioning, the two auth schemes named in doc 01 §5, the
    shared error model, the job resource and its lifecycle (doc 01 §4), and
    every Server-Sent Events event type on `/api/v1/events`. Disk, pool,
    share, container and VM operations arrive with the issues that design
    those subsystems (doc 07 §1) — this spec is extended, never replaced, as
    they land.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Hoserva
    url: https://github.com/mdg-labs/hoserva

tags:
  - name: jobs
    description: The job system (doc 01 §4) — every long-running operation.
  - name: events
    description: Live data over Server-Sent Events (doc 01 §5).
  - name: status
    description: Overall system health (`hoserva status`, doc 01 §3).
  - name: metrics
    description: >-
      Downsampled time series from metrics.db (Q74, doc 02 §4) — throughput,
      CPU, RAM, SMART history. Read-only; never probes block devices.
  - name: pool
    description: Pool topology and per-disk breakdown (`hoserva pool status`).
  - name: disks
    description: Disk inventory and lifecycle (`hoserva disk`, doc 01 §3).
  - name: array
    description: Array start and stop / maintenance mode (Q70, `hoserva array stop|start`).
  - name: parity
    description: SnapRAID sync, scrub and fix through the threshold guard (doc 02 §2).
  - name: config
    description: Config archive export and import (doc 10 §1).
  - name: doctor
    description: Prerequisite and sanity checks (`hoserva doctor`, doc 01 §3).
  - name: users
    description: Account recovery over the Unix socket (Q78).
  - name: auth
    description: >-
      First-run setup, sessions and TOTP over TCP (doc 01 §5, §7, Q9, Q10,
      Q28, Q44, doc 03 §1). The Unix socket needs none of this — it is
      peer-credential trusted (Q44) — but these operations still run on
      it, unauthenticated, exactly as they do on TCP, since the same
      handlers serve both transports (doc 01 §5). Personal API tokens
      (Q43) are Phase 2 and have no operations here yet.
  - name: notifications
    description: >-
      Alerting channels (email, Gotify, ntfy, Discord webhook, generic
      webhook), per-event routing and quiet hours (doc 03 §8.3, doc 01 §7,
      Q28). Credentials are write-only: a channel response never carries
      the secret it holds, only whether one is configured.
  - name: settings
    description: >-
      General installation settings shared by onboarding and `/settings`
      (doc 03 §1, §8.1). The backup passphrase is write-only (Q28): a
      response never carries it, only whether one is configured.

# Two transports (doc 01 §5): a Unix socket for the local root/`hoserva`-group
# CLI, and TLS-only TCP for the web UI and remote/scripted use. Same handlers,
# different auth middleware — the Unix socket is peer-credential trusted and
# carries no bearer/cookie credential of its own, which is why its entry below
# has no `x-hoserva-transport-auth` value: there is nothing for a client to
# attach. The TCP server's operations still declare `security` below; that
# security only applies on this transport.
servers:
  - url: https://{host}:8008/api/v1
    description: TCP, TLS-only. Session cookie for the web UI, personal API tokens (Q43) for scripts and the remote CLI.
    variables:
      host:
        default: localhost
  - url: unix:///run/hoserva/hoserva.sock/api/v1
    description: >-
      Unix socket. Root and the `hoserva` group only (Q44); accepted with no
      auth token because the kernel already vouches for the caller's identity
      via `SO_PEERCRED` — there is no bearer or cookie credential on this
      transport. Used by the local CLI.
    x-hoserva-transport-auth: peer-credentials-trusted

security:
  - sessionCookie: []
  - apiToken: []

paths:
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs
      description: >-
        Every long-running operation is a job (doc 01 §4). Filterable by
        class and status so the UI's jobs page and `hoserva logs` can scope
        what they render without walking the whole history.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: class
          in: query
          schema:
            $ref: '#/components/schemas/JobClass'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The jobs matching the filter, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: Get a job
      description: A single job's current state, by id.
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a job
      description: >-
        Only meaningful where the underlying tool supports cancellation
        (doc 01 §4); a job that cannot be cancelled reports that in its
        `cancellable` field rather than accepting this call and doing
        nothing.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, now in a cancelling or cancelled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      summary: Resume a checkpointed job
      description: >-
        Only resumable job types (mover, rebalance, evacuation, share
        relocation) persist a checkpoint to resume from (Q29). Jobs are never
        resumed automatically after a restart — this operation is always an
        explicit user action.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, resumed from its last checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/log:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJobLog
      summary: Download a job's captured stdout/stderr
      description: Kept for 90 days (Q74).
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job's captured output, compressed.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /events:
    get:
      operationId: streamEvents
      summary: Stream live events
      description: >-
        Server-Sent Events for job progress, disk state changes, container
        state changes and new notifications (doc 01 §5). Every event type is
        a schema below (`Event`'s member types).

        ogen generates only SSE *clients*, not a server-side encoder for
        `text/event-stream` (confirmed against ogen v1.24.0 — see Q63), so
        `make gen` excludes this one operation from the generated `apiv1`
        server interface and client (`ogen.yml`'s `ignore_not_implemented`).
        The `Event` schema and its variants are still generated code, though:
        `make gen` runs ogen's `jschemagen` against `api/event-schema-root.yaml`
        to produce typed Go structs in `api/gen/go/events`, plus a small
        generated SSE-frame reader alongside them, so a Go client reads this
        stream only through generated types (D18, doc 01 §5). The server-side
        write loop for this route — framing each `Event` over
        `text/event-stream` — is hand-written in `internal/api`
        (`EventsHandler`, issue #19), mounted beside the generated router
        rather than inside it, since ogen generates no security hook for a
        route it doesn't generate a server for either; it is gated by an
        `Authenticate` seam #22 wires to real session/token validation. The
        job system publishes `job_progress` events on every state and
        progress change; disk/container state and notifications arrive with
        the issues that add those subsystems.
      tags: [events]
      x-hoserva-role: viewer
      responses:
        "200":
          description: An unbounded stream of `Event` frames.
          content:
            text/event-stream:
              x-ogen-sse-event-shape: full
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check whether the first-run admin account exists
      description: >-
        Reachable before an admin exists: this operation, createFirstAdmin
        and the SPA's static assets are the only routes that don't refuse
        every request with a "setup required" error while `adminExists` is
        false (#22).
      tags: [auth]
      x-hoserva-role: public
      security: []
      responses:
        "200":
          description: Whether the first-run admin account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        default:
          $ref: '#/components/responses/Error'

  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account
      description: >-
        Reachable only before an admin exists; refused once one does.
        Creating the admin is atomic — a race between two concurrent
        requests can never create two admins (#22). Signs the new admin in
        on success, exactly like login.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirstAdminRequest'
      responses:
        "200":
          description: The admin account, now signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: >-
        Username is matched case-insensitively, using simple lowercasing
        (Go's `strings.ToLower`) rather than full Unicode case folding.
        Password, plus a TOTP code once the account has TOTP enrolled
        (doc 01 §7). Rate-limited and lockout-protected per account and
        per source address (doc 01 §7): an unknown username and a wrong
        password against a real one get the same status and error code
        (`invalid_credentials`), reach lockout (`rate_limited`) at the
        same failure threshold, and cost the same bounded argon2id-shaped
        work either way, for similar timing, under ordinary load — under
        a sustained flood large enough to fill and evict from the
        unknown-username table's own 10,000-entry cap, an unknown
        username's lockout can lift early, where a real account's own
        (never capped or evicted) would not. Once the password is
        correct, `totp_required` (no code supplied) versus `totp_invalid`
        (a wrong one) does reveal that an account has TOTP enrolled — an
        unavoidable, rate-limited signal, not one this API tries to hide.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the current session server-side and clears the cookie.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session's user
      description: The signed-in user this session cookie belongs to.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start TOTP enrolment for the signed-in user
      description: >-
        Generates a new secret (RFC 6238), stored encrypted with the
        machine key (Q28) but not yet active — the account's existing
        active credential, if any, is untouched until confirmTotp
        activates the new one. Enrolling again before confirming replaces
        the still-pending secret. Once TOTP is already active on this
        account, replacing it requires proving the caller still holds the
        account: exactly one of the current password or a current TOTP
        code, in TotpEnrollRequest. Omitting both while TOTP is active is
        refused (totp_reverify_required); supplying both is refused too
        (totp_reverify_ambiguous), since each is one guess at the active
        credential and honouring both would spend two for the price of
        one request. Neither is required for a first enrolment.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        "200":
          description: The new secret, pending confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm TOTP enrolment
      description: >-
        Activates the pending secret enrollTotp created, once a code
        proves the signed-in user actually has it.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "204":
          description: TOTP is now active on this account.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels:
    get:
      operationId: listNotificationChannels
      summary: List notification channels
      description: Every configured alerting destination (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every configured channel.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createNotificationChannel
      summary: Add a notification channel
      description: >-
        A credential supplied in `secret` (Q28) is encrypted with the
        machine key before it reaches the database and is never returned
        by any later read — `hasSecret` on the response is the only trace
        of it.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getNotificationChannel
      summary: Get a notification channel
      description: A single channel's current configuration, by id, secret excluded.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationChannel
      summary: Replace a notification channel's configuration
      description: >-
        A full replace, like the request body of createNotificationChannel:
        every type-specific field the request omits is cleared, not left
        as it was. `secret` is tri-state — omitted keeps the existing
        credential, `null` clears it, a string replaces it — since this is
        the one field a response never echoes back for a client to resend
        unchanged (Q28).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationChannelRequest'
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: Also removes every routing entry that named this channel.
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: sendTestNotification
      summary: Send a test notification through a channel
      description: >-
        Sent immediately, outside the delivery queue and its retry policy
        — this is a synchronous probe of the channel's own configuration,
        not a routed event, so it reports success or the delivery error
        directly rather than being retried and logged like a routed
        notification (doc 03 §8.3: "untested notification config is the
        same as no notification config").
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the test notification was delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing:
    get:
      operationId: getNotificationRouting
      summary: Get the full per-event routing matrix
      description: >-
        One entry per event type in doc 03 §8.3's fixed catalog, in the
        order that doc lists them — every event type appears even before
        it has ever been routed anywhere, with its compiled-in default
        severity and an empty channel list.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The routing matrix.
          content:
            application/json:
              schema:
                type: object
                required: [routing]
                properties:
                  routing:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing/{eventType}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    put:
      operationId: updateNotificationRoute
      summary: Set one event type's severity and routed channels
      description: >-
        A full replace of eventType's own row in the matrix: the channel
        list becomes exactly channelIds, and the severity becomes exactly
        severity — including reverting to the compiled-in default when the
        request's severity matches it, and un-routing every channel by
        sending an empty list, e.g. for `sync_succeeded`'s opt-in,
        off-by-default event (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRouteRequest'
      responses:
        "200":
          description: The event type's updated routing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/quiet-hours:
    get:
      operationId: getQuietHours
      summary: Get the quiet hours configuration
      description: The current quiet hours window and the always-on critical override (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateQuietHours
      summary: Set the quiet hours window
      description: >-
        `criticalAlwaysDelivers` is not part of the request body: doc
        03 §8.3's override that critical alerts always deliver cannot be
        disabled, so there is nothing for a client to set — the response
        always reports it `true`.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuietHoursRequest'
      responses:
        "200":
          description: The updated quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notification alerts
      description: >-
        Unread alerts first, grouped by event type (doc 03 §2). Reads only
        the central database — never probes block devices.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Grouped in-app alerts and the unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsOK'
        default:
          $ref: '#/components/responses/Error'

  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark in-app alerts read
      description: >-
        Marks every alert whose id is listed, or every alert when `all` is
        true (doc 03 §2's mark-all-read). Omitted ids with `all` false is a
        no-op that returns the current unread count.
      tags: [notifications]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        "200":
          description: The unread count after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationsReadOK'
        default:
          $ref: '#/components/responses/Error'

  /settings/general:
    get:
      operationId: getGeneralSettings
      summary: Get general installation settings
      description: >-
        Hostname, timezone and whether a backup passphrase is configured
        (doc 03 §1, §8.1). The passphrase itself is never returned (Q28).
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateGeneralSettings
      summary: Set general installation settings
      description: >-
        Persists hostname, timezone and/or the backup passphrase. Each
        field is optional: omitted leaves that value unchanged. An empty
        `hostname` clears a previously set hostname. `backupPassphrase` is
        write-only and never echoed back — skipping it during onboarding
        is valid (Q28).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralSettingsRequest'
      responses:
        "200":
          description: The updated general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules:
    get:
      operationId: getSchedules
      summary: List recurring job schedules
      description: >-
        The nightly maintenance chain (Q30, doc 03 §8.4) and every separately
        scheduled job, with server-computed next-run times, human-readable
        schedule previews and conflict warnings from DetectConflict (doc 01
        §4). Chain step order is server-defined and not writable.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: All recurring schedules and any detected conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/chain:
    put:
      operationId: updateMaintenanceChainSchedule
      summary: Update the nightly maintenance chain schedule
      description: >-
        Persists the chain's start time, weekly scrub day and per-step
        enabled flags (doc 03 §8.4). Step order is fixed by Q30 and cannot
        be changed. Omitted step entries leave that step's enabled state
        unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceChainScheduleRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OtherScheduleJobId'
    put:
      operationId: updateScheduledJob
      summary: Update a separately scheduled job
      description: >-
        Persists enabled state, frequency and start time for one of the
        recurring jobs outside the nightly chain (doc 03 §8.4).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledJobRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /status:
    get:
      operationId: getStatus
      summary: Overall system health
      description: >-
        One-screen health summary for the dashboard and `hoserva status`
        (doc 01 §3, §5).
      tags: [status]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /metrics:
    get:
      operationId: getMetrics
      summary: Metric time series
      description: >-
        Returns downsampled samples from metrics.db for one metric/subject
        over a time window (Q74, doc 03 §2). Resolution is chosen from the
        window — raw for up to 48 hours, hourly for up to 90 days, daily
        beyond — so clients cannot force a full raw scan. A missing or
        empty metrics.db yields an empty series, not an array-health error.
      tags: [metrics]
      x-hoserva-role: viewer
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
          description: >-
            Metric identifier, e.g. `disk_throughput_bytes_per_sec` or
            `network_throughput_bytes_per_sec` for dashboard charts.
        - name: subject
          in: query
          schema:
            type: string
          description: >-
            Device path for a per-disk metric (SMART, temperature) or omit
            for a host-wide metric (CPU, RAM, pool throughput).
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window start (inclusive), UTC.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window end (inclusive), UTC.
      responses:
        "200":
          description: The matching series, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        default:
          $ref: '#/components/responses/Error'

  /pool:
    get:
      operationId: getPool
      summary: Pool status
      description: >-
        Per-disk pool breakdown for `hoserva pool status` (doc 01 §3).
      tags: [pool]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Pool topology and disk breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatus'
        default:
          $ref: '#/components/responses/Error'

  /disks:
    get:
      operationId: listDisks
      summary: List disks
      description: Every block device Hoserva knows about (doc 02 §4).
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Disk inventory.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiskInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /disks/wake-events:
    get:
      operationId: listWakeEvents
      summary: List spin-state wake events
      description: >-
        Reads persisted spin-state transitions from the central database
        only — never probes block devices (Q32, doc 03 §3.3a Phase 1).
        Returns every recorded transition plus per-device wake counts
        grouped by UTC day so the wake-events page can show when each
        disk woke, how long it stayed awake, and how often it woke.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Spin-state transition log and daily wake counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeEventsResponse'
        default:
          $ref: '#/components/responses/Error'

  /disks/array:
    post:
      operationId: createArray
      summary: Create the storage array
      description: >-
        Queues a Topology job that formats or adopts the assigned disks
        (doc 03 §3.1 step 6, doc 02 §4). The request is the wizard's role
        assignments, per-disk filesystem (including adopt/keep), pool
        options, and the same typed confirmation string
        `disk.TopologyPlan.Confirmation` produces. A wrong or missing
        confirmation is refused with `confirmation_required` and formats
        nothing. The handler calls `disk.FormatPlan` — never a second
        formatter (D1).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrayRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /array/stop:
    post:
      operationId: stopArray
      summary: Stop the array
      description: >-
        Enters maintenance mode (Q70, doc 02 §4, `hoserva array stop`):
        refuse new jobs and interrupt non-resumable jobs, shut down
        running VMs, stop containers, stop Samba and NFS, then unmount
        share paths, the catch-all and data disks — the same list the
        `/storage` Stop array confirm dialog already shows. The handler
        calls `job.ArraySequence.Stop` and does not write parity. A
        failure leaves maintenance mode active so nothing new starts
        against a half-stopped array. `confirm: true` is required.
      tags: [array]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopArrayRequest'
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/start:
    post:
      operationId: startArray
      summary: Start the array
      description: >-
        Reverses `stopArray` (Q70, doc 02 §4, `hoserva array start`):
        mount disks, the catch-all and share paths, then start services
        in the reverse of stop order, and exit maintenance mode only
        once every step succeeds. The handler calls
        `job.ArraySequence.Start`. Refused with `storage_not_ready`
        when the storage gate is not ready (Q69, `ErrStorageNotReady`)
        — nothing is mounted.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is false
            on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /parity:
    get:
      operationId: getParity
      summary: Parity status and guard state
      description: >-
        Reads SnapRAID status from the boot-device content file only — does
        not run `snapraid diff` or wake data disks (doc 02 §2, Q13).
        Threshold-guard state and grouped diff rows reflect the last
        explicit `POST /parity/diff` (or a sync job's own pre-sync diff)
        until the next one runs.
      tags: [parity]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current parity freshness and guard snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParitySnapshot'
        default:
          $ref: '#/components/responses/Error'

  /parity/diff:
    post:
      operationId: runParityDiff
      summary: Run a SnapRAID diff
      description: >-
        Runs `snapraid diff` on every data disk — an explicit user action
        that wakes every data disk (doc 02 §2, Q13). Returns grouped
        changes and threshold-guard evaluation for the parity page; never
        polled on a timer.
      tags: [parity]
      x-hoserva-role: admin
      responses:
        "200":
          description: Grouped diff and guard evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityDiffResult'
        default:
          $ref: '#/components/responses/Error'

  /parity/sync:
    post:
      operationId: startSync
      summary: Start a SnapRAID sync
      description: >-
        Queues a sync job through the threshold guard (doc 02 §2). A
        non-dry-run sync past a tripped guard requires `confirm: true`
        after reviewing the diff.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
      responses:
        "200":
          description: The queued or running sync job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/scrub:
    post:
      operationId: startScrub
      summary: Start a SnapRAID scrub
      description: Queues a scrub job (`hoserva scrub`, doc 01 §3).
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScrubRequest'
      responses:
        "200":
          description: The queued or running scrub job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/fix:
    post:
      operationId: startFix
      summary: Start a SnapRAID fix
      description: >-
        Queues a fix job (`hoserva fix`, doc 01 §3). Requires
        `confirm: true` — fix rewrites data from parity.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFixRequest'
      responses:
        "200":
          description: The queued or running fix job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /config/export:
    post:
      operationId: exportConfig
      summary: Export a config archive
      description: >-
        Builds and returns doc 10 §1's `hoserva-config-*.tar.zst` archive.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The config archive.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /config/import:
    post:
      operationId: importConfig
      summary: Import a config archive
      description: >-
        Restores from doc 10 §1's archive format. Requires `confirm: true`
        — this replaces the running configuration.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, confirm]
              properties:
                archive:
                  type: string
                  format: binary
                confirm:
                  type: boolean
                  description: Must be true — import is destructive.
      responses:
        "204":
          description: Import completed.
        default:
          $ref: '#/components/responses/Error'

  /doctor:
    get:
      operationId: runDoctor
      summary: Run prerequisite checks
      description: >-
        Docker, mergerfs, SnapRAID, mounts, parity freshness, SMART,
        free space and permission sanity (`hoserva doctor`, doc 01 §3).
      tags: [doctor]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Plain-language check results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically — the `hoserva` group and TCP are refused.
        Audit-logged and announced through every notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        "204":
          description: Password reset.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/disable-totp:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: disableUserTotp
      summary: Disable a user's TOTP
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically. Audit-logged and announced through every
        notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: TOTP disabled.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/unlock:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: unlockUser
      summary: Clear login lockout
      description: >-
        Clears the account's login rate-limiter lockout (doc 01 §7, Q78).
        Root-only over the Unix socket, checked against the peer's uid 0
        specifically. Audit-logged like the other recovery commands.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: Lockout cleared.
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EventType:
      name: eventType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationEventType'

    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    Error:
      description: An error response (doc 01 §5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hoserva_session
      description: Web UI session, issued at login over TCP.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: personal-api-token
      description: >-
        Personal API token (Q43), scoped to a role (admin/viewer). For
        scripts and the remote CLI over TCP.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            A stable, machine-readable identifier, e.g. `job_not_found`.
            Every auth-related operation (#22) can also return one of:
            `setup_required` (409 — no admin account exists yet; every
            operation but getSetupStatus/createFirstAdmin refuses with
            this while it's true), `setup_complete` (409, createFirstAdmin
            — an admin account already exists), `rate_limited` (429 — the
            account or source address is currently locked out after
            repeated failures; `message` gives a retry-after),
            `too_busy` (503 — the bounded password-hashing worker pool is
            saturated; safe to retry shortly), `invalid_credentials` (401,
            login — an unknown username or wrong password, deliberately
            indistinguishable), `totp_required` (401, login — the account
            has TOTP enrolled and no code was supplied), `totp_invalid`
            (401, login and confirmTotp — a code was supplied but is
            wrong, expired or already used; a missing login code is
            `totp_required` instead, never this), `totp_reverify_required`
            (403, enrollTotp — TOTP is already active and the caller
            didn't prove they still hold the account: no password or code
            was supplied, or the one supplied was wrong; 403 rather than
            401 since the session itself is valid, only the
            reverification is missing or failed), `totp_reverify_ambiguous`
            (400, enrollTotp — TOTP is already active and *both* the
            current password and a current TOTP code were supplied;
            supply exactly one), `totp_not_pending` (409, confirmTotp — no
            pending secret to confirm), `unauthorized` (401 — no
            credential, or one that no longer validates), `forbidden`
            (403 — a valid credential whose role doesn't satisfy the
            operation), `no_session` (404 — the Unix socket's
            peer-credential-trusted local access has no signed-in user for
            an operation that needs one), `request_too_large` (413 — the
            request body exceeded the server's size limit), `bad_request`
            (400 — the request body could not be decoded) and `not_found`
            (404 — no such API route).
        message:
          type: string
          description: A human-readable explanation, safe to show in the UI or CLI.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which field failed validation.

    UserRole:
      type: string
      description: Q27 — share-only users have no API access and are not represented here.
      enum: [admin, viewer]

    User:
      type: object
      required: [id, username, role, totpEnrolled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.

    SetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    CreateFirstAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totpCode:
          type: string
          maxLength: 16
          description: Required once the account has TOTP enrolled; omitted otherwise.

    TotpEnrollRequest:
      type: object
      description: >-
        Both fields are optional for a first enrolment. Once TOTP is
        already active on the account, exactly one must prove the caller
        still holds it — the current password, or a current TOTP code —
        or enrollTotp is refused; supplying both is refused too (doc
        01 §7).
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    TotpEnrollResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret (RFC 6238), for manual entry.
        otpauthUri:
          type: string
          description: An otpauth:// URI, for the enrolment QR code (doc 03 §1).

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    JobType:
      type: string
      description: Every job type named in doc 01 §4's mutually-exclusive-class table.
      enum:
        # Parity
        - sync
        - scrub
        - fix
        - check
        # Array-write
        - rebalance
        - evacuation
        - share_relocation
        - mover
        - vm_disk_relocation
        # Topology
        - disk_format
        - disk_add
        - disk_remove
        - disk_replace
        - pool_remount
        # Service
        - appdata_backup
        - container_update
        # VM
        - vm_start
        - vm_stop
        - vm_create
        - vm_delete
        - vm_snapshot
        - vm_clone
        - vm_migration_import

    JobClass:
      type: string
      description: The mutually exclusive job class the scheduler enforces (doc 01 §4).
      enum: [parity, array_write, topology, service, vm]

    JobStatus:
      type: string
      description: >-
        `interrupted` is set on an in-flight job by a daemon restart and is
        never cleared automatically (doc 01 §4) — resuming or re-running it
        is always an explicit user action.
      enum: [queued, running, interrupted, succeeded, failed, cancelled]

    Job:
      type: object
      required:
        - id
        - type
        - class
        - status
        - resumable
        - cancellable
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 100
          description: Null when the job type or tool reports no meaningful percentage.
        resumable:
          type: boolean
          description: Whether this job type persists a checkpoint to resume from (Q29).
        cancellable:
          type: boolean
          description: Whether the underlying tool honestly supports cancelling this job.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: "null"

    DiskState:
      type: string
      enum: [active, standby, spinning_up, missing, failed]

    ContainerState:
      type: string
      enum: [running, stopped, restarting, exited, paused]

    NotificationLevel:
      type: string
      enum: [info, warning, error, critical]

    # `full`-shape SSE envelopes (ogen's x-ogen-sse-event-shape): each member
    # carries the discriminator in its own `event` field, so a client can
    # switch on the wire value without decoding `data` first. `const`, not a
    # single-value `enum`, on purpose: ogen names a named enum type after its
    # schema plus property (e.g. `DiskStateEvent`'s `event` property would be
    # `DiskStateEventEvent`), which collides with the identical naming ogen's
    # own discriminator codegen uses for `Event`'s variant tags once `Event`
    # itself is generated (api/event-schema-root.yaml, jschemagen) — `const`
    # inlines the field as a plain validated string instead of a named type,
    # so there is nothing left to collide.
    JobProgressEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: job_progress
        data:
          $ref: '#/components/schemas/Job'

    DiskStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: disk_state
        data:
          type: object
          required: [diskId, device, state, at]
          properties:
            diskId:
              type: string
            device:
              type: string
              description: e.g. `/dev/sdb` — as reported, never accepted back as input (doc 01 §7).
            state:
              $ref: '#/components/schemas/DiskState'
            at:
              type: string
              format: date-time

    ContainerStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: container_state
        data:
          type: object
          required: [containerId, name, state, at]
          properties:
            containerId:
              type: string
            name:
              type: string
            state:
              $ref: '#/components/schemas/ContainerState'
            at:
              type: string
              format: date-time

    NotificationEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: notification
        data:
          type: object
          required: [id, eventType, level, title, message, createdAt]
          properties:
            id:
              type: string
            eventType:
              $ref: '#/components/schemas/NotificationEventType'
            level:
              $ref: '#/components/schemas/NotificationLevel'
            title:
              type: string
            message:
              type: string
            createdAt:
              type: string
              format: date-time

    Event:
      description: The full set of `/api/v1/events` SSE event types (doc 01 §5).
      oneOf:
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/DiskStateEvent'
        - $ref: '#/components/schemas/ContainerStateEvent'
        - $ref: '#/components/schemas/NotificationEvent'
      discriminator:
        propertyName: event
        mapping:
          job_progress: '#/components/schemas/JobProgressEvent'
          disk_state: '#/components/schemas/DiskStateEvent'
          container_state: '#/components/schemas/ContainerStateEvent'
          notification: '#/components/schemas/NotificationEvent'

    NotificationEventType:
      type: string
      description: >-
        The fixed event catalog doc 03 §8.3 lists, in that doc's own order.
        internal/notify assigns every one of these a compiled-in default
        severity (NotificationLevel); notify_event_severity overrides it
        per event type.
      enum:
        - smart_warning
        - smart_failure
        - disk_offline
        - array_degraded
        - sync_succeeded
        - sync_failed
        - sync_blocked_threshold
        - scrub_errors_found
        - pool_above_threshold
        - disk_near_minfreespace
        - cache_above_threshold
        - mover_skipping_files
        - config_drift_detected
        - container_unhealthy
        - container_update_available
        - hoserva_update_available
        - reboot_required
        - ups_on_battery
        - ups_battery_low
        - login_failure_burst
        - credential_reset
        - certificate_expiring
        - config_backup_failed
        - appdata_backup_failed
        - backup_destination_stale
        - restore_drill_failed

    NotificationChannelType:
      type: string
      enum: [email, gotify, ntfy, discord, webhook]

    NotificationWebhookMethod:
      type: string
      enum: [POST, PUT]

    NotificationWebhookHeaders:
      type: object
      additionalProperties:
        type: string

    NotificationChannel:
      type: object
      description: >-
        Never carries a credential (Q28) — `hasSecret` is the only signal
        that one is configured. Only the properties relevant to `type` are
        meaningful; the rest are absent.
      required: [id, name, type, enabled, hasSecret, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: Whether a credential is configured for this channel.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string
          description: >-
            The header carrying the generic webhook's credential, e.g.
            `Authorization` — the header's value is `secret`, never a
            plain property here.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNotificationChannelRequest:
      type: object
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type: string
          description: >-
            The channel's credential, e.g. an SMTP password, a Gotify app
            token, an ntfy auth token, a Discord webhook URL, or a generic
            webhook's auth header value. Encrypted with the machine key
            before it reaches the database (Q28) and never returned by any
            later read.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    UpdateNotificationChannelRequest:
      type: object
      description: >-
        Same shape as CreateNotificationChannelRequest, a full replace,
        except `secret` is tri-state: omitted keeps the existing
        credential, `null` clears it, a string replaces it.
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type:
            - string
            - "null"
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    NotificationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: The delivery error, present only when success is false.

    NotificationRoutingEntry:
      type: object
      required: [eventType, severity, channelIds]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateNotificationRouteRequest:
      type: object
      required: [severity, channelIds]
      properties:
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationAlert:
      type: object
      required: [id, eventType, level, title, message, createdAt, read]
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        level:
          $ref: '#/components/schemas/NotificationLevel'
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationGroup:
      type: object
      required: [eventType, alerts]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAlert'

    ListNotificationsOK:
      type: object
      required: [groups, unreadCount]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NotificationGroup'
        unreadCount:
          type: integer
          minimum: 0

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        all:
          type: boolean

    MarkNotificationsReadOK:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    NotificationQuietHours:
      type: object
      required: [enabled, start, end, criticalAlwaysDelivers]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 24-hour local time, e.g. "22:00".
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        criticalAlwaysDelivers:
          type: boolean
          description: >-
            Always true (doc 03 §8.3) — critical alerts deliver regardless
            of quiet hours, and this cannot be disabled, so there is no
            request field that ever sets it otherwise.

    UpdateQuietHoursRequest:
      type: object
      required: [enabled, start, end]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    GeneralSettings:
      type: object
      required: [backupPassphraseSet]
      properties:
        hostname:
          type: string
          description: Configured host name, if any.
        timezone:
          type: string
          description: IANA timezone name, e.g. "Europe/Berlin".
        backupPassphraseSet:
          type: boolean
          description: >-
            Whether a backup passphrase is configured. The passphrase itself
            is never returned (Q28).

    UpdateGeneralSettingsRequest:
      type: object
      properties:
        hostname:
          type: string
          description: >-
            Host name for this server. An empty string clears a previously
            set value. Omitted leaves hostname unchanged.
        timezone:
          type: string
          description: IANA timezone name. Omitted leaves timezone unchanged.
        backupPassphrase:
          type: string
          minLength: 1
          description: >-
            Write-only. Sets or replaces the backup passphrase (Q28).
            Omitted leaves any existing passphrase unchanged.

    MaintenanceChainStepId:
      type: string
      enum: [mover, diff_guard, sync, scrub, config_backup]
      description: One step in Q30's fixed nightly maintenance chain order.

    OtherScheduleJobId:
      type: string
      enum: [smart_self_test, appdata_backup, restore_drill, container_update_check]
      description: A recurring job scheduled outside the nightly chain (doc 03 §8.4).

    ScheduleFrequency:
      type: string
      enum: [daily, weekly, monthly]

    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: Day of week, 0=Sunday through 6=Saturday.

    MaintenanceChainStep:
      type: object
      required: [id, enabled]
      properties:
        id:
          $ref: '#/components/schemas/MaintenanceChainStepId'
        enabled:
          type: boolean

    MaintenanceChainSchedule:
      type: object
      required: [startTime, weeklyScrubDay, schedulePreview, nextRun, steps]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time the chain starts (Q30 default 02:00).
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        schedulePreview:
          type: string
          description: Human-readable summary, e.g. "every day at 02:00".
        nextRun:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: Q30 order — mover, diff_guard, sync, scrub, config_backup.

    ScheduledJob:
      type: object
      required: [id, enabled, frequency, time, schedulePreview, nextRun]
      properties:
        id:
          $ref: '#/components/schemas/OtherScheduleJobId'
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        schedulePreview:
          type: string
        nextRun:
          type: string
          format: date-time

    ScheduleConflict:
      type: object
      required: [jobA, jobB]
      properties:
        jobA:
          type: string
          description: >-
            Identifier of the first colliding schedule — `maintenance_chain`
            or an OtherScheduleJobId value.
        jobB:
          type: string
          description: Identifier of the second colliding schedule.

    Schedules:
      type: object
      required: [chain, otherJobs, conflicts]
      properties:
        chain:
          $ref: '#/components/schemas/MaintenanceChainSchedule'
        otherJobs:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJob'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleConflict'

    UpdateMaintenanceChainScheduleRequest:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: >-
            Per-step enabled flags only — order is ignored; Q30's order is
            always server-defined.

    UpdateScheduledJobRequest:
      type: object
      properties:
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    DoctorCheckStatus:
      type: string
      enum: [pass, warn, fail]

    DoctorCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
        name:
          type: string
          description: Plain-language label for the check.
        status:
          $ref: '#/components/schemas/DoctorCheckStatus'
        message:
          type: string
        remediation:
          type:
            - string
            - "null"
          description: What to run or change when status is not pass.

    DoctorReport:
      type: object
      required: [checks, overall]
      properties:
        overall:
          $ref: '#/components/schemas/DoctorCheckStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DoctorCheck'

    MetricResolution:
      type: string
      enum: [raw, hourly, daily]
      description: Q74 retention tier used for this response.

    MetricPoint:
      type: object
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
          format: double

    MetricSeries:
      type: object
      required: [metric, subject, resolution, from, to, points]
      properties:
        metric:
          type: string
        subject:
          type: string
        resolution:
          $ref: '#/components/schemas/MetricResolution'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    SystemStatus:
      type: object
      required: [healthy, summary]
      properties:
        healthy:
          type: boolean
        summary:
          type: string
        maintenanceMode:
          type: boolean
        arrayDegraded:
          type: boolean
        parityBlocked:
          type: boolean
        activeJobs:
          type: integer
          format: int32

    PoolDiskEntry:
      type: object
      required: [device, mountPoint, role, state]
      properties:
        device:
          type: string
        mountPoint:
          type: string
        role:
          type: string
          enum: [data, parity, cache, boot, external, unassigned]
        state:
          $ref: '#/components/schemas/DiskState'
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        usedBytes:
          type:
            - integer
            - "null"
          format: int64

    PoolStatus:
      type: object
      required: [mounted, disks]
      properties:
        mounted:
          type: boolean
        disks:
          type: array
          items:
            $ref: '#/components/schemas/PoolDiskEntry'

    SpinTransition:
      type: object
      required: [device, fromState, toState, at]
      properties:
        device:
          type: string
          description: e.g. `/dev/sdb` — as recorded, never accepted back as input (doc 01 §7).
        fromState:
          type: string
          enum: [active, standby]
        toState:
          type: string
          enum: [active, standby]
        at:
          type: string
          format: date-time
        awakeDurationSeconds:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Present when this row is a wake (standby → active) and a later
            active → standby transition exists for the same device; seconds
            until that transition.

    DailyWakeCount:
      type: object
      required: [device, date, count]
      properties:
        device:
          type: string
        date:
          type: string
          format: date
          description: UTC calendar day the wakes occurred on.
        count:
          type: integer
          format: int32
          minimum: 0

    WakeEventsResponse:
      type: object
      required: [events, dailyWakeCounts]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpinTransition'
        dailyWakeCounts:
          type: array
          items:
            $ref: '#/components/schemas/DailyWakeCount'

    DiskInventoryEntry:
      type: object
      required: [device, sizeBytes, boot]
      properties:
        device:
          type: string
        sizeBytes:
          type: integer
          format: int64
        model:
          type: string
        serial:
          type: string
        wwn:
          type: string
        boot:
          type: boolean
        failed:
          type: boolean
        weakIdentity:
          type: boolean
        filesystem:
          type: string
          description: >-
            Cached filesystem type from udev (`ID_FS_TYPE`), never probed
            in a way that wakes a standby disk (doc 02 §1, §4, doc 03 §3.1).
        label:
          type: string
          description: Cached filesystem label from udev (`ID_FS_LABEL`).
        smartStatus:
          type: string
          description: >-
            SMART summary from a standby-respecting poll. `standby` when
            the disk was left asleep; `ok` or `failing` from a real read.
        containsData:
          type: boolean
          description: True when udev reports an existing filesystem on the disk.
        looksLikeUnraid:
          type: boolean
          description: >-
            True when the filesystem label matches Unraid's `diskN` /
            `parity` / `cache` naming (doc 05) — a conservative heuristic
            that never mounts the disk to look for `super.dat`.

    ArrayDiskRole:
      type: string
      description: A role the array-setup wizard assigns (doc 03 §3.1 step 2). Ignore is omitted — those disks never appear in the plan.
      enum: [parity, data, cache]

    ArrayDiskFilesystem:
      type: string
      description: Filesystem to format with, or to verify when adopt is true (Q23). Parity is always xfs (Q20).
      enum: [xfs, ext4, btrfs]

    ArrayCreatePolicy:
      type: string
      description: Default mergerfs create policy for new shares (doc 02 §1, Q11).
      enum: [mspmfs, mfs, lfs, ff]

    ArrayDiskAssignment:
      type: object
      required: [device, role]
      properties:
        device:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (data and cache only; Q20 forbids this on parity).

    CreateArrayRequest:
      type: object
      required: [disks, confirmation]
      properties:
        disks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ArrayDiskAssignment'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        minFreeSpace:
          type: string
          description: >-
            mergerfs minfreespace in its size-suffix syntax (doc 02 §1),
            e.g. `50G`. Omitted uses the engine default.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this plan (doc 03 §3.1 step 6):
            `ERASE /dev/sda, /dev/sdb` listing every device that will be
            formatted, sorted, or `ADOPT ONLY — NOTHING ERASED` when every
            assigned disk is adopted. A wrong or missing string is refused
            and formats nothing.

    ParityFreshness:
      type: string
      description: Parity age from `snapraid status` (doc 02 §2).
      enum: [green, amber, red]

    ParityGuardTrigger:
      type: string
      enum: [removed-count, removed-updated-percent, zero-files]

    ParityZeroFilesDisk:
      type: object
      required: [disk, filesBefore]
      properties:
        disk:
          type: string
          description: Data-disk mount point.
        filesBefore:
          type: integer
          format: int32

    ParityGuardState:
      type: object
      required: [wouldBlock]
      properties:
        wouldBlock:
          type: boolean
          description: True when the threshold guard would block a sync (doc 02 §2).
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/ParityGuardTrigger'
        removedCount:
          type: integer
          format: int32
          description: Accounted-for removals compared against the removed-count threshold.
        removedUpdatedPercent:
          type: number
          format: float
          description: Accounted removals plus updated, as a percent of files before the diff.
        zeroFilesDisks:
          type: array
          items:
            $ref: '#/components/schemas/ParityZeroFilesDisk'
        summary:
          type: string
          description: Plain-language why the guard would block, when wouldBlock is true.

    ParityDiffCategory:
      type: string
      description: One doc 02 §2 diff group; moved-by-Hoserva is Q15's relocation manifest match.
      enum: [removed, updated, added, moved, copied, moved_by_hoserva]

    ParityDiffGroup:
      type: object
      required: [category, count, paths]
      properties:
        category:
          $ref: '#/components/schemas/ParityDiffCategory'
        count:
          type: integer
          format: int32
        paths:
          type: array
          items:
            type: string
          description: >-
            `mount/relative` paths when SnapRAID named individual files.
            Empty when only an aggregate count is known (updated, moved).

    ParitySnapshot:
      type: object
      required: [freshness]
      properties:
        freshness:
          $ref: '#/components/schemas/ParityFreshness'
        lastSyncAt:
          type: string
          format: date-time
          description: Last successful sync, when known.
        changedSinceSync:
          type: integer
          format: int32
          description: Files changed since last sync (`status` / change journal).
        dataDisks:
          type: integer
          format: int32
        parityDisks:
          type: integer
          format: int32
        guard:
          $ref: '#/components/schemas/ParityGuardState'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
          description: Present after the last explicit run-diff; omitted until then.

    ParityDiffResult:
      type: object
      required: [groups, guard]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
        guard:
          $ref: '#/components/schemas/ParityGuardState'

    StartSyncRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        confirm:
          type: boolean
          default: false
          description: Required true to sync past a tripped threshold guard.

    StartScrubRequest:
      type: object
      properties:
        percent:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Scrub percentage cap (doc 01 §3 `hoserva scrub [--percent N]`).

    StartFixRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — fix rewrites data from parity.
        disk:
          type: integer
          format: int32
          minimum: 1
          description: SnapRAID disk index (`hoserva fix --disk N`).

    StopArrayRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: >-
            Must be true after reviewing the Q70 stop list the `/storage`
            confirm dialog already shows: refuse new jobs and interrupt
            non-resumable jobs, shut down running VMs, stop containers,
            stop Samba and NFS, then unmount share paths, the catch-all
            and data disks.

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256
