openapi: 3.1.0
info:
  title: Hoserva API
  version: "1.0.0"
  # Design refs: doc 01 §5, D18, doc 01 §4, doc 07 §1
  # Implementation: Go server interfaces, the CLI's Go client and the web UI's
  # TypeScript client are generated from this file (`make gen`); handlers in
  # `internal/api/` implement the generated interfaces, and both clients call
  # the API only through their generated code. The first version covered the
  # foundation every later feature area builds on, and disk, pool, share,
  # container and VM operations arrived with the issues that designed those
  # subsystems.
  description: >-
    The Hoserva API. This file is the whole API: every capability the web UI or
    the CLI has is a documented operation here, and nothing else. The web UI and
    the CLI call the API only through clients generated from this specification.

    This version covers `/api/v1/` versioning, the two authentication schemes,
    the shared error model, the job resource and its lifecycle, and every
    Server-Sent Events event type on `/api/v1/events`, together with the
    operations of each feature area. The API is extended, never replaced, as
    capabilities are added.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Hoserva
    url: https://github.com/mdg-labs/hoserva

tags:
  - name: jobs
    # Design refs: doc 01 §4
    description: The job system — every long-running operation.
  - name: events
    # Design refs: doc 01 §5
    description: Live data over Server-Sent Events.
  - name: status
    # Design refs: doc 01 §3
    description: >-
      Overall system health (`hoserva status`).
  - name: metrics
    # Design refs: Q74, doc 02 §4
    description: >-
      Downsampled time series from metrics.db — throughput, CPU, RAM, SMART
      history. Read-only; never probes block devices.
  - name: pool
    description: Pool topology and per-disk breakdown (`hoserva pool status`).
  - name: disks
    # Design refs: doc 01 §3
    description: >-
      Disk inventory and lifecycle (`hoserva disk`).
  - name: array
    # Design refs: Q70, Q69
    description: >-
      Array start and stop / maintenance mode (`hoserva array stop|start`), and
      acknowledging a degraded array (`hoserva array acknowledge-degraded`).
  - name: parity
    # Design refs: doc 02 §2
    description: >-
      SnapRAID sync, scrub and fix through the threshold guard.
  - name: mover
    # Design refs: doc 09 §2
    description: >-
      The write cache's mover (`hoserva mover run`) — moves a cache-then-move
      share's files onto the array. Reachable on a schedule (the nightly chain),
      a cache-usage threshold, or this manual trigger; never continuous.
  - name: config
    # Design refs: doc 10 §1
    description: Config archive export and import.
  - name: backup
    # Design refs: doc 10 §1
    description: >-
      Where config backups are written — local paths, an external disk, and
      remote destinations through rclone — and whether each one is reachable.
  - name: migrate
    # Design refs: doc 05
    description: >-
      The Unraid migrator (`hoserva migrate`): the pre-flight scan of a Flash
      Backup zip and its written go / no-go report. Nothing here writes to an
      Unraid disk or to the zip.
  - name: doctor
    # Design refs: doc 01 §3
    description: >-
      Prerequisite and sanity checks (`hoserva doctor`).
  - name: users
    # Design refs: Q27, doc 03 §7, Q78, Q43
    description: >-
      Accounts, roles and Samba credentials: the admin, viewer and share-only
      roles, per-account passwords (which write the UI credential and the Samba
      passdb entry together), user groups and session list/revoke. Account
      recovery over the Unix socket and personal API tokens are also under this
      tag.
  - name: auth
    # Design refs: doc 01 §5, §7, Q9, Q10, Q28, Q44, doc 03 §1, doc 01 §5
    description: >-
      First-run setup, sessions and TOTP over TCP. The Unix socket needs none of
      this — it is peer-credential trusted — but these operations still run on
      it, unauthenticated, exactly as they do on TCP, since the same handlers
      serve both transports.
  - name: notifications
    # Design refs: doc 03 §8.3, doc 01 §7, Q28
    description: >-
      Alerting channels (email, Gotify, ntfy, Discord webhook, generic webhook),
      per-event routing and quiet hours. Credentials are write-only: a channel
      response never carries the secret it holds, only whether one is
      configured.
  - name: settings
    # Design refs: doc 03 §1, §8.1, Q28, doc 03 §8.1, Q77, doc 03 §8.6, Q67,
    # Q68, Q10, doc 03 §8.2, Q75
    description: >-
      General installation settings shared by onboarding and `/settings`. The
      backup passphrase is write-only: a response never carries it, only whether
      one is configured. UPS connection and shutdown thresholds live under
      `/settings/ups`; UPS passwords are write-only. Self-update, rollback and
      Debian update status live under `/settings/updates`. Host networking, TLS
      certificate expiry, LAN-only access scope and the listen port live under
      `/settings/network`.
  - name: shares
    # Design refs: D4, doc 03 §4, doc 02 §1, Q12, Q27, doc 03 §7
    # Originally also: enforcing the access in the generated Samba/mergerfs
    # config was a later issue.
    description: >-
      User shares as first-class SQLite state: each share has its own mergerfs
      mount and Samba is generated from the same rows. Per-user and per-group
      share access is stored here too, editable from either the share or the
      user/group.
  - name: stacks
    # Design refs: doc 04 §2, D4
    description: >-
      Docker Compose stacks: one `stacks` row per stack, from which
      `docker-compose.yml`, `.env` and `meta.json` under the stacks directory
      (`<state dir>/stacks/<name>/`, `/var/lib/hoserva/ stacks/<name>/` on an
      installed system) are generated. A stack's Compose project is run with
      `docker compose`, never through a shell.
  - name: templates
    # Design refs: doc 04 §4, §7
    description: >-
      The template catalog and installing one of its templates (`hoserva catalog
      list`, `hoserva app install`): the catalog is listed and each template is
      shown, with its icon and the privilege summary computed from its Compose
      content, from the catalog installed on disk; installing resolves the
      `x-hoserva` inputs and stores the result as a stack.
  - name: apps
    # Design refs: doc 04 §2, §3, doc 04 §1, §2
    description: >-
      Docker Engine containers and images (`hoserva app list`): every container
      the Engine reports, managed and unmanaged alike, with the same lifecycle
      actions for both: start, stop, restart, recreate, remove, logs and stats.
      The Compose stack model is served by the `stacks` operations
      (`listStacks`, `createStack`, `getStack`, `updateStack`, `getStackConfig`,
      `updateStackConfig`, `startStack`, `removeStack`). `available` is false,
      with no error, whenever Docker itself is not reachable: a missing
      prerequisite is Apps' normal state, not a failed request.

# Two transports (doc 01 §5): a Unix socket for the local root/`hoserva`-group
# CLI, and TLS-only TCP for the web UI and remote/scripted use. Same handlers,
# different auth middleware — the Unix socket is peer-credential trusted and
# carries no bearer/cookie credential of its own, which is why its entry below
# has no `x-hoserva-transport-auth` value: there is nothing for a client to
# attach. The TCP server's operations still declare `security` below; that
# security only applies on this transport.
servers:
  - url: https://{host}:8008/api/v1
    # Design refs: Q43
    description: >-
      TCP, TLS-only. Session cookie for the web UI, personal API tokens for
      scripts and the remote CLI.
    variables:
      host:
        default: localhost
  - url: unix:///run/hoserva/hoserva.sock/api/v1
    # Design refs: Q44
    description: >-
      Unix socket. Root and the `hoserva` group only; accepted with no auth
      token because the kernel already vouches for the caller's identity via
      `SO_PEERCRED` — there is no bearer or cookie credential on this transport.
      Used by the local CLI.
    x-hoserva-transport-auth: peer-credentials-trusted

security:
  - sessionCookie: []
  - apiToken: []

paths:
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs
      # Design refs: doc 01 §4
      description: >-
        Every long-running operation is a job. Filterable by class and status so
        the UI's jobs page and `hoserva logs` can scope what they render without
        walking the whole history.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: class
          in: query
          schema:
            $ref: '#/components/schemas/JobClass'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The jobs matching the filter, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: Get a job
      description: A single job's current state, by id.
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a job
      # Design refs: doc 01 §4, doc 02 §4 E3
      description: >-
        Only meaningful where the underlying tool supports cancellation; a job
        that cannot be cancelled reports that in its `cancellable` field rather
        than accepting this call and doing nothing. A queued or running job is
        stopped; an interrupted, cancellable job is ended `cancelled`. For a
        data-disk upgrade this is the abort: refused with `job_not_cancellable`
        once its checkpoint is at releasing, whether queued, running or
        interrupted. A running upgrade is answered with the running job and
        records its outcome once it has unmounted everything. A queued or
        interrupted upgrade is unwound first; if that fails it stays interrupted
        and the call is refused with `disk_upgrade_cleanup_failed`, naming what
        is still mounted. `job_abort_in_progress` refuses a second cancel while
        one runs. `job_resume_in_progress` refuses a cancel while a resume of
        the same job is still repairing its log; retry in a moment.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, now in a cancelling or cancelled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      summary: Resume a checkpointed job
      # Design refs: Q29, doc 02 §4 E5, doc 02 §6, Q77
      description: >-
        Only resumable job types (mover, rebalance, evacuation, share
        relocation, data- and parity-disk upgrade) persist a checkpoint to
        resume from. Jobs are never resumed automatically after a restart — this
        operation is always an explicit user action. A data-disk upgrade resumes
        only in maintenance mode; one resumed at its releasing checkpoint is not
        cancellable. Refused with `job_abort_in_progress` while a cancel of the
        same job is unwinding it, and with `job_resume_in_progress` while
        another resume of the same job is still repairing its log (retry in a
        moment). Resuming an interrupted mover job is refused with 409
        `on_battery` while the on-battery hold is active.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, resumed from its last checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/log:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJobLog
      summary: Download a job's captured stdout/stderr
      # Design refs: Q74
      description: >-
        Kept for 90 days. With `follow` true on a job that has not finished, the
        response stays open and carries the gzip stream of the log as it grows
        (each write is flushed as it arrives, so a client decompressing on the
        fly prints every line at once), and ends when the job reaches a terminal
        state, when the client disconnects, or on a read error; a clean end
        carries the gzip trailer. `follow` on a finished job is the same as
        omitting it.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The job's captured output, compressed.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /events:
    get:
      operationId: streamEvents
      summary: Stream live events
      # Design refs: doc 01 §5, Q63, D18, issue #19, #22
      # Implementation: ogen generates only SSE *clients*, not a server-side
      # encoder for `text/event-stream` (confirmed against ogen v1.24.0, see
      # Q63), so `make gen` excludes this one operation from the generated
      # `apiv1` server interface and client (`ogen.yml`'s
      # `ignore_not_implemented`). The `Event` schema and its variants are still
      # generated code, though: `make gen` runs ogen's `jschemagen` against
      # `api/event-schema-root.yaml` to produce typed Go structs in
      # `api/gen/go/events`, plus a small generated SSE-frame reader alongside
      # them, so a Go client reads this stream only through generated types
      # (D18, doc 01 §5). The server-side write loop for this route, framing
      # each `Event` over `text/event-stream`, is hand-written in `internal/api`
      # (`EventsHandler`, issue #19), mounted beside the generated router rather
      # than inside it, since ogen generates no security hook for a route it
      # doesn't generate a server for either; it is gated by an `Authenticate`
      # seam #22 wires to real session/token validation.
      description: >-
        Server-Sent Events for job progress, disk state changes, container state
        changes and new notifications. Every event type is a schema in this
        reference, as a member type of `Event`.

        The job system publishes `job_progress` events on every state and
        progress change.
      tags: [events]
      x-hoserva-role: viewer
      responses:
        "200":
          description: An unbounded stream of `Event` frames.
          content:
            text/event-stream:
              x-ogen-sse-event-shape: full
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check whether the first-run admin account exists
      # Design refs: #22
      description: >-
        Reachable before an admin exists: this operation, createFirstAdmin and
        the SPA's static assets are the only routes that don't refuse every
        request with a "setup required" error while `adminExists` is false.
      tags: [auth]
      x-hoserva-role: public
      security: []
      responses:
        "200":
          description: Whether the first-run admin account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        default:
          $ref: '#/components/responses/Error'

  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account
      # Design refs: #22
      description: >-
        Reachable only before an admin exists; refused once one does. Creating
        the admin is atomic — a race between two concurrent requests can never
        create two admins. Signs the new admin in on success, exactly like
        login.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirstAdminRequest'
      responses:
        "200":
          description: The admin account, now signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      operationId: login
      summary: Log in
      # Design refs: doc 01 §7
      description: >-
        Username is matched case-insensitively, using simple lowercasing rather
        than full Unicode case folding. Password, plus a TOTP code once the
        account has TOTP enrolled. Rate-limited and lockout-protected per
        account and per source address: an unknown username and a wrong password
        against a real one get the same status and error code
        (`invalid_credentials`), reach lockout (`rate_limited`) at the same
        failure threshold, and cost the same bounded argon2id-shaped work either
        way, for similar timing, under ordinary load — under a sustained flood
        large enough to fill and evict from the unknown-username table's own
        10,000-entry cap, an unknown username's lockout can lift early, where a
        real account's own (never capped or evicted) would not. Once the
        password is correct, `totp_required` (no code supplied) versus
        `totp_invalid` (a wrong one) does reveal that an account has TOTP
        enrolled — an unavoidable, rate-limited signal, not one this API tries
        to hide.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the current session server-side and clears the cookie.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session's user
      description: The signed-in user this session cookie belongs to.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start TOTP enrolment for the signed-in user
      # Design refs: Q28
      description: >-
        Generates a new secret (RFC 6238), stored encrypted with the machine key
        but not yet active — the account's existing active credential, if any,
        is untouched until confirmTotp activates the new one. Enrolling again
        before confirming replaces the still-pending secret. Once TOTP is
        already active on this account, replacing it requires proving the caller
        still holds the account: exactly one of the current password or a
        current TOTP code, in TotpEnrollRequest. Omitting both while TOTP is
        active is refused (totp_reverify_required); supplying both is refused
        too (totp_reverify_ambiguous), since each is one guess at the active
        credential and honouring both would spend two for the price of one
        request. Neither is required for a first enrolment.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        "200":
          description: The new secret, pending confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm TOTP enrolment
      description: >-
        Activates the pending secret enrollTotp created, once a code
        proves the signed-in user actually has it.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "204":
          description: TOTP is now active on this account.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels:
    get:
      operationId: listNotificationChannels
      summary: List notification channels
      # Design refs: doc 03 §8.3
      description: Every configured alerting destination.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every configured channel.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createNotificationChannel
      summary: Add a notification channel
      # Design refs: Q28
      description: >-
        A credential supplied in `secret` is encrypted with the machine key
        before it reaches the database and is never returned by any later read —
        `hasSecret` on the response is the only trace of it.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getNotificationChannel
      summary: Get a notification channel
      description: A single channel's current configuration, by id, secret excluded.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationChannel
      summary: Replace a notification channel's configuration
      # Design refs: Q28
      description: >-
        A full replace, like the request body of createNotificationChannel:
        every type-specific field the request omits is cleared, not left as it
        was. `secret` is tri-state — omitted keeps the existing credential,
        `null` clears it, a string replaces it — since this is the one field a
        response never echoes back for a client to resend unchanged.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationChannelRequest'
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: Also removes every routing entry that named this channel.
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: sendTestNotification
      summary: Send a test notification through a channel
      # Design refs: doc 03 §8.3
      description: >-
        Sent immediately, outside the delivery queue and its retry policy — this
        is a synchronous probe of the channel's own configuration, not a routed
        event, so it reports success or the delivery error directly rather than
        being retried and logged like a routed notification. A test that
        succeeds is also recorded for the migration checklist
        (`getMigrationChecklist`), which counts a channel only while it is
        enabled and its latest successful test ran in a later second than the
        one the channel last changed in; a test that fails is not recorded.
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the test notification was delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing:
    get:
      operationId: getNotificationRouting
      summary: Get the full per-event routing matrix
      # Design refs: doc 03 §8.3
      description: >-
        One entry per event type in the fixed event catalog, in the catalog's
        own order: every event type appears even before it has ever been routed
        anywhere, with its compiled-in default severity and an empty channel
        list.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The routing matrix.
          content:
            application/json:
              schema:
                type: object
                required: [routing]
                properties:
                  routing:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing/{eventType}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    put:
      operationId: updateNotificationRoute
      summary: Set one event type's severity and routed channels
      # Design refs: doc 03 §8.3
      description: >-
        A full replace of eventType's own row in the matrix: the channel list
        becomes exactly channelIds, and the severity becomes exactly severity —
        including reverting to the compiled-in default when the request's
        severity matches it, and un-routing every channel by sending an empty
        list, e.g. for `sync_succeeded`'s opt-in, off-by-default event.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRouteRequest'
      responses:
        "200":
          description: The event type's updated routing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/quiet-hours:
    get:
      operationId: getQuietHours
      summary: Get the quiet hours configuration
      # Design refs: doc 03 §8.3
      description: >-
        The current quiet hours window and the always-on critical override.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateQuietHours
      summary: Set the quiet hours window
      # Design refs: doc 03 §8.3
      description: >-
        `criticalAlwaysDelivers` is not part of the request body: the override
        that makes critical alerts always deliver cannot be disabled, so there
        is nothing for a client to set — the response always reports it `true`.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuietHoursRequest'
      responses:
        "200":
          description: The updated quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notification alerts
      # Design refs: doc 03 §2
      description: >-
        Unread alerts first, grouped by event type. Reads only the central
        database — never probes block devices.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Grouped in-app alerts and the unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsOK'
        default:
          $ref: '#/components/responses/Error'

  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark in-app alerts read
      # Design refs: doc 03 §2
      description: >-
        Marks every alert whose id is listed, or every alert when `all` is true
        (mark all as read). Omitted ids with `all` false is a no-op that returns
        the current unread count.
      tags: [notifications]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        "200":
          description: The unread count after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationsReadOK'
        default:
          $ref: '#/components/responses/Error'

  /settings/general:
    get:
      operationId: getGeneralSettings
      summary: Get general installation settings
      # Design refs: doc 03 §1, §8.1, Q28
      description: >-
        Hostname, timezone and whether a backup passphrase is configured. The
        passphrase itself is never returned.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateGeneralSettings
      summary: Set general installation settings
      # Design refs: Q28
      description: >-
        Persists hostname, timezone and/or the backup passphrase. Each field is
        optional: omitted leaves that value unchanged. An empty `hostname`
        clears a previously set hostname. `backupPassphrase` is write-only and
        never echoed back — skipping it during onboarding is valid.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralSettingsRequest'
      responses:
        "200":
          description: The updated general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/apps:
    get:
      operationId: getAppSettings
      summary: Get the container update settings
      # Design refs: doc 04 §6
      description: >-
        How long the image a container ran before an update is kept for a
        revert: 7 days until it is set.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current container update settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAppSettings
      summary: Set the container update settings
      description: >-
        Sets how many days the image a container ran before an update is kept
        for a revert, from 1 to 365. It applies to updates made afterwards;
        an update already made keeps the deadline it was made with.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSettings'
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/ups:
    get:
      operationId: getUPSSettings
      summary: Get UPS / NUT settings
      # Design refs: Doc 03 §8.1, Q77, Q28
      description: >-
        The UPS settings: connection mode (USB or a network NUT server), driver
        fields, and USB-only shutdown thresholds. Passwords are never returned —
        only `monitorPasswordSet` / `networkPasswordSet`. When no UPS is
        configured, `configured` is false and every other field is omitted.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current UPS settings, or an empty configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUPSSettings
      summary: Set UPS / NUT settings
      # Design refs: D4, Q77, Q28
      # Implementation: the NUT config is written through `WriteUPS`; validation
      # failures are `ErrInvalidUPSField`.
      description: >-
        Persists UPS settings to SQLite, generates the NUT configuration, and
        reloads the NUT units. Passwords are write-only: omit to keep an
        existing secret; a first configure must supply the password the
        connection mode needs. USB-only thresholds are ignored for network mode.
        Validation failures return 400; unmanaged or existing host NUT files and
        a missing `nut` group return 409.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUPSSettingsRequest'
      responses:
        "200":
          description: The updated UPS settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network:
    get:
      operationId: getNetworkSettings
      summary: Host network, TLS and access-scope settings
      # Design refs: Q10, doc 03 §8.2, Q75
      description: >-
        Current network backend, interfaces, any in-flight confirm-or-revert
        window, the TLS certificate's expiry, LAN-only access scope and the
        listen port. Editing address, DNS or gateway is only possible when the
        backend is ifupdown; otherwise `editable` is false and `readOnlyReason`
        says why.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current network settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: applyNetworkSettings
      summary: Apply host network, access-scope or listen-port changes
      # Design refs: Q75
      description: >-
        Address, DNS and gateway changes are written to one managed ifupdown
        file under `/etc/network/interfaces.d/` and applied with a 60-second
        confirm-or-revert: unless `confirmNetworkSettings` is called over the
        new configuration before the window expires (or the daemon dies), the
        previous file is restored. Access scope and listen port apply without
        that window — access scope takes effect immediately; a listen-port
        change is persisted and used on the next daemon start. Addressing fields
        are refused when the backend is not ifupdown.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyNetworkSettingsRequest'
      responses:
        "200":
          description: Settings after the apply, including any pending confirm window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/confirm:
    post:
      operationId: confirmNetworkSettings
      summary: Keep the pending network configuration
      # Design refs: Q75
      description: >-
        Called over the new configuration during the confirm-or-revert window.
        Keeps the managed ifupdown file. An unreachable address cannot be
        confirmed because this request never arrives. After the window expires,
        or if the daemon died before confirm, the previous configuration has
        already been restored and this returns `network_confirm_expired`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after confirm; `pending` is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/certificate:
    post:
      operationId: regenerateTLSCertificate
      summary: Regenerate the self-signed TLS certificate
      # Design refs: Q9
      description: >-
        Replaces the daemon's TLS certificate with a freshly generated
        self-signed certificate and hot-reloads it so new connections use the
        new cert. If Let's Encrypt DNS-01 is configured, unattended renewal is
        disarmed so this self-signed cert is not overwritten without another
        explicit setup. Let's Encrypt issue and renew are handled by
        `configureLetsEncrypt`, not by this operation.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings including the new certificate expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/lets-encrypt:
    post:
      operationId: configureLetsEncrypt
      summary: Configure Let's Encrypt DNS-01 and issue a certificate
      # Design refs: Q28, Q9
      description: >-
        Stores the domain and DNS-01 provider credentials (encrypted at rest)
        and queues an `acme_issue` job that talks to the ACME directory over
        DNS-01 only. Ports 80 and 443 are never claimed. HTTP-01 and TLS-ALPN-01
        are not offered. On success the issued certificate replaces the
        self-signed cert on `:8008`. Unattended renewal stays armed while
        `letsEncrypt.enabled` is true. A failed issue or renew keeps serving the
        existing certificate and notifies; it never silently falls back to a new
        self-signed cert.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureLetsEncryptRequest'
      responses:
        "200":
          description: The queued or running ACME issue job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableLetsEncrypt
      summary: Stop unattended Let's Encrypt renewal
      description: >-
        Disarms unattended renewal. The certificate currently served on
        `:8008` is left in place — this does not generate a self-signed
        replacement. DNS credentials remain stored until overwritten by
        a later `configureLetsEncrypt` or cleared by regenerating a
        self-signed certificate.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after renewal is disarmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules:
    get:
      operationId: getSchedules
      summary: List recurring job schedules
      # Design refs: Q30, doc 03 §8.4, doc 01 §4
      # Implementation: conflict warnings come from DetectConflict.
      description: >-
        The nightly maintenance chain and every separately scheduled job, with
        server-computed next-run times, human-readable schedule previews and
        conflict warnings. Chain step order is server-defined and not writable.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: All recurring schedules and any detected conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/chain:
    put:
      operationId: updateMaintenanceChainSchedule
      summary: Update the nightly maintenance chain schedule
      # Design refs: doc 03 §8.4, Q30
      description: >-
        Persists the chain's start time, weekly scrub day and per-step enabled
        flags. Step order is fixed and cannot be changed. Omitted step entries
        leave that step's enabled state unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceChainScheduleRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OtherScheduleJobId'
    put:
      operationId: updateScheduledJob
      summary: Update a separately scheduled job
      # Design refs: doc 03 §8.4
      description: >-
        Persists enabled state, frequency and start time for one of the
        recurring jobs outside the nightly chain.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledJobRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates:
    get:
      operationId: getUpdateStatus
      summary: Hoserva and Debian update status
      # Design refs: doc 03 §8.6, Q67, Q68, Q49
      description: >-
        Current Hoserva version, any newer release on the configured channel,
        update-check on/off, pending Debian updates and whether a reboot is
        required. The update check reads only the signed release index on the
        project site — never the GitHub API and never a system-wide `apt
        update`. When the check is disabled, `availableVersion` is omitted
        rather than fetched.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUpdateSettings
      summary: Set update channel and check-enabled
      # Design refs: Q49, Q67
      description: >-
        Persists the update channel (stable / beta) and whether the outbound
        update check is enabled. Omitted fields are left unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUpdateSettingsRequest'
      responses:
        "200":
          description: The updated update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/check:
    post:
      operationId: checkForUpdate
      summary: Check the signed release index for a newer Hoserva
      # Design refs: Q67
      description: >-
        Fetches the signed release index for the configured channel. A
        user-initiated check runs even when the periodic outbound check is
        disabled. Never calls the GitHub API or `apt update`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Update status after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/apply:
    post:
      operationId: applyUpdate
      summary: Download, verify and install the available Hoserva release
      # Design refs: Q67, doc 10 §1
      description: >-
        Downloads the `.deb` named by the signed release index, verifies it
        against the signed SHA256SUMS, runs a config backup, and installs it in
        a transient systemd unit. Refused while a Parity, Array-write or
        Topology job is running; the error names that job. A `.deb` whose
        checksum does not match is never installed, and a notification is
        raised.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The update has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/rollback:
    post:
      operationId: rollbackUpdate
      summary: Roll back to the previous Hoserva release and its snapshot
      # Design refs: Q67, D16
      description: >-
        Downloads and verifies the previous release's `.deb`, restores that
        version's pre-migration database snapshot, and installs the previous
        package. There are no down migrations — rollback is previous package
        plus its snapshot. Refused while a Parity, Array-write or Topology job
        is running; the error names that job.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The rollback has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/reboot:
    post:
      operationId: rebootHost
      summary: Reboot after waiting for storage jobs and a clean shutdown
      # Design refs: Q70, Q68
      description: >-
        Waits for any running Parity, Array-write or Topology job, runs the
        clean shutdown sequence, then reboots. Hoserva never reboots on its own
        — this is always the user's action.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: Reboot has been started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /status:
    get:
      operationId: getStatus
      summary: Overall system health
      # Design refs: doc 01 §3, §5
      description: >-
        One-screen health summary for the dashboard and `hoserva status`.
      tags: [status]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /metrics:
    get:
      operationId: getMetrics
      summary: Metric time series
      # Design refs: Q74, doc 03 §2
      description: >-
        Returns downsampled samples from metrics.db for one metric/subject over
        a time window. Resolution is chosen from the window — raw for up to 48
        hours, hourly for up to 90 days, daily beyond — so clients cannot force
        a full raw scan. A missing or empty metrics.db yields an empty series,
        not an array-health error.
      tags: [metrics]
      x-hoserva-role: viewer
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
          description: >-
            Metric identifier, e.g. `disk_throughput_bytes_per_sec` or
            `network_throughput_bytes_per_sec` for dashboard charts.
        - name: subject
          in: query
          schema:
            type: string
          description: >-
            Device path for a per-disk metric (SMART, temperature) or omit
            for a host-wide metric (CPU, RAM, pool throughput).
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window start (inclusive), UTC.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window end (inclusive), UTC.
      responses:
        "200":
          description: The matching series, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        default:
          $ref: '#/components/responses/Error'

  /pool:
    get:
      operationId: getPool
      summary: Pool status
      # Design refs: doc 01 §3, doc 09 §4 step 2, #359
      description: >-
        Per-disk pool breakdown for `hoserva pool status`, including each disk's
        own `removalState` where one is in progress.
      tags: [pool]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Pool topology and disk breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatus'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance/plan:
    post:
      operationId: planRebalance
      summary: Preview rebalancing the pool
      # Design refs: doc 09 §3
      description: >-
        Computes the rebalance plan: for every share with at least two branches,
        the files a rebalance would move from that share's own most-full disk to
        its own least-full disk to bring them within the skew tolerance, plus
        any path-preserving warnings, and the exact typed confirmation
        `startRebalance` requires. A data disk in removal (any `removalState`)
        is left out of every share's branches: the plan neither moves a file off
        it nor onto it. Read-only: nothing is copied, synced or deleted.
      tags: [pool]
      x-hoserva-role: admin
      responses:
        "200":
          description: The rebalance plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancePlan'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance:
    post:
      operationId: startRebalance
      summary: Rebalance the pool
      # Design refs: Q14, doc 09 §3
      # Implementation: the job is `job.TypeRebalance`, run through
      # `cache.RunRebalance`.
      description: >-
        Recomputes the rebalance plan (never trusting a client-supplied one — a
        stale plan can only omit or skip files at run time, never misdirect a
        copy or delete) and, once `confirmation` matches the exact phrase the
        matching `planRebalance` call returned, queues a resumable rebalance job
        that runs that plan unchanged: copy and verify every batch, sync through
        the threshold guard, delete the batch's sources, sync again, batched so
        no trailing sync this run makes can ever trip the guard after sources
        are already gone. The recomputed plan leaves out a data disk in removal
        the same way `planRebalance` does. A wrong or missing confirmation is
        refused (`confirmation_required`) before anything runs.
      tags: [pool]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRebalanceRequest'
      responses:
        "200":
          description: The queued, resumable rebalance job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares:
    get:
      operationId: listShares
      summary: List shares
      # Design refs: doc 03 §4.1
      # Originally also: size and per-disk distribution were later issues.
      description: Every configured share. Does not walk data disks.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Configured shares, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShare
      summary: Create a share
      # Design refs: D4, doc 02 §1, doc 03 §4, Q70
      description: >-
        Persists the share, creates its directory tree on the branches its cache
        mode uses, writes the per-share mergerfs mount through the existing pool
        renderer, and regenerates `smb.conf`. Refused with 409
        `maintenance_mode` while the array is stopped: create would mkdir under
        bare disk mountpoints on the root filesystem, and the next array start
        would hide those writes. Refused with 409 `migration_in_progress` while
        an Unraid import is pending its point of no return: a new share would
        need a directory on every adopted disk, and those are not written until
        then. The import creates its own shares (`startMigrationImport`).
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
      responses:
        "200":
          description: The created share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getShare
      summary: Get a share
      # Design refs: doc 03 §4.2
      description: One share by name.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateShare
      summary: Update a share
      # Design refs: doc 09 §2, Q70
      description: >-
        Updates cache mode, create policy and SMB options, then regenerates the
        per-share mount and `smb.conf`. Does not relocate existing files.
        Refused with 409 `maintenance_mode` while the array is stopped: update
        would mkdir and remount under bare disk mountpoints on the root
        filesystem. While an Unraid import is pending its point of no return it
        creates no directory on any adopted disk, and a cache mode that needs a
        cache is refused because none exists yet; choosing a cache mode here
        replaces the one the import recorded as the share's target.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShareRequest'
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShare
      summary: Delete a share definition
      # Design refs: doc 03 §4.2, Q70
      description: >-
        Removes the share row and regenerates mounts and `smb.conf`. Leaves the
        share's files on disk. `confirm: true` is required. Deleting the data is
        `deleteShareData`. Refused with 409 `maintenance_mode` while the array
        is stopped: delete would unmount and rewrite share mounts against bare
        disk mountpoints on the root filesystem.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: Share definition removed.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/data/delete:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: deleteShareData
      summary: Delete a share's files
      # Design refs: doc 03 §4.2
      description: >-
        Deletes this share's files on the branches that hold it, and nothing
        else — not other shares, not the parity file, not disks that do not hold
        this share. The definition is left in place. `confirmation` must equal
        the share name. Refused with 409 `migration_in_progress` while an Unraid
        import is pending its point of no return: the adopted disks are not
        written until then.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteShareDataRequest'
      responses:
        "204":
          description: Share data deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/relocate:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: startShareRelocation
      summary: Relocate a share between cache and array
      # Design refs: doc 09 §2, Q14, Q15
      description: >-
        Queues a `share_relocation` job moving name's files between its cache
        path and the array — `hoserva share relocate <share> --to cache|array`.
        Cache to array behaves as a mover run limited to this share, ignoring
        the grace period; array to cache follows the two-phase copy-verify-sync-
        delete-sync order, through the same threshold guard every other sync
        goes through. There is no second relocation-invocation path. A
        relocation in either direction needs the array's cache disk, so it is
        refused with 409 `no_cache_disk` before any job is queued while the
        array has no cache disk, and with 409 `no_array` while there is no
        array; a failure to read the array topology fails the request rather
        than assuming a cache.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartShareRelocationRequest'
      responses:
        "200":
          description: The queued or running share relocation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/relocation-precheck:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getShareRelocationPrecheck
      summary: List what a share relocation would collide with
      # Design refs: doc 09 §2, doc 04 §3
      description: >-
        What a caller shows before it starts `startShareRelocation`: the
        containers whose mounts use the share and every file of the share some
        process currently holds open, across the cache and every array branch. A
        container uses the share when a mount's host path is the share's pool
        path, a path inside it, or a path that holds it (`/mnt/user`, a disk or
        the cache itself), on the pool, on the cache or on a data disk; the
        match is made on the path as written, never through a symlink, so it
        reads no data disk. `active` is true for a container that is running,
        paused or restarting — one that can hold files open and that a
        relocation must not run beside. Listing the open files enumerates the
        share on the cache and on every array branch, so this is an explicit
        call that may wake disks — it is never polled. `dockerAvailable` is
        false, with no error and no containers, whenever Docker itself is not
        reachable. The answer covers both sides of the share, so it is the same
        whichever way the share will move. No answer is given in the cases
        `startShareRelocation` refuses before it queues a job: 409
        `no_cache_disk` while the array has no cache disk, 409 `no_array` while
        there is no array, 409 `maintenance_mode` while the array is stopped,
        409 `migration_in_progress` while an Unraid migration is unfinished and
        409 `database_restore_in_progress` during a database restore. These are
        the scheduler's own admission checks, queried without submitting a job.
        Stopping a listed container goes through `stopApp`.
      tags: [shares]
      x-hoserva-role: admin
      responses:
        "200":
          description: The containers and open files a relocation would collide with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRelocationPrecheck'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/browse:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: browseShare
      summary: List a share directory
      # Design refs: doc 03 §4.2
      description: >-
        Lists one directory of the share, including the holding disk per entry
        from mergerfs `user.mergerfs.basepath`. This is an explicit call and may
        wake disks — it is never polled.
      tags: [shares]
      x-hoserva-role: viewer
      parameters:
        - name: path
          in: query
          description: Directory relative to the share root. Empty is the share root.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareBrowseResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShareFile
      summary: Delete a file or empty directory from the share
      # Design refs: doc 03 §4.2
      description: >-
        Deletes one file or empty directory within the share, given a path
        relative to the share root. Refuses the share root itself and any path
        that would resolve outside the share's root, including through a
        symlink. `confirm: true` is required.
      tags: [shares]
      x-hoserva-role: admin
      parameters:
        - name: path
          in: query
          required: true
          description: File or empty directory to delete, relative to the share root.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: File or directory deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/permissions:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getSharePermissions
      summary: Get a share's per-user and per-group access
      # Design refs: Q27, doc 03 §7
      description: >-
        Every user and every user group with an explicit access level on this
        share. A user or group with no row here is not represented.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This share's per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSharePermissions
      summary: Replace a share's per-user and per-group access
      # Design refs: doc 03 §7
      description: >-
        A full replace: this share's access is set to exactly the users and
        groups listed, and every user or group previously granted an explicit
        level but missing from the request loses its row entirely (access is
        editable from either the share or the user; this is the share-side
        editor).
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSharePermissionsRequest'
      responses:
        "200":
          description: This share's updated per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /disks:
    get:
      operationId: listDisks
      summary: List disks
      # Design refs: doc 02 §4
      description: Every block device Hoserva knows about.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Disk inventory.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiskInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /disks/external:
    get:
      operationId: listExternalDisks
      summary: List external disks
      # Design refs: Q72, doc 02 §4, doc 03 §3.3, doc 05 §5
      description: >-
        Disks outside the array: Ignore-role or a later USB disk, never a pool
        or parity member. Registered external disks plus inventory disks that
        are not the boot device and not in the array. The Unraid USB stick (a
        FAT filesystem labelled `UNRAID`) is never offered: it is the
        migration's rollback. Nothing is mounted by this call.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: External disks.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerExternalDisk
      summary: Register a disk as external
      # Design refs: Q72
      description: >-
        Assigns a non-array, non-boot disk the Ignore/external role with a label
        used as `/mnt/disks/<label>`. Does not mount or format. The boot device
        is refused, and so is the Unraid USB stick (`unraid_stick`, 409).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalDiskRequest'
      responses:
        "200":
          description: The registered external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    patch:
      operationId: updateExternalDisk
      summary: Update an external disk
      # Design refs: doc 10 §1
      description: >-
        Sets whether this disk's `/mnt/disks/<label>` mount is a local backup
        destination. Enabling it on the Unraid USB stick is refused with
        `unraid_stick` (409).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalDiskRequest'
      responses:
        "200":
          description: The updated external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/mount:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: mountExternalDisk
      summary: Mount an external disk
      # Design refs: Q21, Q72
      description: >-
        Mounts the disk by filesystem UUID at `/mnt/disks/<label>`. Nothing
        mounts automatically on plug-in. The boot device and array disks are
        refused, and so is the Unraid USB stick (`unraid_stick`, 409): it is
        only ever mounted read-only, by the migration scan.
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The mounted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/eject:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: ejectExternalDisk
      summary: Eject an external disk
      # Design refs: Q72
      description: >-
        Unmounts `/mnt/disks/<label>`, then spins the disk down.
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The ejected external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/format:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: formatExternalDisk
      summary: Format an external disk
      # Design refs: doc 03 §3.1 step 6
      description: >-
        Formats the disk after the same typed confirmation array setup uses. The
        boot device is never offered. A wrong or missing confirmation is refused
        with `confirmation_required` and formats nothing. The Unraid USB stick
        is refused with `unraid_stick` (409), whatever the confirmation.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatExternalDiskRequest'
      responses:
        "200":
          description: The formatted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/wake-events:
    get:
      operationId: listWakeEvents
      summary: List spin-state wake events
      # Design refs: Q32, doc 03 §3.3a Phase 1
      description: >-
        Reads persisted spin-state transitions from the central database only —
        never probes block devices. Returns every recorded transition plus
        per-device wake counts grouped by UTC day so the wake-events page can
        show when each disk woke, how long it stayed awake, and how often it
        woke.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Spin-state transition log and daily wake counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeEventsResponse'
        default:
          $ref: '#/components/responses/Error'

  /disks/array:
    post:
      operationId: createArray
      summary: Create the storage array
      # Design refs: doc 03 §3.1 step 6, doc 02 §4, D1, doc 01 §6, doc 05 §4
      # step 11
      # Implementation: the confirmation string is
      # `disk.TopologyPlan.Confirmation`; the handler calls `disk.FormatPlan`,
      # never a second formatter.
      description: >-
        Queues a Topology job that formats or adopts the assigned disks. The
        request is the wizard's role assignments, per-disk filesystem (including
        adopt/keep), pool options, and the same typed confirmation string array
        setup uses. A wrong or missing confirmation is refused with
        `confirmation_required` and formats nothing. A device is a whole,
        non-boot disk, with one exception: the `cache` role may name a spare
        partition of the boot disk that `listDisks` reports in that disk's
        `cachePartitions` — Hoserva formats that blank partition and never
        writes the boot disk's partition table. A partition of the boot disk
        assigned to `data` or `parity` is refused with
        `boot_partition_cache_only`; a partition that is not one of the reported
        spare partitions is refused with `unmanaged_device`. The Unraid USB
        stick, which is the user's rollback, is refused in every role with
        `unraid_stick` (409). Refused with 409 `migration_in_progress` while an
        Unraid import is pending its point of no return
        (`startMigrationImport`).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrayRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add/plan:
    post:
      operationId: planDiskAdd
      summary: Preview adding a data disk
      # Design refs: doc 02 §4 "Adding a disk", Q20, Q21
      # Implementation: `disk.NextDataMountpoint` assigns the mountpoint;
      # `disk.TopologyPlan.Validate` is the shared validation.
      description: >-
        Computes the add plan: the target disk's own identity (model, WWN or
        serial, size, its existing filesystem if any), its assigned mountpoint
        and the exact typed confirmation `addDisk` requires. Refuses a disk that
        would leave a parity disk smaller than the array's largest data disk,
        and a device already identified as one of the array's own members by WWN
        or serial, applying the same validation array setup runs over the
        resulting data set. Read-only: nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskPlanRequest'
      responses:
        "200":
          description: The add plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add:
    post:
      operationId: addDisk
      summary: Add a data disk to the running array
      # Design refs: D4, doc 02 §4 "Adding a disk"
      # Implementation: job type `job.TypeDiskAdd`.
      description: >-
        Queues a Topology job that formats or adopts the disk, then regenerates
        mount units, the pool and `snapraid.conf` from SQLite. The confirmation
        must be the exact string the matching `planDiskAdd` call returned; a
        wrong or missing one is refused with `confirmation_required` and formats
        nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace/plan:
    post:
      operationId: planDiskReplace
      summary: Preview replacing a data disk
      # Design refs: doc 02 §4 "Replacing a failed disk", doc 02 §4 steps 1-2,
      # #289, Q20, #384
      description: >-
        Computes the replace plan: the replacement's own identity (model, WWN or
        serial, size, its existing filesystem if any), the SnapRAID `fix`
        command that reconstructs the slot's contents after it is formatted, and
        the exact typed confirmation `replaceDisk` requires. Refuses
        (`slot_disk_present`) unless the slot's own recorded disk is genuinely
        gone — not merely unmounted, but absent from a fresh disk inventory by
        identity (a healthy disk goes through the upgrade flow instead) — and a
        replacement that would leave a parity disk smaller than the array's
        largest data disk. Refuses (`disk_leaving_array`, 409) a slot whose disk
        is still `evacuating` or already `unlisted`: the replacement would
        inherit that state. A slot that is `evacuated` or `unpooled` is allowed
        once the slot's own disk is genuinely missing, refused with
        `slot_disk_present` otherwise like any other slot — replace abandons the
        removal and rebuilds the disk's recorded files from parity. Read-only:
        nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskPlanRequest'
      responses:
        "200":
          description: The replace plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace:
    post:
      operationId: replaceDisk
      summary: Replace a data disk
      # Design refs: doc 02 §4 "Replacing a failed disk", #384
      # Implementation: job type `job.TypeDiskReplace`.
      description: >-
        Queues a Topology job that formats or adopts the replacement at the same
        mountpoint, regenerates mount units, the pool and `snapraid.conf` from
        SQLite, confirms the mountpoint is genuinely backed by the replacement
        before touching parity, then runs `snapraid fix` to reconstruct its
        contents from parity and the remaining disks. Identity is re-checked at
        format time and the boot disk is always refused. Refuses
        (`slot_disk_present`) the same way `planDiskReplace` does when the
        slot's own disk is still mounted or still present by identity, and
        (`disk_leaving_array`, 409) a slot still `evacuating` or already
        `unlisted`. A slot that is `evacuated` or `unpooled` is allowed once the
        slot's own disk is genuinely missing: the job clears the removal state
        as part of adopting the replacement, so the disk rejoins the array as an
        ordinary member and its recorded files rebuild from parity. The
        confirmation must be the exact string the matching `planDiskReplace`
        call returned; a wrong or missing one is refused with
        `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade/plan:
    post:
      operationId: planDiskUpgrade
      summary: Preview upgrading a data or parity disk to a larger one
      # Design refs: doc 02 §4 "Larger data disk"/"Larger parity disk", Q20,
      # Q19, Q21, Q23, Q71
      # Implementation: the parity-size rule is
      # `disk.DataDiskUpgradeExceedsParity`; the shared checks are Q19, Q20, Q21
      # and Q23.
      description: >-
        Computes the upgrade plan for the existing array slot at `mountpoint`,
        whichever role it holds: the replacement's own identity (model, WWN or
        serial, size, its existing filesystem if any), the copy/verify/remount
        steps a data-disk upgrade runs or the copy/verify/switch/check steps a
        parity-disk upgrade runs, and the exact typed confirmation `upgradeDisk`
        requires. For a data disk, refuses (`invalid_plan`) a replacement that
        would leave a parity disk smaller than it — offering the parity upgrade
        flow first — and any of `planDiskReplace`'s own checks. For a parity
        disk, `newMountpoint` is the fresh `/mnt/parityN` slot the new disk will
        be formatted, mounted and verified at independently of the old one —
        never the old disk's own mountpoint. Refuses (`disk_leaving_array`, 409)
        a data disk in removal (any `removalState`): the new disk would inherit
        that state. Read-only: nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskUpgradePlanRequest'
      responses:
        "200":
          description: The upgrade plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskUpgradePlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade:
    post:
      operationId: upgradeDisk
      summary: Upgrade a data or parity disk to a larger one
      # Design refs: doc 02 §4, Q71
      # Implementation: job types `job.TypeDiskUpgradeData` and
      # `job.TypeDiskUpgradeParity`.
      description: >-
        Starts a resumable Topology job (a data-disk or a parity-disk upgrade,
        resolved from the slot's role). The confirmation must be the exact
        string the matching `planDiskUpgrade` call returned; a wrong or missing
        one is refused with `confirmation_required` and formats nothing. A data
        disk in removal is refused (`disk_leaving_array`, 409) as
        `planDiskUpgrade` refuses it. A data-disk upgrade follows a fixed state
        machine: it is admitted only once `stopArray` has completed (otherwise
        `array_not_stopped`) and while no other data-disk upgrade is pending
        (otherwise `disk_upgrade_pending`, naming it). It requires a clean
        `snapraid diff` before formatting, copies and verifies the old disk,
        mounts the new one at the same mountpoint, requires `snapraid diff` to
        show no removed or updated files, and only then names the new disk in
        SQLite; the array stays stopped until the user starts it. A parity-disk
        upgrade runs with the array started (refused with `maintenance_mode`
        while it is stopped): it copies the parity file, verifies it byte for
        byte, switches the configuration and passes `snapraid check` before
        releasing the old parity disk. The old disk is never written to or
        released until its verification gate passes.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDiskRequest'
      responses:
        "200":
          description: The queued, resumable Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate/plan:
    post:
      operationId: planDiskEvacuation
      summary: Preview evacuating a data disk before removal
      # Design refs: doc 09 §4 steps 1-3, doc 09 §4, #367, doc 09 §4 step 2, doc
      # 09 §4 steps 1 and 3-6, Q14
      # Implementation: files come from `cache.PlanEvacuation`; this covers doc
      # 09 §4 steps 1 and 3-6, step 2's no-create switch is `evacuateDisk`'s
      # job, and steps 7-9 are `finishDiskRemoval`'s.
      description: >-
        Computes the evacuation plan for the data disk at `mountpoint`
        (mechanically a rebalance targeting one specific source disk): every
        file an evacuation would move from that disk onto the pool's remaining
        disks, any path-preserving warnings, and the exact typed confirmation
        `evacuateDisk` requires. Refused (`invalid_plan`) when a share on this
        disk has no other branch to evacuate onto, when an entry on the disk is
        something the evacuation copy path cannot move (a symlink, fifo, socket
        or device node), when the remaining disks do not have room even after
        each one's own minimum free space is kept, or when the disk holds any
        top-level entry that is neither a configured share's own branch there
        nor SnapRAID's own bookkeeping (`lost+found`, `snapraid.content*`) —
        there is no procedure for moving such content, so evacuation refuses to
        start rather than leave it behind unreported; that refusal's own 400
        body, `EvacuationPlanRefusal`, names every offending path in
        `nonSharePaths`. Read-only: nothing is copied, synced or deleted, and
        this preview does not itself put the disk into its `removing`/no-create
        state — `evacuateDisk`'s own job does that, before its first copy, so
        the disk keeps taking new writes only until that job starts, never for
        as long as it runs. Refused (`disk_leaving_array`, 409) when the disk is
        already `unpooled` or `unlisted` — only `finishDiskRemoval` takes it
        further — and (`disk_removal_in_progress`) while a different disk is
        already in removal. An `evacuating` or `evacuated` disk is planned
        again, as the source of a resumed or repeated evacuation. No other disk
        in removal is ever a target. Evacuation moves the disk's own
        already-present files off it, protected through the threshold guard. The
        no-create switch is applied by `evacuateDisk`'s job, not by this
        preview, and the mergerfs branch-list removal, SnapRAID removal and
        unmount are not performed by either.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskPlanRequest'
      responses:
        "200":
          description: The evacuation plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvacuationPlan'
        "400":
          description: >-
            The disk holds content outside every configured share;
            `nonSharePaths` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvacuationPlanRefusal'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate:
    post:
      operationId: evacuateDisk
      summary: Evacuate a data disk before removal
      # Design refs: D4, doc 09 §4 step 2, Q15, Q14, doc 09 §4 step 6, doc 09 §4
      # steps 7-9
      # Implementation: job type `job.TypeEvacuation`, run through
      # `cache.RunRebalance`; the post-check is `cache.EvacuationPostCheck`;
      # steps 7-9 are doc 09 §4's.
      description: >-
        Recomputes the evacuation plan for `mountpoint` (never trusting a
        client-supplied one, as `startRebalance` does) and, once `confirmation`
        matches the exact phrase the matching `planDiskEvacuation` call
        returned, queues a resumable evacuation job. Before copying anything —
        and again on every resume — the job marks the disk `evacuating`
        (persisted in SQLite) and applies no-create to its own branch in every
        pool mount, live; a failure to apply that fails the job before any copy.
        It then runs the plan unchanged: copy and verify every batch, sync
        through the threshold guard (each such sync naming this disk in the
        guard's own zero-files exemption, since the batch that finally empties
        it would otherwise trip that rule), delete the batch's sources, sync
        again — then, once the whole plan finishes without being interrupted, a
        post-check confirms the disk's own share branches hold nothing but empty
        directories and the job marks the disk `evacuated` before reporting
        success. A wrong or missing confirmation is refused
        (`confirmation_required`) before anything runs, a disk already
        `unpooled` or `unlisted` is refused (`disk_leaving_array`, 409) as
        `planDiskEvacuation` refuses it, a second disk is refused
        (`disk_removal_in_progress`) while one is already in removal, and any
        new evacuation is refused (`evacuation_pending`) while another
        evacuation job is queued, running or interrupted. The removal state
        belongs to the job that set it: cancelling that job — queued, running or
        interrupted — clears it and puts the disk back to taking writes, and
        cancelling any other job never does. A job that fails leaves the disk
        `evacuating`; evacuating it again takes the state over, and cancelling
        that run clears it. Success here means the disk's data as this job saw
        it is safely off it and it is no longer taking new writes, not that it
        is empty of every file or safe to physically remove: the mergerfs
        branch-list removal, SnapRAID removal and unmount are
        `finishDiskRemoval`'s.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskRequest'
      responses:
        "200":
          description: The queued, resumable evacuation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/remove/finish:
    post:
      operationId: finishDiskRemoval
      summary: Finish removing an evacuated data disk
      # Design refs: doc 09 §4 steps 7-9, Q18
      # Implementation: job type `job.TypeDiskRemove`; the steps are doc 09 §4's
      # 7-9 (step 7 pool removal, step 8 snapraid.conf, step 9 unit removal).
      description: >-
        Queues a Topology job that takes an evacuated data disk out of the
        array. The confirmation is the same `REMOVE <mountpoint>` phrase
        `planDiskEvacuation` returned for the disk. Refused synchronously with
        `disk_slot_not_found` when no data disk occupies `mountpoint`,
        `disk_not_evacuated` when its removal state is not `evacuated`,
        `unpooled` or `unlisted`, and `confirmation_required` for a wrong or
        missing confirmation; `not_configured` when the daemon has no parity
        engine. Before changing anything the job checks all of that again, that
        the array without the disk still has a data disk and room for every
        content-file copy, that the disk is mounted by its own filesystem, and
        that nothing but empty directories and SnapRAID's own content files is
        left anywhere on it. It then marks the disk `unpooled` and takes it out
        of every pool mount, live (a failed live update fails the job); removes
        the empty directories the evacuation left, since SnapRAID records those
        too (rmdir only); runs a sync through the threshold guard with only this
        disk exempt from the zero-files rule, while its data line is still in
        snapraid.conf, and confirms SnapRAID tracks no file on it; marks it
        `unlisted`, regenerates snapraid.conf without it and checks SnapRAID
        accepts the result; then stops its mount unit, removes the unit file and
        deletes the disk from the array. The job's result names the disk as safe
        to physically remove; its filesystem is never wiped. A job that fails or
        is interrupted leaves the disk in the last state it reached, and running
        this operation again carries on from there — once `unlisted`, it never
        syncs again. A tripped guard leaves the disk `unpooled`, still listed
        and mounted, with nothing synced.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishDiskRemovalRequest'
      responses:
        "200":
          description: The queued disk-removal job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/remove/cancel:
    post:
      operationId: cancelDiskRemoval
      summary: Cancel a data disk's removal and return it to normal use
      # Design refs: doc 09 §4, #361
      description: >-
        Clears `mountpoint`'s removal state synchronously — no job — and
        re-applies the pool live so the disk's branches go back to RW. Refused
        with `disk_slot_not_found` (404) when no data disk occupies
        `mountpoint`. Refused with `disk_removal_not_cancellable` (409) when the
        disk is not currently in removal; when it is `unpooled` or `unlisted` —
        it has already left the pool, so the only way forward is
        `finishDiskRemoval`, never back; or when it is `evacuating` and its
        evacuation job is still queued, running or interrupted — that job owns
        the state, so cancel it (`cancelJob`) instead. An `evacuating` disk
        whose evacuation job has already ended (no longer queued, running or
        interrupted — including a job the store no longer has a record of) is
        cancelled the same as an `evacuated` one: the copy it ran already
        stopped, and cancelling here is how the disk gets back to ordinary use
        instead of sitting stuck until it is evacuated again. A live-update
        failure while re-applying the pool is an internal error, and the removal
        state is left cleared — the same as the disk-topology jobs' own
        live-apply failures — rather than silently reporting success with the
        disk still no-create.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDiskRemovalRequest'
      responses:
        "204":
          description: The removal is cancelled; the disk takes writes again.
        default:
          $ref: '#/components/responses/Error'

  /array/stop:
    post:
      operationId: stopArray
      summary: Stop the array
      # Design refs: Q70, doc 02 §4, doc 02 §4 E7
      # Implementation: the handler calls `job.ArraySequence.Stop`; the stop
      # list is Q70's.
      description: >-
        Enters maintenance mode (`hoserva array stop`): refuse new jobs and
        interrupt non-resumable jobs, shut down running VMs, stop containers,
        stop Samba and NFS, then unmount share paths, the catch-all and data
        disks — the same list the Stop array confirmation dialog shows. Parity
        is not written. A failure leaves maintenance mode active so nothing new
        starts against a half-stopped array. `confirm: true` is required.
        Refused with `disk_upgrade_pending` while a data-disk upgrade is
        pending: the array is already stopped for it, and nothing is stopped,
        signalled or unmounted.
      tags: [array]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopArrayRequest'
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/start:
    post:
      operationId: startArray
      summary: Start the array
      # Design refs: Q70, doc 02 §4, Q69, doc 02 §4 E6
      # Implementation: the handler calls `job.ArraySequence.Start`; the gate
      # error is `ErrStorageNotReady`; the filesystem check is UR9.
      description: >-
        Reverses `stopArray` (`hoserva array start`): mount disks, the catch-all
        and share paths, then start services in the reverse of stop order, and
        exit maintenance mode only once every step succeeds. Refused with
        `storage_not_ready` when the storage gate is not ready — nothing is
        mounted. Also refused with `disk_upgrade_pending` while a data-disk
        upgrade is pending — queued, running or interrupted at any checkpoint;
        the error names the job to resume or cancel, and nothing is mounted.
        Once the disks are mounted, each must hold the filesystem SQLite names
        for it before the pool or any service starts; otherwise it is refused
        with `array_disk_mismatch`, the disks are unmounted again and
        maintenance mode stays on.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is false
            on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/degraded/acknowledge:
    post:
      operationId: acknowledgeDegradedArray
      summary: Acknowledge a degraded array
      # Design refs: doc 02 §1, Q69
      # Implementation: `disk.StorageGate.Acknowledge`,
      # `storageTargetSync.UpdateOrError`, `pool.DependentServiceUnits`,
      # `disk.ErrNothingToAcknowledge`; the rebuild is of the daemon's array
      # sequence.
      description: >-
        Records the user's explicit choice to proceed while the array is
        degraded (`hoserva array acknowledge-degraded`): the daemon acknowledges
        the missing disk on its live storage gate and then runs the exact
        not-ready to ready transition a returning disk reaches: mounting and
        confirming the pool, then starting every enabled, unmasked service unit
        that depends on it (Samba, NFS, Docker, libvirtd), never through a shell
        and never by a second mechanism. The acknowledgement itself survives
        every later rebuild of the daemon's array sequence (a share change, a
        disk-topology change, a daemon reload) for as long as the same disk
        stays missing. Refused with `array_not_degraded` (409) when nothing is
        currently missing — acknowledging a degraded state that does not exist
        would let a stale acknowledgement outlive the situation it was about.
        Refused with `array_services_not_started` (409) when the acknowledgement
        itself succeeds but the transition it triggers does not actually start
        anything — the array is in maintenance mode (`hoserva array stop`), or
        mounting or confirming the pool fails — so this never reports success
        over services that never came up — in that refusal case
        `arrayDegradedAcknowledged` on a later `getStatus` still reports true
        (the acknowledgement stands) while `storageServicesReleased` stays
        false, so a client must check both before ever telling the user services
        are running. `arrayDegraded` on the returned status stays true for as
        long as the disk is still missing — acknowledging never reports a
        degraded array as healthy — and `arrayDegradedAcknowledged` becomes true
        instead, the field the persistent banner and top-bar pill use to show
        "acknowledged, running degraded" rather than clearing the warning
        outright.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after acknowledging. `arrayDegraded` stays true
            while the disk is still missing; `arrayDegradedAcknowledged` is
            true; `storageServicesReleased` is true only once the
            transition actually started the gated services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /parity:
    get:
      operationId: getParity
      summary: Parity status and guard state
      # Design refs: doc 02 §2, Q13
      description: >-
        Reads SnapRAID status from the boot-device content file only — does not
        run `snapraid diff` or wake data disks. Threshold-guard state and
        grouped diff rows reflect the last explicit `POST /parity/diff` (or a
        sync job's own pre-sync diff) until the next one runs.
      tags: [parity]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current parity freshness and guard snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParitySnapshot'
        default:
          $ref: '#/components/responses/Error'

  /parity/diff:
    post:
      operationId: runParityDiff
      summary: Run a SnapRAID diff
      # Design refs: doc 02 §2, Q13
      description: >-
        Runs `snapraid diff` on every data disk — an explicit user action that
        wakes every data disk. Returns grouped changes and threshold-guard
        evaluation for the parity page; never polled on a timer.
      tags: [parity]
      x-hoserva-role: admin
      responses:
        "200":
          description: Grouped diff and guard evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityDiffResult'
        default:
          $ref: '#/components/responses/Error'

  /parity/sync:
    post:
      operationId: startSync
      summary: Start a SnapRAID sync
      # Design refs: doc 02 §2, doc 02 §6, Q77
      description: >-
        Queues a sync job through the threshold guard. A non-dry-run sync past a
        tripped guard requires `confirm: true` after reviewing the diff. Refused
        with 409 `on_battery` while the on-battery hold is active — scheduled
        syncs are held until power returns.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
      responses:
        "200":
          description: The queued or running sync job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/scrub:
    post:
      operationId: startScrub
      summary: Start a SnapRAID scrub
      # Design refs: doc 01 §3
      description: >-
        Queues a scrub job (`hoserva scrub`). By default it skips blocks newer
        than 10 days; `allBlocks` scrubs every block.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScrubRequest'
      responses:
        "200":
          description: The queued or running scrub job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/fix:
    post:
      operationId: startFix
      summary: Start a SnapRAID fix
      # Design refs: doc 01 §3, doc 02 §2
      description: >-
        Queues a fix job (`hoserva fix`). Requires `confirm: true` — fix
        rewrites data from parity. Without `path` the fix covers the whole
        array, or the one `disk`, and brings back every file changed or deleted
        since the last sync; with `path` it restores only that one file. Refused
        with 400 `invalid_fix_path` before a job is queued when `path` is not
        one file under `/mnt/user` or is sent together with `disk`. A fix that
        SnapRAID reports unrecoverable blocks for, with or without `path`, ends
        `failed`, never `succeeded`: SnapRAID exits 1, and the job's error gives
        the number of unrecoverable blocks and names the partial copies it left
        as `<name>.unrecoverable` on their disks, or says SnapRAID leaves them
        beside the file when its log names none; files it did recover stay
        restored. Without `path`, the error also says that SnapRAID can only
        rebuild what parity held at the last sync, and no more failed blocks
        than parity covers. With `path`, the error names the file and, when the
        log names the partial copy, gives one example cause: another file that
        shares its parity positions changed after the last sync. Any other
        non-zero exit fails the job too. A fix with `path` also ends `failed`
        when SnapRAID exits 0 with "Nothing to do": the path matched nothing in
        parity (misspelt, the wrong case, a directory, a file made after the
        last sync, a file only on the cache) or the file is intact and needs no
        restoring, and the job reports that nothing was restored.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFixRequest'
      responses:
        "200":
          description: The queued or running fix job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/run:
    post:
      operationId: startMover
      summary: Start a manual mover run
      # Design refs: doc 09 §2, doc 02 §6, Q77
      # Implementation: the job type is `TypeMover`; doc 09 §2's manual trigger.
      description: >-
        Queues a mover job (`hoserva mover run`, the manual trigger) — the same
        mover job the cache-usage threshold and the nightly chain submit; there
        is no second way to start the mover. Refused with 409 `on_battery` while
        the on-battery hold is active — the mover is paused until power returns.
      tags: [mover]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running mover job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/last-run:
    get:
      operationId: getLastMoverRun
      summary: Most recent finished mover run
      # Design refs: doc 09 §2, doc 03 §3.6, #273
      description: >-
        The structured result of the most recent finished mover run: files
        moved, bytes, duration, and every skipped entry with its reason.
        Persisted in SQLite by the mover job itself, not reconstructed from the
        job log. Null when no mover job has ever finished.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The last finished mover run, or null when none has finished yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/MoverRunResult'
        default:
          $ref: '#/components/responses/Error'

  /cache/usage:
    get:
      operationId: getCacheUsage
      summary: Cache usage breakdown
      # Design refs: doc 03 §3.6, Q87, Q13
      description: >-
        Appdata / pending-moves / other byte breakdown for the cache disk.
        Computed as a by-product of each mover run, never a live directory walk
        on a timer. Null when no mover run has computed it yet.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The latest persisted breakdown, or null when none has been
            computed yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/CacheUsageBreakdown'
        default:
          $ref: '#/components/responses/Error'

  /config/export:
    post:
      operationId: exportConfig
      summary: Export a config archive
      # Design refs: doc 10 §1
      description: >-
        Builds and returns the `hoserva-config-*.tar.zst` configuration archive.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The config archive.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /config/backup:
    post:
      operationId: runConfigBackup
      summary: Back up the config to the destinations now
      description: >-
        Queues a `config_backup` job (service class): the config archive
        the nightly chain writes, taken now. It writes one archive to every
        enabled backup destination, verifies it, and prunes each
        destination's own retention, counting the archive like a scheduled
        one — it never takes the slot of a pre-import, pre-update or
        pre-topology archive. It is serialized with the other config
        backups, so one asked for while another runs queues rather than
        failing. The job succeeds when at least one destination was written
        and its log names each destination written and each that failed
        (the stale-destination alert covers one that keeps failing), and
        fails, with a `config_backup_failed` notification, when none was.
        Refused with 409 `backup_no_destination` before anything is queued
        while no destination is enabled, and with 501 `not_configured`
        when this daemon has no backup service. To download an archive
        instead of writing one to the destinations, use `exportConfig`.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running config backup job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /config/import:
    post:
      operationId: importConfig
      summary: Import a config archive
      # Design refs: doc 10 §1
      description: >-
        Restores from a configuration archive. Requires `confirm: true` — this
        replaces the running configuration: the database, the custom config
        files (`*.custom.conf`), the installed app templates and each stack's
        compose and `meta.json` files, after which every managed config file is
        regenerated from the restored database and the result applied to the
        running pool. It also restores the passphrase-protected part of the
        archive, its stacks' `.env` files: with the optional `passphrase` if one
        is given, otherwise with the configured backup passphrase. Without a
        passphrase that opens it, everything else is restored and the report
        says the `.env` files were not. When the import restores `.env` files,
        the pre-import archive's own `secrets.age` is sealed with the passphrase
        that opened the imported archive's, so it holds every `.env` the import
        replaces; a failure to write it refuses the import. The answer is the
        restore report: what was restored per category, what was not and why,
        the name of the pre-import archive and which passphrase seals its
        secrets. Every refusal happens before anything is written, including the
        pre-import backup: 400 `invalid_archive` (it does not unpack or
        checksum, holds a file its manifest does not list or lacks one it lists,
        holds a link, device, FIFO or duplicate entry, or has a `secrets.age` or
        `identity.age` that is not readable, which shows once a passphrase is
        tried against it), 400 `backup_passphrase_incorrect` (a `passphrase` was
        given and it does not open the archive's `secrets.age` or, for an
        archive with an `identity.age` and no `secrets.age`, its `identity.age`;
        one that opens `secrets.age` but not `identity.age` is not refused), 400
        `incompatible_archive` (another schema version), 409 `job_in_progress`,
        409 `archive_other_installation` (its machine key check value differs
        from this installation's or is missing; a different installation's
        archive is restored only onto a fresh install) and 409
        `archive_array_mismatch` (its disks, their removal state or the
        relocation in flight differ from the live array; the message names each
        difference), and 409 `restore_path_unsafe` (a file it would restore
        lands on a symbolic link or on something that is not a regular file, or
        it names a path outside the directory it is restored into; nothing is
        followed). A bare-metal restore that would replace a Samba or NFS file
        already on this server also refuses with 409 `host_files_not_saved` when
        no backup destination is enabled to take the copy of it that the
        pre-import archive carries. A failure to stage the files answers 500
        `import_failed` with nothing changed; a failure once the database has
        been replaced answers 500 `import_failed` naming the pre-import archive
        to restore from and which of the file categories were restored and which
        left as they were. The array's own state, running, in maintenance mode
        or stopped, is kept as it is, never restored from the archive, so an
        import cannot return a stopped array to normal operation.


        On a fresh install, one with no array configured, whatever admin
        accounts it has, the import is the bare-metal restore of another
        installation's archive. It takes the archive's array disks from the
        archived database and matches each against the attached disks by
        identity; the mapping is what `previewConfigImport` shows, and the
        import refuses with 409 `disk_mapping_required` without `diskMapping`,
        the mapping the user confirmed, and with 409 `disk_mapping_stale` when
        it no longer matches the attached disks. An archive from an older schema
        version is upgraded on a staged copy of its database by the same
        migration runner a normal upgrade uses; one from a newer version is
        refused with 409 `archive_newer_version`. This box's own machine key
        check is kept, so `hoservad` starts. With a backup passphrase that opens
        the archive's `secrets.age`, every database secret in it (ACME, UPS,
        backup destination and notification channel credentials) is sealed under
        this box's machine key and written back into its own table, column and
        row, and the stack `.env` files are restored; the passphrase becomes
        this box's backup passphrase; and, when it opens `identity.age`, the
        archive's backup recipient replaces this box's own, so archives written
        from then on are encrypted to it. Without such a passphrase everything
        else is restored, this box keeps its own backup recipient (reported as
        `backup_recipient`), and every secret sealed under the archive's key is
        cleared and reported in `notRestored`. TOTP enrolment and any secret the
        archive does not carry are always cleared and reported, so the next
        sign-in of an account with TOTP enrols again. A `passphrase` given that
        does not open the archive's `secrets.age`, or, for an archive with an
        `identity.age` and no `secrets.age`, its `identity.age`, is refused with
        400 `backup_passphrase_incorrect` before anything is written; one that
        opens `secrets.age` but not `identity.age` is restored, and the report
        says the recipient was kept. Only matched disks are mounted; an absent,
        replaced or ambiguous disk stays a row of the restored array, unmounted,
        and is reported in `notRestored` (the replace flow adopts a replacement
        disk), and no disk is ever formatted or partitioned. While no admin
        account exists this operation and `previewConfigImport` are served on
        the Unix socket only; the TCP listener answers 409 `setup_required`.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, confirm]
              properties:
                archive:
                  type: string
                  format: binary
                confirm:
                  type: boolean
                  description: Must be true — import is destructive.
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: >-
                    The backup passphrase the archive's `secrets.age` and
                    `identity.age` were sealed under. Optional: omitted, the
                    configured backup passphrase is tried. On a fresh
                    install it also becomes this box's backup passphrase.
                diskMapping:
                  type: string
                  minLength: 1
                  maxLength: 65536
                  description: >-
                    The JSON of a `ConfigImportDiskMapping`: the mapping the
                    user confirmed, which is `previewConfigImport`'s
                    `bareMetal.diskMapping` as it was shown. Required when
                    the installation has no array (409
                    `disk_mapping_required` without it) and refused with
                    409 `disk_mapping_not_applicable` otherwise, since an
                    import into an array restores no disks. Sent as a JSON
                    string, not a JSON part, because the generated clients
                    send an empty part for an unset optional object; one that
                    is not a valid mapping is refused as 400
                    `invalid_disk_mapping`.
      responses:
        "200":
          description: Import completed; what it restored and what it did not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportReport'
        default:
          $ref: '#/components/responses/Error'

  /config/import/preview:
    post:
      operationId: previewConfigImport
      summary: Preview a config import
      description: >-
        Reads the same archive upload as `importConfig` and reports what an
        in-place import would change, without changing anything: it writes
        no database row, no pre-import archive, takes no job hold, and
        leaves no file behind. `blockers` lists the refusals `importConfig`
        would return for this archive, with the same codes and messages
        (400 `incompatible_archive`, 409 `archive_other_installation`, 409
        `archive_array_mismatch`, 409 `restore_path_unsafe`); `groups`
        compares the archive's database with the live one per category, and
        lists the custom config files, app templates and app stack files
        the import would replace, add and remove; it is empty when the
        archive's schema version differs, since the two cannot be compared.
        `secrets` says whether the archive has a passphrase-protected section
        (`status`, for `secrets.age`) and whether the passphrase available
        opens it and `identity.age` (`identity`), and if not, which stacks'
        `.env` files would not be restored. The optional `passphrase`
        is tried as `importConfig` tries it: one that does not open the
        archive's `secrets.age`, or, for an archive with an `identity.age`
        and no `secrets.age`, its `identity.age`, is refused as 400
        `backup_passphrase_incorrect`; one that opens `secrets.age` but not
        `identity.age` is not refused, and `identity` reports
        `passphrase_incorrect`. Without a `passphrase` the configured one
        is tried, and one that is absent or does not open the files shows
        only in `secrets`, never as a refusal; an archive with neither file has nothing to check a
        `passphrase` against. An
        archive that cannot be read is refused as `importConfig` refuses it
        (400 `invalid_archive`, 413 `archive_too_large`), and a daemon with
        no config backup wired answers 501 `not_configured`. Nothing on a
        data disk is read.


        On a fresh install, one with no array configured, `bareMetal`
        reports the bare-metal restore (see `importConfig`): whether the
        archive's database would be upgraded, and one entry per array disk
        the archive records, with the attached disk it matched, or none,
        and a state of `matched`, `absent`, `replaced` or `ambiguous`.
        `bareMetal.diskMapping` is the mapping to confirm, ready to send as
        `importConfig`'s `diskMapping`. An archive from a newer schema
        version is a blocker (`archive_newer_version`) with no `bareMetal`.
        The refusals for another installation's archive or a different
        array (`archive_other_installation`, `archive_array_mismatch`) apply
        to an installation that has an array only. While no admin account
        exists this operation is served on the Unix socket only.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: >-
                    The backup passphrase the archive's `secrets.age` and
                    `identity.age` were sealed under. Optional: omitted, the
                    configured backup passphrase is tried.
      responses:
        "200":
          description: What the import would change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportPreview'
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations:
    get:
      operationId: listBackupDestinations
      summary: List backup destinations
      # Design refs: doc 10 §1, Q28
      description: >-
        Every place a config backup is written, with its last successful backup
        and whether it is stale. Credentials are never returned — `hasSecrets`
        is the only trace of them.
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every destination.
          content:
            application/json:
              schema:
                type: object
                required: [destinations]
                properties:
                  destinations:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBackupDestination
      summary: Add a backup destination
      # Design refs: Q80, Q41
      description: >-
        A remote destination (`smb`, `s3`, `sftp`, `webdav`, `rclone`) is
        written through rclone and is always encrypted. It is refused with 400
        `backup_passphrase_required` while no backup passphrase is set, and with
        424 `rclone_missing` — whose `message` carries the install command —
        when rclone is not installed. Credentials in `secrets` are sealed under
        the machine key before they reach the database. Local destinations work
        without rclone.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupDestinationRequest'
      responses:
        "201":
          description: The new destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations/{destinationId}:
    parameters:
      - $ref: '#/components/parameters/DestinationId'
    patch:
      operationId: updateBackupDestination
      summary: Change a backup destination's enabled flag or retention
      description: >-
        Changes `enabled` and `retention` in place; a field left out is left
        as it is. Its type, path, options and credentials cannot be
        changed — remove the destination and add it again. Disabling never
        removes an archive or the credentials, and the next backup run uses
        the new values without a restart. Retention is bounded as in
        `createBackupDestination` (each count 0 to 1000, at least one
        archive kept) and, as always, applies only to archives this
        installation wrote. Switching a disabled destination back on
        restarts its staleness clock, so it is not reported stale until two
        days after that. 404 `backup_destination_not_found` for an unknown
        id; 400 `backup_destination_invalid` for a retention out of bounds.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBackupDestinationRequest'
      responses:
        "200":
          description: The destination as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestination'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBackupDestination
      summary: Remove a backup destination
      description: >-
        Removes the destination's configuration. Archives already written
        to it are left where they are.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /backup/destinations/{destinationId}/test:
    parameters:
      - $ref: '#/components/parameters/DestinationId'
    post:
      operationId: testBackupDestination
      summary: Test a backup destination
      # Design refs: doc 10 §1
      description: >-
        Writes a small file to the destination, reads it back and deletes it. A
        destination that cannot be reached is a `200` with `success` false and
        the reason; a missing rclone is a `424` `rclone_missing`.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the write, read-back and delete all worked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDestinationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /backup/drill:
    get:
      operationId: getRestoreDrill
      summary: Last restore drill
      # Design refs: doc 10 §1
      description: >-
        The result of the most recent restore drill: whether the newest config
        archive on each enabled backup destination could be fetched, opened the
        way a restore opens it, and verified, and when. `lastRun` is absent
        until a drill has run. 501 `not_configured` when this daemon has no
        backup service. When the next drill is due is in `getSchedules`, under
        the `restore_drill` job.
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The last drill's result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreDrill'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startRestoreDrill
      summary: Run a restore drill now
      description: >-
        Queues a `restore_drill` job (service class), the job the monthly
        schedule queues. It fetches the newest config archive this
        installation wrote to each enabled destination, opens it the way a
        restore would (an encrypted one through its identity sidecar and the
        backup passphrase alone), checks its checksums and that `state.db`
        opens and passes `PRAGMA integrity_check`, and discards everything it
        fetched. It never writes to a destination and never reads the live
        database. A destination that cannot be read, or holds no archive
        written by this installation, fails the drill. The result replaces
        the one `getRestoreDrill` returns, and a failed drill publishes a
        `restore_drill_failed` notification. A drill behind another one queues
        rather than failing.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running restore drill job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate:
    get:
      operationId: getMigration
      summary: The migration session and its report
      # Design refs: doc 05 §6, Q25
      description: >-
        The one migration session: its phase and, once a scan has finished, the
        report as rows. `phase` is `none` before any scan, `scanning` while a
        `migration_scan` job is queued or running, `scanned` once a report
        exists and `scan_failed` when the latest scan did not finish, including
        when its job was cancelled or dropped before it ran (its `scanError`
        says why; the report of an earlier scan, if there was one, is still
        returned). The rows name and count; they never quote a file's content.
        `getMigrationReport` returns the same report as a document.
        `flashDevices` lists the disks a scan can read as the Unraid USB stick
        (`startMigrationDeviceScan`): a FAT filesystem labelled `UNRAID` on a
        disk that is neither the boot disk nor in the array. It is empty, and
        `zipOnly` is true, once the session's report was made from a capture
        that says Unraid booted from an internal device: the Flash Backup zip is
        then the only source. It is empty, with `zipOnly` false, when no such
        disk is attached or this daemon cannot read one. The report's `review`
        holds what the Review step shows as data: the disk mapping table, the
        share preview, the boot mode and the capture's state. It comes from the
        same scan as the rows, which stay as they are, and is absent from a
        report made before it existed.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Migration'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: forgetMigration
      summary: Delete the migration session
      description: >-
        Deletes the session, its report and the uploaded Flash Backup zip,
        which holds secrets (password hashes, SSH host keys, WireGuard and
        rclone config, the licence key, containers' environment). A scan of
        the Unraid USB stick keeps nothing of it: the stick is never written
        and nothing is copied from it. Succeeds
        when there is nothing to delete. Refused with 409 `scan_in_progress`
        while a scan runs, and with 409 `migration_in_progress` while an
        import is pending its point of no return (`startMigrationImport`): the
        scan's baseline is what the adopted disks are verified against.
        `startMigrationImport` with `undo` takes a pending import back, after
        which this succeeds.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "204":
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'

  /migrate/scan:
    post:
      operationId: startMigrationScan
      summary: Scan a Flash Backup zip
      # Design refs: doc 05 §3, Q25, Q24
      description: >-
        Takes the Flash Backup zip and queues a `migration_scan` job (topology
        class, so no storage job runs beside it). The zip is kept in the
        daemon's state directory, readable by root only, as the session's
        source; it is never modified and never extracted: entries are read in
        memory. A scan replaces the previous session's report and zip once it
        finishes. Refused before anything is queued, with nothing kept: 400
        `file_required` (no `file`), 400 `invalid_zip` (not a zip, an entry path
        with `..` or starting with `/`, or a duplicate entry), 413
        `zip_too_large` (a zip over 2 GiB, refused as soon as the request body,
        which is the zip and its multipart framing, passes that size plus 1
        MiB), 400 `invalid_flash_backup` (no usable `config/disk.cfg`) and 400
        `unsupported_layout` (an Unraid version other than 6.12.x or 7.x, or a
        flash layout Hoserva does not recognise, unless `unverifiedLayout` is
        true). 409 `scan_in_progress` while a scan runs, 409
        `migration_in_progress` while an import is pending its point of no
        return (`startMigrationImport`), and 501 `not_configured` when this
        daemon has no migration service. `unverifiedLayout` overrides only the
        layout refusal; the override is recorded in the report and printed at
        its top. The scan reads the disks Hoserva already inventories and SMART
        without waking a disk in standby. It also reads every data disk the
        capture records, through a read-only mount at a private mountpoint under
        the daemon's state directory (XFS without replaying its log), after the
        disk's read-only filesystem check: a disk that fails a check, or is a
        ZFS, encrypted or multi-device btrfs disk, is refused by name in the
        report and the scan goes on with the rest. Each data disk's files are
        listed and a sample hashed, as the baseline the verify phase compares
        against (`fullChecksums` hashes every file). Nothing is written to a
        source disk, and no disk stays mounted when the job ends, whether it
        succeeded, failed or was cancelled. The job reports its progress and can
        be cancelled.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The Flash Backup zip, its root being `/boot`.
                unverifiedLayout:
                  type: boolean
                  # Design refs: Q24
                  description: >-
                    Go ahead although the Unraid version or flash layout is not
                    one Hoserva has been verified against.
                fullChecksums:
                  type: boolean
                  description: >-
                    Hash every file of every data disk for the baseline,
                    instead of every file of 1 MiB or less plus a
                    deterministic sample of the larger ones. It takes much
                    longer.
      responses:
        "200":
          description: The queued `migration_scan` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/scan/device:
    post:
      operationId: startMigrationDeviceScan
      summary: Scan the Unraid USB stick
      # Design refs: doc 05 §3, Q25, Q24
      description: >-
        Instead of the Flash Backup zip, reads Unraid's configuration from the
        USB stick, attached to this machine, and queues a `migration_scan` job.
        `device` must be one of the `flashDevices` `getMigration` offers. The
        stick is mounted read-only (never read-write) at a private mountpoint
        under the daemon's state directory for the one read made here before
        anything is queued and for the job's own read, and is unmounted after
        each; nothing is ever written to it and nothing is copied from it. The
        stick is the user's rollback. Refused before anything is queued: 400
        `invalid_flash_device` (the device is not on offer: not a FAT filesystem
        labelled `UNRAID`, the boot disk, an array disk, or a filesystem UUID
        that another disk shares), 409 `zip_only_source` (the session's capture,
        or the stick's own, says Unraid booted from an internal device, whose
        ZFS boot pool Hoserva does not read; the zip is the only source), 409
        `flash_device_unreadable` (it could not be mounted read-only or
        unmounted, or failed while it was read), 400 `invalid_flash_backup` (no
        usable `config/disk.cfg`) and 400 `unsupported_layout` (as for the zip,
        unless `unverifiedLayout` is true). 409 `scan_in_progress` while a scan
        runs, and 501 `not_configured` when this daemon has no migration service
        or cannot read a flash device. The result is the report the same flash's
        zip gives.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  type: string
                  description: >-
                    The disk's device path, as `flashDevices` lists it
                    (`/dev/sdb`).
                unverifiedLayout:
                  type: boolean
                  # Design refs: Q24
                  description: >-
                    Go ahead although the Unraid version or flash layout is not
                    one Hoserva has been verified against.
                fullChecksums:
                  type: boolean
                  description: >-
                    Hash every file of every data disk for the baseline, as
                    for the zip scan (`startMigrationScan`).
      responses:
        "200":
          description: The queued `migration_scan` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/import:
    post:
      operationId: startMigrationImport
      summary: Adopt the Unraid data disks
      # Design refs: doc 05 §4 steps 14-16, Q21, Q19, Q20, Q23, Q18, doc 05 §4
      # steps 3, 4 and 15, Q11
      description: >-
        Phase C of the migration: queues a `migration_import` job (topology
        class) that adopts the Unraid data disks into the pool at `/mnt/user`
        without formatting them and without writing a byte to them. Each data
        disk is mounted by its own device, never by a filesystem UUID another
        disk may share, with `ro,norecovery` (XFS), `ro,noload` (ext4) or
        `ro,rescue=nologreplay` (btrfs), and the catch-all pool over them is
        read-only, with the share directory structure intact. The former parity
        and cache disks are recorded by identity and are neither formatted,
        mounted nor opened: formatting them is the point of no return. No
        `snapraid.conf` is generated, so no parity engine exists and no sync can
        run. While the import is pending (`getMigration` `phase` is `imported`),
        parity, array-write and topology jobs other than this one's own retry
        are refused with 409 `migration_in_progress`, a scan included, and
        `forgetMigration` is refused with the same code. `roles` is the
        disk-role mapping the user confirmed against the serial table, one entry
        per disk, keyed by `serial` or `wwn`; the `review` of `getMigration`
        proposes a role for each disk the capture names. A cache on a spare
        partition of the boot disk (`listDisks` `cachePartitions`) is keyed by
        that partition's `byId` and `partUuid` instead, with no serial or WWN.
        The mapping is refused with 400 `invalid_import_roles`, before anything
        is queued, unless every role names a disk the scan listed and this
        machine still has; a disk the scan refused, an Unraid boot device or the
        Unraid USB stick has no role but `ignore`; a disk `disks.ini` records as
        parity is never `data`, whatever filesystem it reports, and a disk it
        records as data is never `parity` or `cache`; a weak-identity disk is
        never parity; the disk this machine boots from is never parity or data
        and is the cache only by a spare partition of it; parity is one or two
        disks, each at least as large as the largest data disk; and every data
        disk has a filesystem Hoserva adopts whose UUID is not another data
        disk's; and the layout must be one `snapraid.conf` can be rendered for
        at the point of no return, which is the same check that step makes: the
        content-file copies (the parity disks + 2, on distinct devices) need the
        boot device, a cache that is a device of its own (a cache that is a
        partition of the boot disk is the boot device's copy) and enough data
        disks. A layout that falls short is refused with 400
        `invalid_import_roles`, naming the shortfall and what to add (a data
        disk or a cache device), never left to fail at step 17. The Unraid USB
        stick in any role is refused with 409 `unraid_stick`. Also refused
        before queueing: 409 `confirmation_required` unless `confirm` is true,
        404 `no_migration_report` before a scan, 409 `scan_not_finished` while a
        scan runs or the latest one failed, 409 `migration_no_go` when the
        report's verdict is no-go, 409 `scan_outdated` for a report made before
        the disk table existed, 409 `array_exists` when the array is not a
        pending import's, and 501 `not_configured`. The job reads every data
        disk's identity again and re-runs its read-only filesystem check
        immediately before mounting; a disk that changed since the request, or
        now fails, is refused and nothing is mounted. A failure after the array
        is recorded unmounts what was mounted, deletes the record and leaves no
        pool; a retry of the same mapping applies a recorded import again.
        Nothing is read from the Unraid flash: the import uses the report the
        scan stored.


        With `undo` true the request takes back an import that is pending its
        point of no return instead (`getMigration` `phase` `imported`,
        `verifying`, `verify_failed` or `verified`): it queues a
        `migration_import` job (topology class) that unmounts the read-only pool
        and the adopted data disks, forgets the verify result, deletes the
        recorded array and removes the generated mount units. `roles` is then
        omitted. Nothing is written to any adopted disk, and the former parity
        and cache disks, which the import never touched, are untouched. A mount
        that cannot be released keeps the record and fails the job, so the
        request can be made again. The shares and accounts the import created
        are kept (they hold no data); a new import finds them and leaves them as
        they are. Afterwards the scan's report is still there (`getMigration`
        `phase` `scanned`), `forgetMigration` is no longer refused, and the
        disks can be imported again with a mapping that works. It is the way out
        of an import whose layout the point of no return would refuse. Refused
        before anything is queued with 409 `confirmation_required` unless
        `confirm` is true, 400 `invalid_import_roles` when `roles` is given, and
        409 `no_import_pending` unless an import is pending its point of no
        return: an array that has been through it is never touched. Without
        `undo`, `roles` is required and an empty one is refused with 400
        `invalid_import_roles`.


        Once the disks are adopted the job seeds the scan's shares and accounts,
        and writes nothing to an adopted disk to do it. Each share the scan kept
        is created, its allocation method mapped to a create policy, its Unraid
        cache setting recorded as `migration.targetCacheMode` while the share is
        array-only (no cache exists before the point of no return), its floor as
        `minFreeSpace`, its export and security settings as SMB settings and its
        read and write lists as per-user access for the imported accounts; what
        Hoserva has no equivalent of, such as High-water allocation or a split
        level, is in `migration.notes`. The shares are exported read-only over
        SMB while the import is pending. A share whose name Hoserva does not
        accept (spaces, for instance) is reported in the job's log with the
        reason and never renamed, and the scan's report flags it. Each account
        is created share-only without a password: passwords are never read from
        the flash, and each one is set by the user with `setUserPassword` (the
        job's log lists them). The job is all-or-nothing: a share or account
        that cannot be created undoes the adoption too. A share or account that
        already exists is left as it is.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationImportRequest'
      responses:
        "200":
          description: The queued `migration_import` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/verify:
    post:
      operationId: startMigrationVerify
      summary: Verify the adopted disks against the scan's baseline
      # Design refs: doc 05 §4
      description: >-
        Step 16 of the migration, the last checkpoint before parity is touched:
        queues a `migration_verify` job (topology class, read-only, and admitted
        while the import is pending) that walks every adopted data disk through
        its read-only mount and every share through the read-only pool at
        `/mnt/user`, and compares what it finds with the scan's baseline. For
        each disk and each share it compares the file, symlink and special-file
        counts, the total bytes, every file's size, every symlink's target and
        every special file's type, and it hashes again exactly the files the
        baseline hashed (`fullChecksums` of the scan decides how many that is).
        The expected figures of a share are the union of the disks' baselines: a
        path two disks hold is shown once by the pool, from the first disk, and
        is listed in `duplicates`, never as missing or extra. Any difference,
        and any file or directory that cannot be read, fails the job and leaves
        `getMigration` in `verify_failed` with the result in `verify`; a verify
        can be run again, and a run clears the earlier result when it starts. A
        disk or the pool that the kernel's mount table does not show read-only
        is not read. Nothing is written to a source disk. The result is in
        `getMigration`; the job reports its progress and can be cancelled, which
        leaves a failed result. Refused before anything is queued: 409
        `no_import_pending` unless an import is pending its point of no return
        (`startMigrationImport`), 409 `no_migration_baseline` when the scan
        recorded no baseline, and 501 `not_configured`.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued `migration_verify` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/initialize-parity:
    post:
      operationId: initializeMigrationParity
      summary: Cross the point of no return and initialise parity
      # Design refs: doc 05 §4, Q20, doc 02 §2, Q26, doc 02 §1
      description: >-
        Step 17 of the migration, the point of no return and the first step that
        writes to a disk of the old array: queues a `migration_parity` job
        (topology class) that formats the former Unraid parity disk(s) XFS and
        the cache (a whole disk, a spare partition of the boot disk, or
        partition 4 of an Unraid boot + data device and never the rest of that
        disk), records them as the array's own, mounts the data disks
        read-write, generates `snapraid.conf` with its content files placed on
        separate devices, applies what the import deferred (each share's cache
        mode and its top-level directory's setgid mode and group), wires the
        parity engine so sync, scrub and fix are available without a restart,
        and queues the initial `sync` as an ordinary sync job, which runs
        through the threshold guard like every other. The data disks are never
        formatted. Until the sync completes the array has no redundancy at all:
        `getMigration` `parityInit` states that window and what rollback means
        for this session's boot mode and layout, and the user is shown them
        before this is called.


        `confirmation` must be the exact string `getMigration`
        `parityInit.confirmation` gives: it names every device that will be
        erased, in the style of the array setup's own typed confirmation. A
        wrong or missing string is refused with 409 `confirmation_required` and
        nothing is formatted. Refused before anything is queued with 409
        `verify_required` unless the latest verify of the adopted array passed
        (`startMigrationVerify`) and no import has run since, with 409
        `no_import_pending` unless an import is pending its point of no return
        (or an initialisation is unfinished), and with 400
        `invalid_import_roles` when a disk the import recorded is gone, was
        swapped or may not be erased (a cache that is a partition of an Unraid
        boot device is refused unless the capture says the boot pool is not a
        mirrored pair, and whenever a second Unraid boot device is attached),
        and with 409 `pool_below_min_free_space` when no adopted data disk has
        the catch-all pool's `minfreespace` free: once the disks are writable
        mergerfs would answer ENOSPC to every directory the job makes through
        `/mnt/user`, after the former parity disk and the cache were erased. The
        gate reads each data disk's free space once and the error names the
        floor and the disk with the most room; make room on a data disk (in
        Unraid, or by undoing the import) and import again. The job resolves
        every disk again from a fresh inventory by identity immediately before
        the first format and refuses, erasing nothing, when one is not the disk
        that was confirmed. A failure before the first format leaves the
        migration pending, with the adopted disks mounted read-only again. A
        failure after the formatted disks are recorded leaves the migration in
        `initializing`: running this again with the `parityInit.confirmation` of
        that phase finishes it and formats nothing. Parity, array-write and
        topology jobs other than this one are refused with 409
        `migration_in_progress` until it finishes.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationInitializeParityRequest'
      responses:
        "200":
          description: The queued `migration_parity` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/report:
    get:
      operationId: getMigrationReport
      summary: Download the go / no-go report
      description: >-
        The latest scan's report as a Markdown document: the verdict, then
        every check with its status, subject and detail. 404
        `no_migration_report` before a scan has finished.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The report document.
          content:
            text/markdown:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /migrate/templates:
    get:
      operationId: listMigrationTemplates
      summary: The template conversion preview
      # Design refs: doc 05 §3 and §6, doc 04 §5
      description: >-
        What the scan's conversion of the Flash Backup's Docker templates found:
        every template with its class and how it converted, every Compose
        Manager project, and the counts the report shows. The scan converts each
        template in memory with the converter `convertUnraidTemplate` runs,
        passing it the Docker networks of the Phase A capture, so a custom
        network's `docker network create` command is exact when the capture
        holds that network. Nothing is created, written under
        `/var/lib/hoserva/stacks/` or started. The session keeps only each
        template's outcome (its status and warning classes), never its content,
        so this answers without the zip; `getMigrationTemplate` builds a preview
        on request. `counts` cover the templates that had a container on the
        source server (autostart, running and stopped) and, without the
        capture's container list, every template (`allTemplates`); a
        template-only template is converted and previewable but is in
        `templateOnly` and not in the clean or warning counts. A Compose Manager
        project is previewed with its own `compose.yaml`, counted in
        `composeProjects` and never converted. 404 `no_migration_report` before
        a scan has finished, and 404 `no_template_preview` for a report made
        before scans converted templates (scan again).
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The templates and projects with the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationTemplates'
        default:
          $ref: '#/components/responses/Error'

  /migrate/templates/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: >-
          A template's file name as `listMigrationTemplates` shows it
          (`my-notes.xml`), which is unique where the container's name may
          not be, or a Compose Manager project's name.
    get:
      operationId: getMigrationTemplate
      summary: One template's conversion preview
      description: >-
        The preview of one template or Compose Manager project from the
        latest scan, built when it is asked for by converting the template
        again from the Flash Backup zip the session keeps in the daemon's
        state directory, with the Docker networks of the Phase A capture; the
        session itself keeps no template content. It holds the source as the
        flash holds it, the generated Compose
        (the project's own `compose.yaml` for a project), every warning,
        including the writable-layer warning every converted template
        carries and any host path into another `/mnt/<pool>`, and the
        privileges the Compose content asks for. The source and the Compose
        hold the template's environment, secrets included, which is why
        this is an admin operation and the report's rows never quote them. A
        template the converter could not read has `status` `failed` and an
        `error`, and no Compose. 404 `template_not_found` for a name the
        report does not list or a Compose Manager project whose
        `compose.yaml` is not in the source, `no_migration_report` before a
        scan has finished and `no_template_preview` for a report made before scans
        converted templates. 409 `template_source_unavailable` when the zip
        is not kept: it was removed, or the report was made from the Unraid
        USB stick, which nothing is copied from. A preview is never
        answered from a copy kept after the zip is gone.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationTemplatePreview'
        default:
          $ref: '#/components/responses/Error'

  /migrate/containers:
    get:
      operationId: listMigrationContainers
      summary: What the migration's Phase D can create, and what it has created
      # Design refs: doc 05 §4 steps 19 and 20
      description: >-
        Phase D's container steps as data, from the latest scan. `templates` are
        every template of the scan grouped by `class` in the order the groups
        are shown (`autostart` in Unraid's own autostart order, then `running`,
        `stopped`, `template_only` and `unknown`); only a creatable template on
        Unraid's autostart list whose stack does not exist yet is `preselected`,
        so with no capture (class `unknown`) nothing is. Every one can still be
        selected. `composeProjects` are the Compose Manager projects, offered
        with their own `compose.yaml`; `byHand` are the containers created with
        `docker run` and their image, which nothing is generated for: they are
        recreated by hand. The preview of each (the generated Compose, every
        warning including the writable-layer warning) is `getMigrationTemplate`,
        and should be read before `createMigrationStacks`. `stacks` are the
        stacks `createMigrationStacks` created, in the order they are offered
        for starting (Unraid's autostart order first), each with its `state`;
        `awaiting` names the started stack that must be confirmed or stopped
        before another is started, and `next` the first stack not started yet; a
        stack that was started, stopped and never confirmed is offered as `next`
        only when none of those is left. `parityInitialized` is false until the
        migration is past its point of no return (`initializeMigrationParity`);
        the operations that create or start something refuse until then. This
        reads no disk. 404 `no_migration_report` before a scan has finished and
        404 `no_template_preview` for a report made before scans converted
        templates.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationContainers'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createMigrationStacks
      summary: Create stopped Compose stacks from the scan's templates and projects
      # Design refs: doc 05 §4, Q36
      description: >-
        Step 19 of the migration: creates a Compose stack, stopped, through the
        stack layer (`createStack`) for each selected template or Compose
        Manager project of the scan, from the generated Compose the preview
        showed (`getMigrationTemplate`), or the project's own `compose.yaml`.
        Nothing is started and nothing is written outside the stacks directory.
        A stack is named after the template's `<Name>` (or the project's name),
        lowercased with every character a stack name may not hold turned into
        `-`.


        Refused as a whole, before any stack is created: 409
        `parity_not_initialized` until the migration is past its point of no
        return (the initialisation has finished: an array exists and no import
        is pending or part-way through step 17); 400 `invalid_selection` for an
        empty selection, a name given twice or two selections that would create
        one stack name; 404 `template_not_found`, `no_migration_report` or
        `no_template_preview`; 409 `template_source_unavailable` when the Flash
        Backup zip is not kept; 409 `template_unconvertible` for a template the
        converter could not read; and 409 `warnings_not_acknowledged` for a
        template whose conversion has warnings that need manual action unless
        its selection says `acknowledged`. After that each stack is created on
        its own and the answer has one result per selection, in the order they
        are made (Unraid's autostart order first): a stack that could not be
        created says why in `error`, with the code `createStack` gives
        (`stack_exists`, `invalid_stack`, ...), and the stacks before it stay
        created and recorded. A selection whose stack already exists from this
        migration is `already_created`, so the same request can be sent again:
        that includes a stack this request made for the selection whose record
        was never written (the daemon stopped between the two), which is
        recorded now and never made again or deleted. A stack of that name the
        migration did not make is `stack_exists`.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationStacksRequest'
      responses:
        "200":
          description: One result per selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStacksCreated'
        default:
          $ref: '#/components/responses/Error'

  /migrate/containers/{name}/start:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: A stack `listMigrationContainers` shows in `stacks`.
    post:
      operationId: startMigrationContainer
      summary: Start one migrated stack
      # Design refs: doc 05 §4
      description: >-
        Step 20 of the migration: queues the `stack_start` job (`startStack`)
        for a stack `createMigrationStacks` created, and records that it was
        started: the start is recorded before the job is queued, so a start that
        cannot be recorded queues nothing, and a start that is queued and whose
        job is then not recorded leaves the stack recorded as started with no
        job. Containers are started one at a time: this is refused with 409
        `container_unconfirmed` while another migrated stack that was started is
        neither confirmed (`confirmMigrationContainer`) nor stopped, which
        includes one whose start job is still running or whose containers are
        running, and one recorded as started with no job. When the state of
        another started stack cannot be read (its start job or its containers),
        nothing is queued and the read failure is returned as it is, not as
        `container_unconfirmed`: 503 `docker_unavailable` when the Docker Engine
        cannot be reached, 500 otherwise. A failure to record the start is a
        500. Refused before anything is queued with 409 `parity_not_initialized`
        until the migration is past its point of no return, 404
        `migrated_stack_not_found` for a name the migration did not create, 409
        `container_confirmed` for a stack already confirmed, 404
        `stack_not_found` when the stack was removed since, and 409
        `array_stopped` or 503 `array_state_unknown` as `startStack` answers.
        The stack's `waitSeconds` is what Unraid's autostart list waited after
        starting it, as a suggestion. Run `checkMigrationContainer` once the job
        has succeeded.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued `stack_start` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /migrate/containers/{name}/check:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: A stack `listMigrationContainers` shows in `stacks`.
    post:
      operationId: checkMigrationContainer
      summary: Check that a started stack's containers see their data
      # Design refs: doc 05 §4
      description: >-
        The data check of step 20: for each bind mount of the stack's containers
        whose host path is under `/mnt/user` or `/mnt/cache`, whether the path
        exists and is not empty. A directory counts as empty when it holds no
        entry, a file when it has no byte; a path that cannot be read is
        `unreadable`, never `ok`. It reads one directory entry of each path
        (which can spin a disk up), when asked and never on a timer, and records
        that a check ran since the latest start, which
        `confirmMigrationContainer` needs. A stack with no bind mount under
        those paths has nothing to check and is `allOk`. Refused with 409
        `container_not_started` for a stack that was not started, 409
        `no_container` while the stack has no container (its start has not
        created one), 409 `parity_not_initialized` and 404
        `migrated_stack_not_found` as `startMigrationContainer` does.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: What the stack's containers see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationContainerCheck'
        default:
          $ref: '#/components/responses/Error'

  /migrate/containers/{name}/confirm:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: A stack `listMigrationContainers` shows in `stacks`.
    post:
      operationId: confirmMigrationContainer
      summary: Confirm a started stack sees its data
      description: >-
        Records that the user read the data check and the started stack sees its
        data, which offers the next stack. Refused with 409
        `container_not_started` for a stack that was not started, 409
        `data_check_required` until `checkMigrationContainer` has run since the
        latest start, 409 `data_check_failed` when that check found a path that
        is missing, empty or unreadable unless `acceptFailedCheck` is true
        (a container whose data directory is meant to be empty), and 409
        `container_not_running` when none of the stack's containers is running
        (stop the container instead, to go on without it). Confirming a
        confirmed stack changes nothing. 409 `parity_not_initialized` and 404
        `migrated_stack_not_found` as `startMigrationContainer` does.
      tags: [migrate]
      x-hoserva-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationContainerConfirmRequest'
      responses:
        "200":
          description: The stack, confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationContainerStack'
        default:
          $ref: '#/components/responses/Error'

  /migrate/checklist:
    get:
      operationId: getMigrationChecklist
      summary: The post-migration checklist
      # Design refs: doc 05 §4 steps 18 and 21 to 25, Q83
      description: >-
        Phase D's closing steps as a checklist, each item's state taken from a
        record where one exists, so it cannot say something was done when it was
        not. The migration counts as finished exactly when the array record
        carries the time the point of no return finished
        (`initializeMigrationParity`), which is written in the same statement
        that ends it and by nothing else: `finished` is true and `finishedAt` is
        that time. A migration that is pending, part-way through its point of no
        return, or was undone has none, and so has an array created by hand or
        one that finished before this record existed; then `finished` is false,
        `finishedAt` is absent and `items` is empty: the checklist does not
        apply. `getMigration` keeps no "complete" phase.


        `appdata_cache` is done by a succeeded `share_relocation` job for the
        `appdata` share to the cache (`startShareRelocation`), and
        `not_applicable` when the scan read the capture's disk roles and the
        source had no cache. `initial_sync` is done by the first succeeded
        `sync` that is not a dry run and was created after `finishedAt`.
        `full_scrub` is done by a succeeded `scrub` with `percent` 100 and
        `allBlocks` true that started after that sync ended, and stays `todo`
        until the initial sync is done. A scrub without `allBlocks` skips blocks
        synced within the last days, so it checks nothing right after a sync and
        never counts. `notifications` is done once an enabled channel's test
        (`sendTestNotification`) has succeeded in a later second than the one
        the channel last changed in; the Unraid notification agents the scan
        found are named so the user knows what to recreate, and no secret is
        carried over. `schedules` is done once the nightly chain's `mover`,
        `sync` and `scrub` steps are all enabled
        (`updateMaintenanceChainSchedule`); it offers the values the scan read
        from Unraid: its mover schedule as the mover schedule, its parity-check
        schedule as the scrub schedule (a non-correcting check maps to a scrub
        that only reports) and its spin-down delay as the default. Unraid's
        parity is updated as files are written, so there is no Unraid sync
        schedule to carry over: nothing is offered for `sync` and the user
        chooses one.


        `user_scripts` and `restore_drill` have no record to derive from and are
        done by `acknowledgeMigrationChecklistItem`: the first lists the User
        Scripts the scan found, by name and schedule (a script is never executed
        or translated); the second shows the latest succeeded `fix` job that had
        a `path`, which an acknowledgement records. Only those two are ever
        `acknowledgeable`. The checklist needs no scan: without a report the
        offers, the agents and the scripts are empty.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationChecklist'
        default:
          $ref: '#/components/responses/Error'

  /migrate/checklist/{item}/acknowledge:
    parameters:
      - name: item
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationChecklistItemId'
    post:
      operationId: acknowledgeMigrationChecklistItem
      summary: Acknowledge a checklist item no record can show
      description: >-
        Records that the user did `user_scripts` (worked through the scan's
        inventory) or `restore_drill` (deleted a file and recovered it with
        `hoserva fix --path`), with who made the acknowledgement and when; the
        restore drill's also records the latest succeeded `fix` job that had a
        `path`, when there is one. It is kept in the database and outlives `forgetMigration`.
        Refused with 409 `migration_not_finished` while the checklist does
        not apply (`getMigrationChecklist` answers `finished` false), and with 409 `checklist_item_has_record` for every
        other item, whose state comes from a record and is never set by hand.
        Acknowledging an acknowledged item changes nothing: the first
        acknowledgement is kept. Returns the item as it stands.
      tags: [migrate]
      x-hoserva-role: admin
      responses:
        "200":
          description: The item, acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationChecklistItem'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup:
    get:
      operationId: getAppdataBackup
      summary: Appdata backup policy
      # Design refs: doc 10 §2
      description: >-
        Every container with a bind-mounted directory inside the appdata
        location (the cache disk's `appdata` directory), each with whether the
        backup stops it while its directory is copied and whether it is in the
        backup at all. A container the operator has not configured is stopped
        and included. A known database image that is not stopped carries
        `warning`: copying a database's files while it runs can produce an
        archive that does not restore. 501 `not_configured` when this daemon has
        no Docker Engine client, and 503 when the Engine is not reachable.
      tags: [backup]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The containers in scope and their policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataBackupConfig'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startAppdataBackup
      summary: Start an appdata backup
      description: >-
        Queues an `appdata_backup` job (service class): every container that
        is running and set to be stopped is stopped, each included
        container's appdata directories are archived, one archive per
        container, on the same device as the appdata location, the stopped
        containers are started again in reverse order, and only then are the
        archives verified and written to the enabled backup destinations
        (never the boot device's default destination, which is too small for
        appdata). `containers` limits the run to the named containers; omit
        it for every included one. Refused with 409 `array_stopped` while the
        array is stopped or its storage is not ready — with the cache disk
        unmounted the appdata directories are empty — and 404
        `container_not_found` for a name that is not in scope. A run that
        fails publishes an `appdata_backup_failed` notification.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppdataBackupRequest'
      responses:
        "200":
          description: The queued or running appdata backup job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/containers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
        description: The container's name.
    put:
      operationId: setAppdataBackupContainer
      summary: Set a container's appdata backup policy
      description: >-
        Replaces the container's policy. Opting a known database image out
        of being stopped is allowed, and the response carries `warning`
        saying why that is a bad idea. 404 `container_not_found` for a name
        with no appdata directory in scope.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppdataBackupContainerRequest'
      responses:
        "200":
          description: The container with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataBackupContainer'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/archives:
    get:
      operationId: listAppdataArchives
      summary: List appdata archives
      description: >-
        The appdata archives this installation wrote to each enabled backup
        destination, newest first, optionally for one container. It lists the
        destinations when asked — a remote destination is reached through
        rclone — and a destination that could not be listed is reported in
        `unavailable` instead of being read as having no archives.
      tags: [backup]
      x-hoserva-role: admin
      parameters:
        - name: container
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: The archives found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppdataArchivesOK'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore:
    post:
      operationId: restoreAppdata
      summary: Restore one container's appdata
      description: >-
        Queues an `appdata_restore` job (service class). The archive is
        fetched, decrypted and verified before anything is changed. Then the
        container is stopped if it is running, a snapshot of its current
        appdata is written to the enabled backup destinations, and only when
        that snapshot is written is the appdata replaced by the archive's
        content; if the snapshot cannot be written the live appdata is not
        touched. The container is started again afterwards. Requires
        `confirm: true`: the restore overwrites the container's appdata
        (400 `confirmation_required` otherwise). 404 `archive_not_found` for
        an archive the named destination does not hold, and 409
        `array_stopped` while the array is stopped or its storage is not
        ready.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreAppdataRequest'
      responses:
        "200":
          description: The queued or running appdata restore job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore/preview:
    post:
      operationId: previewAppdataRestore
      summary: Preview restoring one container's appdata
      description: >-
        Queues an `appdata_restore_preview` job (service class, scoped to the
        container) that reports what `restoreAppdata` would overwrite for the
        same archive on the same destination, before anything is changed.
        Read the result with `getAppdataRestorePreview` once the job has
        succeeded. The job fetches, decrypts and verifies the archive
        exactly as the restore does and fails with the restore's own error
        when the archive is corrupt, is another container's, names a
        directory outside the appdata location, or holds entries a restore
        could not unpack. It
        then compares each archived directory with the live one, walking the
        live appdata only for this job: files present in both are
        `replaced`, files only in the archive are `added`, and files only in
        the live appdata are `removed`, because the restore replaces each
        directory as a whole. It stops no container, writes nothing under the
        appdata location and leaves no fetched archive on disk, on success or
        failure. It queues behind a backup or restore of the same container
        and runs beside those of others. Cancelling it stops the fetch, the
        reading of the archive and the walk of the live directories; the
        decryption and the verification read that follow the fetch run to
        their end first. 404 `archive_not_found` for an archive the named
        destination does not hold, 404 `backup_destination_not_found`, 400
        `appdata_archive_invalid` for a request that names no archive of
        this installation and container, and 409 `array_stopped` while the
        array is stopped or its storage is not ready.
      tags: [backup]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewAppdataRestoreRequest'
      responses:
        "200":
          description: The queued or running preview job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /appdata/backup/restore/preview/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getAppdataRestorePreview
      summary: Get a restore preview
      description: >-
        The result of the `appdata_restore_preview` job `previewAppdataRestore`
        queued. The daemon holds the sixteen most recent results in memory, so
        a result is gone after a restart and after sixteen newer previews:
        preview again. 404 `job_not_found` for an id that is not a restore
        preview job, 409 `appdata_preview_not_ready` while the job is queued
        or running, 409 `appdata_preview_failed` when it failed, was
        cancelled or was interrupted (the message says why; `getJob` and
        `getJobLog` have the rest), and 404 `appdata_preview_gone` when the
        job succeeded but its result is no longer held.
      tags: [backup]
      x-hoserva-role: admin
      responses:
        "200":
          description: What restoring the archive would overwrite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppdataRestorePreview'
        default:
          $ref: '#/components/responses/Error'

  /doctor:
    get:
      operationId: runDoctor
      summary: Run prerequisite checks
      # Design refs: doc 01 §3, Q76
      description: >-
        Docker, mergerfs, SnapRAID, mounts, parity freshness, SMART, free space
        and permission sanity (`hoserva doctor`), plus existing host
        configuration (Samba shares, NFS exports, fstab mounts, Docker
        containers and images) for onboarding.
      tags: [doctor]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Plain-language check results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        default:
          $ref: '#/components/responses/Error'

  /doctor/host-config:
    post:
      operationId: applyHostConfig
      summary: Apply onboarding choices for existing host configuration
      # Design refs: Q76, doc 01 §2, Q62
      description: >-
        Each detected Samba file, NFS exports file, fstab, Docker containers
        list and images list is imported into the database or left unmanaged
        under the drift model. Existing host files are never overwritten unless
        the caller chose import. Docker's data-root stays at `/var/lib/docker`
        when containers or images exist, or when there is no cache disk.
      tags: [doctor]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyHostConfigRequest'
      responses:
        "200":
          description: Applied choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyHostConfigResult'
        default:
          $ref: '#/components/responses/Error'

  /apps:
    get:
      operationId: listApps
      summary: List containers
      # Design refs: doc 04 §2, doc 04 §3
      description: >-
        Every container the Docker Engine reports, managed and unmanaged alike.
        A container an installed stack started carries that stack's name in
        `stack`; one no stack manages has none. The daemon decides which, so the
        request fails when the stacks cannot be read rather than reporting every
        container as unmanaged. available is false, with no error, whenever
        Docker itself is not reachable.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Container inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppsOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/convert:
    post:
      operationId: convertUnraidTemplate
      summary: Convert an Unraid XML template to Compose
      # Design refs: doc 04 §5
      description: >-
        Converts one Unraid container template to a Compose file for review.
        Nothing is created, written or run: the result is the generated
        `compose` beside the `source` XML as it was sent, every warning, and the
        privilege summary computed from the generated Compose content, so the
        caller reads all of it before it acts on any of it. Every part of the
        template that is not translated is reported, never dropped: an
        `<ExtraParams>` flag outside the translate table is listed in a comment
        at the top of the service and as an `untranslated_flag` warning; a host
        path outside the pool and the cache (`/boot`, `/mnt/disks/`,
        `/mnt/user0`, another pool) is kept as written and listed as a
        `flagged_path` warning; a custom network the template names is a
        `missing_network` warning carrying the `docker network create` command,
        with placeholders for what the template does not say; two entries for
        the same target with different values are a `conflict`; the possibility
        of state inside the source container that no template expresses is
        always a `writable_layer` warning. `clean` is true when no warning is of
        the classes that need manual action (`writable_layer` and `note` never
        count against it). A body that is not an Unraid container template is
        refused with 400 `invalid_unraid_template`.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnraidConvertRequest'
      responses:
        "200":
          description: The generated Compose and what needs review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnraidConversion'
        default:
          $ref: '#/components/responses/Error'

  /apps/images:
    get:
      operationId: listAppImages
      summary: List images
      description: Every image the Docker Engine holds locally.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Image inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppImagesOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/networks:
    get:
      operationId: listDockerNetworks
      summary: List Docker networks
      # Design refs: Q37, doc 03 §5.4, doc 04 §3
      description: >-
        Every network the Docker Engine holds, sorted by name: the built-in
        `bridge`, `host` and `none` and the networks the user created (macvlan
        and ipvlan included). The install wizard offers the existing ones as
        network modes; Hoserva never creates a network. `available` is false,
        with no error, whenever Docker itself is not reachable, and then
        `networks` is empty without meaning there are none: a caller that needs
        the list must treat it as unknown. Any other failure to read the list is
        an error, never an empty list.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: Network inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDockerNetworksOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/updates:
    get:
      operationId: listAppUpdates
      summary: Container update status
      # Design refs: doc 04 §6, Q81
      description: >-
        What the daily registry check last found for each container's image: a
        new build of the same tag (`new_build`) is reported apart from a newer
        version tag (`new_version`, named by `availableTag`). The check asks
        each registry for manifests and tag names only, never a pull. `skipped`
        means the registry was rate limiting requests and is asked again at the
        next check, `failed` that the check could not tell (including a registry
        whose saved credential cannot be used or was refused: it is never asked
        anonymously instead), and `not_checked` that no check has reached the
        image yet or that it could not look: the registry wants a login and no
        credential is saved for it (`putRegistryCredential`) or the container is
        pinned to an image digest, so there is no tag to update. The `message`
        says which. None of them means up to date. available is false, with no
        error, whenever Docker itself is not reachable.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: One entry per container, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppUpdatesOK'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: startAppUpdates
      summary: Update several containers
      description: >-
        Queues one `container_update` job (service class) that updates the
        named containers one after another, each as `updateApp` does: an
        appdata snapshot first when its appdata sits on the cache disk, then
        the update, keeping the image it ran before for a revert. One
        container's failure does not stop the others; the job fails, naming
        each, once they have all been tried, and a container that failed is
        left on its previous image. With no `containers`, the targets are
        the containers the last update check found a newer image for, minus
        those that opted out of bulk updates (`setAppUpdatePolicy`); those
        come back in `skipped`. Naming a container updates it whether or not
        it opted out. When there is nothing to update no job is queued and
        `job` is absent. Refused with 409 `array_stopped` while the array is
        stopped (maintenance mode) or its storage is not ready, and with 503
        `array_state_unknown` if the array's state cannot be read; no job is
        queued. An unknown container is 404 and queues nothing.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAppUpdatesRequest'
      responses:
        "200":
          description: The queued job and what was left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAppUpdatesOK'
        default:
          $ref: '#/components/responses/Error'

  /apps/updates/history:
    get:
      operationId: listAppUpdateHistory
      summary: Container updates that can be reverted
      description: >-
        Every update Hoserva made that kept the image the container ran
        before it, newest first: when it was made, the previous image, the
        appdata snapshot taken just before it (absent for a container with
        no appdata on the cache disk) and until when the previous image is
        kept (`keepUntil`, set by `imageKeepDays` in the app settings).
        `revertible` says whether `revertApp` would go ahead now: only the
        newest update of a container can be reverted, once, within the keep
        period and while the previous image is still held and the container
        still runs the image it was updated to. A snapshot that has gone
        from its destination only shows when the revert is tried. available
        is false, with no error, whenever Docker itself is not reachable.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The recorded updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppUpdateHistoryOK'
        default:
          $ref: '#/components/responses/Error'

  /registry-credentials:
    get:
      operationId: listRegistryCredentials
      summary: List the registries that have a saved credential
      # Design refs: doc 04 §6, Q81
      description: >-
        The registry hosts the daily update check has a credential for, sorted,
        as image references name them (`docker.io`, `ghcr.io`,
        `registry.example.com:5000`). A credential is never returned: only the
        host is. A host listed here whose credential was cleared by a restore
        without the backup passphrase makes the update check report its images
        as `failed` until `putRegistryCredential` saves it again.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The registry hosts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialList'
        default:
          $ref: '#/components/responses/Error'

  /registry-credentials/{registry}:
    parameters:
      - name: registry
        in: path
        required: true
        schema:
          type: string
        description: >-
          The registry host as an image reference names it, with its port if
          it has one: `ghcr.io`, `registry.example.com:5000`. `index.docker.io`
          and `registry-1.docker.io` are `docker.io`.
    put:
      operationId: putRegistryCredential
      summary: Save a registry's credential
      # Design refs: Q28
      description: >-
        Saves the username and password the update check logs in to this
        registry with, replacing any it already has, sealed under the machine
        key. The password is write-only: no operation returns it and it is never
        logged. The credential is sent only to this registry's own host (and,
        for Docker Hub, its token service `auth.docker.io`), only over https,
        and never follows a redirect to another host or scheme; a registry whose
        address would send it in plain HTTP, or whose token service is on
        another host, is not logged in to and its images are reported `failed`.
        It is carried in a config archive's `secrets.age`, so a restore with the
        backup passphrase brings it back; without it the credential is cleared
        and the restore report names it. A host that is not a registry host
        name, or an empty username or password, a username with a colon, or a
        value with control characters is 400 `invalid_registry_credential`.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRegistryCredentialRequest'
      responses:
        "204":
          description: The credential was saved.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteRegistryCredential
      summary: Delete a registry's credential
      description: >-
        Deletes the credential saved for this registry; the update check asks
        it anonymously again. A registry with none is 404
        `registry_credential_not_found`.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "204":
          description: The credential was deleted.
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getApp
      summary: Inspect a container
      # Design refs: doc 04 §3
      description: >-
        One container's current state, health, image, tag, ports and mounts, and
        the stack that manages it, if any.
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeApp
      summary: Remove a container
      description: >-
        Removes a stopped container (`app_running`, 409, for one that is
        not stopped). The container's appdata is kept unless
        `deleteAppdata` is explicitly true: then the bind-mount
        directories strictly inside the appdata location (the cache
        disk's `appdata` directory) are deleted, together with the
        container's anonymous volumes. Anything outside that location, the
        location itself, and any directory another container mounts, or
        that lies inside a directory of appdata another container mounts,
        is never deleted — a request that would delete one is refused
        (`appdata_shared`, 409) and removes nothing. `deleteAppdata` with no appdata location is refused
        (`appdata_unavailable`, 409). `deleteAppdata` is refused with 409
        `array_stopped` while the array is stopped (maintenance mode) or its
        storage is not ready, because the cache disk is not mounted and the
        appdata on it could not be deleted, and with 503
        `array_state_unknown` if the array's state cannot be read. A remove
        that keeps appdata is allowed on a stopped array. Every refusal
        happens before the container is removed.
      tags: [apps]
      x-hoserva-role: admin
      parameters:
        - name: deleteAppdata
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Also delete the container's appdata. Never implied by anything
            else; absent means false.
      responses:
        "200":
          description: The container was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAppResult'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: startApp
      summary: Start a container
      description: >-
        Starts the container and returns its state afterwards, and
        publishes a `container_state` event. Managed and unmanaged
        containers alike. Refused with 409 `array_stopped`, before the
        Engine is called, while the array is stopped (maintenance mode) or
        its storage is not ready: a container started then would write
        onto the boot device under `/mnt/user` and `/mnt/cache`. If the
        array's state cannot be read the start is refused too, with 503
        `array_state_unknown`.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after starting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: stopApp
      summary: Stop a container
      description: >-
        Stops the container (the Engine's own grace period, then a kill)
        and returns its state afterwards, and publishes a
        `container_state` event.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after stopping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/restart:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: restartApp
      summary: Restart a container
      description: >-
        Restarts the container and returns its state afterwards, and
        publishes a `container_state` event. Refused with 409
        `array_stopped`, before the Engine is called, while the array is
        stopped (maintenance mode) or its storage is not ready, and with
        503 `array_state_unknown` if the array's state cannot be read —
        the same refusal as `startApp`.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The container after restarting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/recreate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: recreateApp
      summary: Recreate a container
      description: >-
        Queues a `container_recreate` job (service class): it pulls the
        container's image again and replaces the container with one built
        from the same configuration, volumes and networks. If the pull or
        the creation of the replacement fails, or the replacement does not
        start, the original container is left as it was — same name and
        volumes, running again if it was running. A container started with
        `--rm` cannot be recreated: the Engine deletes it the moment it
        stops, so the job fails before changing anything. Refused with 409
        `array_stopped` while the array is stopped (maintenance mode) or
        its storage is not ready, and with 503 `array_state_unknown` if
        the array's state cannot be read; no job is queued. The job checks
        again when it runs and fails, changing nothing, if the array has
        stopped since.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/update:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: updateApp
      summary: Update a container
      description: >-
        Queues a `container_update` job (service class) that updates the
        container. The job pulls the container's image again first, which
        changes nothing about the container: a failed pull, or one that
        finds nothing newer, ends the job with no snapshot taken and the
        container left alone. Otherwise, when its appdata sits on the cache
        disk, a snapshot of it is written (a `pre-update` archive on the
        appdata backup's destinations) and the update does not go ahead if
        that snapshot cannot be written; then the container is replaced by
        one built from the pulled image with the same configuration, volumes
        and networks, as `recreateApp` does, and the image it ran before is
        kept locally for `imageKeepDays`. If any step after the pull fails,
        the container is left on its previous image, with the image tag the
        pull moved pointed back at it and the update's record removed, so
        nothing is left to revert. A container pinned to an image digest
        cannot be updated. Refused with 409 `array_stopped`
        while the array is stopped (maintenance mode) or its storage is not
        ready, and with 503 `array_state_unknown` if the array's state
        cannot be read; no job is queued. The job checks again when it runs.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    post:
      operationId: revertApp
      summary: Revert a container's last update
      description: >-
        Queues a `container_update` job (service class) that puts the
        container back on the image it ran before its latest update and
        restores the appdata snapshot taken just before it. A running
        container is stopped first, so it never runs the updated image
        against the restored data; the snapshot is restored, writing a
        snapshot of the appdata it replaces (`pre-restore`), so anything
        written since the update is kept in an archive; the container is
        recreated from the kept image without pulling; then it is started,
        once, on the previous image. A container that was stopped stays
        stopped. A revert deletes nothing from the pool. Refused with 409
        `nothing_to_revert` when the container has no update to revert (see
        `listAppUpdateHistory`), with 409 `revert_unavailable` when the
        update is on record but can no longer be undone (the previous image
        was removed, its keep period ended, or the snapshot is gone from its
        destination), and with 409 `array_stopped` / 503
        `array_state_unknown` while the array is stopped or unreadable; no
        job is queued and nothing is changed. If the job fails after it has
        stopped the container, the container is left stopped, because the
        restore may already have replaced its data and the updated image must
        not run against that; reverting again finishes it, while the
        snapshot is still on its destination, after which the container is
        started by hand.
      tags: [apps]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/update-policy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    put:
      operationId: setAppUpdatePolicy
      summary: Include or exclude a container from bulk updates
      description: >-
        Sets whether `startAppUpdates` with no named containers skips this
        container. The policy is kept by container name. It does not stop
        the container being updated by name.
      tags: [apps]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppUpdatePolicyRequest'
      responses:
        "200":
          description: The container's policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpdatePolicy'
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getAppLogs
      summary: Read a container's logs
      description: >-
        The container's stdout and stderr as plain text: the last `tail`
        lines, then, with `follow` true, every new line as it is written
        until the client disconnects or the container exits (each line is
        flushed as it arrives).
      tags: [apps]
      x-hoserva-role: admin
      parameters:
        - name: tail
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 10000
            default: 200
          description: How many trailing lines to start from.
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The container's log text.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /apps/{id}/stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The container's Engine ID or name.
    get:
      operationId: getAppStats
      summary: Read a container's resource use
      description: >-
        CPU, memory, network and block I/O for a running container
        (`app_not_running`, 409, for one that is not running — a stopped
        container is never reported as using nothing).
      tags: [apps]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The container's current resource use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStats'
        default:
          $ref: '#/components/responses/Error'

  /stacks:
    get:
      operationId: listStacks
      summary: List Compose stacks
      description: >-
        Every stack Hoserva has a row for, sorted by name. A stack's
        `.env` is never returned: it holds generated secrets.
      tags: [stacks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The stacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStacksOK'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createStack
      summary: Create a Compose stack
      # Design refs: D4
      description: >-
        Stores the stack's row (`.env` sealed under the machine key) and
        generates `docker-compose.yml`, `.env` and `meta.json` into the
        directory named after the stack, then checks the result with `docker
        compose config`. Nothing is started. Refused with 409 `stack_exists`
        when a stack of that name exists. A directory of that name already under
        the stacks directory (what a removed stack's own files left behind) is
        used as it is, and only the three generated files are written into it;
        it is refused with 409 `stack_dir_exists` when it holds a
        `docker-compose.yml`, which is never overwritten. A name that is not 1
        to 63 lowercase letters, digits, `-` or `_`, starting with a letter or
        digit, is refused with 400 `invalid_stack_name` before anything is
        touched. A Compose file that `docker compose config` rejects is refused
        with 400 `invalid_stack`, and leaves no row and no generated file
        behind. A `.env` that defines one of the variables Docker needs from the
        daemon's environment (`PATH`, `HOME`, `XDG_RUNTIME_DIR`, `DOCKER_HOST`,
        `DOCKER_CONTEXT`, `DOCKER_CONFIG`, `DOCKER_CERT_PATH`,
        `DOCKER_TLS_VERIFY`) is refused with 400 `invalid_stack_env` before
        anything is stored or written, so Docker always runs with the daemon's
        own values for them.
      tags: [stacks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStackRequest'
      responses:
        "200":
          description: The created stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        default:
          $ref: '#/components/responses/Error'

  /stacks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The stack's name.
    get:
      operationId: getStack
      summary: Get a Compose stack
      description: >-
        One stack's row with its stored `docker-compose.yml` text in
        `compose`, and `manuallyEdited`. Its `.env` is never returned: it
        holds generated secrets.
      tags: [stacks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateStack
      summary: Edit a Compose stack's file
      description: >-
        Replaces the stack's `docker-compose.yml` text. The text is first
        checked with `docker compose config` against a copy of the stack's
        own `.env`, in a temporary directory, before anything is stored or
        written: a file that is empty or that `docker compose config`
        rejects is refused with 400 `invalid_stack`, carrying the compiler's
        message, and leaves the row and every file as they were. With
        `dryRun` a valid file is answered with `applied` false and the
        stored stack, and nothing is changed. Otherwise the row is updated
        (the new text, and `manuallyEdited` set so a template form never
        silently overwrites it) and the stack's `docker-compose.yml` is
        regenerated from it; if writing the file fails the row is put back
        as it was. Nothing is restarted: `startStack` makes the edit take
        effect. A stack whose `.env` cannot be opened (a restore without the
        backup passphrase) cannot be checked and is refused. An unknown
        stack is refused with 404 `stack_not_found` and a name that is not
        a valid stack name with 400 `invalid_stack_name`.
      tags: [stacks]
      x-hoserva-role: admin
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Only validate the text and report the result; store and write
            nothing. Absent means false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStackRequest'
      responses:
        "200":
          description: The text is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStackResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeStack
      summary: Remove a Compose stack
      description: >-
        Runs `docker compose down` for the stack (its containers and
        networks are removed; named volumes are kept), deletes its generated
        `docker-compose.yml`, `.env` and `meta.json`, and then its row; the
        stack's directory goes too if nothing else is in it, so the name
        can be used again and a file the stack keeps there stays. Taking
        the stack down does not need its `.env`. `docker compose down`
        removes every container and network of the stack's Compose project
        name, and with `--volumes` its named volumes, whichever file or
        directory they were started from. So before docker runs, every
        container of that project must be one Compose started from the
        stack's own directory: a project of the same name that something
        else runs (a hand-run `~/immich/compose.yml` is project `immich`) is
        refused with 409 `stack_project_shared`, whether or not the stack
        has its `.env` and whether or not appdata is deleted. Since that
        cannot be checked otherwise, a remove is also refused, as any
        docker failure is, when the project's containers cannot be listed
        (503 `docker_unavailable` when Docker is not reachable). Appdata is
        deleted only when `deleteAppdata` is explicitly true: then the
        stack's named volumes are removed with `docker compose down
        --volumes`, each bind-mount directory of the stack's containers
        that lies strictly inside an appdata location (the cache disk's
        `appdata` directory) and is used by no other container is deleted,
        and so is the stack's whole directory, before the row. Nothing is
        deleted if one of the stack's containers is still there after
        `docker compose down`. That needs the array running, like a
        container remove that deletes appdata: refused with 409
        `array_stopped` (or 503 `array_state_unknown`) before anything is
        changed, with 409 `appdata_unavailable` when no appdata location
        is known, and with 409 `appdata_shared` when a directory is used
        by another container or another container binds a place inside the
        stack's directory. A name that is not a valid stack name is
        refused with 400 `invalid_stack_name` before anything is touched.
        A `docker compose down` that fails, or a directory that cannot be
        deleted, leaves the row in place so the remove can be retried.
      tags: [stacks]
      x-hoserva-role: admin
      parameters:
        - name: deleteAppdata
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Also delete the stack's appdata (its named volumes and the
            bind-mount directories inside the appdata location that no
            other container uses) and its whole directory. Never implied by
            anything else; absent means false.
      responses:
        "200":
          description: The stack was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveStackResult'
        default:
          $ref: '#/components/responses/Error'

  /stacks/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The stack's name.
    get:
      operationId: getStackConfig
      summary: Read an installed stack's template inputs
      description: >-
        The inputs of the template a stack was installed from, with the
        value each has now. The inputs are read from the `x-hoserva` block of
        the stack's stored `docker-compose.yml` text, so the catalog is not
        needed and a stack whose Compose file was edited by hand is read as it
        runs (`manuallyEdited` says so), and the values from the stack's
        `.env`. A secret is never returned: `set` says whether the `.env`
        gives it a value. A `device` input is `readOnly`: its device mapping
        is part of the Compose file, which the form never writes. A `path`
        input that is not appdata lists the existing shares' paths as
        suggestions, as `previewTemplateInstall` does. A stack whose Compose
        file has no `x-hoserva` block (one made with `createStack` without a
        template) is refused with 409 `stack_has_no_template`; one whose
        block is not valid with 422 `template_invalid`; an unknown stack
        with 404 `stack_not_found` and a name that is not a valid stack name
        with 400 `invalid_stack_name`. A stack whose `.env` cannot be opened
        (a restore without the backup passphrase) is a plain failure.
      tags: [stacks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The stack's inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackConfig'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateStackConfig
      summary: Change an installed stack's template inputs
      description: >-
        Changes the values of some of the stack's template inputs. Every
        value is checked with the rules `previewTemplateInstall` uses, before
        anything is stored: a value that does not fit its kind, a path that
        is not absolute, a `string` input emptied that is not optional, or a
        `device` input given a different value (its mapping is in the
        Compose file, so it is changed there) is refused with 400
        `invalid_template_input`, whose `details.input` names the input; a `port` input changed to a port that a
        container publishes or is configured to publish, that another
        stack's Compose file publishes, or that the host listens on, is
        refused with 409 `no_free_port` and is never moved to another port
        (the stack's own ports are not taken); a `.env` that would define a
        variable Docker takes from the daemon's environment is refused
        with 400 `invalid_stack_env`. A refusal changes nothing. Otherwise
        the new `.env` is sealed into the stack's row and the stack's `.env`
        file is regenerated from it: only the lines of the inputs that
        changed are rewritten and every other line is kept. If writing the
        file fails the row is put back as it was. `docker-compose.yml` is
        never regenerated from the template, so a manual edit of it stays,
        and nothing is restarted: `startStack` makes the change take effect.
        An input without an entry keeps its value. An empty entry takes the
        input's default, as in an install, and so clears an optional
        `string` input. A secret with no entry or an empty one keeps the
        sealed value; a non-empty one replaces it; one named in `generate`
        gets a newly generated value (48 hexadecimal characters), and naming
        one that is not a secret, or that also has a value, is refused with
        400 `invalid_template_input`. The answer is `getStackConfig`'s, with
        the values as they are now. The other errors of `getStackConfig`
        apply; 503 `docker_unavailable` is answered only when a port was
        changed, since the check needs Docker.
      tags: [stacks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStackConfigRequest'
      responses:
        "200":
          description: The stack's inputs after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackConfig'
        default:
          $ref: '#/components/responses/Error'

  /stacks/{name}/template-update:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The stack's name.
    get:
      operationId: getStackTemplateUpdate
      summary: Check whether a stack's template has a newer revision
      description: >-
        Compares the template revision the stack was installed from (its
        `stacks` row) with the revision the stack's own source lists now, and
        never changes the stack, its files or its row: a catalog update is only
        ever offered, and applying it is the user's action. `update_available`
        carries `diff`, a unified diff from the stack's stored
        `docker-compose.yml` to the newer revision's `compose.yaml`, and the
        source's badge (`sourceKind`, `signed`). A stack that was edited by
        hand is marked with `manuallyEdited` and its diff is against the
        edited file, never as if it were the pristine install. The other
        statuses carry no diff: `up_to_date` (the source lists the installed
        revision or an older one), `not_from_template` (the stack records no
        template or no revision number), `source_removed` (the source the
        stack was installed from is no longer one of the sources) and
        `template_removed` (the source no longer lists the template). A
        catalog that cannot be read is an error (503 `catalog_unavailable`),
        never `up_to_date`. A GPU device a template install added to the
        stack's Compose file shows in the diff as removed lines. An unknown
        stack is 404 `stack_not_found`; a name that is not a valid stack
        name is 400 `invalid_stack_name`.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackTemplateUpdate'
        default:
          $ref: '#/components/responses/Error'

  /stacks/{name}/start:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The stack's name.
    post:
      operationId: startStack
      summary: Start or recreate a Compose stack
      description: >-
        Queues a `stack_start` job (service class, scoped to the stack) that
        runs `docker compose up --detach` for the stack: its services are
        created if they do not exist and recreated only where their
        definition changed, so an edit saved by `updateStack` takes effect.
        Missing generated files are written from the stack's row first.
        Refused with 409 `array_stopped` while the array is stopped
        (maintenance mode) or its storage is not ready, and with 503
        `array_state_unknown` if the array's state cannot be read; no job is
        queued. The job checks again when it runs. An unknown stack is
        refused with 404 `stack_not_found` and an invalid name with 400
        `invalid_stack_name`.
      tags: [stacks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /catalog:
    get:
      operationId: listCatalog
      summary: List the catalog's templates
      # Design refs: doc 04 §7
      description: >-
        The templates of the catalog installed on disk, read from its
        `index.json` and never waiting on the network, with the catalog's
        `serial` and `generatedAt`, which are the curated catalog's. The curated
        catalog's entries come first, then those of each user-added source
        (`listCatalogSources`) in the order the sources were added; a template
        id a source earlier in that order already lists is never supplied by a
        later one, so a user-added entry cannot shadow a curated one. Every
        entry names the `source` it came from (`hoserva` for the curated
        catalog, a source id for a user-added source) and carries that source's
        badge as data: `sourceKind` and `signed`. An entry of an unsigned source
        has `signed` false. Every entry says whether a stack of that template id
        already exists (`installed`, from the `stacks` table). Entries are in
        that order. Search, filters and paging are the caller's. `lastCheckedAt`
        and `lastOutcome` report the most recent catalog check
        (`refreshCatalog`) since the daemon started, and are absent before any
        check has run. A catalog that is not installed or whose `index.json`
        cannot be read is refused with 503 `catalog_unavailable`, never answered
        with an empty list. With `checkOnOpen` on (`getCatalogSettings`), a call
        made when the last check is older than 15 minutes, or when none has run
        since the daemon started, also starts one catalog check in the
        background, never a second while one is running. The answer is the
        on-disk copy as it is now; the finished check is announced as a
        `catalog` event on `/api/v1/events`.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogList'
        default:
          $ref: '#/components/responses/Error'

  /settings/catalog:
    get:
      operationId: getCatalogSettings
      summary: Get the catalog refresh settings
      # Design refs: doc 04 §7, Q65
      description: >-
        How the catalog checks for updates by itself: the background
        `refreshInterval` and whether opening the catalog starts a check
        (`checkOnOpen`). Every install starts at `24h` and on.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current catalog refresh settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateCatalogSettings
      summary: Set the catalog refresh settings
      description: >-
        Sets either or both settings; a field left out stays as it is. An
        interval other than `off`, `1h`, `6h`, `12h` or `24h` is refused with
        400. With the interval `off` and
        `checkOnOpen` off, nothing reaches the catalog host except
        `refreshCatalog`. The background check applies a changed interval
        without a daemon restart.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogSettingsUpdate'
      responses:
        "200":
          description: The settings now saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSettings'
        default:
          $ref: '#/components/responses/Error'

  /catalog/refresh:
    post:
      operationId: refreshCatalog
      summary: Check for catalog updates now
      # Design refs: doc 04 §7, Q65
      description: >-
        Runs one conditional request for the latest signed catalog from the
        catalog host and returns how it ended. It is an explicit user action, so
        it runs even when automatic refresh is off. An unchanged catalog answers
        `304` and downloads nothing (`unchanged`). A newer archive replaces the
        installed catalog only if its signature verifies against the compiled-in
        catalog key and its serial is strictly higher (`updated`, with the
        number of new and of updated templates, compared by id and revision
        against the catalog it replaced). Any other outcome keeps the installed
        catalog untouched and is `failed`, with a `reason` code and a `message`;
        a failed verification (`bad_signature`, `not_newer`, `bad_archive`) also
        raises a `catalog_check_failed` notification, and a network failure does
        not. A check that fails is still a completed check, answered 200. Calls
        made while a check is running share that check's request and result. A
        signature that does not verify makes the check fetch the archive and its
        signature once more before it reports `bad_signature`, because the two
        files are cached separately and can briefly disagree while a catalog is
        being published. Every finished check, whoever started it, is announced
        as a `catalog` event on `/api/v1/events`. Nothing is fetched from
        `api.github.com`.
      tags: [templates]
      x-hoserva-role: admin
      responses:
        "200":
          description: The check's outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRefresh'
        default:
          $ref: '#/components/responses/Error'

  /catalog-sources:
    get:
      operationId: listCatalogSources
      summary: List the catalog sources
      # Design refs: doc 04 §4, §7
      description: >-
        The curated catalog (`hoserva`, `kind` `curated`, always first) and
        every source URL the user added (`kind` `user_added`) in the order they
        were added. `signed` is true only for a source whose installed archive
        passed a signature check: always for the curated catalog, and for a
        user-added source only when it was added with a public key. `serial` is
        the installed catalog's serial and is absent when it cannot be read.
        `lastRefreshedAt` is the last time the source's archive was installed or
        confirmed unchanged, and is absent before the first.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSourceList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addCatalogSource
      summary: Add a catalog source
      # Design refs: doc 04 §4
      description: >-
        Adds a catalog source URL of the user's own: the archive
        `catalog.tar.zst` is fetched from beneath `url` in the same format as
        the curated catalog and installed, and only then is the source recorded,
        so a source that cannot be fetched or verified leaves nothing behind.
        Hoserva contacts the URL only because the user added it, and only again
        when the user refreshes it. The URL must be an `https` address with no
        credentials, query or fragment (400 `invalid_catalog_source` otherwise,
        before anything is fetched), a redirect must stay on the same host, and
        the archive is size-capped as the curated one is. With a `publicKey`
        (PEM, or the base64 of the raw 32-byte Ed25519 key) the archive's
        detached signature `catalog.tar.zst.sig` is required and must verify
        against that key, and the source is `signed`. With no `publicKey` the
        source is accepted unsigned: no signature is requested and every entry
        it supplies is badged `signed` false. A template of an unsigned source
        still goes through the same privilege summary and warnings at install.
        Refused with 409 `catalog_source_exists` when a source with that URL
        (the curated one included) exists, 502 `catalog_source_unreachable` when
        the archive could not be fetched, and 422 `catalog_source_rejected` when
        the archive was fetched but refused (a signature that does not verify, a
        malformed archive).
      tags: [templates]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCatalogSourceRequest'
      responses:
        "200":
          description: The source that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSource'
        default:
          $ref: '#/components/responses/Error'

  /catalog-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The source's id, as listed by `listCatalogSources`.
    delete:
      operationId: removeCatalogSource
      summary: Remove a catalog source
      description: >-
        Removes one user-added source: its on-disk copy and its record, and
        nothing of any other source. Stacks already installed from it are not
        touched: their Compose files and rows stay as they are, and they only
        report `source_removed` from `getStackTemplateUpdate`. The curated
        catalog cannot be removed: 409 `catalog_source_curated`. An unknown
        id is 404 `catalog_source_not_found`. A removal that fails part way
        leaves a source the next call finishes removing.
      tags: [templates]
      x-hoserva-role: admin
      responses:
        "204":
          description: The source was removed.
        default:
          $ref: '#/components/responses/Error'

  /catalog-sources/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The source's id, as listed by `listCatalogSources`.
    post:
      operationId: refreshCatalogSource
      summary: Check a catalog source for updates now
      description: >-
        Runs one check of the source and returns how it ended, as
        `refreshCatalog` does for the curated catalog (the curated id runs
        that same check). A user-added source is only ever fetched when it is
        added or refreshed here, never by the background interval. A newer
        archive replaces the source's copy only if it verifies the way the
        source was added (against its public key, or well-formed for an
        unsigned source) and its serial is strictly higher. Any other
        outcome keeps the installed copy and everything recorded about the
        source, and is `failed` with a `reason` and a `message` (200). A
        remembered rejection never carries over from one source to another.
        An unknown id is 404 `catalog_source_not_found`.
      tags: [templates]
      x-hoserva-role: admin
      responses:
        "200":
          description: The check's outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRefresh'
        default:
          $ref: '#/components/responses/Error'

  /catalog/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    get:
      operationId: getCatalogTemplate
      summary: Show one catalog template
      description: >-
        The template's metadata, its `compose.yaml` text as the catalog holds
        it, and its privilege summary: what its Compose content asks for
        beyond an ordinary container, computed with each input's default
        (a secret, which has none, with a generated-shaped value) and never
        from anything the template declares. An unknown template is refused
        with 404 `template_not_found`; an entry that fails the template rules
        with 422 `template_invalid`, as `previewTemplateInstall` does. The
        template's source and its badge (`sourceKind`, `signed`) come with
        it; the privilege summary is the same for an unsigned source's
        template as for a curated one, because an unsigned template can ask
        for any privilege.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTemplate'
        default:
          $ref: '#/components/responses/Error'

  /catalog/{id}/icon:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    get:
      operationId: getCatalogTemplateIcon
      summary: Get a catalog template's icon
      description: >-
        The icon file the template names, with a content type from an
        allow-list (SVG, PNG, WebP or JPEG) chosen by the file's extension,
        never by its content. A template that names no icon has none to
        serve: 404 `template_icon_not_found`, and the web UI shows its
        placeholder. A file that is not a plain file inside the
        template's own directory (a symlink, however it points), has another
        extension, or is larger than 1 MiB is not served: 404
        `template_icon_not_found`. An unknown template is 404
        `template_not_found`. The response forbids content sniffing and
        scripts, styles and subresources beyond the image itself, so an SVG
        cannot run code when it is opened directly.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The icon.
          headers:
            Content-Security-Policy:
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              schema:
                type: string
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /catalog/{id}/screenshots/{index}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 7
        description: >-
          The screenshot's position in the template's list, from 0 to
          `screenshotCount` of `getCatalogTemplate` minus one.
    get:
      operationId: getCatalogTemplateScreenshot
      summary: Get one of a catalog template's screenshots
      description: >-
        The screenshot at that position of the template's `screenshots` list,
        with a content type from an allow-list (PNG, WebP or JPEG) chosen by
        the file's extension, never by its content. It is addressed by
        position, so no file path ever appears in a request. A file that is
        not a plain file inside the template's own directory (a symlink in
        the path or as the file, however it points), has another extension,
        or is larger than 4 MiB is not served, and neither is a position past
        the end of the list: 404 `template_screenshot_not_found`. An unknown
        template is 404 `template_not_found`. The response forbids content
        sniffing and anything but the image itself.
      tags: [templates]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The screenshot.
          headers:
            Content-Security-Policy:
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /templates/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    post:
      operationId: previewTemplateInstall
      summary: Preview installing a catalog template
      description: >-
        Resolves the template's inputs the way an install would, without
        creating a stack or writing any file of the template: paths default to the template's own
        default or, with none, to the existing share of the input's role
        (`/mnt/user/<role>`) and list the existing shares as suggestions;
        a port that a container publishes or is configured to publish,
        running or stopped, that an existing stack's Compose file publishes
        (resolved with its `.env`, whether or not the stack was started), or
        that the host listens on resolves to the next free port above it,
        with the port asked for in `requestedValue`; a timezone with no value takes the host's; a
        `device` input with role `gpu` lists the host's render devices
        (`/dev/dri/renderD*`) as suggestions. A secret is never given a
        value here: it is marked `generated` and is generated by the
        install. The privilege summary is computed from the Compose content
        with these values substituted — privileged mode, host networking,
        the host PID or cgroup namespace, device cgroup rules, added
        capabilities, disabled or replaced confinement, extra groups, the
        Docker socket and host paths outside the pool and cache (the cache
        itself and Docker's data-root on it count as outside) — never from
        anything the template declares. `compose` is the file an install
        would write. A path input with no value, no default and no existing
        share to default to, a port input with neither value nor default, and
        a `string` input with no value and no default are listed with
        `required: true` and an `error`, so a form shows every field and
        `installTemplate` refuses them (a `string` input the template marks
        `optional` may be left empty and is written to `.env` with an empty
        value). An input that is not the template's or a value that does not
        fit its kind is refused with 400 `invalid_template_input`, and so is
        a setting that does not fit (`networkMode`, `cpus`, `memoryMiB`,
        `extraParams`); the error's `details.input` names the input or setting
        it is about. The container settings of the request (`networkMode`,
        `restart`, `cpus`, `memoryMiB`, `extraParams`) are written into
        `compose`, and `warnings` lists what they could not carry out; a name
        that is not a valid
        stack name with 400 `invalid_stack_name`; an unknown template with
        404 `template_not_found`; a catalog entry that fails the template
        rules with 422 `template_invalid` (an input is written to the
        stack's `.env` under its name, so one named `PATH`, `HOME`,
        `XDG_RUNTIME_DIR`, `DOCKER_HOST`, `DOCKER_CONTEXT`, `DOCKER_CONFIG`,
        `DOCKER_CERT_PATH` or `DOCKER_TLS_VERIFY`, which Docker takes from
        the daemon's environment, fails them); a GPU the host cannot give to a
        container (no `render` group) with 409 `gpu_unavailable`; no free
        port above a conflicting one with 409 `no_free_port`, and the same
        code, never moving the port, for a host port `extraParams` publishes
        that is taken; Docker not
        reachable, which the port check needs, with 503 `docker_unavailable`.
        The check also reads the ports of every existing stack with `docker
        compose config`; a stack whose ports cannot be read refuses the
        request (`stack_action_failed`) instead of the port being assumed
        free. Reading a stack's ports also regenerates, from the stack's
        row, any of its `docker-compose.yml`, `.env` or `meta.json` that is
        missing from its directory; a file that exists is never changed,
        and a stack removed meanwhile is skipped. `installTemplate` does the
        same.
      tags: [templates]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInstallRequest'
      responses:
        "200":
          description: What an install would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInstallPlan'
        default:
          $ref: '#/components/responses/Error'

  /templates/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The template's id.
    post:
      operationId: installTemplate
      summary: Install a catalog template as a stack
      description: >-
        Resolves the inputs exactly as `previewTemplateInstall` does, and
        generates each secret that has no value of its own (48 hexadecimal
        characters). A port that is taken is moved to the next free port
        and reported in the result's `requestedValue`, never refused. Taken
        means what `previewTemplateInstall` lists, including the ports of
        stacks installed earlier that were never started, so two installs in
        a row are given different ports; installs run one at a time. Reading
        the ports of existing stacks regenerates their missing generated
        files from their rows, as `previewTemplateInstall` describes. A port
        that something other than Hoserva takes after the install is not
        checked. Then
        it creates the stack as `createStack` does: the stack's row
        records the template's source, id and revision, and
        `docker-compose.yml` (the template with its `x-hoserva` block kept,
        plus the `/dev/dri` device and the host's `render` group for a GPU
        that was chosen), `.env` (every input; secrets only here) and
        `meta.json` are generated and checked with `docker compose config`.
        Nothing is started. The result carries the privilege summary, so a
        template that asks for privileged mode, the Docker socket or any
        other kind `previewTemplateInstall` lists is reported with its
        install. The stack errors of `createStack`
        apply (409 `stack_exists`, 409 `stack_dir_exists`, 400
        `invalid_stack`), as do those of `previewTemplateInstall`. An input
        that needs a value and has none is refused with 400
        `invalid_template_input` whose `details.input` names it, and a
        `networkMode` that names a network that does not exist with 409
        `network_missing` (the message holds the `docker network create`
        command); nothing is written in either case.
      tags: [templates]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInstallRequest'
      responses:
        "200":
          description: The installed stack and what it was installed with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInstallResult'
        default:
          $ref: '#/components/responses/Error'

  /users:
    get:
      operationId: listUsers
      summary: List accounts
      # Design refs: Q27, doc 03 §7
      description: >-
        Every account, sorted by username.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Create an account
      # Design refs: Q27
      description: >-
        Defaults to the share-only role when omitted: a new account has no UI
        login until an admin promotes it. No password is set by this call —
        setUserPassword provisions the UI credential and the Samba account
        together, in a separate action. Never creates an admin account
        (users_one_admin_idx allows exactly one, created only by
        createFirstAdmin).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUser
      summary: Change an account's role
      # Design refs: Q27
      description: >-
        Viewer or share-only only — the sole admin account is never reachable
        through this operation.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: >-
        Removes the account, its sessions, its group memberships and its
        per-share permissions. Refuses the sole admin account.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Account deleted.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: setUserPassword
      summary: Set an account's password
      # Design refs: Q27, doc 03 §7, Q78
      description: >-
        Writes the UI credential hash and the Samba passdb entry together: if
        the Samba write fails, the UI credential is rolled back to its previous
        value, and nothing is left updated on only one side. This is the
        ordinary admin-driven password action on `/users` — distinct from
        resetUserPassword, which is root-only recovery for a locked-out account
        over the Unix socket and never touches the Samba passdb.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
      responses:
        "204":
          description: Password set on both the UI credential and the Samba account.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserSharePermissions
      summary: Get one account's per-share access
      # Design refs: Q27, doc 03 §7
      description: >-
        Every share this account has an explicit access level for. A share with
        no row here is not represented — none of the three levels is assumed.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This account's per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUserSharePermissions
      summary: Replace one account's per-share access
      # Design refs: doc 03 §7
      description: >-
        A full replace: the account's access is set to exactly the shares and
        levels listed, and every share this account previously had an explicit
        level for but that is missing from the request loses its row entirely
        (access is editable from either the share or the user; this is the
        user-side editor).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSharePermissionsRequest'
      responses:
        "200":
          description: This account's updated per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /user-groups:
    get:
      operationId: listUserGroups
      summary: List user groups
      # Design refs: Q27, doc 03 §7
      description: >-
        Every user group, sorted by name.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every user group.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUserGroup
      summary: Create a user group
      # Design refs: Q27, doc 03 §7, Q26
      description: >-
        A named collection of accounts, purely for bulk share-permission
        assignment — distinct from the fixed `users` system group (GID 100) that
        every share's files belong to.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserGroupRequest'
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    delete:
      operationId: deleteUserGroup
      summary: Delete a user group
      description: Also removes its memberships and its per-share permissions.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Group deleted.
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    put:
      operationId: setUserGroupMembers
      summary: Replace a user group's membership
      description: A full replace of the group's member list.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserGroupMembersRequest'
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      # Design refs: doc 03 §7
      description: >-
        Every session across every account, with revoke.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every active session.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: >-
        Ends this session immediately, server-side — the same effect as
        that session's own logout, forced by an admin.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/tokens:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: createApiToken
      summary: Create a personal API token
      # Design refs: Q43, doc 01 §7, Q27
      description: >-
        A personal API token, scoped to admin or viewer, for scripting and the
        remote CLI over TCP. The raw token is returned only here, once — only
        its SHA-256 is ever stored afterward, mirroring how a session cookie is
        handled. Refused for a share-only account (share-only has no API access
        at all), and refused when role exceeds the account's own role: a token
        can narrow an account's access (an admin can hand out a viewer-scoped
        token to reduce a script's own blast radius), never widen it.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        "201":
          description: The new token, with its raw value shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens:
    get:
      operationId: listApiTokens
      summary: List personal API tokens
      # Design refs: doc 03 §7
      description: >-
        Every account's tokens, most recently created first.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every personal API token.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenSummary'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/ApiTokenId'
    delete:
      operationId: revokeApiToken
      summary: Revoke a personal API token
      description: >-
        Ends this token immediately — the request it would have
        authenticated next is refused the moment this returns, since
        every request looks the token up fresh (no caching).
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Token revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      # Design refs: Q78
      description: >-
        Root-only over the Unix socket. Checked against the peer's uid 0
        specifically — the `hoserva` group and TCP are refused. Audit-logged and
        announced through every notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        "204":
          description: Password reset.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/disable-totp:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: disableUserTotp
      summary: Disable a user's TOTP
      # Design refs: Q78
      description: >-
        Root-only over the Unix socket. Checked against the peer's uid 0
        specifically. Audit-logged and announced through every notification
        channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: TOTP disabled.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/unlock:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: unlockUser
      summary: Clear login lockout
      # Design refs: doc 01 §7, Q78
      description: >-
        Clears the account's login rate-limiter lockout. Root-only over the Unix
        socket, checked against the peer's uid 0 specifically. Audit-logged like
        the other recovery commands.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: Lockout cleared.
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9:_-]*$'

    EventType:
      name: eventType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationEventType'

    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ApiTokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ShareName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ShareName'

    ExternalLabel:
      name: label
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExternalDiskLabel'

  responses:
    Error:
      # Design refs: doc 01 §5
      description: An error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hoserva_session
      description: Web UI session, issued at login over TCP.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: personal-api-token
      # Design refs: Q43
      description: >-
        Personal API token, scoped to a role (admin/viewer). For scripts and the
        remote CLI over TCP.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          # Design refs: #22, Q27
          description: >-
            A stable, machine-readable identifier, e.g. `job_not_found`. Every
            auth-related operation can also return one of: `setup_required` (409
            — no admin account exists yet; every operation but
            getSetupStatus/createFirstAdmin refuses with this while it's true),
            `setup_complete` (409, createFirstAdmin — an admin account already
            exists), `rate_limited` (429 — the account or source address is
            currently locked out after repeated failures; `message` gives a
            retry-after), `too_busy` (503 — the bounded password-hashing worker
            pool is saturated; safe to retry shortly), `invalid_credentials`
            (401, login — an unknown username or wrong password, deliberately
            indistinguishable), `totp_required` (401, login — the account has
            TOTP enrolled and no code was supplied), `totp_invalid` (401, login
            and confirmTotp — a code was supplied but is wrong, expired or
            already used; a missing login code is `totp_required` instead, never
            this), `totp_reverify_required` (403, enrollTotp — TOTP is already
            active and the caller didn't prove they still hold the account: no
            password or code was supplied, or the one supplied was wrong; 403
            rather than 401 since the session itself is valid, only the
            reverification is missing or failed), `totp_reverify_ambiguous`
            (400, enrollTotp — TOTP is already active and *both* the current
            password and a current TOTP code were supplied; supply exactly one),
            `totp_not_pending` (409, confirmTotp — no pending secret to
            confirm), `unauthorized` (401 — no credential, or one that no longer
            validates), `forbidden` (403 — a valid credential whose role doesn't
            satisfy the operation), `no_session` (404 — the Unix socket's
            peer-credential-trusted local access has no signed-in user for an
            operation that needs one), `request_too_large` (413 — the request
            body exceeded the server's size limit), `bad_request` (400 — the
            request body could not be decoded), `not_found` (404 — no such API
            route), `api_token_not_found` (404, revokeApiToken — no token with
            that id), `invalid_token_role` (400, createApiToken — the requested
            role is neither admin nor viewer; share-only is never a valid token
            role), `share_only_no_api_token` (403, createApiToken — the target
            account has SMB/NFS access only and no API access at all) and
            `token_role_exceeds_account` (403, createApiToken — the requested
            role is wider than the target account's own role; a token can only
            narrow an account's access, never widen it).
        message:
          type: string
          description: A human-readable explanation, safe to show in the UI or CLI.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which field failed validation.

    UserRole:
      type: string
      # Design refs: Q27
      # Implementation: RoleViewer and RoleAdmin never satisfy a share-only
      # requirement.
      description: >-
        Admin (full UI), viewer (read-only UI), or share-only (SMB/NFS only, no
        UI login at all — the default for a new account). A share-only account
        can still sign in with this role on a session that predates a role
        change; every operation but the public ones refuses it, and login itself
        refuses a share-only account outright.
      enum: [admin, viewer, share-only]

    User:
      type: object
      required: [id, username, role, totpEnrolled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.

    SetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    CreateFirstAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totpCode:
          type: string
          maxLength: 16
          description: Required once the account has TOTP enrolled; omitted otherwise.

    TotpEnrollRequest:
      type: object
      # Design refs: doc 01 §7
      description: >-
        Both fields are optional for a first enrolment. Once TOTP is already
        active on the account, exactly one must prove the caller still holds it
        — the current password, or a current TOTP code — or enrollTotp is
        refused; supplying both is refused too.
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    TotpEnrollResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret (RFC 6238), for manual entry.
        otpauthUri:
          type: string
          # Design refs: doc 03 §1
          description: >-
            An otpauth:// URI, for the enrolment QR code.

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    JobType:
      type: string
      # Design refs: doc 01 §4
      description: >-
        Every job type, each belonging to one of the mutually exclusive job
        classes.
      enum:
        # Parity
        - sync
        - scrub
        - fix
        - check
        # Array-write
        - rebalance
        - evacuation
        - share_relocation
        - mover
        - vm_disk_relocation
        # Topology
        - disk_format
        - disk_add
        - disk_remove
        - disk_replace
        - disk_upgrade_data
        - disk_upgrade_parity
        - pool_remount
        - migration_scan
        - migration_import
        - migration_verify
        - migration_parity
        # Service
        - appdata_backup
        - appdata_restore
        - appdata_restore_preview
        - restore_drill
        - config_backup
        - container_update
        - container_recreate
        - stack_start
        - acme_issue
        # VM
        - vm_start
        - vm_stop
        - vm_create
        - vm_delete
        - vm_snapshot
        - vm_clone
        - vm_migration_import

    JobClass:
      type: string
      # Design refs: doc 01 §4
      description: >-
        The mutually exclusive job class the scheduler enforces.
      enum: [parity, array_write, topology, service, vm]

    JobStatus:
      type: string
      # Design refs: doc 01 §4
      description: >-
        `interrupted` is set on an in-flight job by a daemon restart and is
        never cleared automatically — resuming or re-running it is always an
        explicit user action.
      enum: [queued, running, interrupted, succeeded, failed, cancelled]

    Job:
      type: object
      required:
        - id
        - type
        - class
        - status
        - resumable
        - cancellable
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 100
          description: Null when the job type or tool reports no meaningful percentage.
        resumable:
          type: boolean
          # Design refs: Q29
          description: >-
            Whether this job type persists a checkpoint to resume from.
        cancellable:
          type: boolean
          description: Whether the underlying tool honestly supports cancelling this job.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: "null"

    DiskState:
      type: string
      # Design refs: #388, Q21, #398, Q13
      description: >-
        `wrong_filesystem` is `PoolDiskEntry`-only: a disk matched to an array
        slot by identity (serial or WWN) whose filesystem UUID does not match
        what SQLite recorded for that slot — a replacement disk that kept the
        original disk's serial/WWN (a cloned or reused drive) but was formatted
        differently, or not at all. Distinct from `missing`: the disk is
        genuinely present, so the pool's own slot list must say so rather than
        report it `active`. The storage gate treats it exactly like a missing
        disk (not ready, no mount attempted for that slot) and never emits it on
        `DiskStateEvent`, since it is not a spindown state.


        `mount_failed` is also `PoolDiskEntry`-only, and covers the case
        `wrong_filesystem` deliberately does not: a disk matched to a slot by
        identity whose filesystem UUID was never positively read at all — most
        commonly a genuinely blank same-serial replacement — so the storage
        gate's own identity/FSUUID check reports the array ready for it, but
        hoservad's own bounded attempt to mount that slot's disk still failed or
        timed out. Never derived from a device probe on this state's own read
        path — it reflects the daemon's last actual mount attempt, recorded when
        it happened. The web/CLI Replace disk flow offers this slot's own device
        as its only replacement target, the same way it does for
        `wrong_filesystem`; the replace job's own one-off probe of that exact
        device is what actually confirms it is blank before formatting it. Never
        emitted on `DiskStateEvent`, since it is not a spindown state.
      enum: [active, standby, spinning_up, missing, failed, wrong_filesystem, mount_failed]

    DiskRemovalState:
      type: string
      # Design refs: doc 09 §4, #359, #358
      # doc 09 §4: evacuating is step 2, evacuated precedes steps 7-9, unpooled
      # is step 7 and unlisted is step 8.
      description: >-
        The disk-removal state machine: `evacuating` from before an evacuation's
        first copy until its post-check passes — every pool mount marks this
        disk no-create for the whole time; `evacuated` once that copy and
        post-check finish, but the disk is still in every mergerfs branch list,
        SnapRAID layout and mount table (still no-create); `unpooled` once
        `finishDiskRemoval`'s job has taken it out of every pool mount — still
        in snapraid.conf and mounted; `unlisted` once a sync has recorded it
        empty and it is out of snapraid.conf too — only its unmount and removal
        from the array are left. A disk that finished leaves the pool and the
        array altogether.
      enum: [evacuating, evacuated, unpooled, unlisted]

    NotificationLevel:
      type: string
      enum: [info, warning, error, critical]

    # `full`-shape SSE envelopes (ogen's x-ogen-sse-event-shape): each member
    # carries the discriminator in its own `event` field, so a client can
    # switch on the wire value without decoding `data` first. `const`, not a
    # single-value `enum`, on purpose: ogen names a named enum type after its
    # schema plus property (e.g. `DiskStateEvent`'s `event` property would be
    # `DiskStateEventEvent`), which collides with the identical naming ogen's
    # own discriminator codegen uses for `Event`'s variant tags once `Event`
    # itself is generated (api/event-schema-root.yaml, jschemagen) — `const`
    # inlines the field as a plain validated string instead of a named type,
    # so there is nothing left to collide.
    JobProgressEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: job_progress
        data:
          $ref: '#/components/schemas/Job'

    DiskStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: disk_state
        data:
          type: object
          required: [diskId, device, state, at]
          properties:
            diskId:
              type: string
            device:
              type: string
              # Design refs: doc 01 §7
              description: >-
                e.g. `/dev/sdb` — as reported, never accepted back as input.
            state:
              $ref: '#/components/schemas/DiskState'
            at:
              type: string
              format: date-time

    ContainerStateEvent:
      type: object
      description: >-
        A container's state or health changed — sent when the Engine
        reports it (a start, die, pause, unpause or health check result,
        including a container killed from outside Hoserva) and when a
        start, stop, restart or recreate through the API finishes. `state`
        is the Engine's own vocabulary. `health` is present only when the
        event carries a health check result (or the container's health
        after an API action); a start, stop or die resets the check and
        the Engine's event omits it.
      required: [event, data]
      properties:
        event:
          type: string
          const: container_state
        data:
          type: object
          required: [containerId, name, state, at]
          properties:
            containerId:
              type: string
            name:
              type: string
            state:
              $ref: '#/components/schemas/AppState'
            health:
              $ref: '#/components/schemas/AppHealth'
            at:
              type: string
              format: date-time

    NotificationEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: notification
        data:
          type: object
          required: [id, eventType, level, title, message, createdAt]
          properties:
            id:
              type: string
            eventType:
              $ref: '#/components/schemas/NotificationEventType'
            level:
              $ref: '#/components/schemas/NotificationLevel'
            title:
              type: string
            message:
              type: string
            createdAt:
              type: string
              format: date-time

    CatalogEvent:
      type: object
      description: >-
        A catalog check finished, whether the background interval,
        check-on-open or `refreshCatalog` started it. `data` is the check's
        outcome, the same object `refreshCatalog` answers with.
      required: [event, data]
      properties:
        event:
          type: string
          const: catalog
        data:
          $ref: '#/components/schemas/CatalogRefresh'

    Event:
      # Design refs: doc 01 §5
      description: >-
        The full set of `/api/v1/events` SSE event types.
      oneOf:
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/DiskStateEvent'
        - $ref: '#/components/schemas/ContainerStateEvent'
        - $ref: '#/components/schemas/NotificationEvent'
        - $ref: '#/components/schemas/CatalogEvent'
      discriminator:
        propertyName: event
        mapping:
          job_progress: '#/components/schemas/JobProgressEvent'
          disk_state: '#/components/schemas/DiskStateEvent'
          container_state: '#/components/schemas/ContainerStateEvent'
          notification: '#/components/schemas/NotificationEvent'
          catalog: '#/components/schemas/CatalogEvent'

    NotificationEventType:
      type: string
      # Design refs: doc 03 §8.3
      # Implementation: internal/notify assigns every one of these a compiled-in
      # default severity (NotificationLevel); notify_event_severity overrides it
      # per event type.
      description: >-
        The fixed event catalog, in its own order. Each event type has a
        compiled-in default severity, which can be overridden per event type.
      enum:
        - smart_warning
        - smart_failure
        - disk_offline
        - array_degraded
        - sync_succeeded
        - sync_failed
        - sync_blocked_threshold
        - scrub_errors_found
        - pool_above_threshold
        - disk_near_minfreespace
        - cache_above_threshold
        - mover_skipping_files
        - config_drift_detected
        - container_unhealthy
        - container_update_available
        - hoserva_update_available
        - hoserva_update_failed
        - reboot_required
        - ups_on_battery
        - ups_battery_low
        - login_failure_burst
        - credential_reset
        - certificate_expiring
        - certificate_renewal_failed
        - config_backup_failed
        - appdata_backup_failed
        - backup_destination_stale
        - restore_drill_failed
        - catalog_check_failed

    NotificationChannelType:
      type: string
      enum: [email, gotify, ntfy, discord, webhook]

    NotificationWebhookMethod:
      type: string
      enum: [POST, PUT]

    NotificationWebhookHeaders:
      type: object
      additionalProperties:
        type: string

    NotificationChannel:
      type: object
      # Design refs: Q28
      description: >-
        Never carries a credential — `hasSecret` is the only signal that one is
        configured. Only the properties relevant to `type` are meaningful; the
        rest are absent.
      required: [id, name, type, enabled, hasSecret, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: Whether a credential is configured for this channel.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string
          description: >-
            The header carrying the generic webhook's credential, e.g.
            `Authorization` — the header's value is `secret`, never a
            plain property here.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNotificationChannelRequest:
      type: object
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type: string
          # Design refs: Q28
          description: >-
            The channel's credential, e.g. an SMTP password, a Gotify app token,
            an ntfy auth token, a Discord webhook URL, or a generic webhook's
            auth header value. Encrypted with the machine key before it reaches
            the database and never returned by any later read.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    UpdateNotificationChannelRequest:
      type: object
      description: >-
        Same shape as CreateNotificationChannelRequest, a full replace,
        except `secret` is tri-state: omitted keeps the existing
        credential, `null` clears it, a string replaces it.
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type:
            - string
            - "null"
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    NotificationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: The delivery error, present only when success is false.

    NotificationRoutingEntry:
      type: object
      required: [eventType, severity, channelIds]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateNotificationRouteRequest:
      type: object
      required: [severity, channelIds]
      properties:
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationAlert:
      type: object
      required: [id, eventType, level, title, message, createdAt, read]
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        level:
          $ref: '#/components/schemas/NotificationLevel'
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationGroup:
      type: object
      required: [eventType, alerts]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAlert'

    ListNotificationsOK:
      type: object
      required: [groups, unreadCount]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NotificationGroup'
        unreadCount:
          type: integer
          minimum: 0

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        all:
          type: boolean

    MarkNotificationsReadOK:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    NotificationQuietHours:
      type: object
      required: [enabled, start, end, criticalAlwaysDelivers]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 24-hour local time, e.g. "22:00".
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        criticalAlwaysDelivers:
          type: boolean
          # Design refs: doc 03 §8.3
          description: >-
            Always true — critical alerts deliver regardless of quiet hours, and
            this cannot be disabled, so there is no request field that ever sets
            it otherwise.

    UpdateQuietHoursRequest:
      type: object
      required: [enabled, start, end]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    GeneralSettings:
      type: object
      required: [backupPassphraseSet]
      properties:
        hostname:
          type: string
          description: Configured host name, if any.
        timezone:
          type: string
          description: IANA timezone name, e.g. "Europe/Berlin".
        backupPassphraseSet:
          type: boolean
          # Design refs: Q28
          description: >-
            Whether a backup passphrase is configured. The passphrase itself is
            never returned.

    UpdateGeneralSettingsRequest:
      type: object
      properties:
        hostname:
          type: string
          description: >-
            Host name for this server. An empty string clears a previously
            set value. Omitted leaves hostname unchanged.
        timezone:
          type: string
          description: IANA timezone name. Omitted leaves timezone unchanged.
        backupPassphrase:
          type: string
          minLength: 1
          # Design refs: Q28
          description: >-
            Write-only. Sets or replaces the backup passphrase. Omitted leaves
            any existing passphrase unchanged.

    UPSConnection:
      type: string
      enum: [usb, network]
      # Design refs: Doc 03 §8.1, Q77
      description: >-
        Connection choice: a USB-attached UPS Hoserva drives locally, or a
        remote NUT server this host monitors.

    UPSSettings:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >-
            Whether a UPS configuration row exists. False means the card
            shows the optional empty state; every other field is omitted.
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          description: NUT driver name for a USB UPS (e.g. usbhid-ups).
        port:
          type: string
          description: Driver port for a USB UPS (commonly "auto").
        monitorPasswordSet:
          type: boolean
          # Design refs: Q28
          description: >-
            Whether a local monitor password is stored. The password itself is
            never returned.
        networkHost:
          type: string
          description: Remote NUT server hostname or address.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT server port (default 3493 when omitted on write).
        networkUpsName:
          type: string
          description: UPS name on the remote NUT server.
        networkUsername:
          type: string
          description: Monitoring username on the remote NUT server.
        networkPasswordSet:
          type: boolean
          # Design refs: Q28
          description: >-
            Whether a network monitoring password is stored. The password itself
            is never returned.
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          # Design refs: Q77
          description: >-
            USB-only. Charge percent that marks the battery low for a clean
            shutdown. Omitted or zero leaves NUT's driver default.
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          # Design refs: Q77
          description: >-
            USB-only. Estimated runtime seconds remaining that mark the battery
            low. Omitted or zero leaves NUT's driver default.

    UpdateUPSSettingsRequest:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          minLength: 1
          description: Required for USB. NUT driver name (e.g. usbhid-ups).
        port:
          type: string
          minLength: 1
          description: Required for USB. Driver port (commonly "auto").
        monitorPassword:
          type: string
          minLength: 1
          # Design refs: Q28
          description: >-
            Write-only. Required on first USB configure; omit on later updates
            to keep the stored secret.
        networkHost:
          type: string
          minLength: 1
          description: Required for network. Remote NUT server host.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT port. Defaults to 3493 when omitted.
        networkUpsName:
          type: string
          minLength: 1
          description: Required for network. UPS name on the remote server.
        networkUsername:
          type: string
          minLength: 1
          description: Required for network. Monitoring username.
        networkPassword:
          type: string
          minLength: 1
          # Design refs: Q28
          description: >-
            Write-only. Required on first network configure; omit on later
            updates to keep the stored secret.
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          # Design refs: Q77
          description: USB-only low-battery charge percent.
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          # Design refs: Q77
          description: USB-only low-battery runtime seconds.

    NetworkBackend:
      type: string
      enum: [ifupdown, networkmanager, systemd-networkd, unknown]
      # Design refs: Q75
      description: Detected host network backend.

    NetworkAddressMethod:
      type: string
      enum: [dhcp, static]
      description: How this interface obtains its address.

    NetworkInterface:
      type: object
      required: [name, method, state]
      properties:
        name:
          type: string
          description: Kernel interface name, e.g. `enp1s0`.
        mac:
          type: string
          description: Hardware address, if known.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
        address:
          type: string
          description: Configured IPv4 or IPv6 address without prefix.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for `address`.
        gateway:
          type: string
          description: Default gateway for this interface, if any.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers used with this configuration.
        state:
          type: string
          enum: [up, down]
          description: Link operational state.

    NetworkPending:
      type: object
      required: [interface, expiresAt, remainingSeconds]
      properties:
        interface:
          type: string
          description: Interface the pending confirm-or-revert applies to.
        expiresAt:
          type: string
          format: date-time
          description: When the previous configuration is restored if unconfirmed.
        remainingSeconds:
          type: integer
          minimum: 0
          description: Whole seconds left in the confirm window.

    TLSCertificateKind:
      type: string
      enum: [self_signed, lets_encrypt]
      # Design refs: Q9
      description: How the current TLS certificate was issued.

    TLSCertificateInfo:
      type: object
      required: [kind, notAfter, daysRemaining]
      properties:
        kind:
          $ref: '#/components/schemas/TLSCertificateKind'
        notAfter:
          type: string
          format: date-time
          description: Certificate expiry instant.
        daysRemaining:
          type: integer
          description: Whole days until expiry; negative if already expired.
        domain:
          type: string
          description: >-
            DNS name the Let's Encrypt certificate covers. Absent for a
            self-signed certificate.

    DNS01Provider:
      type: string
      enum: [cloudflare, rfc2136]
      # Design refs: Q9
      description: >-
        DNS-01 providers in v1: Cloudflare's API and generic RFC 2136. HTTP-01
        and TLS-ALPN-01 are not offered.

    LetsEncryptStatus:
      type: object
      required: [configured, enabled]
      properties:
        configured:
          type: boolean
          description: True when DNS-01 credentials are stored.
        enabled:
          type: boolean
          description: True when unattended renewal is armed.
        domain:
          type: string
          description: Hostname configured for DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        hasSecret:
          type: boolean
          # Design refs: Q28
          description: >-
            True when a DNS credential is stored; the secret itself is never
            returned.
        lastError:
          type: string
          description: Last issue or renewal failure. Omitted after a success.

    ConfigureLetsEncryptRequest:
      type: object
      required: [domain, provider]
      properties:
        domain:
          type: string
          minLength: 1
          description: Hostname the certificate will cover, challenged via DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        cloudflareAPIToken:
          type: string
          # Design refs: Q28
          description: >-
            Cloudflare API token with Zone.DNS Edit. Write-only. Required when
            `provider` is cloudflare and no token is stored yet.
        rfc2136Nameserver:
          type: string
          description: RFC 2136 nameserver as host:port. Required when `provider` is rfc2136.
        rfc2136TsigKeyName:
          type: string
          description: TSIG key name. Required when `provider` is rfc2136.
        rfc2136TsigSecret:
          type: string
          # Design refs: Q28
          description: >-
            TSIG secret. Write-only. Required when `provider` is rfc2136 and no
            secret is stored yet.
        rfc2136TsigAlgorithm:
          type: string
          description: TSIG algorithm. Defaults to hmac-sha256.

    NetworkSettings:
      type: object
      required: [backend, editable, interfaces, certificate, allowAllSources, listenPort, letsEncrypt]
      properties:
        backend:
          $ref: '#/components/schemas/NetworkBackend'
        editable:
          type: boolean
          # Design refs: Q75
          description: >-
            True only when the backend is ifupdown.
        readOnlyReason:
          type: string
          description: Why addressing cannot be edited, when `editable` is false.
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        pending:
          $ref: '#/components/schemas/NetworkPending'
        certificate:
          $ref: '#/components/schemas/TLSCertificateInfo'
        letsEncrypt:
          $ref: '#/components/schemas/LetsEncryptStatus'
        allowAllSources:
          type: boolean
          # Design refs: Q10
          description: >-
            When false (default), the TCP listener accepts only LAN-ish sources.
            When true, every source address is accepted.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          # Design refs: Q9
          description: TCP port the TLS UI/API currently listens on.
        listenPortRestartRequired:
          type: boolean
          description: True when a persisted listen-port change has not been bound yet.

    ApplyNetworkSettingsRequest:
      type: object
      properties:
        interface:
          type: string
          minLength: 1
          description: >-
            Interface to reconfigure. Required when any of `method`,
            `address`, `prefix`, `gateway` or `dns` is set.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
          description: >-
            Required when any of `interface`, `address`, `prefix`,
            `gateway` or `dns` is set — the managed ifupdown stanza is
            always rewritten in full.
        address:
          type: string
          description: Static address without prefix. Required when `method` is static.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for a static address. Required when `method` is static.
        gateway:
          type: string
          description: Default gateway. Empty string clears a previously set gateway.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers. Empty array clears them.
        allowAllSources:
          type: boolean
          # Design refs: Q10
          description: >-
            Set the access-scope toggle. Omitted leaves it unchanged.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Persist a new listen port for the next daemon start. Omitted leaves it unchanged.

    UpdateChannel:
      type: string
      enum: [stable, beta]
      # Design refs: Q67
      description: >-
        Release channel the update check reads from the signed index.

    UpdateStatus:
      type: object
      required: [currentVersion, channel, checkEnabled, rebootRequired, pendingDebianUpdates, dependencies]
      properties:
        currentVersion:
          type: string
          description: Installed Hoserva package version.
        availableVersion:
          type: string
          description: Newer version on the configured channel, if any.
        availableTag:
          type: string
          description: Git tag of availableVersion, if any.
        changelog:
          type: string
          description: Release notes for availableVersion, if the index carries them.
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean
          # Design refs: Q49
          description: >-
            Whether the periodic outbound update check is enabled.
        previousVersion:
          type: string
          description: Version rollback would restore, if an upgrade has been applied.
        rebootRequired:
          type: boolean
          # Design refs: Q68
          description: >-
            Whether `/run/reboot-required` is present.
        pendingDebianUpdates:
          type: array
          items:
            $ref: '#/components/schemas/DebianPackageUpdate'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/PackageDependencyStatus'
        blockingJob:
          $ref: '#/components/schemas/BlockingJob'
          description: >-
            A running Parity, Array-write or Topology job that would refuse
            an update, rollback or (until it finishes) a reboot.

    DebianPackageUpdate:
      type: object
      required: [name, installedVersion, candidateVersion]
      properties:
        name:
          type: string
        installedVersion:
          type: string
        candidateVersion:
          type: string

    PackageDependencyStatus:
      type: object
      required: [name, installedVersion, testedFloor, inRange]
      properties:
        name:
          type: string
          description: Debian package name (mergerfs, snapraid).
        installedVersion:
          type: string
        testedFloor:
          type: string
          # Design refs: Q7
          description: >-
            Lowest version this Hoserva release was tested against.
        inRange:
          type: boolean
          description: True when installedVersion is at or above testedFloor.

    BlockingJob:
      type: object
      required: [id, type, class]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'

    UpdateUpdateSettingsRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean

    ConfirmUpdateRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true; the UI/CLI confirm dialog is what sets this.

    MaintenanceChainStepId:
      type: string
      enum: [mover, diff_guard, sync, scrub, config_backup]
      # Design refs: Q30
      description: One step in the fixed nightly maintenance chain order.

    OtherScheduleJobId:
      type: string
      enum: [smart_self_test, appdata_backup, restore_drill, container_update_check]
      # Design refs: doc 03 §8.4
      description: A recurring job scheduled outside the nightly chain.

    ScheduleFrequency:
      type: string
      enum: [daily, weekly, monthly]

    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: Day of week, 0=Sunday through 6=Saturday.

    MaintenanceChainStep:
      type: object
      required: [id, enabled]
      properties:
        id:
          $ref: '#/components/schemas/MaintenanceChainStepId'
        enabled:
          type: boolean

    MaintenanceChainSchedule:
      type: object
      required: [startTime, weeklyScrubDay, schedulePreview, nextRun, steps]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          # Design refs: Q30
          description: >-
            Local time the chain starts (default 02:00).
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        schedulePreview:
          type: string
          description: Human-readable summary, e.g. "every day at 02:00".
        nextRun:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          # Design refs: Q30
          description: >-
            Order: mover, diff_guard, sync, scrub, config_backup.

    ScheduledJob:
      type: object
      required: [id, enabled, frequency, time, schedulePreview, nextRun]
      properties:
        id:
          $ref: '#/components/schemas/OtherScheduleJobId'
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        schedulePreview:
          type: string
        nextRun:
          type: string
          format: date-time

    ScheduleConflict:
      type: object
      required: [jobA, jobB]
      properties:
        jobA:
          type: string
          description: >-
            Identifier of the first colliding schedule — `maintenance_chain`
            or an OtherScheduleJobId value.
        jobB:
          type: string
          description: Identifier of the second colliding schedule.

    Schedules:
      type: object
      required: [chain, otherJobs, conflicts]
      properties:
        chain:
          $ref: '#/components/schemas/MaintenanceChainSchedule'
        otherJobs:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJob'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleConflict'

    UpdateMaintenanceChainScheduleRequest:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          # Design refs: Q30
          description: >-
            Per-step enabled flags only — order is ignored; the order is always
            server-defined.

    UpdateScheduledJobRequest:
      type: object
      properties:
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    DoctorCheckStatus:
      type: string
      enum: [pass, warn, fail]

    DoctorCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
        name:
          type: string
          description: Plain-language label for the check.
        status:
          $ref: '#/components/schemas/DoctorCheckStatus'
        message:
          type: string
        remediation:
          type:
            - string
            - "null"
          description: What to run or change when status is not pass.

    DoctorReport:
      type: object
      required: [checks, overall]
      properties:
        overall:
          $ref: '#/components/schemas/DoctorCheckStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DoctorCheck'

    HostConfigID:
      type: string
      enum: [host_samba, host_nfs, host_fstab, host_docker_containers, host_docker_images]
      # Design refs: Q76
      description: >-
        Onboarding category, matching DoctorCheck.id.

    HostConfigDecision:
      type: string
      enum: [import, leave]
      # Design refs: doc 01 §2
      description: >-
        import persists parsed facts in SQLite so a later generate may take
        ownership; leave marks the host file unmanaged so Generator never writes
        it.

    HostConfigChoice:
      type: object
      required: [id, decision]
      properties:
        id:
          $ref: '#/components/schemas/HostConfigID'
        decision:
          $ref: '#/components/schemas/HostConfigDecision'

    ApplyHostConfigRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'

    ApplyHostConfigResult:
      type: object
      required: [files, dockerDataRoot]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'
        dockerDataRoot:
          type: string
          # Design refs: Q62, Q76
          description: >-
            Docker's data-root after this apply. Always `/var/lib/docker` when
            containers, images or named volumes exist, when there is no cache
            disk, or when the caller did not accept a move.

    AppState:
      type: string
      enum: [created, running, paused, restarting, removing, exited, dead]
      description: The Docker Engine's own container state vocabulary.

    AppHealth:
      type: string
      enum: [none, starting, healthy, unhealthy]
      description: >-
        The container's HEALTHCHECK result, in the Engine's own
        vocabulary; `none` when the container defines no health check.

    AppStats:
      type: object
      required: [at, cpuPercent, memoryBytes, memoryLimitBytes, networkRxBytes, networkTxBytes, blockReadBytes, blockWriteBytes]
      properties:
        at:
          type: string
          format: date-time
        cpuPercent:
          type: number
          format: double
          description: >-
            Share of the host's CPU time the container used since the
            previous sample, times the CPUs online (100 is one full core).
        memoryBytes:
          type: integer
          format: int64
          description: Memory in use, without reclaimable page cache.
        memoryLimitBytes:
          type: integer
          format: int64
        networkRxBytes:
          type: integer
          format: int64
        networkTxBytes:
          type: integer
          format: int64
        blockReadBytes:
          type: integer
          format: int64
        blockWriteBytes:
          type: integer
          format: int64

    RemoveAppResult:
      type: object
      required: [deletedPaths]
      properties:
        deletedPaths:
          type: array
          items:
            type: string
          description: >-
            The appdata directories deleted. Empty unless `deleteAppdata`
            was requested — and possibly empty then too, when none of the
            container's mounts lay inside the appdata location.

    StackTemplate:
      type: object
      required: [source, id, revision]
      properties:
        source:
          type: string
          description: Where the template came from; empty for a stack no template installed.
        id:
          type: string
        revision:
          type: string

    Stack:
      type: object
      required: [name, template, installedAt, manuallyEdited]
      properties:
        name:
          type: string
        template:
          $ref: '#/components/schemas/StackTemplate'
        installedAt:
          type: string
          format: date-time
        manuallyEdited:
          type: boolean
          description: >-
            True once the stack's Compose text was saved by hand
            (`updateStack`), so the template's form must not silently
            overwrite it. A template install is not manually edited.
        compose:
          type: string
          description: >-
            The stored `docker-compose.yml` text. Returned by `getStack` and
            `updateStack` only, never by `listStacks`. The `.env` is never
            returned.

    UpdateStackRequest:
      type: object
      required: [compose]
      properties:
        compose:
          type: string
          description: The new `docker-compose.yml` text.

    UpdateStackResult:
      type: object
      required: [applied, stack]
      properties:
        applied:
          type: boolean
          description: False for a `dryRun`, which changes nothing.
        stack:
          $ref: '#/components/schemas/Stack'

    ListStacksOK:
      type: object
      required: [stacks]
      properties:
        stacks:
          type: array
          items:
            $ref: '#/components/schemas/Stack'

    CreateStackRequest:
      type: object
      required: [name, compose]
      properties:
        name:
          type: string
          description: >-
            1 to 63 lowercase letters, digits, `-` or `_`, starting with a
            letter or digit. It is the stack's directory name and its
            Compose project name.
        compose:
          type: string
          description: The `docker-compose.yml` text.
        env:
          type: string
          description: >-
            The `.env` text. Write-only: it is stored sealed under the
            machine key and never returned. Absent means an empty `.env`.
            It may not define `PATH`, `HOME`, `XDG_RUNTIME_DIR`,
            `DOCKER_HOST`, `DOCKER_CONTEXT`, `DOCKER_CONFIG`,
            `DOCKER_CERT_PATH` or `DOCKER_TLS_VERIFY`, which Docker takes
            from the daemon's environment (400 `invalid_stack_env`).
        template:
          $ref: '#/components/schemas/StackTemplate'

    RemoveStackResult:
      type: object
      required: [deletedPaths]
      properties:
        deletedPaths:
          type: array
          items:
            type: string
          description: >-
            The appdata directories and the stack directory deleted. Empty
            unless `deleteAppdata` was requested.

    CatalogEntry:
      type: object
      required: [id, revision, title, categories, docs, source, sourceKind, signed, installed]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
          description: Increases with every change to the template.
        title:
          type: string
        categories:
          type: array
          items:
            type: string
        docs:
          type: string
          description: The upstream documentation the template was written from.
        maintainer:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Who maintains the template or the app, as the catalog's index
            lists it. Absent when the template names none.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            The template's description as the catalog's index lists it; the
            catalog card shows an excerpt. Plain text, never markup. Absent
            when the template has none.
        source:
          type: string
          description: >-
            Where the entry came from: `hoserva` for the curated catalog, a
            source id for a user-added source.
        sourceKind:
          $ref: '#/components/schemas/CatalogSourceKind'
        signed:
          type: boolean
          description: >-
            The source's badge as data: true only when the source's installed
            archive passed a signature check. False for every entry of an
            unsigned user-added source.
        installed:
          type: boolean
          description: A stack of this template id exists.

    CatalogList:
      type: object
      required: [serial, templates]
      properties:
        serial:
          type: integer
          format: int64
          description: The installed catalog's serial.
        generatedAt:
          type: string
          format: date-time
          description: When the catalog archive was built; absent when its index carries no time.
        templates:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        lastCheckedAt:
          type: string
          format: date-time
          description: >-
            When the most recent catalog check finished, whatever its outcome.
            Absent before any check has run since the daemon started.
        lastOutcome:
          $ref: '#/components/schemas/CatalogCheckOutcome'

    CatalogCheckOutcome:
      type: string
      enum: [updated, unchanged, failed]
      description: How a catalog check ended.

    CatalogRefreshInterval:
      type: string
      enum: ['off', '1h', '6h', '12h', '24h']
      description: >-
        How often the daemon checks the catalog host in the background. Each
        wait is lengthened by a random extra of up to 10% of the interval;
        `off` sends no automatic request.

    CatalogSettings:
      type: object
      required: [refreshInterval, checkOnOpen]
      properties:
        refreshInterval:
          $ref: '#/components/schemas/CatalogRefreshInterval'
        checkOnOpen:
          type: boolean
          description: >-
            Whether listing the catalog starts a background check when the
            last one is older than 15 minutes.

    CatalogSettingsUpdate:
      type: object
      properties:
        refreshInterval:
          $ref: '#/components/schemas/CatalogRefreshInterval'
        checkOnOpen:
          type: boolean
          description: Left out, it stays unchanged.

    CatalogRefresh:
      type: object
      required: [checkedAt, outcome]
      properties:
        checkedAt:
          type: string
          format: date-time
          description: When the check finished.
        outcome:
          $ref: '#/components/schemas/CatalogCheckOutcome'
        newTemplates:
          type: integer
          minimum: 0
          description: >-
            Templates the new catalog lists that the replaced one did not.
            Present only when `outcome` is `updated`.
        updatedTemplates:
          type: integer
          minimum: 0
          description: >-
            Templates both catalogs list under a different revision. Present
            only when `outcome` is `updated`.
        reason:
          type: string
          enum: [fetch_failed, bad_signature, not_newer, bad_archive, install_failed]
          description: >-
            Present only when `outcome` is `failed`. `fetch_failed`: the host
            could not be reached or answered something unusable (not
            notified). `bad_signature`: the signature does not verify against
            the catalog key. `not_newer`: the serial is not higher than the
            installed catalog's. `bad_archive`: the signed archive is not a
            catalog. `install_failed`: the verified archive could not be
            written to disk. The three verification reasons raise a
            `catalog_check_failed` notification.
        message:
          type: string
          description: Present only when `outcome` is `failed`.

    CatalogSourceKind:
      type: string
      enum: [curated, user_added]
      # Design refs: doc 04 §7, doc 04 §4
      description: >-
        `curated`: Hoserva's own catalog. `user_added`: a source URL the user
        added.

    CatalogSource:
      type: object
      required: [id, url, kind, signed]
      properties:
        id:
          type: string
          description: >-
            `hoserva` for the curated catalog, otherwise the id its entries
            carry as `source`.
        url:
          type: string
          description: The address the archive is fetched from beneath.
        kind:
          $ref: '#/components/schemas/CatalogSourceKind'
        signed:
          type: boolean
          description: >-
            True only when the source's installed archive passed a signature
            check: always for the curated catalog, and for a user-added
            source only when it was added with a public key.
        serial:
          type: integer
          format: int64
          description: The installed catalog's serial; absent when it cannot be read.
        lastRefreshedAt:
          type: string
          format: date-time
          description: >-
            When the source's archive was last installed or confirmed
            unchanged; absent before the first time.

    CatalogSourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSource'

    AddCatalogSourceRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: >-
            An `https` address with no credentials, query or fragment; the
            archive and its signature are fetched from beneath it.
        publicKey:
          type: string
          description: >-
            The Ed25519 public key the archive is signed with, as PEM or the
            base64 of the raw 32 bytes. Absent means the source is unsigned;
            a key that is present but blank is refused with 400, never read
            as unsigned.

    StackTemplateUpdate:
      type: object
      required: [status, manuallyEdited]
      properties:
        status:
          type: string
          enum: [update_available, up_to_date, not_from_template, source_removed, template_removed]
        source:
          type: string
          description: The source the stack records; absent when it records none.
        templateId:
          type: string
          description: The template the stack records; absent when it records none.
        installedRevision:
          type: integer
          minimum: 1
          description: The revision the stack was installed from; absent for `not_from_template`.
        availableRevision:
          type: integer
          minimum: 1
          description: >-
            The revision the source lists now; present for `update_available`
            and `up_to_date`.
        sourceKind:
          $ref: '#/components/schemas/CatalogSourceKind'
        signed:
          type: boolean
          description: >-
            The source's badge, present with `availableRevision`: true only
            when the source's installed archive passed a signature check.
        manuallyEdited:
          type: boolean
          description: >-
            The stack's Compose text was saved by hand, so `diff` is against
            the edited file and applying the update would overwrite the edit.
        diff:
          type: string
          description: >-
            Present only for `update_available`: a unified diff from the
            stack's `docker-compose.yml` to the newer revision's
            `compose.yaml`.

    CatalogTemplate:
      type: object
      required: [id, revision, title, categories, docs, screenshotCount, source, sourceKind, signed, compose, privileges]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        categories:
          type: array
          items:
            type: string
        docs:
          type: string
        maintainer:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Who maintains the template or the app. Absent when the template
            names none.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Longer plain text for the template's page. Line breaks are
            meaningful; it is never markup. Absent when the template has none.
        links:
          $ref: '#/components/schemas/CatalogTemplateLinks'
        screenshotCount:
          type: integer
          minimum: 0
          maximum: 8
          description: >-
            How many screenshots the template lists. Screenshot `i` of
            `0..screenshotCount-1` is `getCatalogTemplateScreenshot`.
        source:
          type: string
          description: >-
            Where the template came from: `hoserva` for the curated catalog, a
            source id for a user-added source.
        sourceKind:
          $ref: '#/components/schemas/CatalogSourceKind'
        signed:
          type: boolean
          description: >-
            True only when the source's installed archive passed a signature
            check; false for a template of an unsigned user-added source.
        compose:
          type: string
          description: The template's `compose.yaml` text, with its `x-hoserva` block.
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePrivilege'
          description: Empty when the template asks for nothing beyond an ordinary container.

    CatalogTemplateLinks:
      type: object
      description: >-
        The addresses the template's page offers, each absolute `https` with
        a host and no credentials. A link the template does not set is absent.
      properties:
        project:
          type: string
          maxLength: 2048
          description: The app's project page.
        support:
          type: string
          maxLength: 2048
          description: Where to get help with the app.
        donate:
          type: string
          maxLength: 2048
          description: Where to support the app's development.

    TemplateInstallRequest:
      type: object
      properties:
        name:
          type: string
          description: >-
            The stack's name, under the rules of `createStack`. Absent means
            the template's id.
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            Input name to value. An input with no entry, or an empty one,
            takes its default. An entry for a name that is not one of the
            template's inputs is refused.
        networkMode:
          type: string
          # Design refs: Q37
          description: >-
            `bridge`, `host` or the name of an existing Docker network. It
            replaces the service's own `network_mode` and `networks` in the
            generated Compose file. A name that is not a Docker network name, or
            is `none`, is refused with 400 `invalid_template_input`
            (`details.input` is `networkMode`). A network that does not exist is
            a `missing_network` warning in the plan, with the exact `docker
            network create <name>` command, and `installTemplate` refuses it
            with 409 `network_missing`: Hoserva never creates networks. A
            failure to list the networks is an error (503 `docker_unavailable`
            when Docker is not reachable), never read as the network existing.
            Absent leaves the template's network settings as they are, and so
            does an empty string. Refused for a template with several services,
            like `cpus`, `memoryMiB` and `extraParams` (`advancedAvailable` is
            false).
        restart:
          type: string
          enum: ["no", always, unless-stopped, on-failure]
          description: >-
            The restart policy of every service. Absent leaves the template's.
        cpus:
          type: number
          format: double
          description: >-
            CPU limit of the service (Compose `cpus`), from 0.01 to 1024.
            Absent is no limit, and 0 is not a limit but a value outside the range: 400
            `invalid_template_input` (`details.input` is `cpus`).
        memoryMiB:
          type: integer
          description: >-
            Memory limit of the service in MiB (Compose `mem_limit`), from 6
            to 16777216. Absent is no limit, and 0 is not a limit but a value
            outside the range: 400 `invalid_template_input`
            (`details.input` is `memoryMiB`).
        extraParams:
          type: string
          # Design refs: doc 04 §5
          description: >-
            At most 4096 bytes; longer is 400 `invalid_template_input`. Absent
            or empty adds nothing. Raw `docker run` flags, read by the same
            parser that handles an Unraid template's `ExtraParams`: parsed into
            Compose fields and merged into the service, never passed to a shell.
            A flag outside the translate table, a word that is not a flag, or a
            string with shell syntax is a `untranslated_flag` warning in the
            plan and a comment above the service in the Compose file, never
            dropped silently. A flag that widens privileges (`--cap-add`,
            `--device`, `--pid=host`, `--security-opt`, a mount of a host path
            or of the Docker socket) is applied and shows in the plan's
            `privileges`. An entry that clashes with the template's own (a
            variable, label or mount at the same target with another value) is a
            `conflict` warning and the template's is kept. `--restart`, `--cpus`
            and `--memory` are refused with 400 `invalid_template_input`
            (`details.input` is `extraParams`) only when the request also gives
            `restart`, `cpus` or `memoryMiB` respectively; otherwise they
            translate like any other flag. A named volume a mount refers to is
            declared under the top-level `volumes` of the Compose file (one the
            template declares stays as declared). A host port a `-p` flag
            publishes is checked as a port input is: one the template's own
            ports, another flag, a container, a stack or the host already holds
            is refused with 409 `no_free_port` (`details.input` is
            `extraParams`) and is never moved, and a port that cannot be checked
            is refused too. Under host networking Docker ignores published
            ports, so none is checked.

    TemplateInput:
      type: object
      required: [name, kind, generated, required]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [path, port, string, secret, timezone, device]
        role:
          type: string
          enum: [appdata, share, media, downloads, gpu]
        label:
          type: string
        description:
          type: string
        value:
          type: string
          description: >-
            What the input resolves to. Absent for a secret, whose value is
            only ever written to the stack's `.env`; empty for a `device`
            input with no GPU chosen.
        requestedValue:
          type: string
          description: >-
            Present on a `port` input whose requested port is taken: the port
            asked for, while `value` is the next free port instead.
        generated:
          type: boolean
          description: A secret that the install generates.
        required:
          type: boolean
          description: >-
            True for an input that may not be left empty: a `path`, a `port`,
            or a `string` input the template does not mark `optional`.
        error:
          type: string
          description: >-
            Present on a `required` input that has no value and no default:
            what is missing. `previewTemplateInstall` lists the input with
            this instead of refusing the request, so a form can show every
            field; `installTemplate` refuses the same input with 400
            `invalid_template_input`.
        suggestions:
          type: array
          items:
            type: string
          description: >-
            The existing shares' paths for a `path` input that is not
            appdata; the host's `/dev/dri` render devices for a `device`
            input.

    StackConfigInput:
      type: object
      required: [name, kind, readOnly]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [path, port, string, secret, timezone, device]
        role:
          type: string
          enum: [appdata, share, media, downloads, gpu]
        label:
          type: string
        description:
          type: string
        value:
          type: string
          description: >-
            The value the stack's `.env` gives the input; empty when it
            gives none. Absent for a secret.
        set:
          type: boolean
          description: >-
            Present on a `secret` input only: whether the stack's `.env`
            gives it a value. The value itself is never returned.
        readOnly:
          type: boolean
          description: >-
            True for a `device` input, which `updateStackConfig` refuses to
            change.
        suggestions:
          type: array
          items:
            type: string
          description: >-
            The existing shares' paths for a `path` input that is not
            appdata.

    StackConfig:
      type: object
      required: [stack, inputs]
      properties:
        stack:
          $ref: '#/components/schemas/Stack'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/StackConfigInput'
          description: The template's inputs, sorted by name.

    UpdateStackConfigRequest:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            Input name to its new value. An input with no entry keeps its
            value; an empty entry takes the input's default. An entry for a
            name that is not one of the stack's inputs is refused.
        generate:
          type: array
          items:
            type: string
          description: >-
            Names of secret inputs to give a newly generated value.

    TemplatePrivilege:
      type: object
      required: [kind, service, description]
      properties:
        kind:
          type: string
          enum: [privileged, host_network, host_pid, host_cgroup, device_cgroup_rules, added_capabilities, confinement_disabled, group_add, docker_socket, host_path]
        service:
          type: string
          description: The Compose service that asks for it.
        detail:
          type: string
          description: >-
            The path, process namespace, rules, capabilities, security
            options or groups concerned, comma-separated when there are
            several; absent for `privileged`, `host_network` and
            `host_cgroup`.
        description:
          type: string
          description: Plain-language explanation of what it grants.

    TemplateInstallPlan:
      type: object
      required: [template, title, name, inputs, privileges, warnings, advancedAvailable, compose]
      properties:
        template:
          $ref: '#/components/schemas/StackTemplate'
        title:
          type: string
        name:
          type: string
          description: The stack's name.
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TemplateInput'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePrivilege'
          description: >-
            Computed from the generated Compose content, so it includes what
            `networkMode` and `extraParams` add. Empty when the template
            asks for nothing beyond an ordinary container.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ConversionWarning'
          description: >-
            What the network mode and the extra parameters could not carry
            out or need a decision on, to read before installing: untranslated
            flags, host paths outside the pool and the cache, clashes with
            the template's own entries, a network that does not exist (with
            its command) and notes. Empty with no such setting.
        advancedAvailable:
          type: boolean
          description: >-
            False for a template with several services, where `networkMode`,
            `cpus`, `memoryMiB` and `extraParams` are refused because no
            input says which service they mean; `restart` still applies to
            every service.
        compose:
          type: string
          description: The `docker-compose.yml` text that an install writes.

    TemplateInstallResult:
      type: object
      required: [stack, plan]
      properties:
        stack:
          $ref: '#/components/schemas/Stack'
        plan:
          $ref: '#/components/schemas/TemplateInstallPlan'

    UnraidConvertRequest:
      type: object
      required: [xml]
      properties:
        xml:
          type: string
          minLength: 1
          maxLength: 49152
          description: >-
            The text of one Unraid container template (an XML file). The
            converter takes at most 49152 bytes of UTF-8; `maxLength` counts
            characters, so a template with multi-byte characters can be
            refused under it.

    UnraidConversion:
      type: object
      required: [source, compose, clean, warnings, privileges, metadata]
      properties:
        source:
          type: string
          description: The template XML as it was sent, to show beside `compose`.
        compose:
          type: string
          description: >-
            The generated Compose file. Not applied anywhere: a service
            named after the template and, where the template needs them, the
            top-level `networks` and `volumes` it refers to.
        clean:
          type: boolean
          # Design refs: Q36
          description: >-
            True when the Compose file needs no manual action: no warning of
            class `untranslated_flag`, `untranslated_field`, `flagged_path`,
            `missing_network` or `conflict`.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ConversionWarning'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePrivilege'
          description: >-
            The privilege summary of the generated Compose content. Empty
            when it asks for nothing beyond an ordinary container.
        metadata:
          $ref: '#/components/schemas/UnraidTemplateMetadata'

    ConversionWarning:
      type: object
      required: [class, message]
      properties:
        class:
          type: string
          enum: [untranslated_flag, untranslated_field, flagged_path, missing_network, conflict, writable_layer, note]
          description: >-
            `untranslated_flag` is an `ExtraParams` flag or word that has no
            Compose equivalent here. `untranslated_field` is a template
            field or entry that could not be carried over. `flagged_path` is
            a host path outside the pool and the cache. `missing_network` is
            a custom network the template names. `conflict` is two entries
            for one target with different values. `writable_layer` is the
            warning every conversion carries about state inside the source
            container. `note` is informational.
        message:
          type: string
          description: Plain-language explanation.
        detail:
          type: string
          description: The flag, path, network name or entry concerned.
        command:
          type: string
          description: >-
            Only on `missing_network`: the `docker network create` command.
            In a conversion it holds `<PLACEHOLDER>` values for what the
            template does not say; in an install plan it is the exact
            `docker network create <name>` for the network that was chosen.

    UnraidTemplateMetadata:
      type: object
      required: [title, variables]
      properties:
        title:
          type: string
          description: The template's `<Name>`.
        overview:
          type: string
        category:
          type: string
        support:
          type: string
        project:
          type: string
        webui:
          type: string
          description: The template's `<WebUI>` as written, Unraid placeholders included.
        icon:
          type: string
          description: The template's `<Icon>` address as written. Never fetched here.
        requires:
          type: string
        donateLink:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/UnraidVariable'
          description: The template's environment variables with their descriptions, for an install form.

    UnraidVariable:
      type: object
      required: [name, value, secret]
      properties:
        name:
          type: string
        value:
          type: string
        description:
          type: string
        secret:
          type: boolean
          description: The template marks the value as masked.

    AppPort:
      type: object
      required: [containerPort, protocol]
      properties:
        hostIP:
          type: string
        hostPort:
          type: integer
          description: Absent when this container port is not published to the host.
        containerPort:
          type: integer
        protocol:
          type: string
          enum: [tcp, udp, sctp]

    AppMount:
      type: object
      required: [destination, readWrite]
      properties:
        source:
          type: string
        destination:
          type: string
        mode:
          type: string
        readWrite:
          type: boolean
        location:
          $ref: '#/components/schemas/AppMountLocation'

    AppMountLocation:
      type: object
      required: [kind]
      # Design refs: doc 02 §1
      description: >-
        Which storage a mount's host path lies on, decided from the path alone
        against the daemon's known mount points (the pool at `/mnt/user`, each
        data disk's and the cache disk's mount point). Nothing is read from a
        data disk to decide it, so a listing never wakes one.
      properties:
        kind:
          type: string
          enum: [pool, disk, cache, outside]
          description: >-
            `pool` is a path under `/mnt/user`, whose files may be on any
            data disk. `disk` is a path under one data disk's own mount
            point. `cache` is a path under the cache disk. `outside` is
            anywhere else, including the boot device.
        share:
          type: string
          description: >-
            For `pool`, the first directory under `/mnt/user`, which is the
            share's name. Absent for the pool's root itself.
        disk:
          type: integer
          minimum: 1
          description: For `disk`, the data disk's number.

    App:
      type: object
      required: [id, name, image, tag, state, status, health, ports, mounts]
      properties:
        id:
          type: string
        name:
          type: string
        health:
          $ref: '#/components/schemas/AppHealth'
        image:
          type: string
          description: The image repository, without its tag.
        tag:
          type: string
        state:
          $ref: '#/components/schemas/AppState'
        status:
          type: string
          description: Human-readable Engine status, e.g. "Up 3 hours".
        stack:
          type: string
          description: >-
            The name of the installed stack that started this container,
            decided by the daemon from the container's Compose project and
            the directory Compose ran it from. Absent for a container no
            stack manages (one started by hand or by another tool). Set by
            `listApps` and `getApp`; the responses of the start, stop and
            restart operations do not carry it.
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Engine created the container. Set by `getApp` only; the
            listing and the responses of the start, stop and restart
            operations do not carry it.
        startedAt:
          type: string
          format: date-time
          description: >-
            When the Engine last started the container. Absent for a
            container that has never run. Set by `getApp` only.
        restartCount:
          type: integer
          minimum: 0
          description: >-
            How many times the Engine's restart policy has restarted the
            container. Set by `getApp` only.
        ports:
          type: array
          items:
            $ref: '#/components/schemas/AppPort'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/AppMount'
          description: >-
            Each mount with a host path carries its `location`, set by
            `listApps` and `getApp`.

    ListAppsOK:
      type: object
      required: [available, apps]
      properties:
        available:
          type: boolean
          # Design refs: doc 04 §3
          description: >-
            False when the Docker Engine is not reachable.
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        apps:
          type: array
          items:
            $ref: '#/components/schemas/App'

    ListAppUpdatesOK:
      type: object
      required: [available, updates]
      properties:
        available:
          type: boolean
          # Design refs: doc 04 §3
          description: >-
            False when the Docker Engine is not reachable.
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        updates:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdate'

    AppUpdate:
      type: object
      required: [container, image, tag, status]
      properties:
        container:
          type: string
          description: The container's name.
        bulkExcluded:
          type: boolean
          description: >-
            True when the container opted out of bulk updates
            (`setAppUpdatePolicy`); `startAppUpdates` with no named
            containers skips it. The daemon always sets it.
        image:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [up_to_date, update_available, skipped, failed, not_checked]
        kind:
          type: string
          enum: [new_build, new_version]
          description: >-
            Set with status update_available. new_build: the registry serves
            a different build under the same tag (the `latest` case).
            new_version: a newer version tag exists, named by availableTag.
        availableTag:
          type: string
          description: Set with kind new_version.
        message:
          type: string
          description: Why the check was skipped or failed, or what it could not look for.
        checkedAt:
          type: string
          format: date-time
          description: When the image was last checked; absent when no check has reached the image.

    StartAppUpdatesRequest:
      type: object
      properties:
        containers:
          type: array
          items:
            type: string
          description: >-
            Container names or Engine IDs to update. Omitted or empty means
            every container with an update available that has not opted out.
          uniqueItems: true

    StartAppUpdatesOK:
      type: object
      required: [containers, skipped]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        containers:
          type: array
          items:
            type: string
          description: The containers the job updates, in the order it does.
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdateSkipped'

    AppUpdateSkipped:
      type: object
      required: [container, reason]
      properties:
        container:
          type: string
        reason:
          type: string
          description: Why a bulk update left the container out.

    SetAppUpdatePolicyRequest:
      type: object
      required: [bulkExcluded]
      properties:
        bulkExcluded:
          type: boolean

    AppUpdatePolicy:
      type: object
      required: [container, bulkExcluded]
      properties:
        container:
          type: string
          description: The container's name.
        bulkExcluded:
          type: boolean

    RegistryCredentialList:
      type: object
      required: [registries]
      properties:
        registries:
          type: array
          items:
            type: string
          description: Registry hosts that have a saved credential, sorted.

    PutRegistryCredentialRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account name; it cannot contain a colon.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: >-
            The password or access token. Write-only: it is stored sealed and
            no operation returns it.

    AppSettings:
      type: object
      required: [imageKeepDays]
      properties:
        imageKeepDays:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            How many days the image a container ran before an update is kept
            locally for a revert.

    AppUpdateRecord:
      type: object
      required: [id, container, image, previousImageId, updatedAt, keepUntil, revertible]
      properties:
        id:
          type: integer
          format: int64
        container:
          type: string
          description: The container's name.
        image:
          type: string
          description: The image reference the container runs, "repository:tag".
        previousImageId:
          type: string
          description: The Engine ID of the image the container ran before the update.
        snapshotArchive:
          type: string
          description: >-
            The appdata archive taken just before the update; absent when the
            container has no appdata on the cache disk.
        snapshotDestinationId:
          type: string
          description: The backup destination that holds `snapshotArchive`.
        updatedAt:
          type: string
          format: date-time
        keepUntil:
          type: string
          format: date-time
          description: Until when the previous image is kept.
        revertedAt:
          type: string
          format: date-time
          description: When the update was reverted; absent until it was.
        revertible:
          type: boolean

    ListAppUpdateHistoryOK:
      type: object
      required: [available, records]
      properties:
        available:
          type: boolean
          # Design refs: doc 04 §3
          description: >-
            False when the Docker Engine is not reachable.
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        records:
          type: array
          items:
            $ref: '#/components/schemas/AppUpdateRecord'

    AppImage:
      type: object
      required: [id, repoTags, sizeBytes]
      properties:
        id:
          type: string
        repoTags:
          type: array
          items:
            type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    ListAppImagesOK:
      type: object
      required: [available, images]
      properties:
        available:
          type: boolean
          # Design refs: doc 04 §3
          description: >-
            False when the Docker Engine is not reachable.
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        images:
          type: array
          items:
            $ref: '#/components/schemas/AppImage'

    DockerNetwork:
      type: object
      required: [name, driver]
      properties:
        name:
          type: string
        driver:
          type: string
          description: The network's driver, such as `bridge`, `host`, `macvlan` or `ipvlan`.

    ListDockerNetworksOK:
      type: object
      required: [available, networks]
      properties:
        available:
          type: boolean
          # Design refs: doc 04 §3
          description: >-
            False when the Docker Engine is not reachable.
        message:
          type: string
          description: Set alongside available=false with the reason and a remediation.
        networks:
          type: array
          items:
            $ref: '#/components/schemas/DockerNetwork'

    MetricResolution:
      type: string
      enum: [raw, hourly, daily]
      # Design refs: Q74
      description: Retention tier used for this response.

    MetricPoint:
      type: object
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
          format: double

    MetricSeries:
      type: object
      required: [metric, subject, resolution, from, to, points]
      properties:
        metric:
          type: string
        subject:
          type: string
        resolution:
          $ref: '#/components/schemas/MetricResolution'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    SystemStatus:
      type: object
      required: [healthy, summary]
      properties:
        healthy:
          type: boolean
        summary:
          type: string
        maintenanceMode:
          type: boolean
        arrayDegraded:
          type: boolean
          # Design refs: doc 02 §1, Q69
          description: >-
            True whenever any disk `hoservad` expects is currently missing by
            identity — including once the user has acknowledged the degraded
            state through `POST /array/degraded/acknowledge`. It clears only
            once the missing disk actually reappears;
            `arrayDegradedAcknowledged` is what distinguishes an acknowledged
            degraded array from one still waiting on the user.
        arrayDegradedAcknowledged:
          type: boolean
          # Design refs: #385
          description: >-
            True once the user has acknowledged the current degraded state
            (`hoserva array acknowledge-degraded`) — only meaningful while
            `arrayDegraded` is also true. It resets the moment the missing disk
            reappears, the same way the acknowledgement itself does. It can be
            true while `storageServicesReleased` is still false: the
            acknowledgement stands even when the transition it triggers does not
            actually start anything (maintenance mode, or a mount failure,
            `array_services_not_started`) — a client must never read this field
            alone as "services are running".
        storageServicesReleased:
          type: boolean
          # Design refs: #385
          # Implementation: the runtime flag is /run/hoserva/storage-ready.
          description: >-
            True once `hoservad`'s storage-target gate has actually released
            Samba, NFS, Docker and libvirt — read live from the runtime flag
            hoservad itself sets only after mounting and confirming the pool —
            and the array is not currently in maintenance mode. This is the
            field a client checks before ever telling the user services are
            running; `arrayDegradedAcknowledged` alone only reports the
            acknowledgement, not whether it took effect. It goes false again the
            moment `array stop` enters maintenance mode, even while the runtime
            flag from an earlier acknowledgement is still set — an explicit stop
            takes those services back down, so a standing acknowledgement must
            never be read as "still running".
        parityBlocked:
          type: boolean
        activeJobs:
          type: integer
          format: int32

    PoolDiskEntry:
      type: object
      required: [device, mountPoint, role, state]
      properties:
        device:
          type: string
        mountPoint:
          type: string
        role:
          type: string
          enum: [data, parity, cache, boot, external, unassigned]
        state:
          $ref: '#/components/schemas/DiskState'
        unraidStick:
          type: boolean
          description: >-
            True when this disk is the Unraid USB stick (see
            `DiskInventoryEntry.unraidStick`). It is reported as `unassigned`
            but no array operation accepts it, so a client offers it no role.
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        usedBytes:
          type:
            - integer
            - "null"
          format: int64
        freeBytes:
          type:
            - integer
            - "null"
          format: int64
          # Design refs: doc 09 §5
          description: >-
            Free space from statfs(2) on this disk's mountpoint — never a
            directory walk. Null for a non-data disk, or when free-space
            accounting is unavailable (no array topology yet).
        nearMinFreeSpace:
          type: boolean
          # Design refs: doc 09 §1
          description: >-
            True once this disk's free space is at or below the pool's
            configured minfreespace — the point mergerfs itself excludes it from
            create-policy placement. Omitted when freeBytes is not being
            reported for this disk.
        removalState:
          oneOf:
            - $ref: '#/components/schemas/DiskRemovalState'
            - type: "null"
          # Design refs: doc 09 §4 step 2, #359
          description: >-
            The removal state of this disk. Null for a disk that is not
            currently in removal.
        finishConfirmation:
          type: string
          # Design refs: #361
          description: >-
            The exact typed phrase `finishDiskRemoval` requires for this disk,
            set whenever `removalState` is set. Reading it here rather than from
            `planDiskEvacuation` is what lets Finish removal be retried once the
            disk has left the pool (`unpooled`/`unlisted`) —
            `planDiskEvacuation` itself refuses those states with
            `disk_leaving_array`, since evacuating a disk that has already left
            the pool makes no sense, but the confirmation phrase does not depend
            on evacuating it again.

    PoolStatus:
      type: object
      required: [mounted, disks]
      properties:
        mounted:
          type: boolean
        disks:
          type: array
          items:
            $ref: '#/components/schemas/PoolDiskEntry'
        poolFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          # Design refs: doc 09 §5
          description: >-
            Sum of data-disk free space — distinct from a `df` on the pool
            mount, which reports the same misleading pool-wide total this field
            exists to be shown alongside rather than replace. Null when no array
            topology is configured yet.
        largestDiskFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          # Design refs: doc 09 §5
          description: >-
            The largest single data disk's free space — the real answer to "what
            is the biggest file I can write".
        largestDiskPath:
          type:
            - string
            - "null"
          description: Mountpoint of the disk largestDiskFreeBytes refers to.

    SpinTransition:
      type: object
      required: [device, fromState, toState, at]
      properties:
        device:
          type: string
          # Design refs: doc 01 §7
          description: >-
            e.g. `/dev/sdb` — as recorded, never accepted back as input.
        fromState:
          type: string
          enum: [active, standby]
        toState:
          type: string
          enum: [active, standby]
        at:
          type: string
          format: date-time
        awakeDurationSeconds:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Present when this row is a wake (standby → active) and a later
            active → standby transition exists for the same device; seconds
            until that transition.

    DailyWakeCount:
      type: object
      required: [device, date, count]
      properties:
        device:
          type: string
        date:
          type: string
          format: date
          description: UTC calendar day the wakes occurred on.
        count:
          type: integer
          format: int32
          minimum: 0

    WakeEventsResponse:
      type: object
      required: [events, dailyWakeCounts]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpinTransition'
        dailyWakeCounts:
          type: array
          items:
            $ref: '#/components/schemas/DailyWakeCount'

    DiskInventoryEntry:
      type: object
      required: [device, sizeBytes, boot]
      properties:
        device:
          type: string
        sizeBytes:
          type: integer
          format: int64
        model:
          type: string
        serial:
          type: string
        wwn:
          type: string
        boot:
          type: boolean
        failed:
          type: boolean
        weakIdentity:
          type: boolean
        unraidStick:
          type: boolean
          # Design refs: doc 05 §3
          description: >-
            True when this disk is the Unraid USB stick (a `vfat` filesystem
            labelled `UNRAID`). Hoserva only reads it for a migration and never
            assigns it a role: every role assignment, and registering, mounting,
            formatting or enabling it as a backup destination as an external
            disk, is refused with `409 unraid_stick`, so a client offers it no
            role. Ejecting a stick registered before it was recognised still
            works, so it can be taken offline.
        filesystem:
          type: string
          # Design refs: doc 02 §1, §4, doc 03 §3.1
          description: >-
            Cached filesystem type from udev (`ID_FS_TYPE`), never probed in a
            way that wakes a standby disk.
        label:
          type: string
          description: Cached filesystem label from udev (`ID_FS_LABEL`).
        smartStatus:
          type: string
          description: >-
            SMART summary from a standby-respecting poll. `standby` when
            the disk was left asleep; `ok` or `failing` from a real read.
        containsData:
          type: boolean
          description: True when udev reports an existing filesystem on the disk.
        looksLikeUnraid:
          type: boolean
          # Design refs: doc 05 §3
          description: >-
            True when the disk is laid out the way Unraid lays out an array or
            pool disk: an MBR or GPT partition table whose partition 1 starts at
            sector 64 and holds XFS, btrfs or ext4. A real Unraid array carries
            no filesystem label, so the layout is the only sign. Read from sysfs
            and udev's cache; the disk is never mounted to look for `super.dat`.
            A hint for a warning, never a role.
        cachePartitions:
          type: array
          # Design refs: doc 01 §6, doc 02 §4
          description: >-
            Only on the boot disk: its spare partitions that may be assigned the
            `cache` role. A partition is listed when it is on the boot disk,
            typed as Linux data, carries no filesystem signature in udev's
            cache, is not mounted, swap, named in `/etc/fstab` or a systemd
            mount or swap unit, or held open by another device, and has a by-id
            link and a PARTUUID. Derived from sysfs, udev, by-id and the files
            above without opening the device; the blank probe runs only when the
            partition is picked.
          items:
            $ref: '#/components/schemas/CachePartition'

    CachePartition:
      type: object
      required: [device, sizeBytes, reason]
      properties:
        device:
          type: string
          description: The partition's kernel device, for example `/dev/nvme0n1p3`.
        sizeBytes:
          type: integer
          format: int64
        byIdName:
          type: string
          description: The partition's `/dev/disk/by-id` link name, the identity it is formatted and mounted by.
        partUuid:
          type: string
          description: The partition table's identifier for it, re-checked immediately before formatting.
        reason:
          type: string
          enum: [spare_boot_partition]
          description: >-
            Why it qualifies: `spare_boot_partition` — an unused partition of
            the boot disk that nothing mounts, swaps on or names.

    ExternalDiskLabel:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      # Design refs: Q72
      description: >-
        Path segment under `/mnt/disks/`.

    ExternalDisk:
      type: object
      required: [label, device, mountPoint, containerPath, mounted, backupDestination, boot]
      properties:
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        device:
          type: string
        mountPoint:
          type: string
          description: >-
            /mnt/disks/<label> — mounted on request, never automatically.
        containerPath:
          type: string
          # Design refs: Q72
          description: >-
            The same /mnt/disks/<label> path, exposed as a stable bind-mount
            source for a container (Unraid Unassigned Devices convention).
        mounted:
          type: boolean
        backupDestination:
          type: boolean
          # Design refs: doc 10 §1
          description: >-
            Whether this disk's mount is a local backup destination.
        boot:
          type: boolean
          description: Always false — the boot device is never offered as external.
        filesystem:
          type: string
        fsUuid:
          type: string
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        model:
          type: string
        serial:
          type: string

    RegisterExternalDiskRequest:
      type: object
      required: [device, label]
      properties:
        device:
          type: string
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        backupDestination:
          type: boolean
          default: false

    UpdateExternalDiskRequest:
      type: object
      properties:
        backupDestination:
          type: boolean

    FormatExternalDiskRequest:
      type: object
      required: [confirmation]
      properties:
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this disk: `ERASE /dev/sdX`. A wrong or
            missing string is refused and formats nothing.

    ArrayDiskRole:
      type: string
      # Design refs: doc 03 §3.1 step 2
      description: >-
        A role the array-setup wizard assigns. Ignore is omitted — those disks
        never appear in the plan.
      enum: [parity, data, cache]

    ArrayDiskFilesystem:
      type: string
      # Design refs: Q23, Q20
      description: >-
        Filesystem to format with, or to verify when adopt is true. Parity is
        always xfs.
      enum: [xfs, ext4, btrfs]

    ArrayCreatePolicy:
      type: string
      # Design refs: doc 02 §1, Q11
      description: Default mergerfs create policy for new shares.
      enum: [mspmfs, mfs, lfs, ff]

    ArrayDiskAssignment:
      type: object
      required: [device, role]
      properties:
        device:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          # Design refs: Q20
          description: >-
            Keep the existing filesystem instead of formatting (data and cache
            only; not allowed on parity).

    CreateArrayRequest:
      type: object
      required: [disks, confirmation]
      properties:
        disks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ArrayDiskAssignment'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        minFreeSpace:
          type: string
          # Design refs: doc 02 §1
          description: >-
            mergerfs minfreespace in its size-suffix syntax, e.g. `50G`. Omitted
            uses the engine default.
        confirmation:
          type: string
          # Design refs: doc 03 §3.1 step 6
          description: >-
            Exact typed confirmation for this plan: `ERASE /dev/sda, /dev/sdb`
            listing every device that will be formatted, sorted, or `ADOPT ONLY
            — NOTHING ERASED` when every assigned disk is adopted. A wrong or
            missing string is refused and formats nothing.

    AddDiskPlanRequest:
      type: object
      required: [device]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          # Design refs: Q23
          description: >-
            Keep the existing filesystem instead of formatting.

    AddDiskPlan:
      type: object
      required: [device, filesystem, adopt, mountpoint, confirmation]
      properties:
        device:
          type: string
        model:
          type: string
          description: The target disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The disk's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        mountpoint:
          type: string
          # Design refs: doc 02 §4 "Adding a disk" step 4
          description: >-
            The next free `/mnt/diskN` this disk will be mounted at.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `addDisk` requires for this plan:
            `ERASE <device>`, or `ADOPT ONLY — NOTHING ERASED` when adopt
            is true.

    AddDiskRequest:
      type: object
      required: [device, confirmation]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskAdd` call.
            A wrong or missing string is refused and formats nothing.

    ReplaceDiskPlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: The existing data disk slot being replaced, e.g. `/mnt/disk2`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          # Design refs: Q23
          description: >-
            Keep the existing filesystem instead of formatting.

    ReplaceDiskPlan:
      type: object
      required: [mountpoint, previousDevice, replacementDevice, filesystem, adopt, rebuild, confirmation]
      properties:
        mountpoint:
          type: string
        previousDevice:
          type: string
          description: The device on record for this slot before the replacement.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        rebuild:
          type: string
          # Design refs: doc 02 §4 "Replacing a failed disk" step 4
          description: >-
            The SnapRAID command this plan's own apply call runs to reconstruct
            the slot's contents from parity, e.g. `snapraid fix -d d2`.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `replaceDisk` requires for this plan:
            `ERASE <replacementDevice>`, or `ADOPT ONLY — NOTHING ERASED`
            when adopt is true.

    ReplaceDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskReplace`
            call. A wrong or missing string is refused and formats
            nothing.

    DiskUpgradePlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: >-
            The existing array slot being upgraded, data or parity, e.g.
            `/mnt/disk2` or `/mnt/parity1`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
          # Design refs: Q20
          description: >-
            Data-disk upgrades only (default xfs); a parity disk is always
            formatted XFS regardless of this field.

    DiskUpgradePlan:
      type: object
      required: [mountpoint, role, previousDevice, replacementDevice, filesystem, steps, confirmation]
      properties:
        mountpoint:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        previousDevice:
          type: string
          description: The device on record for this slot before the upgrade.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          # Design refs: Q71
          description: >-
            Parity upgrades only: the fresh `/mnt/parityN` slot the new disk
            will be formatted, mounted and verified at independently of the old
            one, submitted back unchanged to `upgradeDisk`.
        steps:
          type: array
          items:
            type: string
          description: >-
            The copy/verify/remount steps (data) or copy/verify/switch/check
            steps (parity) this plan's own apply call runs, in order.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `upgradeDisk` requires for this plan:
            `ERASE <replacementDevice>`.

    UpgradeDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          description: >-
            Required, and must equal the matching `planDiskUpgrade` call's
            own `newMountpoint`, when `mountpoint` names a parity slot.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskUpgrade`
            call. A wrong or missing string is refused and formats
            nothing.

    RebalanceMove:
      type: object
      # Design refs: doc 09 §3-4
      description: One file a rebalance or evacuation plan moves.
      required: [share, relPath, sourceBranch, targetBranch, sizeBytes]
      properties:
        share:
          type: string
        relPath:
          type: string
          description: Path relative to the share root.
        sourceBranch:
          type: string
          description: >-
            The share-scoped branch directory the file currently lives on,
            e.g. `/mnt/disk1/media`.
        targetBranch:
          type: string
        sizeBytes:
          type: integer
          format: int64

    RebalanceWarning:
      type: object
      # Design refs: doc 09 §3
      description: >-
        A condition a rebalance or evacuation plan surfaces for review before it
        runs (the path-preserving caveat) — never something the plan itself acts
        on.
      required: [share, reason]
      properties:
        share:
          type: string
        reason:
          type: string

    RebalancePlan:
      type: object
      required: [moves, warnings, confirmation]
      properties:
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `startRebalance` requires for this
            plan (`REBALANCE`).

    StartRebalanceRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planRebalance`
            call (`REBALANCE`). A wrong or missing string is refused and
            nothing runs.

    EvacuationPlan:
      type: object
      required: [mountpoint, moves, warnings, nonSharePaths, confirmation]
      properties:
        mountpoint:
          type: string
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        nonSharePaths:
          type: array
          items:
            type: string
          # Design refs: doc 09 §4, #367
          description: >-
            Every top-level entry on the disk's own mountpoint that is neither a
            configured share's own branch there nor SnapRAID's own bookkeeping
            (`lost+found`, `snapraid.content*`) — content for which there is no
            procedure for moving it. Always empty on a plan this operation
            actually returns: any such content refuses the plan outright
            (`EvacuationPlanRefusal`) instead.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `evacuateDisk` requires for this
            plan (`REMOVE <mountpoint>`).

    EvacuationPlanRefusal:
      type: object
      required: [code, message, nonSharePaths]
      # Design refs: #367
      description: >-
        `planDiskEvacuation`'s 400 refusal: the shared `Error` schema has no
        room for `nonSharePaths`, so a refusal caused by non-share content on
        the disk gets its own body naming every offending path structurally, not
        only in `message`.
      properties:
        code:
          type: string
        message:
          type: string
        nonSharePaths:
          type: array
          items:
            type: string
          description: >-
            Every top-level entry on the disk's own mountpoint that is
            neither a configured share's own branch there nor SnapRAID's
            own bookkeeping — empty when the refusal has a different
            cause (no other branch, an unsupported entry, or the
            remaining disks not having room).

    EvacuateDiskPlanRequest:
      type: object
      required: [mountpoint]
      properties:
        mountpoint:
          type: string
          description: The data disk slot to evacuate, e.g. `/mnt/disk3`.

    FinishDiskRemovalRequest:
      type: object
      required: [mountpoint, confirmation]
      properties:
        mountpoint:
          type: string
          description: The evacuated data disk's slot, e.g. `/mnt/disk3`.
        confirmation:
          type: string
          description: >-
            `REMOVE <mountpoint>` — the phrase `planDiskEvacuation`
            returned for this disk. A wrong or missing string is refused
            and nothing runs.

    CancelDiskRemovalRequest:
      type: object
      required: [mountpoint]
      properties:
        mountpoint:
          type: string
          description: The data disk slot to stop removing, e.g. `/mnt/disk3`.

    EvacuateDiskRequest:
      type: object
      required: [mountpoint, confirmation]
      properties:
        mountpoint:
          type: string
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching
            `planDiskEvacuation` call. A wrong or missing string is
            refused and nothing runs.

    ParityFreshness:
      type: string
      # Design refs: doc 02 §2
      description: >-
        Parity age from `snapraid status`.
      enum: [green, amber, red]

    ParityGuardTrigger:
      type: string
      enum: [removed-count, removed-updated-percent, zero-files]

    ParityZeroFilesDisk:
      type: object
      required: [disk, filesBefore]
      properties:
        disk:
          type: string
          description: Data-disk mount point.
        filesBefore:
          type: integer
          format: int32

    ParityGuardState:
      type: object
      required: [wouldBlock]
      properties:
        wouldBlock:
          type: boolean
          # Design refs: doc 02 §2
          description: >-
            True when the threshold guard would block a sync.
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/ParityGuardTrigger'
        removedCount:
          type: integer
          format: int32
          description: Accounted-for removals compared against the removed-count threshold.
        removedUpdatedPercent:
          type: number
          format: float
          description: Accounted removals plus updated, as a percent of files before the diff.
        zeroFilesDisks:
          type: array
          items:
            $ref: '#/components/schemas/ParityZeroFilesDisk'
        summary:
          type: string
          description: Plain-language why the guard would block, when wouldBlock is true.

    ParityDiffCategory:
      type: string
      # Design refs: doc 02 §2, Q15
      description: >-
        One diff group; moved-by-Hoserva is a match against the relocation
        manifest.
      enum: [removed, updated, added, moved, copied, moved_by_hoserva]

    ParityDiffGroup:
      type: object
      required: [category, count, paths]
      properties:
        category:
          $ref: '#/components/schemas/ParityDiffCategory'
        count:
          type: integer
          format: int32
        paths:
          type: array
          items:
            type: string
          description: >-
            `mount/relative` paths when SnapRAID named individual files.
            Empty when only an aggregate count is known (updated, moved).

    ParitySnapshot:
      type: object
      required: [freshness]
      properties:
        freshness:
          $ref: '#/components/schemas/ParityFreshness'
        lastSyncAt:
          type: string
          format: date-time
          description: Last successful sync, when known.
        changedSinceSync:
          type: integer
          format: int32
          description: Files changed since last sync (`status` / change journal).
        dataDisks:
          type: integer
          format: int32
        parityDisks:
          type: integer
          format: int32
        guard:
          $ref: '#/components/schemas/ParityGuardState'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
          description: Present after the last explicit run-diff; omitted until then.

    ParityDiffResult:
      type: object
      required: [groups, guard]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
        guard:
          $ref: '#/components/schemas/ParityGuardState'

    StartSyncRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        confirm:
          type: boolean
          default: false
          description: Required true to sync past a tripped threshold guard.

    StartScrubRequest:
      type: object
      properties:
        percent:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          # Design refs: doc 01 §3
          description: >-
            Scrub percentage cap (`hoserva scrub [--percent N]`).
        allBlocks:
          type: boolean
          # Design refs: doc 02 §2, doc 05 §4 step 22
          description: >-
            Scrub blocks of every age (`hoserva scrub --all-blocks`, SnapRAID
            `-o 0`). By default a scrub skips blocks scrubbed or synced within
            the last 10 days, so a scrub right after a sync can find nothing to
            check and still succeed. Set true when every block must be verified,
            such as the full scrub after the initial sync. Omitted means false.
            The scheduled scrub never sets it.

    StartFixRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — fix rewrites data from parity.
        disk:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Data disk number N (`/mnt/diskN`), fixed only on that disk
            (`hoserva fix --disk N`). Cannot be combined with `path`.
        path:
          type: string
          minLength: 1
          description: >-
            One file to restore from parity, as it is seen through the pool:
            an absolute path under `/mnt/user`, such as
            `/mnt/user/documents/tax.pdf` (`hoserva fix --path`). Only that file
            is restored; a file edited or deleted elsewhere since the last sync
            keeps its current state. It must be canonical, with no empty, `.`
            or `..` segment and no trailing slash, so a directory is refused; it
            must hold no control character and none of `*`, `?`, `[`, `]` or
            `\`, which SnapRAID reads as pattern syntax and which could match
            more than this one file. Cannot be combined with `disk`. The job
            records it, and the migration checklist's restore drill shows the
            latest succeeded fix job that has one, and a fix that did not restore
            the file (nothing matched, or parity could not rebuild it) does not
            succeed.

    StartShareRelocationRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [cache, array]
          # Design refs: doc 09 §2
          description: >-
            Relocation direction (`hoserva share relocate <share> --to
            cache|array`).

    ShareRelocationPrecheck:
      type: object
      required: [dockerAvailable, containers, openPaths]
      properties:
        dockerAvailable:
          type: boolean
          description: >-
            False when Docker is not reachable; `containers` is then empty
            because there is nothing to list, not because none uses the share.
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ShareRelocationContainer'
        openPaths:
          type: array
          items:
            type: string
          description: >-
            Every file, relative to the share root, that some process holds
            open on the cache or on an array branch. A file a client or
            container reaches through the pool shows as held open by
            mergerfs itself, so a name is never attributed to it.

    ShareRelocationContainer:
      type: object
      required: [id, name, state, active, mounts]
      properties:
        id:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/AppState'
        active:
          type: boolean
          description: >-
            True for a running, paused or restarting container. Stopping it
            (`stopApp`) is what clears it for a relocation.
        mounts:
          type: array
          items:
            type: string
          description: >-
            The host paths of this container's mounts that use the share.

    StopArrayRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          # Design refs: Q70
          description: >-
            Must be true after reviewing the stop list the Stop array
            confirmation dialog shows: refuse new jobs and interrupt
            non-resumable jobs, shut down running VMs, stop containers, stop
            Samba and NFS, then unmount share paths, the catch-all and data
            disks.

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256

    ShareName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      description: >-
        A share name is a single path segment on every branch and under
        `/mnt/user`.

    ShareCacheMode:
      type: string
      # Design refs: doc 02 §3, Q12
      description: Per-share cache mode.
      enum: [cache-then-move, cache-only, array-only]

    ShareSMB:
      type: object
      required: [enabled, guest, readOnly, browseable, recycle, timeMachine]
      properties:
        enabled:
          type: boolean
        guest:
          type: boolean
        readOnly:
          type: boolean
        browseable:
          type: boolean
        recycle:
          type: boolean
        timeMachine:
          type: boolean
        timeMachineMaxSize:
          type:
            - string
            - "null"
          # Design refs: Q73
          description: >-
            Samba `fruit:time machine max size`, e.g. `500G`. Required when
            timeMachine is true; omitted otherwise.

    ShareNFS:
      type: object
      required: [enabled, hosts, squash]
      properties:
        enabled:
          type: boolean
        hosts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 253
          # Design refs: doc 03 §4.2
          description: >-
            Allowed NFS clients: DNS hostnames, IPv4 or IPv6 addresses, or CIDR
            subnets. Required when enabled is true.
        squash:
          type: string
          # Design refs: doc 03 §4.2
          description: NFS squash option.
          enum: [root_squash, no_root_squash, all_squash]
        fsid:
          type: string
          format: uuid
          readOnly: true
          # Design refs: #350, #351
          description: >-
            The fsid= value written for this share's NFS export line. Derived
            from the share name only; ignored on a create or update request.
            Always present on a response — a draft preview can use the saved
            share's fsid because a share cannot be renamed.

    ShareDiskUsage:
      type: object
      required: [disk, bytes]
      properties:
        disk:
          type: string
          description: Data disk mount point currently holding files for this share.
        bytes:
          type: integer
          format: int64
          minimum: 0

    ShareUsage:
      type: object
      required: [totalBytes, perDisk, asOf]
      # Design refs: doc 02 §1, doc 03 §4.1-4.2, #223
      description: >-
        Bytes used and per-disk distribution as of the last sync — computed once
        as a step of the sync job, from SnapRAID's own tracked state, never a
        live directory walk.
      properties:
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        perDisk:
          type: array
          items:
            $ref: '#/components/schemas/ShareDiskUsage'
          # Design refs: doc 03 §4.2
          description: >-
            Which disks currently hold this share's files, and how much. A disk
            this share does not currently occupy is simply absent, not a zero
            entry.
        asOf:
          type: string
          format: date-time
          description: When the sync that produced these figures completed.

    MoverSkippedEntry:
      type: object
      required: [share, path, result]
      # Design refs: doc 09 §2, doc 03 §3.6
      description: >-
        One file the mover chose not to move (or could not move), with why (the
        skipped-because-in-use list).
      properties:
        share:
          type: string
        path:
          type: string
          description: Path relative to the share root.
        bytes:
          type: integer
          format: int64
          minimum: 0
        result:
          type: string
          description: >-
            The mover's own result code (e.g. skipped_open,
            skipped_grace_period, conflict).
        reason:
          type: string
          description: Optional human detail (error text or skip reason).

    MoverRunResult:
      type: object
      required: [startedAt, finishedAt, durationMs, filesMoved, bytesMoved, interrupted, skipped]
      # Design refs: #273, doc 09 §2
      description: >-
        Structured outcome of one finished mover run, persisted in SQLite rather
        than only in the job log.
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
        filesMoved:
          type: integer
          format: int32
          minimum: 0
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
        interrupted:
          type: boolean
          description: True when the run stopped early (cancel, stop, or context).
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MoverSkippedEntry'

    CacheUsageBreakdown:
      type: object
      required: [appdataBytes, pendingMovesBytes, otherBytes, computedAt]
      # Design refs: doc 03 §3.6, Q87, Q13
      description: >-
        Cache disk byte breakdown for the cache page, computed as a by-product
        of each mover run — never a live directory walk on a timer.
      properties:
        appdataBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes under cache-only shares (appdata and similar).
        pendingMovesBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Bytes still under cache-then-move shares, waiting for a
            future mover pass.
        otherBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Remaining used bytes on the cache filesystem (statfs used
            minus appdata and pending), including non-share paths.
        computedAt:
          type: string
          format: date-time

    Share:
      type: object
      required: [name, path, cacheMode, createPolicy, smb, nfs, usage, createdAt, updatedAt]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        path:
          type: string
          # Design refs: D10
          description: >-
            The share's mount path (`/mnt/user/<name>`).
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ShareUsage'
          # Design refs: doc 03 §4.1-4.2
          description: >-
            Null when this share has not been through a sync since it was
            created — an honest "not yet synced" state, never a zero or
            placeholder that looks like real data.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        minFreeSpace:
          type: string
          # Design refs: doc 09 §1
          description: >-
            The share's own mergerfs `minfreespace`, such as `1000K`. Absent
            when the share uses the array's. An Unraid import sets it from the
            share's floor.
        migration:
          $ref: '#/components/schemas/ShareMigration'

    ShareMigration:
      type: object
      # Design refs: doc 05 §4 step 15
      description: >-
        What the Unraid import recorded about a share it created. Absent on a
        share the import did not create.
      required: [notes]
      properties:
        targetCacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        notes:
          type: array
          description: >-
            What could not be mapped exactly, in plain language: High-water
            allocation mapped to Balance across disks, a split level Hoserva
            has no setting for, a security mode it has no equivalent of.
          items:
            type: string

    CreateShareRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    UpdateShareRequest:
      type: object
      properties:
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    ConfirmShareRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — removes the share definition only.

    DeleteShareDataRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          # Design refs: doc 03 §4.2
          description: Must equal the share name (typed confirmation).

    ShareBrowseEntry:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, directory]
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        disk:
          type: string
          description: >-
            Holding disk from mergerfs `user.mergerfs.basepath`. Empty
            when the xattr is absent.

    ShareBrowseResult:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
          description: Listed directory, relative to the share root.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShareBrowseEntry'

    UserSummary:
      type: object
      required: [id, username, role, totpEnrolled, hasCredential, lastLogin, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.
        hasCredential:
          type: boolean
          # Design refs: doc 03 §7
          description: >-
            Whether a Samba/password credential (SMB access) is currently
            provisioned for this account. Set the first time setUserPassword
            succeeds for it; there is no separate action that clears it short of
            deleting the account.
        lastLogin:
          type: string
          format: date-time
          nullable: true
          # Design refs: doc 03 §7
          description: >-
            When this account last completed sign-in, tracked at authentication
            time — never derived from whether a session is still live. Null when
            it has never signed in.
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        role:
          type: string
          # Design refs: Q27
          description: Defaults to share-only when omitted.
          enum: [viewer, share-only]

    UpdateUserRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, share-only]

    SetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 127
          description: >-
            Capped at 127 characters, not LoginRequest's 1024: this
            password is also written to the Samba passdb entry, and
            smbpasswd/pdbedit's own NTLM hash has never supported more.

    ShareAccessLevel:
      type: string
      # Design refs: Q27, doc 03 §7
      description: >-
        A user or group's access to one share.
      enum: [none, read-only, read-write]

    UserSharePermission:
      type: object
      required: [shareName, access]
      properties:
        shareName:
          $ref: '#/components/schemas/ShareName'
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    UserSharePermissionsResult:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UpdateUserSharePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UserPermissionEntry:
      type: object
      required: [userId, username, access]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    GroupPermissionEntry:
      type: object
      required: [groupId, name, access]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    SharePermissionsResult:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserPermissionEntry'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPermissionEntry'

    UpdateSharePermissionsRequest:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            type: object
            required: [userId, access]
            properties:
              userId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'
        groups:
          type: array
          items:
            type: object
            required: [groupId, access]
            properties:
              groupId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'

    UserGroup:
      type: object
      required: [id, name, memberUserIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberUserIds:
          type: array
          items:
            type: string
            format: uuid

    CreateUserGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    SetUserGroupMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid

    Session:
      type: object
      required: [id, userId, username, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: The session's token hash — never the raw session token.
        userId:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ApiTokenRole:
      type: string
      # Design refs: Q43, Q27
      description: >-
        A token's own scope, always admin or viewer — never share-only, since a
        share-only account has no API access to scope.
      enum: [admin, viewer]

    CreateApiTokenRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A caller-chosen label distinguishing this token from an account's others.
        role:
          $ref: '#/components/schemas/ApiTokenRole'

    ApiTokenSummary:
      type: object
      required: [id, userId, username, name, role, createdAt]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time

    ApiTokenCreated:
      type: object
      required: [id, userId, username, name, role, createdAt, token]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          # Design refs: doc 01 §7
          description: >-
            The raw bearer value — shown once, on creation, and never
            retrievable again.

    BackupDestinationType:
      type: string
      enum: [local, smb, s3, sftp, webdav, rclone]
      # Design refs: Q72
      description: >-
        `local` is a directory — the boot device, the pool, or an external
        disk's mount. Every other type is written through rclone: `smb`, `s3`
        (any S3-compatible store), `sftp`, `webdav`, or `rclone` for a remote
        already set up in rclone's own config. An NFS share is a local
        destination at the path the host has mounted it.

    BackupRetention:
      type: object
      required: [daily, weekly, monthly]
      properties:
        daily:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        weekly:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        monthly:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000

    BackupDestination:
      type: object
      required: [id, name, type, path, enabled, encrypt, retention, hasSecrets, stale, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/BackupDestinationType'
        path:
          type: string
          description: >-
            The directory for a local destination; for a remote one, the
            path within it (bucket and prefix, share and folder).
        options:
          type: object
          additionalProperties:
            type: string
          description: The non-secret rclone settings of a remote destination.
        enabled:
          type: boolean
        encrypt:
          type: boolean
          # Design refs: Q80
          description: Always true for a remote destination.
        retention:
          $ref: '#/components/schemas/BackupRetention'
        hasSecrets:
          type: boolean
          description: Whether credentials are stored for this destination.
        lastSuccessfulBackupAt:
          type: string
          format: date-time
          description: Absent until a backup has been written here.
        stale:
          type: boolean
          description: >-
            An enabled destination that has gone two days without a
            successful backup, counted from its creation until its first.
        createdAt:
          type: string
          format: date-time

    CreateBackupDestinationRequest:
      type: object
      required: [name, type, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/BackupDestinationType'
        path:
          type: string
          description: >-
            An absolute directory for `local`. For a remote type, the path
            within it: `smb` needs the share name first, `s3` the bucket.
        options:
          type: object
          additionalProperties:
            type: string
          description: >-
            rclone's own option names. `smb`: `host`, `user`, `port`,
            `domain`. `s3`: `access_key_id`, `provider`, `endpoint`,
            `region`. `sftp`: `host`, `user`, `port`, `key_file`, `known_hosts_file`
            (without it rclone does not verify the host key). `webdav`:
            `url`, `user`, `vendor`. `rclone`: `remote`, the name of a
            configured rclone remote. Any other key is refused.
        secrets:
          type: object
          additionalProperties:
            type: string
          description: >-
            `smb`, `webdav` and `sftp`: `pass`. `s3`: `secret_access_key`.
            Write-only.
        enabled:
          type: boolean
          description: Defaults to true.
        encrypt:
          type: boolean
          description: >-
            Opt-in for a local destination. A remote destination is always
            encrypted; sending false is refused.
        retention:
          $ref: '#/components/schemas/BackupRetention'

    UpdateBackupDestinationRequest:
      type: object
      properties:
        enabled:
          type: boolean
        retention:
          $ref: '#/components/schemas/BackupRetention'

    BackupDestinationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: Why the test failed, present only when success is false.

    RestoreDrill:
      type: object
      properties:
        lastRun:
          $ref: '#/components/schemas/RestoreDrillRun'

    RestoreDrillRun:
      type: object
      required: [ranAt, passed, destinations]
      properties:
        ranAt:
          type: string
          format: date-time
        passed:
          type: boolean
          description: >-
            True only when the newest archive on every enabled destination
            verified.
        error:
          type:
            - string
            - "null"
          description: >-
            Why the drill could not test any destination at all (none is
            enabled, the destinations could not be listed, or the drill could
            not be started). Absent when it tested them.
        destinations:
          type: array
          description: What the drill found on each destination it tested.
          items:
            $ref: '#/components/schemas/RestoreDrillDestination'

    RestoreDrillDestination:
      type: object
      required: [destinationId, destinationName, passed]
      properties:
        destinationId:
          type: string
        destinationName:
          type: string
        passed:
          type: boolean
        archive:
          type:
            - string
            - "null"
          description: >-
            The archive that was fetched and verified. Absent when the
            destination held none.
        error:
          type:
            - string
            - "null"
          description: Why the destination failed. Absent when it passed.

    MigrationPhase:
      type: string
      description: >-
        `imported` is an adopted array waiting for its point of no return:
        the data disks are mounted read-only and parity and cache are
        untouched (`startMigrationImport`). The verify phase
        (`startMigrationVerify`) moves it to `verifying` while it runs, to
        `verify_failed` when it found a mismatch or did not finish, and to
        `verified` when every comparison passed; only `verified` leads to the
        point of no return (`initializeMigrationParity`). `initializing` is a
        point of no return that stopped after the former parity and cache
        disks were formatted and recorded: running it again finishes it and
        erases nothing.
      enum: [none, scanning, scan_failed, scanned, imported, verifying, verify_failed, verified, initializing]

    MigrationImportRole:
      type: string
      enum: [parity, data, cache, ignore]

    MigrationImportDisk:
      type: object
      description: >-
        One disk of the mapping, named by its stable identity and never by a
        `/dev` name. Give `serial` or `wwn`; the cache on a spare partition of
        the boot disk gives `byId` and `partUuid` instead.
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/MigrationImportRole'
        serial:
          type: string
        wwn:
          type: string
        byId:
          type: string
          description: The spare boot-disk partition's `/dev/disk/by-id` name (cache only).
        partUuid:
          type: string
          description: The spare boot-disk partition's PARTUUID (cache only).

    MigrationImportRequest:
      type: object
      required: [confirm]
      properties:
        roles:
          type: array
          description: >-
            The disk-role mapping, at least one disk. Required unless `undo`
            is true, and omitted then.
          items:
            $ref: '#/components/schemas/MigrationImportDisk'
        confirm:
          type: boolean
          description: >-
            Must be true: the user has checked the mapping against the serial
            table.
        undo:
          type: boolean
          description: >-
            Take a pending import back instead of adopting disks.

    MigrationCheckStatus:
      type: string
      description: >-
        `refuse` blocks the migration; `flag` and `warn` need attention before
        it goes ahead; `info` and `pass` do not.
      enum: [pass, warn, flag, refuse, info]

    MigrationVerdict:
      type: string
      enum: [go, go_with_warnings, no_go]

    MigrationReportRow:
      type: object
      required: [check, status, detail]
      properties:
        check:
          type: string
          description: >-
            Which check the row belongs to, such as `unraid_version`,
            `capture`, `boot_device`, `disk_mapping`, `disk_identity`,
            `parity_config`, `parity_size`, `data_disks`, `disk_integrity`,
            `baseline`, `content_space`, `smart`, `parity_history`,
            `shares`, `cache_contents`, `users`, `docker_templates`,
            `containers`, `user_scripts`, `plugins`, `custom_config`,
            `settings`, `uid_99` or `sync_estimate`. Later parts of the scan
            add checks without changing this shape.
        status:
          $ref: '#/components/schemas/MigrationCheckStatus'
        subject:
          type: string
          description: A slot, pool or device the row is about. Absent for the whole system.
        detail:
          type: string

    MigrationReport:
      type: object
      required: [generatedAt, unverifiedLayout, verdict, rows]
      properties:
        generatedAt:
          type: string
          format: date-time
        unraidVersion:
          type: string
          description: From the first line of the flash's `changes.txt`. Absent when it states none.
        unverifiedLayout:
          type: boolean
          # Design refs: Q24
          description: >-
            True when the scan ran only because `unverifiedLayout` overrode the
            refusal of the version or flash layout.
        verdict:
          $ref: '#/components/schemas/MigrationVerdict'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MigrationReportRow'
        review:
          $ref: '#/components/schemas/MigrationReview'

    MigrationUnraidRole:
      type: string
      description: >-
        The role the capture records for a disk. `unassigned` is a disk of this
        machine the capture does not name, and is given only when the capture's
        `disks.ini` could be read.
      enum: [parity, data, cache, boot, unassigned]

    MigrationProposedRole:
      type: string
      # Design refs: doc 05 §4, doc 01 §6
      description: >-
        The Hoserva role the import pre-fills. Absent when nothing is proposed:
        no disk of this machine matched the slot, the disk is refused, or the
        capture has no `disks.ini`. A disk that is an Unraid boot device, or a
        parity or data slot's disk that is one, is only ever `ignore`, except
        that the cache pool's row of an internal boot that shares its disk with
        the cache (`unraidBoot`) is `cache`. The disk this machine boots from is
        never proposed a role as a parity or data slot's disk; as the cache
        pool's disk (the shared NVMe) it is `cache`.
      enum: [parity, data, cache, ignore]

    MigrationRefusalCode:
      type: string
      # Design refs: Q22, Q23, Q21
      description: >-
        Why the scan refused a disk, as a code beside the row's prose.
        `boot_device` is an Unraid boot device given a data or parity slot;
        `host_boot` the disk this machine boots from, given a parity or data
        slot (the cache pool may share it); `failed` a disk reported failed;
        `encrypted`, `zfs`, `unsupported_filesystem`, `filesystem_mismatch` and
        `no_filesystem` the disk's filesystem; `no_filesystem_node` and
        `duplicate_uuid` a disk Hoserva cannot mount by filesystem UUID;
        `multi_device_btrfs` a btrfs filesystem spanning several devices;
        `filesystem_unverified` a btrfs or ext4 disk whose superblock could not
        be read; `pending_log` a log that was never replayed; `integrity_check`
        a failed read-only filesystem check; `unreadable` a disk that passed its
        checks but could not be read completely; `weak_identity_parity` a parity
        disk with only a weak identity.
      enum:
        - boot_device
        - host_boot
        - failed
        - encrypted
        - zfs
        - unsupported_filesystem
        - filesystem_mismatch
        - no_filesystem
        - no_filesystem_node
        - duplicate_uuid
        - multi_device_btrfs
        - filesystem_unverified
        - pending_log
        - integrity_check
        - unreadable
        - weak_identity_parity

    MigrationDisk:
      type: object
      description: >-
        One row of the disk mapping table: a disk the capture names, an Unraid
        boot device, or a disk of this machine the capture does not name. A
        field that is absent is unknown, never zero, none or strong.
      required: [refused]
      properties:
        slot:
          type: string
          description: >-
            The capture's slot or pool (`disk1`, `parity`, `pool cache`), or
            `boot` for a boot device. Absent for a disk the capture does not
            name.
        diskNumber:
          type: integer
          description: The Unraid disk number of a data slot.
        unraidId:
          type: string
          description: The identity Unraid recorded for the slot.
        unraidRole:
          $ref: '#/components/schemas/MigrationUnraidRole'
        proposedRole:
          $ref: '#/components/schemas/MigrationProposedRole'
        unraidBoot:
          type: boolean
          description: >-
            True when this row's disk is also an Unraid boot device, whatever
            the row's slot: the cache pool of an internal boot that shares its
            disk with the cache (proposed `cache`), or a parity or data slot
            that names a boot device (refused as `boot_device` and proposed
            `ignore`). The disk is this one row, never a second `boot` row
            beside it. Absent otherwise.
        hostBoot:
          type: boolean
          # Design refs: doc 01 §6
          description: >-
            True when this row's disk is the disk this machine boots from, which
            is the scan's own boot-disk detection, not a second one: Debian is
            installed on it. False when a disk of this machine matched the row
            and is not that disk. Absent when no disk of this machine matched,
            and in a report made before the field existed; absent means unknown,
            never false. On the cache pool's row, true is the shared NVMe.
        device:
          type: string
          description: This machine's device for the disk. Absent when none matched.
        serial:
          type: string
        wwn:
          type: string
        byId:
          type: string
          description: The disk's `/dev/disk/by-id` name.
        model:
          type: string
        size:
          type: integer
          format: int64
          description: >-
            Bytes: this machine's disk, or the size Unraid recorded when none
            matched.
        filesystem:
          type: string
          description: The filesystem this machine's disk reports.
        weakIdentity:
          type: boolean
          # Design refs: Q21
          description: >-
            True when only a weak identity identifies the disk. Absent when no
            disk of this machine matched.
        problem:
          type: string
          description: Why no disk of this machine matched the slot.
        refused:
          type: boolean
          description: Whether the scan refused the disk, as its report rows say.
        refusalCode:
          $ref: '#/components/schemas/MigrationRefusalCode'
        refusal:
          type: string
          description: The refusal in words, as the report's row says it.

    MigrationSharePreview:
      type: object
      required: [name, highWater, include, exclude, warningCount]
      properties:
        name:
          type: string
        allocationMethod:
          type: string
          description: >-
            Unraid's allocation method as the share's config gives it
            (`fillup`, `mostfree`, `highwater`). Absent when it sets none.
        highWater:
          type: boolean
          # Design refs: Q11
          description: >-
            True for High-water, which has no exact equivalent.
        include:
          type: array
          description: The disks the share is limited to. Empty means any.
          items:
            type: string
        exclude:
          type: array
          description: The disks the share is kept off.
          items:
            type: string
        warningCount:
          type: integer
          description: How many things the share's report row flags or warns about.

    MigrationBootMode:
      type: string
      enum: [usb, internal]

    MigrationBoot:
      type: object
      # Design refs: doc 05 §5
      description: >-
        Where Unraid boots from, for the planned layout and rollback wording.
        Every field is absent when the capture does not say.
      properties:
        mode:
          $ref: '#/components/schemas/MigrationBootMode'
        mirrored:
          type: boolean
          description: Whether an internal boot pool is a mirrored pair. Only for `internal`.
        sharedWithCache:
          type: boolean
          description: >-
            Whether an internal boot device also holds Unraid's cache, which
            is re-created, not adopted. Only for `internal`.

    MigrationCaptureState:
      type: string
      # Design refs: Q89
      description: >-
        `missing` when the source has no capture, `unreadable` when it is there
        and does not parse, `stale` when a template on the flash was saved after
        it was taken, `present` otherwise.
      enum: [present, missing, unreadable, stale]

    MigrationCapture:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/MigrationCaptureState'
        capturedAt:
          type: string
          format: date-time
          description: >-
            When the capture was taken. Absent when it states no time or one
            that is not a timestamp; a `present` capture with no `capturedAt`
            was not checked for staleness.

    MigrationReview:
      type: object
      required: [disks, shares, boot, capture]
      properties:
        disks:
          type: array
          items:
            $ref: '#/components/schemas/MigrationDisk'
        shares:
          type: array
          description: The shares the import would create.
          items:
            $ref: '#/components/schemas/MigrationSharePreview'
        boot:
          $ref: '#/components/schemas/MigrationBoot'
        capture:
          $ref: '#/components/schemas/MigrationCapture'

    MigrationFlashDevice:
      type: object
      required: [device, size]
      properties:
        device:
          type: string
          description: The disk's device path, which `startMigrationDeviceScan` takes.
        size:
          type: integer
          format: int64
          description: Bytes.
        model:
          type: string
        serial:
          type: string

    Migration:
      type: object
      required: [phase, flashDevices, zipOnly]
      properties:
        phase:
          $ref: '#/components/schemas/MigrationPhase'
        scanError:
          type: string
          description: Why the latest scan did not finish. Present only in `scan_failed`.
        sourceSize:
          type: integer
          format: int64
          description: >-
            The size in bytes of the zip the report was made from. Absent when
            it was made from a flash device.
        sourceReceivedAt:
          type: string
          format: date-time
          description: >-
            When the zip the report was made from was uploaded, or the flash
            device was scanned.
        sourceDevice:
          type: string
          description: >-
            The device the report was read from, when it was made from the
            Unraid USB stick and not from a zip.
        flashDevices:
          type: array
          description: The disks a scan can read as the Unraid USB stick now.
          items:
            $ref: '#/components/schemas/MigrationFlashDevice'
        zipOnly:
          type: boolean
          # Design refs: Q25
          description: >-
            True when the session's capture says Unraid booted from an internal
            device: the Flash Backup zip is the only source and no stick is
            offered.
        report:
          $ref: '#/components/schemas/MigrationReport'
        verify:
          $ref: '#/components/schemas/MigrationVerify'
        parityInit:
          $ref: '#/components/schemas/MigrationParityInit'

    MigrationInitializeParityRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: >-
            The exact typed confirmation `getMigration` `parityInit.confirmation`
            gives, naming every device that will be erased.

    MigrationParityErase:
      type: object
      description: One device the point of no return erases.
      required: [role, device, partition]
      properties:
        role:
          type: string
          enum: [parity, cache]
        device:
          type: string
          description: The device node, as it is named in `confirmation`.
        serial:
          type: string
        wwn:
          type: string
        size:
          type: integer
          format: int64
        partition:
          type: boolean
          description: >-
            True when only a partition of the device's disk is erased (the cache
            of an Unraid boot + data device, or a spare partition of the boot
            disk); the rest of that disk is left alone.

    MigrationParityInit:
      type: object
      description: >-
        What the point of no return (`initializeMigrationParity`) would do now,
        present in the `verified` phase (only a passing verify offers it) and in
        `initializing`. The screen and the command show `unprotectedWindow` and
        `rollback` before asking for `confirmation`.
      required: [finishing, erases, unprotectedWindow, rollback]
      properties:
        finishing:
          type: boolean
          description: >-
            True in `initializing`: the former parity and cache disks are already
            formatted and recorded, and running `initializeMigrationParity` with
            this `confirmation` finishes the rest and erases nothing.
        confirmation:
          type: string
          description: >-
            The exact string `initializeMigrationParity` requires. Absent when
            `problem` is set.
        erases:
          type: array
          description: Every device the point of no return erases; empty when `finishing`.
          items:
            $ref: '#/components/schemas/MigrationParityErase'
        problem:
          type: string
          description: >-
            Why it cannot be offered now (a disk missing, swapped or not
            allowed, or no data disk with the pool's `minfreespace` free);
            no `confirmation` is given.
        unprotectedWindow:
          type: string
          # Design refs: doc 05 §5
          description: >-
            The unprotected window: the array has no redundancy from the moment
            Unraid's array stopped until the initial sync completes.
        rollback:
          type: array
          # Design refs: doc 05 §5
          description: >-
            What rollback means once this is confirmed, for this session's boot
            mode and layout: the general statement first, then the row of the
            table that applies.
          items:
            type: string

    MigrationVerifyCounts:
      type: object
      required: [files, symlinks, special, bytes]
      properties:
        files:
          type: integer
          format: int64
        symlinks:
          type: integer
          format: int64
        special:
          type: integer
          format: int64
          description: The special files, meaning FIFOs, sockets and device nodes.
        bytes:
          type: integer
          format: int64
          description: The sum of the regular files' sizes.

    MigrationVerifyList:
      type: object
      description: >-
        A capped list of paths from the root of the disk or pool, with how
        many there were in all.
      required: [total, paths]
      properties:
        total:
          type: integer
          format: int64
        paths:
          type: array
          items:
            type: string

    MigrationVerifyScope:
      type: object
      description: >-
        The comparison of one disk, or of one share through the pool. A scope
        passes only when `problem` is absent, the expected and found counts are
        equal and every list is empty.
      required: [name, passed, expected, found, hashed, missing, extra, sizeChanged, checksumChanged, changed]
      properties:
        name:
          type: string
          description: >-
            The disk's slot (`disk1`) or the share's name; an empty name is the
            files directly in the pool's root.
        passed:
          type: boolean
        problem:
          type: string
          description: >-
            Why the scope could not be compared at all, such as a disk of the
            baseline that no adopted disk matches.
        expected:
          $ref: '#/components/schemas/MigrationVerifyCounts'
        found:
          $ref: '#/components/schemas/MigrationVerifyCounts'
        hashed:
          type: integer
          format: int64
          description: >-
            How many of the baseline's sample were hashed again on this disk.
            0 for a share: its checksum mismatches are the disks'.
        missing:
          $ref: '#/components/schemas/MigrationVerifyList'
        extra:
          $ref: '#/components/schemas/MigrationVerifyList'
        sizeChanged:
          $ref: '#/components/schemas/MigrationVerifyList'
        checksumChanged:
          $ref: '#/components/schemas/MigrationVerifyList'
        changed:
          $ref: '#/components/schemas/MigrationVerifyList'

    MigrationVerifyDuplicate:
      type: object
      description: A path the baseline has on more than one disk.
      required: [path, disks]
      properties:
        path:
          type: string
        disks:
          type: array
          items:
            type: string

    MigrationVerify:
      type: object
      description: >-
        The result of the latest verify (`startMigrationVerify`), present while
        an import is pending its point of no return. `running` is a verify
        that has not finished; `failed` is a mismatch, an error or a cancelled
        run; only `passed` means every comparison matched.
      required: [status, startedAt, duplicates]
      properties:
        status:
          type: string
          enum: [running, passed, failed]
        error:
          type: string
          description: Why the verify could not finish. Absent for a mismatch.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        disks:
          type: array
          items:
            $ref: '#/components/schemas/MigrationVerifyScope'
        shares:
          type: array
          items:
            $ref: '#/components/schemas/MigrationVerifyScope'
        duplicates:
          type: integer
          format: int64
          description: >-
            How many paths exist on more than one disk. The pool shows each
            once, from the first disk; they are never counted as missing or
            extra.
        duplicateSample:
          type: array
          description: The first of the paths counted in `duplicates`.
          items:
            $ref: '#/components/schemas/MigrationVerifyDuplicate'

    MigrationTemplateClass:
      type: string
      description: >-
        What a dockerMan template stands for in the Phase A capture:
        `autostart` (on Unraid's autostart list), `running`, `stopped`,
        `template_only` (a template with no container), or `unknown` for
        every template when the capture has no usable container list.
      enum: [autostart, running, stopped, template_only, unknown]

    MigrationTemplateStatus:
      type: string
      # Design refs: Q36
      description: >-
        How a conversion reads. `clean` means no warning of class
        `untranslated_flag`, `untranslated_field`, `flagged_path`,
        `missing_network` or `conflict`. `warnings` has at least one. `failed`
        is a template the converter could not read. `previewed` is a Compose
        Manager project's `compose.yaml`, which is never converted. `missing` is
        a project whose `compose.yaml` is not in the source.
      enum: [clean, warnings, failed, previewed, missing]

    MigrationTemplateCounts:
      type: object
      required: [clean, withWarnings, failed, templateOnly, allTemplates, composeProjects]
      properties:
        clean:
          type: integer
          # Design refs: Q36
          description: Counted templates that convert cleanly.
        withWarnings:
          type: integer
          description: Counted templates that convert with at least one warning that needs manual action.
        failed:
          type: integer
          description: Counted templates the converter could not read. Never part of `clean`.
        templateOnly:
          type: integer
          description: >-
            Templates with no container on the source server. They are
            converted and previewable and are in none of the counts above.
        allTemplates:
          type: boolean
          description: >-
            True when the capture has no container list, so nothing says which
            templates are installed and `clean`, `withWarnings` and `failed`
            cover every template.
        composeProjects:
          type: integer
          description: Compose Manager projects whose `compose.yaml` is previewed. Not converted and not in the counts above.

    MigrationTemplateSummary:
      type: object
      required: [name, file, class, counted, status, warningCount]
      properties:
        name:
          type: string
          description: The template's `<Name>`, the name its container is matched on.
        file:
          type: string
          description: The template's file name, which `getMigrationTemplate` takes.
        class:
          $ref: '#/components/schemas/MigrationTemplateClass'
        counted:
          type: boolean
          description: Whether the template is in the report's clean and warning counts.
        status:
          $ref: '#/components/schemas/MigrationTemplateStatus'
        warningCount:
          type: integer
          description: >-
            The warnings that make a conversion not clean. The writable-layer
            warning every conversion carries and the notes are not counted;
            the preview lists every warning.
        error:
          type: string
          description: Why the converter could not read the template. Present only when `status` is `failed`.
        autostartPosition:
          type: integer
          description: The 1-based place on Unraid's autostart list. Absent off the list.

    MigrationComposeProjectSummary:
      type: object
      required: [name, containers, status]
      properties:
        name:
          type: string
          description: The project's name, which `getMigrationTemplate` takes.
        containers:
          type: array
          items:
            type: string
          description: The containers the capture shows the project running.
        status:
          $ref: '#/components/schemas/MigrationTemplateStatus'
        error:
          type: string
          description: Why the project's `compose.yaml` could not be read. Present only when `status` is `failed`.

    MigrationTemplates:
      type: object
      required: [counts, templates, composeProjects]
      properties:
        counts:
          $ref: '#/components/schemas/MigrationTemplateCounts'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/MigrationTemplateSummary'
          description: Every template that parsed, by file name.
        composeProjects:
          type: array
          items:
            $ref: '#/components/schemas/MigrationComposeProjectSummary'

    MigrationTemplatePreview:
      type: object
      required: [kind, name, status, source, warnings, privileges]
      properties:
        kind:
          type: string
          enum: [template, compose_project]
        name:
          type: string
          description: The template's file name, or the project's name.
        title:
          type: string
          description: A template's `<Name>`. Absent for a project.
        class:
          $ref: '#/components/schemas/MigrationTemplateClass'
        counted:
          type: boolean
          description: Whether a template is in the report's clean and warning counts. Absent for a project.
        status:
          $ref: '#/components/schemas/MigrationTemplateStatus'
        source:
          type: string
          description: The template XML, or the project's `compose.yaml`, as the flash holds it.
        compose:
          type: string
          description: >-
            The generated Compose file, or the project's own `compose.yaml`.
            Not applied anywhere. Absent when the converter failed.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ConversionWarning'
          description: Every warning of a converted template. Empty for a project.
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePrivilege'
          description: The privilege summary of the Compose content.
        error:
          type: string
          description: Why the template or project could not be read. Present only when `status` is `failed`.

    MigrationContainerTemplate:
      type: object
      required: [name, file, class, status, warningCount, creatable, preselected, created]
      properties:
        name:
          type: string
          description: The template's `<Name>`.
        file:
          type: string
          description: The template's file name, which `createMigrationStacks` and `getMigrationTemplate` take.
        class:
          $ref: '#/components/schemas/MigrationTemplateClass'
        status:
          $ref: '#/components/schemas/MigrationTemplateStatus'
        warningCount:
          type: integer
          # Design refs: Q36
          description: The warnings that make a conversion not clean.
        error:
          type: string
          description: Why the converter could not read the template. Present only when `status` is `failed`.
        stack:
          type: string
          description: The name its stack would have. Absent when the template's name cannot make a stack name.
        autostartPosition:
          type: integer
          description: The 1-based place on Unraid's autostart list. Absent off the list.
        autostartWaitSeconds:
          type: integer
          description: The seconds Unraid's autostart list waits after starting it, as a suggestion. Absent when it gives none.
        creatable:
          type: boolean
          description: False for a template the converter could not read.
        preselected:
          type: boolean
          description: >-
            True for a creatable template on Unraid's autostart list whose stack
            does not exist yet, and for nothing else.
        created:
          type: boolean
          description: Whether its stack was created from this migration.

    MigrationContainerProject:
      type: object
      required: [name, containers, status, creatable, created]
      properties:
        name:
          type: string
          description: The project's name, which `createMigrationStacks` and `getMigrationTemplate` take.
        containers:
          type: array
          items:
            type: string
          description: The containers the capture shows the project running.
        status:
          $ref: '#/components/schemas/MigrationTemplateStatus'
        error:
          type: string
          description: Why the project's `compose.yaml` could not be read. Present only when `status` is `failed`.
        stack:
          type: string
          description: The name its stack would have. Absent when the project's name cannot make a stack name.
        creatable:
          type: boolean
          description: False for a project whose `compose.yaml` is missing from the source or could not be read.
        created:
          type: boolean

    MigrationByHandContainer:
      type: object
      required: [name]
      properties:
        name:
          type: string
        image:
          type: string
          description: The image the container was created from. Absent when the capture does not say.

    MigrationContainerStack:
      type: object
      required: [name, source, kind, state, awaiting, checked, checkFailed]
      properties:
        name:
          type: string
          description: The stack's name, which the start, check and confirm operations take.
        source:
          type: string
          description: The template file or Compose Manager project it was created from.
        kind:
          type: string
          enum: [template, compose_project]
        state:
          type: string
          enum: [created, started, confirmed]
          description: >-
            `created` is a stack that was not started by the migration,
            `started` one whose start was queued and that is not confirmed,
            `confirmed` one the user confirmed sees its data.
        autostartPosition:
          type: integer
          description: The 1-based place on Unraid's autostart list. Absent off the list.
        waitSeconds:
          type: integer
          description: The seconds Unraid's autostart list waited after starting it, as a suggestion for the wait before the next. Absent when it gives none.
        awaiting:
          type: boolean
          description: >-
            True for a started stack that is neither confirmed nor known to be
            stopped; also true when that cannot be read. Another stack is not
            started while one is.
        checked:
          type: boolean
          description: Whether a data check has run since the latest start.
        checkFailed:
          type: boolean
          description: Whether that check found a path that is missing, empty or unreadable.

    MigrationContainers:
      type: object
      required: [parityInitialized, templates, composeProjects, byHand, stacks]
      properties:
        parityInitialized:
          type: boolean
          description: Whether the migration is past its point of no return. No stack is created or started before.
        templates:
          type: array
          items:
            $ref: '#/components/schemas/MigrationContainerTemplate'
        composeProjects:
          type: array
          items:
            $ref: '#/components/schemas/MigrationContainerProject'
        byHand:
          type: array
          description: >-
            Containers created by hand. No template describes them, so nothing
            is generated for them: they are recreated by hand.
          items:
            $ref: '#/components/schemas/MigrationByHandContainer'
        stacks:
          type: array
          description: The stacks created from the scan, in the order they are offered for starting.
          items:
            $ref: '#/components/schemas/MigrationContainerStack'
        awaiting:
          type: string
          description: The stack to confirm or stop before another is started. Absent when none.
        next:
          type: string
          description: The stack to start now. Absent when one awaits confirmation or all are confirmed.

    MigrationStackSelection:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: A template's file name or a Compose Manager project's name, as `listMigrationContainers` shows it.
        acknowledged:
          type: boolean
          description: >-
            The user has read this template's warnings (`getMigrationTemplate`)
            and creates its stack all the same. Needed for a conversion with a
            warning that needs manual action; not needed for a clean one or a
            project.

    MigrationStacksRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MigrationStackSelection'

    MigrationStackResult:
      type: object
      required: [name, stack, status]
      properties:
        name:
          type: string
          description: The selection, as sent.
        stack:
          type: string
          description: The stack's name.
        status:
          type: string
          enum: [created, already_created, failed]
        error:
          $ref: '#/components/schemas/Error'

    MigrationStacksCreated:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MigrationStackResult'

    MigrationDataPath:
      type: object
      required: [container, path, destination, status]
      properties:
        container:
          type: string
        path:
          type: string
          description: The host path of the bind mount.
        destination:
          type: string
          description: Where the container sees it.
        status:
          type: string
          enum: [ok, empty, missing, unreadable]
          description: >-
            `ok` for a path that exists and is not empty; `empty` for a
            directory with no entry or a file with no byte; `missing` for a
            path that does not exist; `unreadable` for one that could not be
            read, which is never fine.
        error:
          type: string
          description: Why a path is `unreadable`.

    MigrationContainerCheck:
      type: object
      required: [stack, running, allOk, paths]
      properties:
        stack:
          type: string
        running:
          type: boolean
          description: Whether one of the stack's containers is running.
        allOk:
          type: boolean
          description: Whether every path is `ok`. True when there is no path to check.
        paths:
          type: array
          items:
            $ref: '#/components/schemas/MigrationDataPath'

    MigrationContainerConfirmRequest:
      type: object
      properties:
        acceptFailedCheck:
          type: boolean
          description: Confirm although the data check found a path that is missing, empty or unreadable.

    MigrationChecklistItemId:
      type: string
      enum: [appdata_cache, initial_sync, full_scrub, notifications, schedules, user_scripts, restore_drill]

    MigrationChecklist:
      type: object
      required: [finished, items]
      properties:
        finished:
          type: boolean
          description: >-
            Whether the array record carries the time its migration's point of
            no return finished, which nothing but that step writes. False for a
            migration that is pending, part-way through, or was undone; then
            the checklist does not apply and `items` is empty.
        finishedAt:
          type: string
          format: date-time
          description: That time; present exactly when `finished` is true.
        items:
          type: array
          # Design refs: doc 05 §4
          description: >-
            In the order of the migration's steps.
          items:
            $ref: '#/components/schemas/MigrationChecklistItem'

    MigrationChecklistItem:
      type: object
      required: [id, status, acknowledgeable]
      properties:
        id:
          $ref: '#/components/schemas/MigrationChecklistItemId'
        status:
          type: string
          enum: [todo, done, not_applicable]
        acknowledgeable:
          type: boolean
          description: >-
            True only for `user_scripts` and `restore_drill` while they are not
            acknowledged. An item with a record is never acknowledgeable.
        doneAt:
          type: string
          format: date-time
          description: When the record says it was done, or when it was acknowledged.
        jobId:
          type: string
          description: >-
            The job the item derives from. For `restore_drill`, the latest
            succeeded `fix` job that had a `path` (`startFix`), which an
            acknowledgement records. A fix of the whole array or of one disk is
            not a restore drill and is not shown.
        acknowledgedBy:
          type: string
          description: Who acknowledged it, `local` for the daemon's own socket.
        acknowledgedAt:
          type: string
          format: date-time
        notifications:
          $ref: '#/components/schemas/MigrationChecklistNotifications'
        schedules:
          $ref: '#/components/schemas/MigrationChecklistSchedules'
        scripts:
          type: array
          description: >-
            The User Scripts the scan found, on `user_scripts` only. Empty when
            the scan found none or could not say; the report's User Scripts row
            tells which.
          items:
            $ref: '#/components/schemas/MigrationChecklistScript'

    MigrationChecklistNotifications:
      type: object
      required: [channels, tested, agents]
      properties:
        channels:
          type: integer
          format: int32
          description: How many notification channels exist.
        tested:
          type: integer
          format: int32
          description: >-
            How many are enabled and have a test that succeeded since they last
            changed.
        agents:
          type: array
          description: >-
            The names of the Unraid notification agents the scan found, never
            anything inside them: recreate each as a channel.
          items:
            type: string

    MigrationChecklistSchedules:
      type: object
      required: [mover, sync, scrub, chainStartTime, weeklyScrubDay, offers]
      properties:
        mover:
          type: boolean
          description: Whether the nightly chain's mover step is enabled.
        sync:
          type: boolean
          description: >-
            Whether the nightly chain's sync step is enabled. Unraid has no
            sync schedule to carry over, so the user chooses one.
        scrub:
          type: boolean
          description: Whether the nightly chain's scrub step is enabled.
        chainStartTime:
          type: string
          description: Local time the chain starts, `HH:MM`.
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        offers:
          $ref: '#/components/schemas/MigrationChecklistOffers'

    MigrationChecklistOffers:
      type: object
      description: >-
        Values read from Unraid's configuration that the schedules item offers
        to carry over. A value the flash did not have is absent, never an
        "off".
      properties:
        moverCron:
          type: string
          description: Unraid's mover schedule, as written.
        moverTime:
          type: string
          description: >-
            `HH:MM` when the mover schedule is a daily line, offered as the
            nightly chain's start time.
        parityCheck:
          $ref: '#/components/schemas/MigrationChecklistParityCheck'
        scrubReportOnly:
          type: boolean
          description: >-
            True when Unraid's parity check wrote no corrections, which maps to
            a scrub that only reports.
        spindownDelay:
          type: string
          description: Unraid's global spin-down delay, offered as the default.

    MigrationChecklistParityCheck:
      type: object
      required: [correcting]
      description: >-
        Unraid's parity-check schedule as `dynamix.cfg` wrote it, offered as the
        scrub schedule.
      properties:
        mode:
          type: string
        hour:
          type: string
        dayOfMonth:
          type: string
        day:
          type: string
        month:
          type: string
        frequency:
          type: string
        correcting:
          type: boolean

    MigrationChecklistScript:
      type: object
      required: [name]
      properties:
        name:
          type: string
        schedule:
          type: string
          description: The schedule the plugin's `customSchedule.cron` gives it, absent when it has none there.

    AppdataBackupContainer:
      type: object
      required: [name, image, running, stop, included, databaseImage]
      properties:
        name:
          type: string
        image:
          type: string
          description: The container's image repository, without its tag.
        running:
          type: boolean
        stop:
          type: boolean
          description: >-
            Whether the backup stops the container while its appdata is
            copied. Only a running container is stopped.
        included:
          type: boolean
        databaseImage:
          type: boolean
          description: >-
            Whether the image is a known database (Postgres, MariaDB, MySQL,
            MongoDB, Redis and similar).
        warning:
          type:
            - string
            - "null"
          description: >-
            Present when a known database image is included but not stopped.

    AppdataBackupConfig:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/AppdataBackupContainer'

    SetAppdataBackupContainerRequest:
      type: object
      required: [stop, included]
      properties:
        stop:
          type: boolean
        included:
          type: boolean

    StartAppdataBackupRequest:
      type: object
      properties:
        containers:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Limits the run to these containers; omit for every included one.

    AppdataArchive:
      type: object
      required: [name, container, destinationId, destinationName, createdAt, size, encrypted]
      properties:
        name:
          type: string
          description: The archive's file name on the destination.
        container:
          type: string
        destinationId:
          type: string
        destinationName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: The archive's modification time on the destination.
        size:
          type: integer
          format: int64
        encrypted:
          type: boolean
        reason:
          type:
            - string
            - "null"
          description: >-
            `pre-restore` for the snapshot a restore took of the appdata it
            replaced, `pre-update` for the snapshot taken before a container
            update; absent for an ordinary backup.

    ListAppdataArchivesOK:
      type: object
      required: [archives, unavailable]
      properties:
        archives:
          type: array
          items:
            $ref: '#/components/schemas/AppdataArchive'
        unavailable:
          type: array
          description: Destinations that could not be listed, and why.
          items:
            type: object
            required: [destinationId, message]
            properties:
              destinationId:
                type: string
              message:
                type: string

    PreviewAppdataRestoreRequest:
      type: object
      required: [container, archive, destinationId]
      properties:
        container:
          type: string
          minLength: 1
          maxLength: 255
        archive:
          type: string
          minLength: 1
          maxLength: 512
          description: An archive name from listAppdataArchives.
        destinationId:
          type: string
          minLength: 1
          maxLength: 64

    ConfigImportBlocker:
      type: object
      required: [code, message]
      description: >-
        A refusal `importConfig` would return for this archive.
      properties:
        code:
          type: string
          enum: [incompatible_archive, archive_newer_version, archive_other_installation, archive_array_mismatch, restore_path_unsafe]
        message:
          type: string

    ConfigImportNote:
      type: object
      required: [code, message]
      description: >-
        Something about an import that holds whatever the archive contains, or,
        for `host_files_replaced`, about what a bare-metal restore does to this
        server's own files: it names each Samba or NFS file already on the
        server that the restore replaces, which the backup taken first saves.
      properties:
        code:
          type: string
          enum: [sessions_replaced, array_state_kept, host_files_replaced]
        message:
          type: string

    ConfigImportChange:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum:
            - share
            - share_user_permission
            - share_group_permission
            - user
            - user_group
            - user_group_member
            - api_token
            - schedule_chain
            - schedule_job
            - notification_channel
            - notification_route
            - notification_severity
            - notification_quiet_hours
            - backup_destination
            - appdata_backup_container
            - backup_recipient
            - acme
            - ups
            - array_settings
            - host_config
            - external_disk
            - hostname
            - timezone
            - backup_passphrase
            - update_channel
            - update_check
            - custom_config_file
            - template_file
            - stack_file
        name:
          type: string
          description: >-
            What a user calls it: a share name, a username, a schedule job,
            a destination name; `share / user` for a permission,
            `group / user` for a membership, `user / token name` for an
            API token, `event / channel` for a route, the label of an
            external disk, the kind of a host configuration decision, the
            path of a custom config file or template relative to its
            directory, `stack/file` for a stack's compose or `meta.json`
            file.
            Empty for the settings that exist once. A secret or a
            passphrase is reported as changed, never by its value.

    ConfigImportGroup:
      type: object
      required: [category, added, changed, removed]
      properties:
        category:
          type: string
          enum: [shares, accounts, schedules, notifications, backup, system, custom_config, templates, stacks]
        added:
          type: array
          description: In the archive, not in the live configuration.
          items:
            $ref: '#/components/schemas/ConfigImportChange'
        changed:
          type: array
          description: In both, with different content.
          items:
            $ref: '#/components/schemas/ConfigImportChange'
        removed:
          type: array
          description: In the live configuration, not in the archive.
          items:
            $ref: '#/components/schemas/ConfigImportChange'

    ConfigImportArchive:
      type: object
      required: [timestamp, host, hoservaVersion, schemaVersion]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the archive was taken.
        host:
          type: string
        hoservaVersion:
          type: string
        schemaVersion:
          type: string
          description: The database schema version of the archive.

    ConfigImportSecretsStatus:
      type: string
      enum: [none, opened, no_passphrase, passphrase_incorrect]
      description: >-
        The state of one of the archive's passphrase-protected files,
        `secrets.age` or `identity.age`; the field using it says which.
        `none`: the archive has no such file. `opened`: the file is there and
        the passphrase available opens it. `no_passphrase`: the file is there
        and no passphrase is available. `passphrase_incorrect`: the file is
        there and the passphrase available does not open it.

    ConfigImportSecrets:
      type: object
      required: [status, stacks]
      properties:
        status:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
          description: >-
            The status of the archive's `secrets.age`, which holds its
            database secrets and stack `.env` files.
        identity:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
          description: >-
            The same status for the archive's `identity.age`, the backup
            recipient's private identity: `opened` means a bare-metal
            restore adopts the archive's recipient; otherwise this box keeps
            its own. Always present in a response; an in-place import never
            replaces the recipient, so it only reports.
        stacks:
          type: array
          description: >-
            The stacks of the archive whose `.env` files would not be
            restored; empty when `status` is `opened`.
          items:
            type: string

    ConfigImportPreview:
      type: object
      required: [archive, liveSchemaVersion, blockers, groups, secrets, notes]
      properties:
        archive:
          $ref: '#/components/schemas/ConfigImportArchive'
        liveSchemaVersion:
          type: string
        blockers:
          type: array
          description: >-
            Refusals `importConfig` would return for this archive; empty
            when it would go ahead (a running job, which is not a property
            of the archive, refuses it too).
          items:
            $ref: '#/components/schemas/ConfigImportBlocker'
        groups:
          type: array
          description: >-
            One entry per category, in a fixed order, each listing what an
            import would add, change or remove. History and runtime tables
            (jobs, the audit log, spin events, notification deliveries and
            alerts, usage, mover and cache results) are not listed. Empty
            when the schema versions differ.
          items:
            $ref: '#/components/schemas/ConfigImportGroup'
        secrets:
          $ref: '#/components/schemas/ConfigImportSecrets'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/ConfigImportNote'
        bareMetal:
          $ref: '#/components/schemas/ConfigImportBareMetal'

    ConfigImportDiskState:
      type: string
      enum: [matched, absent, replaced, ambiguous]
      # Design refs: Q21
      description: >-
        `matched`: exactly one attached disk carries the recorded identity (WWN,
        else serial; a weak-identity disk by filesystem UUID and size) and its
        filesystem is the recorded one. `absent`: no attached disk is it.
        `replaced`: the identity or the filesystem differs, either an attached
        disk holds the recorded filesystem with another identity or the disk
        with the recorded identity holds another filesystem. `ambiguous`: more
        than one attached disk matches, a disk and its clone. A disk that is not
        `matched` stays a row of the restored array with its recorded
        filesystem, is never mounted or adopted by the restore, and leaves the
        array degraded.

    ConfigImportDisk:
      type: object
      required: [name, role, roleIndex, mountpoint, fsUuid, weakIdentity, state]
      description: One array disk the archive records, and what it matched.
      properties:
        name:
          type: string
          description: >-
            What a user calls it: the role and index, its mountpoint and the
            identity it was recorded with.
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        roleIndex:
          type: integer
          format: int64
          minimum: 1
        mountpoint:
          type: string
        fsUuid:
          type: string
          description: The filesystem UUID the archive records for the slot.
        wwn:
          type: string
        serial:
          type: string
        byIdName:
          type: string
        weakIdentity:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/ConfigImportDiskState'
        device:
          type: string
          description: >-
            The attached disk it matched, or the disk holding its filesystem
            when `replaced`; absent for `absent` and `ambiguous`.

    ConfigImportDiskMappingEntry:
      type: object
      required: [role, roleIndex, device]
      properties:
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        roleIndex:
          type: integer
          format: int64
          minimum: 1
        device:
          type: string
          minLength: 1
          maxLength: 256
          description: The attached disk the slot was matched to.

    ConfigImportDiskMapping:
      type: object
      required: [disks]
      description: >-
        The mapping of the archive's array disks to the attached disks that
        a user confirms: one entry per `matched` disk, and none for any
        other. An empty list confirms an archive that records no array
        disks, or that none of its disks is attached.
      properties:
        disks:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/ConfigImportDiskMappingEntry'

    ConfigImportBareMetal:
      type: object
      required: [schemaUpgrade, disks, diskMapping]
      # Design refs: doc 10 §1
      description: >-
        The bare-metal restore of an archive onto a fresh install, present when
        the installation has no array configured and the archive's schema is not
        newer.
      properties:
        schemaUpgrade:
          type: boolean
          description: >-
            The archive's database is older than the running schema and is
            upgraded, on a staged copy, by the migration runner.
        disks:
          type: array
          items:
            $ref: '#/components/schemas/ConfigImportDisk'
        diskMapping:
          $ref: '#/components/schemas/ConfigImportDiskMapping'

    ConfigImportRestored:
      type: object
      required: [category, added, changed, removed]
      description: >-
        What one category of the import brought in: `added` was in the
        archive and not on this machine, `changed` differed, `removed` was
        on this machine and not in the archive. What was identical is not
        counted.
      properties:
        category:
          type: string
          enum: [shares, accounts, schedules, notifications, backup, system, custom_config, templates, stacks, stack_env]
          description: >-
            The categories of `ConfigImportGroup`, and `stack_env`, the
            stacks' `.env` files, counted by stack, of which `removed` is
            always 0.
        added:
          type: integer
          format: int64
        changed:
          type: integer
          format: int64
        removed:
          type: integer
          format: int64

    ConfigImportNotRestored:
      type: object
      required: [kind, name, reason, message]
      properties:
        kind:
          type: string
          enum: [stack_env, disk, database_secret, backup_recipient]
        name:
          type: string
          description: >-
            The stack whose `.env` file it is (`stack_env`), the array disk
            by its `ConfigImportDisk.name` (`disk`), the table and column
            of a database secret cleared by a bare-metal restore, with the
            row it was in (`database_secret`), or `backup_recipient`, the
            archive's backup recipient, which a bare-metal restore adopts
            only when `identity.age` opens and otherwise leaves this box's
            own in place.
        reason:
          type: string
          enum: [no_secrets, no_passphrase, passphrase_incorrect, stack_not_in_archive, left_in_place, disk_absent, disk_replaced, disk_ambiguous, sealed_under_other_key]
          # Design refs: doc 09 §4
          description: >-
            `no_secrets`, `no_passphrase` and `passphrase_incorrect`: the
            archive's passphrase-protected section could not be opened (see
            `ConfigImportSecretsStatus`; for `backup_recipient`, its
            `identity.age`). `stack_not_in_archive`: that section holds an
            `.env` for a stack the archive has no files of. `left_in_place`: the
            `.env` on this machine was kept because the archive holds none for
            that stack. `disk_absent`, `disk_replaced` and `disk_ambiguous`: a
            bare-metal restore did not match the array disk (see
            `ConfigImportDiskState`), so it stays a row of the restored array,
            unmounted, and the array is degraded: nothing mounts, matched disks
            included, until the degraded array is acknowledged or the replace
            flow adopts a replacement disk. `sealed_under_other_key`: the secret
            was sealed under the machine key of the installation the archive
            came from, which this machine does not have, and the archive holds
            no copy of it it could be sealed again from (no passphrase opened
            its `secrets.age`, or it never carried this secret, like TOTP), so a
            bare-metal restore cleared it.
        message:
          type: string

    ConfigImportPreImportSecrets:
      type: string
      enum: [none, request, configured]
      description: >-
        Which passphrase the pre-import archive's `secrets.age` is sealed
        with. `request`: the one given with the import, which opened the
        imported archive's secrets. `configured`: the configured backup
        passphrase. `none`: the pre-import archive has no `secrets.age`.

    ConfigImportReport:
      type: object
      required: [restored, notRestored, secrets, preImportArchive, preImportSecrets]
      properties:
        restored:
          type: array
          description: One entry per category, in a fixed order.
          items:
            $ref: '#/components/schemas/ConfigImportRestored'
        notRestored:
          type: array
          description: >-
            Everything the import did not restore, each with why. Empty when
            everything in the archive was restored.
          items:
            $ref: '#/components/schemas/ConfigImportNotRestored'
        secrets:
          $ref: '#/components/schemas/ConfigImportSecretsStatus'
          description: The status of the imported archive's `secrets.age`.
        preImportArchive:
          type: string
          description: >-
            The name of the archive of the configuration as it was before
            the import, which a restore can go back to. Empty when no backup
            destination was written to.
        preImportSecrets:
          $ref: '#/components/schemas/ConfigImportPreImportSecrets'

    AppdataRestorePreviewGroup:
      type: object
      required: [files, bytes, sample]
      properties:
        files:
          type: integer
          format: int64
          description: >-
            How many files are in this group. Symbolic links and other
            non-directory entries count as files; directories do not.
        bytes:
          type: integer
          format: int64
          description: >-
            Total size of those files: for `replaced` and `removed` the size
            of the live files that would be lost, for `added` the size of
            the archive's files.
        sample:
          type: array
          description: >-
            The first paths of the group in path order, relative to the
            directory, at most 20. `files` is the full count.
          maxItems: 20
          items:
            type: string

    AppdataRestorePreviewDirectory:
      type: object
      required: [directory, replaced, added, removed]
      properties:
        directory:
          type: string
          description: >-
            The archived directory, relative to the appdata location
            (`jellyfin/config`).
        replaced:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'
        added:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'
        removed:
          $ref: '#/components/schemas/AppdataRestorePreviewGroup'

    AppdataRestorePreview:
      type: object
      required: [container, archive, destinationId, createdAt, directories]
      properties:
        container:
          type: string
        archive:
          type: string
        destinationId:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When the archive was taken.
        directories:
          type: array
          items:
            $ref: '#/components/schemas/AppdataRestorePreviewDirectory'

    RestoreAppdataRequest:
      type: object
      required: [container, archive, destinationId, confirm]
      properties:
        container:
          type: string
          minLength: 1
          maxLength: 255
        archive:
          type: string
          minLength: 1
          maxLength: 512
          description: An archive name from listAppdataArchives.
        destinationId:
          type: string
          minLength: 1
          maxLength: 64
        confirm:
          type: boolean
          description: >-
            Must be true, because the restore overwrites the container's
            appdata.
