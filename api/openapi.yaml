openapi: 3.1.0
info:
  title: Hoserva API
  version: "1.0.0"
  description: >-
    The Hoserva API (doc 01 §5, D18). This file is the whole API — every
    capability the web UI or the CLI has is a documented operation here, and
    nothing else. Go server interfaces, the CLI's Go client and the web UI's
    TypeScript client are generated from it (`make gen`); handlers in
    `internal/api/` implement the generated interfaces, and both clients call
    the API only through their generated code.

    This first version covers the foundation every later feature area builds
    on: `/api/v1/` versioning, the two auth schemes named in doc 01 §5, the
    shared error model, the job resource and its lifecycle (doc 01 §4), and
    every Server-Sent Events event type on `/api/v1/events`. Disk, pool,
    share, container and VM operations arrive with the issues that design
    those subsystems (doc 07 §1) — this spec is extended, never replaced, as
    they land.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Hoserva
    url: https://github.com/mdg-labs/hoserva

tags:
  - name: jobs
    description: The job system (doc 01 §4) — every long-running operation.
  - name: events
    description: Live data over Server-Sent Events (doc 01 §5).
  - name: status
    description: Overall system health (`hoserva status`, doc 01 §3).
  - name: metrics
    description: >-
      Downsampled time series from metrics.db (Q74, doc 02 §4) — throughput,
      CPU, RAM, SMART history. Read-only; never probes block devices.
  - name: pool
    description: Pool topology and per-disk breakdown (`hoserva pool status`).
  - name: disks
    description: Disk inventory and lifecycle (`hoserva disk`, doc 01 §3).
  - name: array
    description: Array start and stop / maintenance mode (Q70, `hoserva array stop|start`).
  - name: parity
    description: SnapRAID sync, scrub and fix through the threshold guard (doc 02 §2).
  - name: mover
    description: >-
      The write cache's mover (doc 09 §2, `hoserva mover run`) — moves a
      cache-then-move share's files onto the array. Reachable on a schedule
      (the nightly chain), a cache-usage threshold, or this manual trigger;
      never continuous.
  - name: config
    description: Config archive export and import (doc 10 §1).
  - name: doctor
    description: Prerequisite and sanity checks (`hoserva doctor`, doc 01 §3).
  - name: users
    description: >-
      Accounts, roles and Samba credentials (Q27, doc 03 §7): the admin,
      viewer and share-only roles, per-account passwords (which write the
      UI credential and the Samba passdb entry together), user groups and
      session list/revoke. Account recovery over the Unix socket (Q78) and
      personal API tokens (Q43) are also under this tag.
  - name: auth
    description: >-
      First-run setup, sessions and TOTP over TCP (doc 01 §5, §7, Q9, Q10,
      Q28, Q44, doc 03 §1). The Unix socket needs none of this — it is
      peer-credential trusted (Q44) — but these operations still run on
      it, unauthenticated, exactly as they do on TCP, since the same
      handlers serve both transports (doc 01 §5).
  - name: notifications
    description: >-
      Alerting channels (email, Gotify, ntfy, Discord webhook, generic
      webhook), per-event routing and quiet hours (doc 03 §8.3, doc 01 §7,
      Q28). Credentials are write-only: a channel response never carries
      the secret it holds, only whether one is configured.
  - name: settings
    description: >-
      General installation settings shared by onboarding and `/settings`
      (doc 03 §1, §8.1). The backup passphrase is write-only (Q28): a
      response never carries it, only whether one is configured. UPS
      connection and shutdown thresholds live under `/settings/ups`
      (doc 03 §8.1, Q77); UPS passwords are write-only (Q28). Self-update,
      rollback and Debian update status live under `/settings/updates`
      (doc 03 §8.6, Q67, Q68). Host networking, TLS certificate expiry,
      LAN-only access scope (Q10) and the listen port live under
      `/settings/network` (doc 03 §8.2, Q75).
  - name: shares
    description: >-
      User shares as first-class SQLite state (D4, doc 03 §4): each share
      has its own mergerfs mount (doc 02 §1, Q12) and Samba is generated
      from the same rows. Per-user and per-group share access (Q27, doc
      03 §7) is stored here too, editable from either the share or the
      user/group; enforcing it in generated Samba/mergerfs config is a
      later issue.

# Two transports (doc 01 §5): a Unix socket for the local root/`hoserva`-group
# CLI, and TLS-only TCP for the web UI and remote/scripted use. Same handlers,
# different auth middleware — the Unix socket is peer-credential trusted and
# carries no bearer/cookie credential of its own, which is why its entry below
# has no `x-hoserva-transport-auth` value: there is nothing for a client to
# attach. The TCP server's operations still declare `security` below; that
# security only applies on this transport.
servers:
  - url: https://{host}:8008/api/v1
    description: TCP, TLS-only. Session cookie for the web UI, personal API tokens (Q43) for scripts and the remote CLI.
    variables:
      host:
        default: localhost
  - url: unix:///run/hoserva/hoserva.sock/api/v1
    description: >-
      Unix socket. Root and the `hoserva` group only (Q44); accepted with no
      auth token because the kernel already vouches for the caller's identity
      via `SO_PEERCRED` — there is no bearer or cookie credential on this
      transport. Used by the local CLI.
    x-hoserva-transport-auth: peer-credentials-trusted

security:
  - sessionCookie: []
  - apiToken: []

paths:
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs
      description: >-
        Every long-running operation is a job (doc 01 §4). Filterable by
        class and status so the UI's jobs page and `hoserva logs` can scope
        what they render without walking the whole history.
      tags: [jobs]
      x-hoserva-role: viewer
      parameters:
        - name: class
          in: query
          schema:
            $ref: '#/components/schemas/JobClass'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The jobs matching the filter, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: Get a job
      description: A single job's current state, by id.
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a job
      description: >-
        Only meaningful where the underlying tool supports cancellation
        (doc 01 §4); a job that cannot be cancelled reports that in its
        `cancellable` field rather than accepting this call and doing
        nothing. A queued or running job is stopped; an interrupted,
        cancellable job is ended `cancelled`. For a data-disk upgrade
        this is the abort (doc 02 §4 E3): refused with
        `job_not_cancellable` once its checkpoint is at releasing,
        whether queued, running or interrupted. A running upgrade is
        answered with the running job and records its outcome once it
        has unmounted everything. A queued or interrupted upgrade is
        unwound first; if that fails it stays interrupted and the call
        is refused with `disk_upgrade_cleanup_failed`, naming what is
        still mounted. `job_abort_in_progress` refuses a second cancel
        while one runs.
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, now in a cancelling or cancelled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      summary: Resume a checkpointed job
      description: >-
        Only resumable job types (mover, rebalance, evacuation, share
        relocation, data- and parity-disk upgrade) persist a checkpoint to
        resume from (Q29). Jobs are never resumed automatically after a
        restart — this operation is always an explicit user action. A
        data-disk upgrade resumes only in maintenance mode (doc 02 §4
        E5); one resumed at its releasing checkpoint is not cancellable.
        Refused with `job_abort_in_progress` while a cancel of the same
        job is unwinding it. Resuming an interrupted mover job is refused
        with 409 `on_battery` while the on-battery hold is active
        (doc 02 §6, Q77).
      tags: [jobs]
      x-hoserva-role: admin
      responses:
        "200":
          description: The job, resumed from its last checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /jobs/{jobId}/log:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJobLog
      summary: Download a job's captured stdout/stderr
      description: Kept for 90 days (Q74).
      tags: [jobs]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The job's captured output, compressed.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /events:
    get:
      operationId: streamEvents
      summary: Stream live events
      description: >-
        Server-Sent Events for job progress, disk state changes, container
        state changes and new notifications (doc 01 §5). Every event type is
        a schema below (`Event`'s member types).

        ogen generates only SSE *clients*, not a server-side encoder for
        `text/event-stream` (confirmed against ogen v1.24.0 — see Q63), so
        `make gen` excludes this one operation from the generated `apiv1`
        server interface and client (`ogen.yml`'s `ignore_not_implemented`).
        The `Event` schema and its variants are still generated code, though:
        `make gen` runs ogen's `jschemagen` against `api/event-schema-root.yaml`
        to produce typed Go structs in `api/gen/go/events`, plus a small
        generated SSE-frame reader alongside them, so a Go client reads this
        stream only through generated types (D18, doc 01 §5). The server-side
        write loop for this route — framing each `Event` over
        `text/event-stream` — is hand-written in `internal/api`
        (`EventsHandler`, issue #19), mounted beside the generated router
        rather than inside it, since ogen generates no security hook for a
        route it doesn't generate a server for either; it is gated by an
        `Authenticate` seam #22 wires to real session/token validation. The
        job system publishes `job_progress` events on every state and
        progress change; disk/container state and notifications arrive with
        the issues that add those subsystems.
      tags: [events]
      x-hoserva-role: viewer
      responses:
        "200":
          description: An unbounded stream of `Event` frames.
          content:
            text/event-stream:
              x-ogen-sse-event-shape: full
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check whether the first-run admin account exists
      description: >-
        Reachable before an admin exists: this operation, createFirstAdmin
        and the SPA's static assets are the only routes that don't refuse
        every request with a "setup required" error while `adminExists` is
        false (#22).
      tags: [auth]
      x-hoserva-role: public
      security: []
      responses:
        "200":
          description: Whether the first-run admin account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        default:
          $ref: '#/components/responses/Error'

  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account
      description: >-
        Reachable only before an admin exists; refused once one does.
        Creating the admin is atomic — a race between two concurrent
        requests can never create two admins (#22). Signs the new admin in
        on success, exactly like login.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirstAdminRequest'
      responses:
        "200":
          description: The admin account, now signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: >-
        Username is matched case-insensitively, using simple lowercasing
        (Go's `strings.ToLower`) rather than full Unicode case folding.
        Password, plus a TOTP code once the account has TOTP enrolled
        (doc 01 §7). Rate-limited and lockout-protected per account and
        per source address (doc 01 §7): an unknown username and a wrong
        password against a real one get the same status and error code
        (`invalid_credentials`), reach lockout (`rate_limited`) at the
        same failure threshold, and cost the same bounded argon2id-shaped
        work either way, for similar timing, under ordinary load — under
        a sustained flood large enough to fill and evict from the
        unknown-username table's own 10,000-entry cap, an unknown
        username's lockout can lift early, where a real account's own
        (never capped or evicted) would not. Once the password is
        correct, `totp_required` (no code supplied) versus `totp_invalid`
        (a wrong one) does reveal that an account has TOTP enrolled — an
        unavoidable, rate-limited signal, not one this API tries to hide.
      tags: [auth]
      x-hoserva-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the current session server-side and clears the cookie.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session's user
      description: The signed-in user this session cookie belongs to.
      tags: [auth]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start TOTP enrolment for the signed-in user
      description: >-
        Generates a new secret (RFC 6238), stored encrypted with the
        machine key (Q28) but not yet active — the account's existing
        active credential, if any, is untouched until confirmTotp
        activates the new one. Enrolling again before confirming replaces
        the still-pending secret. Once TOTP is already active on this
        account, replacing it requires proving the caller still holds the
        account: exactly one of the current password or a current TOTP
        code, in TotpEnrollRequest. Omitting both while TOTP is active is
        refused (totp_reverify_required); supplying both is refused too
        (totp_reverify_ambiguous), since each is one guess at the active
        credential and honouring both would spend two for the price of
        one request. Neither is required for a first enrolment.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        "200":
          description: The new secret, pending confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        default:
          $ref: '#/components/responses/Error'

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm TOTP enrolment
      description: >-
        Activates the pending secret enrollTotp created, once a code
        proves the signed-in user actually has it.
      tags: [auth]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        "204":
          description: TOTP is now active on this account.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels:
    get:
      operationId: listNotificationChannels
      summary: List notification channels
      description: Every configured alerting destination (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every configured channel.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createNotificationChannel
      summary: Add a notification channel
      description: >-
        A credential supplied in `secret` (Q28) is encrypted with the
        machine key before it reaches the database and is never returned
        by any later read — `hasSecret` on the response is the only trace
        of it.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        "201":
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getNotificationChannel
      summary: Get a notification channel
      description: A single channel's current configuration, by id, secret excluded.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationChannel
      summary: Replace a notification channel's configuration
      description: >-
        A full replace, like the request body of createNotificationChannel:
        every type-specific field the request omits is cleared, not left
        as it was. `secret` is tri-state — omitted keeps the existing
        credential, `null` clears it, a string replaces it — since this is
        the one field a response never echoes back for a client to resend
        unchanged (Q28).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationChannelRequest'
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: Also removes every routing entry that named this channel.
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: '#/components/responses/Error'

  /notifications/channels/{channelId}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: sendTestNotification
      summary: Send a test notification through a channel
      description: >-
        Sent immediately, outside the delivery queue and its retry policy
        — this is a synchronous probe of the channel's own configuration,
        not a routed event, so it reports success or the delivery error
        directly rather than being retried and logged like a routed
        notification (doc 03 §8.3: "untested notification config is the
        same as no notification config").
      tags: [notifications]
      x-hoserva-role: admin
      responses:
        "200":
          description: Whether the test notification was delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing:
    get:
      operationId: getNotificationRouting
      summary: Get the full per-event routing matrix
      description: >-
        One entry per event type in doc 03 §8.3's fixed catalog, in the
        order that doc lists them — every event type appears even before
        it has ever been routed anywhere, with its compiled-in default
        severity and an empty channel list.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The routing matrix.
          content:
            application/json:
              schema:
                type: object
                required: [routing]
                properties:
                  routing:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/routing/{eventType}:
    parameters:
      - $ref: '#/components/parameters/EventType'
    put:
      operationId: updateNotificationRoute
      summary: Set one event type's severity and routed channels
      description: >-
        A full replace of eventType's own row in the matrix: the channel
        list becomes exactly channelIds, and the severity becomes exactly
        severity — including reverting to the compiled-in default when the
        request's severity matches it, and un-routing every channel by
        sending an empty list, e.g. for `sync_succeeded`'s opt-in,
        off-by-default event (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRouteRequest'
      responses:
        "200":
          description: The event type's updated routing entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingEntry'
        default:
          $ref: '#/components/responses/Error'

  /notifications/quiet-hours:
    get:
      operationId: getQuietHours
      summary: Get the quiet hours configuration
      description: The current quiet hours window and the always-on critical override (doc 03 §8.3).
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateQuietHours
      summary: Set the quiet hours window
      description: >-
        `criticalAlwaysDelivers` is not part of the request body: doc
        03 §8.3's override that critical alerts always deliver cannot be
        disabled, so there is nothing for a client to set — the response
        always reports it `true`.
      tags: [notifications]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuietHoursRequest'
      responses:
        "200":
          description: The updated quiet hours configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQuietHours'
        default:
          $ref: '#/components/responses/Error'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notification alerts
      description: >-
        Unread alerts first, grouped by event type (doc 03 §2). Reads only
        the central database — never probes block devices.
      tags: [notifications]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Grouped in-app alerts and the unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsOK'
        default:
          $ref: '#/components/responses/Error'

  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark in-app alerts read
      description: >-
        Marks every alert whose id is listed, or every alert when `all` is
        true (doc 03 §2's mark-all-read). Omitted ids with `all` false is a
        no-op that returns the current unread count.
      tags: [notifications]
      x-hoserva-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationsReadRequest'
      responses:
        "200":
          description: The unread count after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationsReadOK'
        default:
          $ref: '#/components/responses/Error'

  /settings/general:
    get:
      operationId: getGeneralSettings
      summary: Get general installation settings
      description: >-
        Hostname, timezone and whether a backup passphrase is configured
        (doc 03 §1, §8.1). The passphrase itself is never returned (Q28).
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateGeneralSettings
      summary: Set general installation settings
      description: >-
        Persists hostname, timezone and/or the backup passphrase. Each
        field is optional: omitted leaves that value unchanged. An empty
        `hostname` clears a previously set hostname. `backupPassphrase` is
        write-only and never echoed back — skipping it during onboarding
        is valid (Q28).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralSettingsRequest'
      responses:
        "200":
          description: The updated general settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/ups:
    get:
      operationId: getUPSSettings
      summary: Get UPS / NUT settings
      description: >-
        Doc 03 §8.1's UPS card on `/settings` General: connection mode
        (USB or a network NUT server), driver fields, and USB-only
        shutdown thresholds (Q77). Passwords are never returned — only
        `monitorPasswordSet` / `networkPasswordSet` (Q28). When no UPS
        is configured, `configured` is false and every other field is
        omitted.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The current UPS settings, or an empty configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUPSSettings
      summary: Set UPS / NUT settings
      description: >-
        Persists UPS settings to SQLite, generates NUT config through
        `WriteUPS` (D4, Q77), and reloads the NUT units. Passwords are
        write-only (Q28): omit to keep an existing secret; a first
        configure must supply the password the connection mode needs.
        USB-only thresholds are ignored for network mode. Validation
        failures and `ErrInvalidUPSField` return 400; unmanaged or
        existing host NUT files and a missing `nut` group return 409.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUPSSettingsRequest'
      responses:
        "200":
          description: The updated UPS settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UPSSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network:
    get:
      operationId: getNetworkSettings
      summary: Host network, TLS and access-scope settings
      description: >-
        Current network backend, interfaces, any in-flight confirm-or-revert
        window, the TLS certificate's expiry, LAN-only access scope (Q10)
        and the listen port (doc 03 §8.2, Q75). Editing address, DNS or
        gateway is only possible when the backend is ifupdown; otherwise
        `editable` is false and `readOnlyReason` says why.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current network settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: applyNetworkSettings
      summary: Apply host network, access-scope or listen-port changes
      description: >-
        Address, DNS and gateway changes are written to one managed
        ifupdown file under `/etc/network/interfaces.d/` and applied with
        a 60-second confirm-or-revert (Q75): unless `confirmNetworkSettings`
        is called over the new configuration before the window expires
        (or the daemon dies), the previous file is restored. Access scope
        and listen port apply without that window — access scope takes
        effect immediately; a listen-port change is persisted and used on
        the next daemon start. Addressing fields are refused when the
        backend is not ifupdown.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyNetworkSettingsRequest'
      responses:
        "200":
          description: Settings after the apply, including any pending confirm window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/confirm:
    post:
      operationId: confirmNetworkSettings
      summary: Keep the pending network configuration
      description: >-
        Called over the new configuration during the confirm-or-revert
        window (Q75). Keeps the managed ifupdown file. An unreachable
        address cannot be confirmed because this request never arrives.
        After the window expires, or if the daemon died before confirm,
        the previous configuration has already been restored and this
        returns `network_confirm_expired`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after confirm; `pending` is omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/certificate:
    post:
      operationId: regenerateTLSCertificate
      summary: Regenerate the self-signed TLS certificate
      description: >-
        Replaces the daemon's TLS certificate with a freshly generated
        self-signed certificate (Q9) and hot-reloads it so new connections
        use the new cert. If Let's Encrypt DNS-01 is configured, unattended
        renewal is disarmed so this self-signed cert is not overwritten
        without another explicit setup. Let's Encrypt issue and renew are
        handled by `configureLetsEncrypt`, not by this operation.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings including the new certificate expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/network/lets-encrypt:
    post:
      operationId: configureLetsEncrypt
      summary: Configure Let's Encrypt DNS-01 and issue a certificate
      description: >-
        Stores the domain and DNS-01 provider credentials (encrypted at
        rest, Q28) and queues an `acme_issue` job that talks to the ACME
        directory over DNS-01 only. Ports 80 and 443 are never claimed
        (Q9). HTTP-01 and TLS-ALPN-01 are not offered. On success the
        issued certificate replaces the self-signed cert on `:8008`.
        Unattended renewal stays armed while `letsEncrypt.enabled` is
        true. A failed issue or renew keeps serving the existing
        certificate and notifies; it never silently falls back to a new
        self-signed cert.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureLetsEncryptRequest'
      responses:
        "200":
          description: The queued or running ACME issue job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableLetsEncrypt
      summary: Stop unattended Let's Encrypt renewal
      description: >-
        Disarms unattended renewal. The certificate currently served on
        `:8008` is left in place — this does not generate a self-signed
        replacement. DNS credentials remain stored until overwritten by
        a later `configureLetsEncrypt` or cleared by regenerating a
        self-signed certificate.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Settings after renewal is disarmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules:
    get:
      operationId: getSchedules
      summary: List recurring job schedules
      description: >-
        The nightly maintenance chain (Q30, doc 03 §8.4) and every separately
        scheduled job, with server-computed next-run times, human-readable
        schedule previews and conflict warnings from DetectConflict (doc 01
        §4). Chain step order is server-defined and not writable.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: All recurring schedules and any detected conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/chain:
    put:
      operationId: updateMaintenanceChainSchedule
      summary: Update the nightly maintenance chain schedule
      description: >-
        Persists the chain's start time, weekly scrub day and per-step
        enabled flags (doc 03 §8.4). Step order is fixed by Q30 and cannot
        be changed. Omitted step entries leave that step's enabled state
        unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceChainScheduleRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/schedules/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OtherScheduleJobId'
    put:
      operationId: updateScheduledJob
      summary: Update a separately scheduled job
      description: >-
        Persists enabled state, frequency and start time for one of the
        recurring jobs outside the nightly chain (doc 03 §8.4).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledJobRequest'
      responses:
        "200":
          description: The updated schedules view, including recomputed next runs and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedules'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates:
    get:
      operationId: getUpdateStatus
      summary: Hoserva and Debian update status
      description: >-
        Current Hoserva version, any newer release on the configured
        channel, update-check on/off, pending Debian updates and whether
        a reboot is required (doc 03 §8.6, Q67, Q68). The update check
        reads only the signed release index on the project site — never
        the GitHub API and never a system-wide `apt update` (Q67, Q49).
        When the check is disabled, `availableVersion` is omitted rather
        than fetched.
      tags: [settings]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUpdateSettings
      summary: Set update channel and check-enabled
      description: >-
        Persists the update channel (stable / beta) and whether the
        outbound update check is enabled (Q49, Q67). Omitted fields are
        left unchanged.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUpdateSettingsRequest'
      responses:
        "200":
          description: The updated update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/check:
    post:
      operationId: checkForUpdate
      summary: Check the signed release index for a newer Hoserva
      description: >-
        Fetches the signed release index for the configured channel
        (Q67). A user-initiated check runs even when the periodic
        outbound check is disabled. Never calls the GitHub API or
        `apt update`.
      tags: [settings]
      x-hoserva-role: admin
      responses:
        "200":
          description: Update status after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/apply:
    post:
      operationId: applyUpdate
      summary: Download, verify and install the available Hoserva release
      description: >-
        Downloads the `.deb` named by the signed release index, verifies
        it against the signed SHA256SUMS, runs a config backup, and
        installs it in a transient systemd unit (Q67, doc 10 §1).
        Refused while a Parity, Array-write or Topology job is running;
        the error names that job. A `.deb` whose checksum does not match
        is never installed, and a notification is raised.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The update has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/rollback:
    post:
      operationId: rollbackUpdate
      summary: Roll back to the previous Hoserva release and its snapshot
      description: >-
        Downloads and verifies the previous release's `.deb`, restores
        that version's pre-migration database snapshot, and installs the
        previous package (Q67, D16). There are no down migrations —
        rollback is previous package plus its snapshot. Refused while a
        Parity, Array-write or Topology job is running; the error names
        that job.
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: The rollback has been queued for install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /settings/updates/reboot:
    post:
      operationId: rebootHost
      summary: Reboot after waiting for storage jobs and a clean shutdown
      description: >-
        Waits for any running Parity, Array-write or Topology job, runs
        the Q70 clean shutdown sequence, then reboots. Hoserva never
        reboots on its own — this is always the user's action (Q68).
      tags: [settings]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUpdateRequest'
      responses:
        "200":
          description: Reboot has been started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        default:
          $ref: '#/components/responses/Error'

  /status:
    get:
      operationId: getStatus
      summary: Overall system health
      description: >-
        One-screen health summary for the dashboard and `hoserva status`
        (doc 01 §3, §5).
      tags: [status]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /metrics:
    get:
      operationId: getMetrics
      summary: Metric time series
      description: >-
        Returns downsampled samples from metrics.db for one metric/subject
        over a time window (Q74, doc 03 §2). Resolution is chosen from the
        window — raw for up to 48 hours, hourly for up to 90 days, daily
        beyond — so clients cannot force a full raw scan. A missing or
        empty metrics.db yields an empty series, not an array-health error.
      tags: [metrics]
      x-hoserva-role: viewer
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
          description: >-
            Metric identifier, e.g. `disk_throughput_bytes_per_sec` or
            `network_throughput_bytes_per_sec` for dashboard charts.
        - name: subject
          in: query
          schema:
            type: string
          description: >-
            Device path for a per-disk metric (SMART, temperature) or omit
            for a host-wide metric (CPU, RAM, pool throughput).
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window start (inclusive), UTC.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Window end (inclusive), UTC.
      responses:
        "200":
          description: The matching series, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        default:
          $ref: '#/components/responses/Error'

  /pool:
    get:
      operationId: getPool
      summary: Pool status
      description: >-
        Per-disk pool breakdown for `hoserva pool status` (doc 01 §3),
        including each disk's own `removalState` (doc 09 §4 step 2, #359)
        where one is in progress.
      tags: [pool]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Pool topology and disk breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatus'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance/plan:
    post:
      operationId: planRebalance
      summary: Preview rebalancing the pool
      description: >-
        Computes the rebalance plan (doc 09 §3): for every share with at
        least two branches, the files `cache.PlanRebalance` would move
        from that share's own most-full disk to its own least-full disk
        to bring them within the skew tolerance, plus any path-preserving
        warnings, and the exact typed confirmation `startRebalance`
        requires. Read-only: nothing is copied, synced or deleted.
      tags: [pool]
      x-hoserva-role: admin
      responses:
        "200":
          description: The rebalance plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancePlan'
        default:
          $ref: '#/components/responses/Error'

  /pool/rebalance:
    post:
      operationId: startRebalance
      summary: Rebalance the pool
      description: >-
        Recomputes the rebalance plan (never trusting a client-supplied
        one — a stale plan can only omit or skip files at run time, never
        misdirect a copy or delete) and, once `confirmation` matches the
        exact phrase the matching `planRebalance` call returned, queues a
        resumable `job.TypeRebalance` job that runs it through
        `cache.RunRebalance` unchanged: copy and verify every batch,
        sync through the threshold guard, delete the batch's sources,
        sync again (Q14), batched so no trailing sync this run makes can
        ever trip the guard after sources are already gone (doc 09 §3). A
        wrong or missing confirmation is refused (`confirmation_required`)
        before anything runs.
      tags: [pool]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRebalanceRequest'
      responses:
        "200":
          description: The queued, resumable rebalance job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares:
    get:
      operationId: listShares
      summary: List shares
      description: >-
        Every configured share (doc 03 §4.1). Does not walk data disks;
        size and per-disk distribution are later issues.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Configured shares, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShare
      summary: Create a share
      description: >-
        Persists the share (D4), creates its directory tree on the
        branches its cache mode uses, writes the per-share mergerfs
        mount through the existing pool renderer, and regenerates
        `smb.conf` (doc 02 §1, doc 03 §4). Refused with 409
        `maintenance_mode` while the array is stopped (Q70): create
        would mkdir under bare disk mountpoints on the root filesystem,
        and the next array start would hide those writes.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
      responses:
        "200":
          description: The created share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getShare
      summary: Get a share
      description: One share by name (doc 03 §4.2).
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: The share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateShare
      summary: Update a share
      description: >-
        Updates cache mode, create policy and SMB options, then
        regenerates the per-share mount and `smb.conf`. Does not relocate
        existing files (doc 09 §2). Refused with 409 `maintenance_mode`
        while the array is stopped (Q70): update would mkdir and remount
        under bare disk mountpoints on the root filesystem.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShareRequest'
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShare
      summary: Delete a share definition
      description: >-
        Removes the share row and regenerates mounts and `smb.conf`.
        Leaves the share's files on disk (doc 03 §4.2 danger zone).
        `confirm: true` is required. Deleting the data is
        `deleteShareData`. Refused with 409 `maintenance_mode` while the
        array is stopped (Q70): delete would unmount and rewrite share
        mounts against bare disk mountpoints on the root filesystem.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: Share definition removed.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/data/delete:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: deleteShareData
      summary: Delete a share's files
      description: >-
        Deletes this share's files on the branches that hold it, and
        nothing else — not other shares, not the parity file, not disks
        that do not hold this share (doc 03 §4.2). The definition is
        left in place. `confirmation` must equal the share name.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteShareDataRequest'
      responses:
        "204":
          description: Share data deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/relocate:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    post:
      operationId: startShareRelocation
      summary: Relocate a share between cache and array
      description: >-
        Queues a `share_relocation` job moving name's files between its
        cache path and the array (doc 09 §2, Q14, Q15) —
        `hoserva share relocate <share> --to cache|array`. Cache to array
        behaves as a mover run limited to this share, ignoring the grace
        period; array to cache follows the two-phase copy-verify-sync-
        delete-sync order, through the same threshold guard every other
        sync goes through. There is no second relocation-invocation path.
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartShareRelocationRequest'
      responses:
        "200":
          description: The queued or running share relocation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/browse:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: browseShare
      summary: List a share directory
      description: >-
        Lists one directory of the share, including the holding disk per
        entry from mergerfs `user.mergerfs.basepath` (doc 03 §4.2). This
        is an explicit call and may wake disks — it is never polled.
      tags: [shares]
      x-hoserva-role: viewer
      parameters:
        - name: path
          in: query
          description: Directory relative to the share root. Empty is the share root.
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareBrowseResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShareFile
      summary: Delete a file or empty directory from the share
      description: >-
        Deletes one file or empty directory within the share, given a
        path relative to the share root (doc 03 §4.2 Browse tab). Refuses
        the share root itself and any path that would resolve outside the
        share's root, including through a symlink. `confirm: true` is
        required.
      tags: [shares]
      x-hoserva-role: admin
      parameters:
        - name: path
          in: query
          required: true
          description: File or empty directory to delete, relative to the share root.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShareRequest'
      responses:
        "204":
          description: File or directory deleted.
        default:
          $ref: '#/components/responses/Error'

  /shares/{name}/permissions:
    parameters:
      - $ref: '#/components/parameters/ShareName'
    get:
      operationId: getSharePermissions
      summary: Get a share's per-user and per-group access
      description: >-
        Every user and every user group with an explicit access level on
        this share (Q27, doc 03 §7). A user or group with no row here is
        not represented.
      tags: [shares]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This share's per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSharePermissions
      summary: Replace a share's per-user and per-group access
      description: >-
        A full replace: this share's access is set to exactly the users
        and groups listed, and every user or group previously granted an
        explicit level but missing from the request loses its row
        entirely (doc 03 §7: "editable from either side" — this is the
        share-side editor).
      tags: [shares]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSharePermissionsRequest'
      responses:
        "200":
          description: This share's updated per-user and per-group access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /disks:
    get:
      operationId: listDisks
      summary: List disks
      description: Every block device Hoserva knows about (doc 02 §4).
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Disk inventory.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiskInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /disks/external:
    get:
      operationId: listExternalDisks
      summary: List external disks
      description: >-
        Disks outside the array (Q72, doc 02 §4, doc 03 §3.3): Ignore-role
        or a later USB disk, never a pool or parity member. Registered
        external disks plus inventory disks that are not the boot device
        and not in the array. Nothing is mounted by this call.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: External disks.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: registerExternalDisk
      summary: Register a disk as external
      description: >-
        Assigns a non-array, non-boot disk the Ignore/external role (Q72)
        with a label used as `/mnt/disks/<label>`. Does not mount or
        format. The boot device is refused.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalDiskRequest'
      responses:
        "200":
          description: The registered external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    patch:
      operationId: updateExternalDisk
      summary: Update an external disk
      description: >-
        Sets whether this disk's `/mnt/disks/<label>` mount is a local
        backup destination (doc 10 §1).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalDiskRequest'
      responses:
        "200":
          description: The updated external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/mount:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: mountExternalDisk
      summary: Mount an external disk
      description: >-
        Mounts the disk by filesystem UUID at `/mnt/disks/<label>` (Q21,
        Q72). Nothing mounts automatically on plug-in. The boot device
        and array disks are refused.
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The mounted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/eject:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: ejectExternalDisk
      summary: Eject an external disk
      description: >-
        Unmounts `/mnt/disks/<label>`, then spins the disk down (Q72).
      tags: [disks]
      x-hoserva-role: admin
      responses:
        "200":
          description: The ejected external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/external/{label}/format:
    parameters:
      - $ref: '#/components/parameters/ExternalLabel'
    post:
      operationId: formatExternalDisk
      summary: Format an external disk
      description: >-
        Formats the disk after the same typed confirmation array setup
        uses (`disk.TopologyPlan.Confirmation`, doc 03 §3.1 step 6). The
        boot device is never offered. A wrong or missing confirmation is
        refused with `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatExternalDiskRequest'
      responses:
        "200":
          description: The formatted external disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDisk'
        default:
          $ref: '#/components/responses/Error'

  /disks/wake-events:
    get:
      operationId: listWakeEvents
      summary: List spin-state wake events
      description: >-
        Reads persisted spin-state transitions from the central database
        only — never probes block devices (Q32, doc 03 §3.3a Phase 1).
        Returns every recorded transition plus per-device wake counts
        grouped by UTC day so the wake-events page can show when each
        disk woke, how long it stayed awake, and how often it woke.
      tags: [disks]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Spin-state transition log and daily wake counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeEventsResponse'
        default:
          $ref: '#/components/responses/Error'

  /disks/array:
    post:
      operationId: createArray
      summary: Create the storage array
      description: >-
        Queues a Topology job that formats or adopts the assigned disks
        (doc 03 §3.1 step 6, doc 02 §4). The request is the wizard's role
        assignments, per-disk filesystem (including adopt/keep), pool
        options, and the same typed confirmation string
        `disk.TopologyPlan.Confirmation` produces. A wrong or missing
        confirmation is refused with `confirmation_required` and formats
        nothing. The handler calls `disk.FormatPlan` — never a second
        formatter (D1).
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrayRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add/plan:
    post:
      operationId: planDiskAdd
      summary: Preview adding a data disk
      description: >-
        Computes the add plan (doc 02 §4 "Adding a disk"): the target
        disk's own identity (model, WWN or serial, size, its existing
        filesystem if any), its assigned mountpoint
        (`disk.NextDataMountpoint`) and the exact typed confirmation
        `addDisk` requires. Refuses (Q20) a disk that would leave a parity
        disk smaller than the array's largest data disk, and (Q21) a
        device already identified as one of the array's own members by WWN
        or serial, reusing `disk.TopologyPlan.Validate` over the resulting
        data set — the same check array setup runs. Read-only: nothing is
        formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskPlanRequest'
      responses:
        "200":
          description: The add plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/add:
    post:
      operationId: addDisk
      summary: Add a data disk to the running array
      description: >-
        Queues a Topology job (`job.TypeDiskAdd`) that formats or adopts
        the disk, then regenerates mount units, the pool and
        `snapraid.conf` from SQLite (D4, doc 02 §4 "Adding a disk"). The
        confirmation must be the exact string the matching `planDiskAdd`
        call returned; a wrong or missing one is refused with
        `confirmation_required` and formats nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace/plan:
    post:
      operationId: planDiskReplace
      summary: Preview replacing a data disk
      description: >-
        Computes the replace plan (doc 02 §4 "Replacing a failed disk"):
        the replacement's own identity (model, WWN or serial, size, its
        existing filesystem if any), the SnapRAID `fix` command that
        reconstructs the slot's contents after it is formatted, and the
        exact typed confirmation `replaceDisk` requires. Refuses
        (`slot_disk_present`) unless the slot's own recorded disk is
        genuinely gone — not merely unmounted, but absent from a fresh disk
        inventory by identity (doc 02 §4 steps 1-2; a healthy disk goes
        through the upgrade flow instead, #289) — and (Q20) a replacement
        that would leave a parity disk smaller than the array's largest
        data disk. Read-only: nothing is formatted or persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskPlanRequest'
      responses:
        "200":
          description: The replace plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDiskPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/replace:
    post:
      operationId: replaceDisk
      summary: Replace a data disk
      description: >-
        Queues a Topology job (`job.TypeDiskReplace`) that formats or
        adopts the replacement at the same mountpoint, regenerates mount
        units, the pool and `snapraid.conf` from SQLite, confirms the
        mountpoint is genuinely backed by the replacement before touching
        parity, then runs `snapraid fix` to reconstruct its contents from
        parity and the remaining disks (doc 02 §4 "Replacing a failed
        disk"). Identity is re-checked at format time and the boot disk is
        always refused. Refuses (`slot_disk_present`) the same way
        `planDiskReplace` does when the slot's own disk is still mounted or
        still present by identity. The confirmation must be the exact
        string the matching `planDiskReplace` call returned; a wrong or
        missing one is refused with `confirmation_required` and formats
        nothing.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDiskRequest'
      responses:
        "200":
          description: The queued Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade/plan:
    post:
      operationId: planDiskUpgrade
      summary: Preview upgrading a data or parity disk to a larger one
      description: >-
        Computes the upgrade plan (doc 02 §4 "Larger data disk"/"Larger
        parity disk") for the existing array slot at
        `mountpoint`, whichever role it holds: the replacement's own
        identity (model, WWN or serial, size, its existing filesystem if
        any), the copy/verify/remount steps a data-disk upgrade runs or
        the copy/verify/switch/check steps a parity-disk upgrade runs, and
        the exact typed confirmation `upgradeDisk` requires. For a data
        disk, refuses (`invalid_plan`) a replacement that would leave a
        parity disk smaller than it (Q20) — offering the parity upgrade
        flow first, the same rule `disk.DataDiskUpgradeExceedsParity`
        checks — and any of `planDiskReplace`'s own Q19/Q20/Q21/Q23
        checks. For a parity disk, `newMountpoint` is the fresh
        `/mnt/parityN` slot the new disk will be formatted, mounted and
        verified at independently of the old one (Q71) — never the old
        disk's own mountpoint. Read-only: nothing is formatted or
        persisted.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskUpgradePlanRequest'
      responses:
        "200":
          description: The upgrade plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskUpgradePlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/upgrade:
    post:
      operationId: upgradeDisk
      summary: Upgrade a data or parity disk to a larger one
      description: >-
        Starts a resumable Topology job (`job.TypeDiskUpgradeData` or
        `job.TypeDiskUpgradeParity`, resolved from the slot's role). The
        confirmation must be the exact string the matching
        `planDiskUpgrade` call returned; a wrong or missing one is refused
        with `confirmation_required` and formats nothing. A data-disk
        upgrade follows doc 02 §4's state machine: it is admitted only
        once `stopArray` has completed (otherwise `array_not_stopped`)
        and while no other data-disk upgrade is pending (otherwise
        `disk_upgrade_pending`, naming it). It requires a clean
        `snapraid diff` before formatting, copies and verifies the old
        disk, mounts the new one at the same mountpoint, requires
        `snapraid diff` to show no removed or updated files, and only
        then names the new disk in SQLite; the array stays stopped until
        the user starts it. A parity-disk upgrade runs with the array
        started (refused with `maintenance_mode` while it is stopped): it
        copies the parity file, verifies it byte for byte, switches the
        configuration and passes `snapraid check` before releasing the
        old parity disk (Q71). The old disk is never written to or
        released until its verification gate passes.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDiskRequest'
      responses:
        "200":
          description: The queued, resumable Topology job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate/plan:
    post:
      operationId: planDiskEvacuation
      summary: Preview evacuating a data disk before removal
      description: >-
        Computes the evacuation plan for the data disk at `mountpoint`
        (doc 09 §4 steps 1-3, "mechanically a rebalance targeting one
        specific source disk"): every file `cache.PlanEvacuation` would
        move from that disk onto the pool's remaining disks, any
        path-preserving warnings, and the exact typed confirmation
        `evacuateDisk` requires. Refused (`invalid_plan`) when a share on
        this disk has no other branch to evacuate onto, when an entry on
        the disk is something the evacuation copy path cannot move (a
        symlink, fifo, socket or device node), or when the remaining disks
        do not have room even after each one's own minimum free space is
        kept. Read-only: nothing is copied, synced or deleted, and this
        preview does not itself put the disk into doc 09 §4 step 2's own
        `removing`/no-create state — `evacuateDisk`'s own job does that,
        before its first copy, so the disk keeps taking new writes only
        until that job starts, never for as long as it runs. Refused
        (`disk_removal_in_progress`) while a different disk is already in
        removal. This operation carries out doc 09 §4 steps 1 and 3-6
        (moving the disk's own already-present files off, protected
        through the threshold guard, Q14); step 2's own no-create switch
        is applied by `evacuateDisk`'s job, not by this preview, and the
        mergerfs branch-list removal, SnapRAID removal and unmount in
        steps 7-9 are not performed by either.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskPlanRequest'
      responses:
        "200":
          description: The evacuation plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvacuationPlan'
        default:
          $ref: '#/components/responses/Error'

  /disks/array/evacuate:
    post:
      operationId: evacuateDisk
      summary: Evacuate a data disk before removal
      description: >-
        Recomputes the evacuation plan for `mountpoint` (never trusting a
        client-supplied one, `startRebalance`'s own reasoning) and, once
        `confirmation` matches the exact phrase the matching
        `planDiskEvacuation` call returned, queues a resumable
        `job.TypeEvacuation` job. Before copying anything — and again on
        every resume — the job marks the disk `evacuating` (persisted in
        SQLite, D4) and applies no-create to its own branch in every pool
        mount, live (doc 09 §4 step 2); a failure to apply that fails the
        job before any copy. It then runs the plan through
        `cache.RunRebalance` unchanged: copy and verify every batch, sync
        through the threshold guard (each such sync naming this disk in
        the guard's own zero-files exemption, Q15, since the batch that
        finally empties it would otherwise trip that rule), delete the
        batch's sources, sync again (Q14) — then, once the whole plan
        finishes without being interrupted, `cache.EvacuationPostCheck`
        confirms the disk's own share branches hold nothing but empty
        directories (doc 09 §4 step 6) and the job marks the disk
        `evacuated` before reporting success. A wrong or missing
        confirmation is refused (`confirmation_required`) before anything
        runs, a second disk is refused (`disk_removal_in_progress`)
        while one is already in removal, and any new evacuation is
        refused (`evacuation_pending`) while another evacuation job is
        queued, running or interrupted. The removal state belongs to the
        job that set it: cancelling that job — queued, running or
        interrupted — clears it and puts the disk back to taking writes,
        and cancelling any other job never does. A job that fails leaves
        the disk `evacuating`; evacuating it again takes the state over,
        and cancelling that run clears it. Success
        here means the disk's data as this job saw it is safely off it
        and it is no longer taking new writes, not that it is empty of
        every file or safe to physically remove: doc 09 §4 steps 7-9
        (mergerfs branch-list removal, SnapRAID removal, unmount) are not
        performed by this operation.
      tags: [disks]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvacuateDiskRequest'
      responses:
        "200":
          description: The queued, resumable evacuation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /array/stop:
    post:
      operationId: stopArray
      summary: Stop the array
      description: >-
        Enters maintenance mode (Q70, doc 02 §4, `hoserva array stop`):
        refuse new jobs and interrupt non-resumable jobs, shut down
        running VMs, stop containers, stop Samba and NFS, then unmount
        share paths, the catch-all and data disks — the same list the
        `/storage` Stop array confirm dialog already shows. The handler
        calls `job.ArraySequence.Stop` and does not write parity. A
        failure leaves maintenance mode active so nothing new starts
        against a half-stopped array. `confirm: true` is required.
        Refused with `disk_upgrade_pending` while a data-disk upgrade is
        pending (doc 02 §4 E7): the array is already stopped for it, and
        nothing is stopped, signalled or unmounted.
      tags: [array]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopArrayRequest'
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /array/start:
    post:
      operationId: startArray
      summary: Start the array
      description: >-
        Reverses `stopArray` (Q70, doc 02 §4, `hoserva array start`):
        mount disks, the catch-all and share paths, then start services
        in the reverse of stop order, and exit maintenance mode only
        once every step succeeds. The handler calls
        `job.ArraySequence.Start`. Refused with `storage_not_ready`
        when the storage gate is not ready (Q69, `ErrStorageNotReady`)
        — nothing is mounted. Also refused with `disk_upgrade_pending`
        while a data-disk upgrade is pending — queued, running or
        interrupted at any checkpoint (doc 02 §4 E6); the error names
        the job to resume or cancel, and nothing is mounted. Once the
        disks are mounted, each must hold the filesystem SQLite names
        for it before the pool or any service starts (UR9); otherwise it
        is refused with `array_disk_mismatch`, the disks are unmounted
        again and maintenance mode stays on.
      tags: [array]
      x-hoserva-role: admin
      responses:
        "200":
          description: >-
            System status after the sequence. `maintenanceMode` is false
            on success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        default:
          $ref: '#/components/responses/Error'

  /parity:
    get:
      operationId: getParity
      summary: Parity status and guard state
      description: >-
        Reads SnapRAID status from the boot-device content file only — does
        not run `snapraid diff` or wake data disks (doc 02 §2, Q13).
        Threshold-guard state and grouped diff rows reflect the last
        explicit `POST /parity/diff` (or a sync job's own pre-sync diff)
        until the next one runs.
      tags: [parity]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Current parity freshness and guard snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParitySnapshot'
        default:
          $ref: '#/components/responses/Error'

  /parity/diff:
    post:
      operationId: runParityDiff
      summary: Run a SnapRAID diff
      description: >-
        Runs `snapraid diff` on every data disk — an explicit user action
        that wakes every data disk (doc 02 §2, Q13). Returns grouped
        changes and threshold-guard evaluation for the parity page; never
        polled on a timer.
      tags: [parity]
      x-hoserva-role: admin
      responses:
        "200":
          description: Grouped diff and guard evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityDiffResult'
        default:
          $ref: '#/components/responses/Error'

  /parity/sync:
    post:
      operationId: startSync
      summary: Start a SnapRAID sync
      description: >-
        Queues a sync job through the threshold guard (doc 02 §2). A
        non-dry-run sync past a tripped guard requires `confirm: true`
        after reviewing the diff. Refused with 409 `on_battery` while
        the on-battery hold is active (doc 02 §6, Q77) — scheduled syncs
        are held until power returns.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
      responses:
        "200":
          description: The queued or running sync job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/scrub:
    post:
      operationId: startScrub
      summary: Start a SnapRAID scrub
      description: Queues a scrub job (`hoserva scrub`, doc 01 §3).
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScrubRequest'
      responses:
        "200":
          description: The queued or running scrub job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /parity/fix:
    post:
      operationId: startFix
      summary: Start a SnapRAID fix
      description: >-
        Queues a fix job (`hoserva fix`, doc 01 §3). Requires
        `confirm: true` — fix rewrites data from parity.
      tags: [parity]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFixRequest'
      responses:
        "200":
          description: The queued or running fix job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/run:
    post:
      operationId: startMover
      summary: Start a manual mover run
      description: >-
        Queues a mover job (`hoserva mover run`, doc 09 §2's manual trigger)
        — the same `TypeMover` job the threshold poll and the nightly chain
        submit; there is no second mover-invocation path. Refused with 409
        `on_battery` while the on-battery hold is active (doc 02 §6, Q77) —
        the mover is paused until power returns.
      tags: [mover]
      x-hoserva-role: admin
      responses:
        "200":
          description: The queued or running mover job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'

  /mover/last-run:
    get:
      operationId: getLastMoverRun
      summary: Most recent finished mover run
      description: >-
        The structured result of the most recent finished mover run
        (doc 09 §2's honest reporting, doc 03 §3.6): files moved, bytes,
        duration, and every skipped entry with its reason. Persisted in
        SQLite by the mover job itself (#273), not reconstructed from the
        job log. Null when no mover job has ever finished.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The last finished mover run, or null when none has finished yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/MoverRunResult'
        default:
          $ref: '#/components/responses/Error'

  /cache/usage:
    get:
      operationId: getCacheUsage
      summary: Cache usage breakdown
      description: >-
        Appdata / pending-moves / other byte breakdown for the cache disk
        (doc 03 §3.6). Computed as a by-product of each mover run (Q87),
        never a live directory walk on a timer (Q13). Null when no mover
        run has computed it yet.
      tags: [mover]
      x-hoserva-role: viewer
      responses:
        "200":
          description: >-
            The latest persisted breakdown, or null when none has been
            computed yet.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/CacheUsageBreakdown'
        default:
          $ref: '#/components/responses/Error'

  /config/export:
    post:
      operationId: exportConfig
      summary: Export a config archive
      description: >-
        Builds and returns doc 10 §1's `hoserva-config-*.tar.zst` archive.
      tags: [config]
      x-hoserva-role: admin
      responses:
        "200":
          description: The config archive.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /config/import:
    post:
      operationId: importConfig
      summary: Import a config archive
      description: >-
        Restores from doc 10 §1's archive format. Requires `confirm: true`
        — this replaces the running configuration.
      tags: [config]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, confirm]
              properties:
                archive:
                  type: string
                  format: binary
                confirm:
                  type: boolean
                  description: Must be true — import is destructive.
      responses:
        "204":
          description: Import completed.
        default:
          $ref: '#/components/responses/Error'

  /doctor:
    get:
      operationId: runDoctor
      summary: Run prerequisite checks
      description: >-
        Docker, mergerfs, SnapRAID, mounts, parity freshness, SMART,
        free space and permission sanity (`hoserva doctor`, doc 01 §3),
        plus existing host configuration (Samba shares, NFS exports,
        fstab mounts, Docker containers and images) for onboarding (Q76).
      tags: [doctor]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Plain-language check results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        default:
          $ref: '#/components/responses/Error'

  /doctor/host-config:
    post:
      operationId: applyHostConfig
      summary: Apply onboarding choices for existing host configuration
      description: >-
        Q76: each detected Samba file, NFS exports file, fstab, Docker
        containers list and images list is imported into the database or
        left unmanaged under the drift model (doc 01 §2). Existing host
        files are never overwritten unless the caller chose import.
        Docker's data-root stays at `/var/lib/docker` when containers or
        images exist, or when there is no cache disk (Q62).
      tags: [doctor]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyHostConfigRequest'
      responses:
        "200":
          description: Applied choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyHostConfigResult'
        default:
          $ref: '#/components/responses/Error'

  /users:
    get:
      operationId: listUsers
      summary: List accounts
      description: Every account, sorted by username (Q27, doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Create an account
      description: >-
        Defaults to the share-only role when omitted (Q27): a new account
        has no UI login until an admin promotes it. No password is set by
        this call — setUserPassword provisions the UI credential and the
        Samba account together, in a separate action. Never creates an
        admin account (users_one_admin_idx allows exactly one, created only
        by createFirstAdmin).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUser
      summary: Change an account's role
      description: >-
        Viewer or share-only only (Q27) — the sole admin account is never
        reachable through this operation.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: >-
        Removes the account, its sessions, its group memberships and its
        per-share permissions. Refuses the sole admin account.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Account deleted.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: setUserPassword
      summary: Set an account's password
      description: >-
        Writes the UI credential hash and the Samba passdb entry together
        (Q27, doc 03 §7): if the Samba write fails, the UI credential is
        rolled back to its previous value, and nothing is left updated on
        only one side. This is the ordinary admin-driven password action
        on `/users` — distinct from resetUserPassword (Q78), which is
        root-only recovery for a locked-out account over the Unix socket
        and never touches the Samba passdb.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
      responses:
        "204":
          description: Password set on both the UI credential and the Samba account.
        default:
          $ref: '#/components/responses/Error'

  /users/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserSharePermissions
      summary: Get one account's per-share access
      description: >-
        Every share this account has an explicit access level for (Q27,
        doc 03 §7). A share with no row here is not represented — none
        of the three levels is assumed.
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: This account's per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUserSharePermissions
      summary: Replace one account's per-share access
      description: >-
        A full replace: the account's access is set to exactly the shares
        and levels listed, and every share this account previously had an
        explicit level for but that is missing from the request loses its
        row entirely (doc 03 §7: "editable from either side" — this is the
        user-side editor).
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSharePermissionsRequest'
      responses:
        "200":
          description: This account's updated per-share access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharePermissionsResult'
        default:
          $ref: '#/components/responses/Error'

  /user-groups:
    get:
      operationId: listUserGroups
      summary: List user groups
      description: Every user group, sorted by name (Q27, doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every user group.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUserGroup
      summary: Create a user group
      description: >-
        A named collection of accounts, purely for bulk share-permission
        assignment (Q27, doc 03 §7) — distinct from the fixed `users`
        system group (GID 100, Q26) that every share's files belong to.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserGroupRequest'
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    delete:
      operationId: deleteUserGroup
      summary: Delete a user group
      description: Also removes its memberships and its per-share permissions.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Group deleted.
        default:
          $ref: '#/components/responses/Error'

  /user-groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/UserGroupId'
    put:
      operationId: setUserGroupMembers
      summary: Replace a user group's membership
      description: A full replace of the group's member list.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserGroupMembersRequest'
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        default:
          $ref: '#/components/responses/Error'

  /sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      description: Every session across every account, with revoke (doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every active session.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: >-
        Ends this session immediately, server-side — the same effect as
        that session's own logout, forced by an admin.
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/tokens:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: createApiToken
      summary: Create a personal API token
      description: >-
        A personal API token (Q43), scoped to admin or viewer, for
        scripting and the remote CLI over TCP. The raw token is returned
        only here, once — only its SHA-256 is ever stored afterward,
        mirroring how a session cookie is handled (doc 01 §7). Refused
        for a share-only account (share-only has no API access at all,
        Q27), and refused when role exceeds the account's own role: a
        token can narrow an account's access (an admin can hand out a
        viewer-scoped token to reduce a script's own blast radius), never
        widen it.
      tags: [users]
      x-hoserva-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
      responses:
        "201":
          description: The new token, with its raw value shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens:
    get:
      operationId: listApiTokens
      summary: List personal API tokens
      description: Every account's tokens, most recently created first (doc 03 §7).
      tags: [users]
      x-hoserva-role: viewer
      responses:
        "200":
          description: Every personal API token.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenSummary'
        default:
          $ref: '#/components/responses/Error'

  /api-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/ApiTokenId'
    delete:
      operationId: revokeApiToken
      summary: Revoke a personal API token
      description: >-
        Ends this token immediately — the request it would have
        authenticated next is refused the moment this returns, since
        every request looks the token up fresh (no caching).
      tags: [users]
      x-hoserva-role: admin
      responses:
        "204":
          description: Token revoked.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically — the `hoserva` group and TCP are refused.
        Audit-logged and announced through every notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        "204":
          description: Password reset.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/disable-totp:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: disableUserTotp
      summary: Disable a user's TOTP
      description: >-
        Root-only over the Unix socket (Q78). Checked against the peer's
        uid 0 specifically. Audit-logged and announced through every
        notification channel.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: TOTP disabled.
        default:
          $ref: '#/components/responses/Error'

  /users/{username}/unlock:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      operationId: unlockUser
      summary: Clear login lockout
      description: >-
        Clears the account's login rate-limiter lockout (doc 01 §7, Q78).
        Root-only over the Unix socket, checked against the peer's uid 0
        specifically. Audit-logged like the other recovery commands.
      tags: [users]
      x-hoserva-role: admin
      x-hoserva-root-only: true
      responses:
        "204":
          description: Lockout cleared.
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EventType:
      name: eventType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NotificationEventType'

    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ApiTokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    ShareName:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ShareName'

    ExternalLabel:
      name: label
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExternalDiskLabel'

  responses:
    Error:
      description: An error response (doc 01 §5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hoserva_session
      description: Web UI session, issued at login over TCP.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: personal-api-token
      description: >-
        Personal API token (Q43), scoped to a role (admin/viewer). For
        scripts and the remote CLI over TCP.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            A stable, machine-readable identifier, e.g. `job_not_found`.
            Every auth-related operation (#22) can also return one of:
            `setup_required` (409 — no admin account exists yet; every
            operation but getSetupStatus/createFirstAdmin refuses with
            this while it's true), `setup_complete` (409, createFirstAdmin
            — an admin account already exists), `rate_limited` (429 — the
            account or source address is currently locked out after
            repeated failures; `message` gives a retry-after),
            `too_busy` (503 — the bounded password-hashing worker pool is
            saturated; safe to retry shortly), `invalid_credentials` (401,
            login — an unknown username or wrong password, deliberately
            indistinguishable), `totp_required` (401, login — the account
            has TOTP enrolled and no code was supplied), `totp_invalid`
            (401, login and confirmTotp — a code was supplied but is
            wrong, expired or already used; a missing login code is
            `totp_required` instead, never this), `totp_reverify_required`
            (403, enrollTotp — TOTP is already active and the caller
            didn't prove they still hold the account: no password or code
            was supplied, or the one supplied was wrong; 403 rather than
            401 since the session itself is valid, only the
            reverification is missing or failed), `totp_reverify_ambiguous`
            (400, enrollTotp — TOTP is already active and *both* the
            current password and a current TOTP code were supplied;
            supply exactly one), `totp_not_pending` (409, confirmTotp — no
            pending secret to confirm), `unauthorized` (401 — no
            credential, or one that no longer validates), `forbidden`
            (403 — a valid credential whose role doesn't satisfy the
            operation), `no_session` (404 — the Unix socket's
            peer-credential-trusted local access has no signed-in user for
            an operation that needs one), `request_too_large` (413 — the
            request body exceeded the server's size limit), `bad_request`
            (400 — the request body could not be decoded), `not_found`
            (404 — no such API route), `api_token_not_found` (404,
            revokeApiToken — no token with that id), `invalid_token_role`
            (400, createApiToken — the requested role is neither admin nor
            viewer; share-only is never a valid token role),
            `share_only_no_api_token` (403, createApiToken — the target
            account has SMB/NFS access only and no API access at all, Q27)
            and `token_role_exceeds_account` (403, createApiToken — the
            requested role is wider than the target account's own role; a
            token can only narrow an account's access, never widen it).
        message:
          type: string
          description: A human-readable explanation, safe to show in the UI or CLI.
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, e.g. which field failed validation.

    UserRole:
      type: string
      description: >-
        Q27: admin (full UI), viewer (read-only UI), or share-only
        (SMB/NFS only, no UI login at all — the default for a new
        account). A share-only account can still sign in with this role
        on a session that predates a role change; every operation but the
        public ones refuses it (RoleViewer/RoleAdmin never satisfy it),
        and login itself refuses a share-only account outright.
      enum: [admin, viewer, share-only]

    User:
      type: object
      required: [id, username, role, totpEnrolled]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.

    SetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    CreateFirstAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totpCode:
          type: string
          maxLength: 16
          description: Required once the account has TOTP enrolled; omitted otherwise.

    TotpEnrollRequest:
      type: object
      description: >-
        Both fields are optional for a first enrolment. Once TOTP is
        already active on the account, exactly one must prove the caller
        still holds it — the current password, or a current TOTP code —
        or enrollTotp is refused; supplying both is refused too (doc
        01 §7).
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    TotpEnrollResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret (RFC 6238), for manual entry.
        otpauthUri:
          type: string
          description: An otpauth:// URI, for the enrolment QR code (doc 03 §1).

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    JobType:
      type: string
      description: Every job type named in doc 01 §4's mutually-exclusive-class table.
      enum:
        # Parity
        - sync
        - scrub
        - fix
        - check
        # Array-write
        - rebalance
        - evacuation
        - share_relocation
        - mover
        - vm_disk_relocation
        # Topology
        - disk_format
        - disk_add
        - disk_remove
        - disk_replace
        - disk_upgrade_data
        - disk_upgrade_parity
        - pool_remount
        # Service
        - appdata_backup
        - container_update
        - acme_issue
        # VM
        - vm_start
        - vm_stop
        - vm_create
        - vm_delete
        - vm_snapshot
        - vm_clone
        - vm_migration_import

    JobClass:
      type: string
      description: The mutually exclusive job class the scheduler enforces (doc 01 §4).
      enum: [parity, array_write, topology, service, vm]

    JobStatus:
      type: string
      description: >-
        `interrupted` is set on an in-flight job by a daemon restart and is
        never cleared automatically (doc 01 §4) — resuming or re-running it
        is always an explicit user action.
      enum: [queued, running, interrupted, succeeded, failed, cancelled]

    Job:
      type: object
      required:
        - id
        - type
        - class
        - status
        - resumable
        - cancellable
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 100
          description: Null when the job type or tool reports no meaningful percentage.
        resumable:
          type: boolean
          description: Whether this job type persists a checkpoint to resume from (Q29).
        cancellable:
          type: boolean
          description: Whether the underlying tool honestly supports cancelling this job.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: "null"

    DiskState:
      type: string
      enum: [active, standby, spinning_up, missing, failed]

    DiskRemovalState:
      type: string
      description: >-
        doc 09 §4's own disk-removal state machine (#359, #358):
        `evacuating` from before an evacuation's first copy until its
        post-check passes — every pool mount marks this disk no-create
        for the whole time (step 2); `evacuated` once that copy and
        post-check finish, but the disk is still in every mergerfs branch
        list, SnapRAID layout and mount table (steps 7-9 have not run
        yet, still no-create); `unpooled` and `unlisted` are #358's own
        later steps of that same removal.
      enum: [evacuating, evacuated, unpooled, unlisted]

    ContainerState:
      type: string
      enum: [running, stopped, restarting, exited, paused]

    NotificationLevel:
      type: string
      enum: [info, warning, error, critical]

    # `full`-shape SSE envelopes (ogen's x-ogen-sse-event-shape): each member
    # carries the discriminator in its own `event` field, so a client can
    # switch on the wire value without decoding `data` first. `const`, not a
    # single-value `enum`, on purpose: ogen names a named enum type after its
    # schema plus property (e.g. `DiskStateEvent`'s `event` property would be
    # `DiskStateEventEvent`), which collides with the identical naming ogen's
    # own discriminator codegen uses for `Event`'s variant tags once `Event`
    # itself is generated (api/event-schema-root.yaml, jschemagen) — `const`
    # inlines the field as a plain validated string instead of a named type,
    # so there is nothing left to collide.
    JobProgressEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: job_progress
        data:
          $ref: '#/components/schemas/Job'

    DiskStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: disk_state
        data:
          type: object
          required: [diskId, device, state, at]
          properties:
            diskId:
              type: string
            device:
              type: string
              description: e.g. `/dev/sdb` — as reported, never accepted back as input (doc 01 §7).
            state:
              $ref: '#/components/schemas/DiskState'
            at:
              type: string
              format: date-time

    ContainerStateEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: container_state
        data:
          type: object
          required: [containerId, name, state, at]
          properties:
            containerId:
              type: string
            name:
              type: string
            state:
              $ref: '#/components/schemas/ContainerState'
            at:
              type: string
              format: date-time

    NotificationEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          const: notification
        data:
          type: object
          required: [id, eventType, level, title, message, createdAt]
          properties:
            id:
              type: string
            eventType:
              $ref: '#/components/schemas/NotificationEventType'
            level:
              $ref: '#/components/schemas/NotificationLevel'
            title:
              type: string
            message:
              type: string
            createdAt:
              type: string
              format: date-time

    Event:
      description: The full set of `/api/v1/events` SSE event types (doc 01 §5).
      oneOf:
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/DiskStateEvent'
        - $ref: '#/components/schemas/ContainerStateEvent'
        - $ref: '#/components/schemas/NotificationEvent'
      discriminator:
        propertyName: event
        mapping:
          job_progress: '#/components/schemas/JobProgressEvent'
          disk_state: '#/components/schemas/DiskStateEvent'
          container_state: '#/components/schemas/ContainerStateEvent'
          notification: '#/components/schemas/NotificationEvent'

    NotificationEventType:
      type: string
      description: >-
        The fixed event catalog doc 03 §8.3 lists, in that doc's own order.
        internal/notify assigns every one of these a compiled-in default
        severity (NotificationLevel); notify_event_severity overrides it
        per event type.
      enum:
        - smart_warning
        - smart_failure
        - disk_offline
        - array_degraded
        - sync_succeeded
        - sync_failed
        - sync_blocked_threshold
        - scrub_errors_found
        - pool_above_threshold
        - disk_near_minfreespace
        - cache_above_threshold
        - mover_skipping_files
        - config_drift_detected
        - container_unhealthy
        - container_update_available
        - hoserva_update_available
        - hoserva_update_failed
        - reboot_required
        - ups_on_battery
        - ups_battery_low
        - login_failure_burst
        - credential_reset
        - certificate_expiring
        - certificate_renewal_failed
        - config_backup_failed
        - appdata_backup_failed
        - backup_destination_stale
        - restore_drill_failed

    NotificationChannelType:
      type: string
      enum: [email, gotify, ntfy, discord, webhook]

    NotificationWebhookMethod:
      type: string
      enum: [POST, PUT]

    NotificationWebhookHeaders:
      type: object
      additionalProperties:
        type: string

    NotificationChannel:
      type: object
      description: >-
        Never carries a credential (Q28) — `hasSecret` is the only signal
        that one is configured. Only the properties relevant to `type` are
        meaningful; the rest are absent.
      required: [id, name, type, enabled, hasSecret, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        hasSecret:
          type: boolean
          description: Whether a credential is configured for this channel.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string
          description: >-
            The header carrying the generic webhook's credential, e.g.
            `Authorization` — the header's value is `secret`, never a
            plain property here.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNotificationChannelRequest:
      type: object
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type: string
          description: >-
            The channel's credential, e.g. an SMTP password, a Gotify app
            token, an ntfy auth token, a Discord webhook URL, or a generic
            webhook's auth header value. Encrypted with the machine key
            before it reaches the database (Q28) and never returned by any
            later read.
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    UpdateNotificationChannelRequest:
      type: object
      description: >-
        Same shape as CreateNotificationChannelRequest, a full replace,
        except `secret` is tri-state: omitted keeps the existing
        credential, `null` clears it, a string replaces it.
      required: [name, type, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        enabled:
          type: boolean
        secret:
          type:
            - string
            - "null"
        emailHost:
          type: string
        emailPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        emailUsername:
          type: string
        emailFrom:
          type: string
        emailTo:
          type: array
          items:
            type: string
        emailStartTls:
          type: boolean
        gotifyUrl:
          type: string
        ntfyUrl:
          type: string
        ntfyTopic:
          type: string
        webhookUrl:
          type: string
        webhookMethod:
          $ref: '#/components/schemas/NotificationWebhookMethod'
        webhookHeaders:
          $ref: '#/components/schemas/NotificationWebhookHeaders'
        webhookAuthHeaderName:
          type: string

    NotificationTestResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type:
            - string
            - "null"
          description: The delivery error, present only when success is false.

    NotificationRoutingEntry:
      type: object
      required: [eventType, severity, channelIds]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateNotificationRouteRequest:
      type: object
      required: [severity, channelIds]
      properties:
        severity:
          $ref: '#/components/schemas/NotificationLevel'
        channelIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationAlert:
      type: object
      required: [id, eventType, level, title, message, createdAt, read]
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        level:
          $ref: '#/components/schemas/NotificationLevel'
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationGroup:
      type: object
      required: [eventType, alerts]
      properties:
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAlert'

    ListNotificationsOK:
      type: object
      required: [groups, unreadCount]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NotificationGroup'
        unreadCount:
          type: integer
          minimum: 0

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        all:
          type: boolean

    MarkNotificationsReadOK:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    NotificationQuietHours:
      type: object
      required: [enabled, start, end, criticalAlwaysDelivers]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 24-hour local time, e.g. "22:00".
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        criticalAlwaysDelivers:
          type: boolean
          description: >-
            Always true (doc 03 §8.3) — critical alerts deliver regardless
            of quiet hours, and this cannot be disabled, so there is no
            request field that ever sets it otherwise.

    UpdateQuietHoursRequest:
      type: object
      required: [enabled, start, end]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    GeneralSettings:
      type: object
      required: [backupPassphraseSet]
      properties:
        hostname:
          type: string
          description: Configured host name, if any.
        timezone:
          type: string
          description: IANA timezone name, e.g. "Europe/Berlin".
        backupPassphraseSet:
          type: boolean
          description: >-
            Whether a backup passphrase is configured. The passphrase itself
            is never returned (Q28).

    UpdateGeneralSettingsRequest:
      type: object
      properties:
        hostname:
          type: string
          description: >-
            Host name for this server. An empty string clears a previously
            set value. Omitted leaves hostname unchanged.
        timezone:
          type: string
          description: IANA timezone name. Omitted leaves timezone unchanged.
        backupPassphrase:
          type: string
          minLength: 1
          description: >-
            Write-only. Sets or replaces the backup passphrase (Q28).
            Omitted leaves any existing passphrase unchanged.

    UPSConnection:
      type: string
      enum: [usb, network]
      description: >-
        Doc 03 §8.1 connection choice-cards: a USB-attached UPS Hoserva
        drives locally, or a remote NUT server this host monitors (Q77).

    UPSSettings:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >-
            Whether a UPS configuration row exists. False means the card
            shows the optional empty state; every other field is omitted.
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          description: NUT driver name for a USB UPS (e.g. usbhid-ups).
        port:
          type: string
          description: Driver port for a USB UPS (commonly "auto").
        monitorPasswordSet:
          type: boolean
          description: >-
            Whether a local monitor password is stored. The password
            itself is never returned (Q28).
        networkHost:
          type: string
          description: Remote NUT server hostname or address.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT server port (default 3493 when omitted on write).
        networkUpsName:
          type: string
          description: UPS name on the remote NUT server.
        networkUsername:
          type: string
          description: Monitoring username on the remote NUT server.
        networkPasswordSet:
          type: boolean
          description: >-
            Whether a network monitoring password is stored. The password
            itself is never returned (Q28).
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >-
            USB-only. Charge percent that marks the battery low for a
            clean shutdown (Q77). Omitted or zero leaves NUT's driver
            default.
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          description: >-
            USB-only. Estimated runtime seconds remaining that mark the
            battery low (Q77). Omitted or zero leaves NUT's driver default.

    UpdateUPSSettingsRequest:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: '#/components/schemas/UPSConnection'
        driver:
          type: string
          minLength: 1
          description: Required for USB. NUT driver name (e.g. usbhid-ups).
        port:
          type: string
          minLength: 1
          description: Required for USB. Driver port (commonly "auto").
        monitorPassword:
          type: string
          minLength: 1
          description: >-
            Write-only. Required on first USB configure; omit on later
            updates to keep the stored secret (Q28).
        networkHost:
          type: string
          minLength: 1
          description: Required for network. Remote NUT server host.
        networkPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Remote NUT port. Defaults to 3493 when omitted.
        networkUpsName:
          type: string
          minLength: 1
          description: Required for network. UPS name on the remote server.
        networkUsername:
          type: string
          minLength: 1
          description: Required for network. Monitoring username.
        networkPassword:
          type: string
          minLength: 1
          description: >-
            Write-only. Required on first network configure; omit on later
            updates to keep the stored secret (Q28).
        lowBatteryPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: USB-only low-battery charge percent (Q77).
        runtimeSeconds:
          type: integer
          format: int32
          minimum: 0
          description: USB-only low-battery runtime seconds (Q77).

    NetworkBackend:
      type: string
      enum: [ifupdown, networkmanager, systemd-networkd, unknown]
      description: Detected host network backend (Q75).

    NetworkAddressMethod:
      type: string
      enum: [dhcp, static]
      description: How this interface obtains its address.

    NetworkInterface:
      type: object
      required: [name, method, state]
      properties:
        name:
          type: string
          description: Kernel interface name, e.g. `enp1s0`.
        mac:
          type: string
          description: Hardware address, if known.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
        address:
          type: string
          description: Configured IPv4 or IPv6 address without prefix.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for `address`.
        gateway:
          type: string
          description: Default gateway for this interface, if any.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers used with this configuration.
        state:
          type: string
          enum: [up, down]
          description: Link operational state.

    NetworkPending:
      type: object
      required: [interface, expiresAt, remainingSeconds]
      properties:
        interface:
          type: string
          description: Interface the pending confirm-or-revert applies to.
        expiresAt:
          type: string
          format: date-time
          description: When the previous configuration is restored if unconfirmed.
        remainingSeconds:
          type: integer
          minimum: 0
          description: Whole seconds left in the confirm window.

    TLSCertificateKind:
      type: string
      enum: [self_signed, lets_encrypt]
      description: How the current TLS certificate was issued (Q9).

    TLSCertificateInfo:
      type: object
      required: [kind, notAfter, daysRemaining]
      properties:
        kind:
          $ref: '#/components/schemas/TLSCertificateKind'
        notAfter:
          type: string
          format: date-time
          description: Certificate expiry instant.
        daysRemaining:
          type: integer
          description: Whole days until expiry; negative if already expired.
        domain:
          type: string
          description: >-
            DNS name the Let's Encrypt certificate covers. Absent for a
            self-signed certificate.

    DNS01Provider:
      type: string
      enum: [cloudflare, rfc2136]
      description: >-
        DNS-01 providers in v1: Cloudflare's API and generic RFC 2136.
        HTTP-01 and TLS-ALPN-01 are not offered (Q9).

    LetsEncryptStatus:
      type: object
      required: [configured, enabled]
      properties:
        configured:
          type: boolean
          description: True when DNS-01 credentials are stored.
        enabled:
          type: boolean
          description: True when unattended renewal is armed.
        domain:
          type: string
          description: Hostname configured for DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        hasSecret:
          type: boolean
          description: True when a DNS credential is stored (Q28); the secret itself is never returned.
        lastError:
          type: string
          description: Last issue or renewal failure. Omitted after a success.

    ConfigureLetsEncryptRequest:
      type: object
      required: [domain, provider]
      properties:
        domain:
          type: string
          minLength: 1
          description: Hostname the certificate will cover, challenged via DNS-01.
        provider:
          $ref: '#/components/schemas/DNS01Provider'
        cloudflareAPIToken:
          type: string
          description: >-
            Cloudflare API token with Zone.DNS Edit. Write-only (Q28).
            Required when `provider` is cloudflare and no token is stored yet.
        rfc2136Nameserver:
          type: string
          description: RFC 2136 nameserver as host:port. Required when `provider` is rfc2136.
        rfc2136TsigKeyName:
          type: string
          description: TSIG key name. Required when `provider` is rfc2136.
        rfc2136TsigSecret:
          type: string
          description: >-
            TSIG secret. Write-only (Q28). Required when `provider` is
            rfc2136 and no secret is stored yet.
        rfc2136TsigAlgorithm:
          type: string
          description: TSIG algorithm. Defaults to hmac-sha256.

    NetworkSettings:
      type: object
      required: [backend, editable, interfaces, certificate, allowAllSources, listenPort, letsEncrypt]
      properties:
        backend:
          $ref: '#/components/schemas/NetworkBackend'
        editable:
          type: boolean
          description: True only when the backend is ifupdown (Q75).
        readOnlyReason:
          type: string
          description: Why addressing cannot be edited, when `editable` is false.
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        pending:
          $ref: '#/components/schemas/NetworkPending'
        certificate:
          $ref: '#/components/schemas/TLSCertificateInfo'
        letsEncrypt:
          $ref: '#/components/schemas/LetsEncryptStatus'
        allowAllSources:
          type: boolean
          description: >-
            When false (default), the TCP listener accepts only LAN-ish
            sources (Q10). When true, every source address is accepted.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: TCP port the TLS UI/API currently listens on (Q9).
        listenPortRestartRequired:
          type: boolean
          description: True when a persisted listen-port change has not been bound yet.

    ApplyNetworkSettingsRequest:
      type: object
      properties:
        interface:
          type: string
          minLength: 1
          description: >-
            Interface to reconfigure. Required when any of `method`,
            `address`, `prefix`, `gateway` or `dns` is set.
        method:
          $ref: '#/components/schemas/NetworkAddressMethod'
          description: >-
            Required when any of `interface`, `address`, `prefix`,
            `gateway` or `dns` is set — the managed ifupdown stanza is
            always rewritten in full.
        address:
          type: string
          description: Static address without prefix. Required when `method` is static.
        prefix:
          type: integer
          minimum: 0
          maximum: 128
          description: Prefix length for a static address. Required when `method` is static.
        gateway:
          type: string
          description: Default gateway. Empty string clears a previously set gateway.
        dns:
          type: array
          items:
            type: string
          description: DNS nameservers. Empty array clears them.
        allowAllSources:
          type: boolean
          description: Set the Q10 access-scope toggle. Omitted leaves it unchanged.
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Persist a new listen port for the next daemon start. Omitted leaves it unchanged.

    UpdateChannel:
      type: string
      enum: [stable, beta]
      description: Release channel the update check reads from the signed index (Q67).

    UpdateStatus:
      type: object
      required: [currentVersion, channel, checkEnabled, rebootRequired, pendingDebianUpdates, dependencies]
      properties:
        currentVersion:
          type: string
          description: Installed Hoserva package version.
        availableVersion:
          type: string
          description: Newer version on the configured channel, if any.
        availableTag:
          type: string
          description: Git tag of availableVersion, if any.
        changelog:
          type: string
          description: Release notes for availableVersion, if the index carries them.
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean
          description: Whether the periodic outbound update check is enabled (Q49).
        previousVersion:
          type: string
          description: Version rollback would restore, if an upgrade has been applied.
        rebootRequired:
          type: boolean
          description: Whether `/run/reboot-required` is present (Q68).
        pendingDebianUpdates:
          type: array
          items:
            $ref: '#/components/schemas/DebianPackageUpdate'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/PackageDependencyStatus'
        blockingJob:
          $ref: '#/components/schemas/BlockingJob'
          description: >-
            A running Parity, Array-write or Topology job that would refuse
            an update, rollback or (until it finishes) a reboot.

    DebianPackageUpdate:
      type: object
      required: [name, installedVersion, candidateVersion]
      properties:
        name:
          type: string
        installedVersion:
          type: string
        candidateVersion:
          type: string

    PackageDependencyStatus:
      type: object
      required: [name, installedVersion, testedFloor, inRange]
      properties:
        name:
          type: string
          description: Debian package name (mergerfs, snapraid).
        installedVersion:
          type: string
        testedFloor:
          type: string
          description: Lowest version this Hoserva release was tested against (Q7).
        inRange:
          type: boolean
          description: True when installedVersion is at or above testedFloor.

    BlockingJob:
      type: object
      required: [id, type, class]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        class:
          $ref: '#/components/schemas/JobClass'

    UpdateUpdateSettingsRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        checkEnabled:
          type: boolean

    ConfirmUpdateRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true; the UI/CLI confirm dialog is what sets this.

    MaintenanceChainStepId:
      type: string
      enum: [mover, diff_guard, sync, scrub, config_backup]
      description: One step in Q30's fixed nightly maintenance chain order.

    OtherScheduleJobId:
      type: string
      enum: [smart_self_test, appdata_backup, restore_drill, container_update_check]
      description: A recurring job scheduled outside the nightly chain (doc 03 §8.4).

    ScheduleFrequency:
      type: string
      enum: [daily, weekly, monthly]

    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: Day of week, 0=Sunday through 6=Saturday.

    MaintenanceChainStep:
      type: object
      required: [id, enabled]
      properties:
        id:
          $ref: '#/components/schemas/MaintenanceChainStepId'
        enabled:
          type: boolean

    MaintenanceChainSchedule:
      type: object
      required: [startTime, weeklyScrubDay, schedulePreview, nextRun, steps]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time the chain starts (Q30 default 02:00).
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        schedulePreview:
          type: string
          description: Human-readable summary, e.g. "every day at 02:00".
        nextRun:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: Q30 order — mover, diff_guard, sync, scrub, config_backup.

    ScheduledJob:
      type: object
      required: [id, enabled, frequency, time, schedulePreview, nextRun]
      properties:
        id:
          $ref: '#/components/schemas/OtherScheduleJobId'
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        schedulePreview:
          type: string
        nextRun:
          type: string
          format: date-time

    ScheduleConflict:
      type: object
      required: [jobA, jobB]
      properties:
        jobA:
          type: string
          description: >-
            Identifier of the first colliding schedule — `maintenance_chain`
            or an OtherScheduleJobId value.
        jobB:
          type: string
          description: Identifier of the second colliding schedule.

    Schedules:
      type: object
      required: [chain, otherJobs, conflicts]
      properties:
        chain:
          $ref: '#/components/schemas/MaintenanceChainSchedule'
        otherJobs:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJob'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleConflict'

    UpdateMaintenanceChainScheduleRequest:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        weeklyScrubDay:
          $ref: '#/components/schemas/Weekday'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceChainStep'
          description: >-
            Per-step enabled flags only — order is ignored; Q30's order is
            always server-defined.

    UpdateScheduledJobRequest:
      type: object
      properties:
        enabled:
          type: boolean
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    DoctorCheckStatus:
      type: string
      enum: [pass, warn, fail]

    DoctorCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
        name:
          type: string
          description: Plain-language label for the check.
        status:
          $ref: '#/components/schemas/DoctorCheckStatus'
        message:
          type: string
        remediation:
          type:
            - string
            - "null"
          description: What to run or change when status is not pass.

    DoctorReport:
      type: object
      required: [checks, overall]
      properties:
        overall:
          $ref: '#/components/schemas/DoctorCheckStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DoctorCheck'

    HostConfigID:
      type: string
      enum: [host_samba, host_nfs, host_fstab, host_docker_containers, host_docker_images]
      description: Q76 onboarding category, matching DoctorCheck.id.

    HostConfigDecision:
      type: string
      enum: [import, leave]
      description: >-
        import persists parsed facts in SQLite so a later generate may
        take ownership; leave marks the host file unmanaged so Generator
        never writes it (doc 01 §2).

    HostConfigChoice:
      type: object
      required: [id, decision]
      properties:
        id:
          $ref: '#/components/schemas/HostConfigID'
        decision:
          $ref: '#/components/schemas/HostConfigDecision'

    ApplyHostConfigRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'

    ApplyHostConfigResult:
      type: object
      required: [files, dockerDataRoot]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/HostConfigChoice'
        dockerDataRoot:
          type: string
          description: >-
            Docker's data-root after this apply (Q62, Q76). Always
            `/var/lib/docker` when containers or images exist, when
            there is no cache disk, or when the caller did not accept
            a move.

    MetricResolution:
      type: string
      enum: [raw, hourly, daily]
      description: Q74 retention tier used for this response.

    MetricPoint:
      type: object
      required: [at, value]
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
          format: double

    MetricSeries:
      type: object
      required: [metric, subject, resolution, from, to, points]
      properties:
        metric:
          type: string
        subject:
          type: string
        resolution:
          $ref: '#/components/schemas/MetricResolution'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    SystemStatus:
      type: object
      required: [healthy, summary]
      properties:
        healthy:
          type: boolean
        summary:
          type: string
        maintenanceMode:
          type: boolean
        arrayDegraded:
          type: boolean
        parityBlocked:
          type: boolean
        activeJobs:
          type: integer
          format: int32

    PoolDiskEntry:
      type: object
      required: [device, mountPoint, role, state]
      properties:
        device:
          type: string
        mountPoint:
          type: string
        role:
          type: string
          enum: [data, parity, cache, boot, external, unassigned]
        state:
          $ref: '#/components/schemas/DiskState'
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        usedBytes:
          type:
            - integer
            - "null"
          format: int64
        freeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Free space from statfs(2) on this disk's mountpoint (doc 09 §5)
            — never a directory walk. Null for a non-data disk, or when
            free-space accounting is unavailable (no array topology yet).
        nearMinFreeSpace:
          type: boolean
          description: >-
            True once this disk's free space is at or below the pool's
            configured minfreespace (doc 09 §1) — the point mergerfs itself
            excludes it from create-policy placement. Omitted when
            freeBytes is not being reported for this disk.
        removalState:
          oneOf:
            - $ref: '#/components/schemas/DiskRemovalState'
            - type: "null"
          description: >-
            doc 09 §4 step 2's own removal state (#359) for this disk.
            Null for a disk that is not currently in removal.

    PoolStatus:
      type: object
      required: [mounted, disks]
      properties:
        mounted:
          type: boolean
        disks:
          type: array
          items:
            $ref: '#/components/schemas/PoolDiskEntry'
        poolFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Sum of data-disk free space (doc 09 §5) — distinct from a `df`
            on the pool mount, which reports the same misleading pool-wide
            total this field exists to be shown alongside rather than
            replace. Null when no array topology is configured yet.
        largestDiskFreeBytes:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            The largest single data disk's free space — the real answer to
            "what is the biggest file I can write" (doc 09 §5).
        largestDiskPath:
          type:
            - string
            - "null"
          description: Mountpoint of the disk largestDiskFreeBytes refers to.

    SpinTransition:
      type: object
      required: [device, fromState, toState, at]
      properties:
        device:
          type: string
          description: e.g. `/dev/sdb` — as recorded, never accepted back as input (doc 01 §7).
        fromState:
          type: string
          enum: [active, standby]
        toState:
          type: string
          enum: [active, standby]
        at:
          type: string
          format: date-time
        awakeDurationSeconds:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Present when this row is a wake (standby → active) and a later
            active → standby transition exists for the same device; seconds
            until that transition.

    DailyWakeCount:
      type: object
      required: [device, date, count]
      properties:
        device:
          type: string
        date:
          type: string
          format: date
          description: UTC calendar day the wakes occurred on.
        count:
          type: integer
          format: int32
          minimum: 0

    WakeEventsResponse:
      type: object
      required: [events, dailyWakeCounts]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpinTransition'
        dailyWakeCounts:
          type: array
          items:
            $ref: '#/components/schemas/DailyWakeCount'

    DiskInventoryEntry:
      type: object
      required: [device, sizeBytes, boot]
      properties:
        device:
          type: string
        sizeBytes:
          type: integer
          format: int64
        model:
          type: string
        serial:
          type: string
        wwn:
          type: string
        boot:
          type: boolean
        failed:
          type: boolean
        weakIdentity:
          type: boolean
        filesystem:
          type: string
          description: >-
            Cached filesystem type from udev (`ID_FS_TYPE`), never probed
            in a way that wakes a standby disk (doc 02 §1, §4, doc 03 §3.1).
        label:
          type: string
          description: Cached filesystem label from udev (`ID_FS_LABEL`).
        smartStatus:
          type: string
          description: >-
            SMART summary from a standby-respecting poll. `standby` when
            the disk was left asleep; `ok` or `failing` from a real read.
        containsData:
          type: boolean
          description: True when udev reports an existing filesystem on the disk.
        looksLikeUnraid:
          type: boolean
          description: >-
            True when the filesystem label matches Unraid's `diskN` /
            `parity` / `cache` naming (doc 05) — a conservative heuristic
            that never mounts the disk to look for `super.dat`.

    ExternalDiskLabel:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      description: Path segment under `/mnt/disks/` (Q72).

    ExternalDisk:
      type: object
      required: [label, device, mountPoint, containerPath, mounted, backupDestination, boot]
      properties:
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        device:
          type: string
        mountPoint:
          type: string
          description: >-
            /mnt/disks/<label> — mounted on request, never automatically.
        containerPath:
          type: string
          description: >-
            The same /mnt/disks/<label> path, exposed as a stable
            bind-mount source for a container (Q72, Unraid Unassigned
            Devices convention).
        mounted:
          type: boolean
        backupDestination:
          type: boolean
          description: Whether this disk's mount is a local backup destination (doc 10 §1).
        boot:
          type: boolean
          description: Always false — the boot device is never offered as external.
        filesystem:
          type: string
        fsUuid:
          type: string
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
        model:
          type: string
        serial:
          type: string

    RegisterExternalDiskRequest:
      type: object
      required: [device, label]
      properties:
        device:
          type: string
        label:
          $ref: '#/components/schemas/ExternalDiskLabel'
        backupDestination:
          type: boolean
          default: false

    UpdateExternalDiskRequest:
      type: object
      properties:
        backupDestination:
          type: boolean

    FormatExternalDiskRequest:
      type: object
      required: [confirmation]
      properties:
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this disk
            (`disk.TopologyPlan.Confirmation`): `ERASE /dev/sdX`. A wrong
            or missing string is refused and formats nothing.

    ArrayDiskRole:
      type: string
      description: A role the array-setup wizard assigns (doc 03 §3.1 step 2). Ignore is omitted — those disks never appear in the plan.
      enum: [parity, data, cache]

    ArrayDiskFilesystem:
      type: string
      description: Filesystem to format with, or to verify when adopt is true (Q23). Parity is always xfs (Q20).
      enum: [xfs, ext4, btrfs]

    ArrayCreatePolicy:
      type: string
      description: Default mergerfs create policy for new shares (doc 02 §1, Q11).
      enum: [mspmfs, mfs, lfs, ff]

    ArrayDiskAssignment:
      type: object
      required: [device, role]
      properties:
        device:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (data and cache only; Q20 forbids this on parity).

    CreateArrayRequest:
      type: object
      required: [disks, confirmation]
      properties:
        disks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ArrayDiskAssignment'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        minFreeSpace:
          type: string
          description: >-
            mergerfs minfreespace in its size-suffix syntax (doc 02 §1),
            e.g. `50G`. Omitted uses the engine default.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation for this plan (doc 03 §3.1 step 6):
            `ERASE /dev/sda, /dev/sdb` listing every device that will be
            formatted, sorted, or `ADOPT ONLY — NOTHING ERASED` when every
            assigned disk is adopted. A wrong or missing string is refused
            and formats nothing.

    AddDiskPlanRequest:
      type: object
      required: [device]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (Q23).

    AddDiskPlan:
      type: object
      required: [device, filesystem, adopt, mountpoint, confirmation]
      properties:
        device:
          type: string
        model:
          type: string
          description: The target disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The disk's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        mountpoint:
          type: string
          description: >-
            The next free `/mnt/diskN` this disk will be mounted at
            (doc 02 §4 "Adding a disk" step 4).
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `addDisk` requires for this plan:
            `ERASE <device>`, or `ADOPT ONLY — NOTHING ERASED` when adopt
            is true.

    AddDiskRequest:
      type: object
      required: [device, confirmation]
      properties:
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskAdd` call.
            A wrong or missing string is refused and formats nothing.

    ReplaceDiskPlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: The existing data disk slot being replaced, e.g. `/mnt/disk2`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
          description: Keep the existing filesystem instead of formatting (Q23).

    ReplaceDiskPlan:
      type: object
      required: [mountpoint, previousDevice, replacementDevice, filesystem, adopt, rebuild, confirmation]
      properties:
        mountpoint:
          type: string
        previousDevice:
          type: string
          description: The device on record for this slot before the replacement.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
        rebuild:
          type: string
          description: >-
            The SnapRAID command this plan's own apply call runs to
            reconstruct the slot's contents from parity (doc 02 §4
            "Replacing a failed disk" step 4), e.g. `snapraid fix -d d2`.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `replaceDisk` requires for this plan:
            `ERASE <replacementDevice>`, or `ADOPT ONLY — NOTHING ERASED`
            when adopt is true.

    ReplaceDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        adopt:
          type: boolean
          default: false
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskReplace`
            call. A wrong or missing string is refused and formats
            nothing.

    DiskUpgradePlanRequest:
      type: object
      required: [mountpoint, device]
      properties:
        mountpoint:
          type: string
          description: >-
            The existing array slot being upgraded, data or parity, e.g.
            `/mnt/disk2` or `/mnt/parity1`.
        device:
          type: string
          description: The replacement disk's device path.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
          description: >-
            Data-disk upgrades only (default xfs); a parity disk is
            always formatted XFS (Q20) regardless of this field.

    DiskUpgradePlan:
      type: object
      required: [mountpoint, role, previousDevice, replacementDevice, filesystem, steps, confirmation]
      properties:
        mountpoint:
          type: string
        role:
          $ref: '#/components/schemas/ArrayDiskRole'
        previousDevice:
          type: string
          description: The device on record for this slot before the upgrade.
        replacementDevice:
          type: string
        model:
          type: string
          description: The replacement disk's own model, for the operator to recognise it by.
        wwn:
          type: string
        serial:
          type: string
        sizeBytes:
          type: integer
          format: int64
        currentFilesystem:
          type: string
          description: The replacement's filesystem before this operation, if any, cached from udev.
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          description: >-
            Parity upgrades only: the fresh `/mnt/parityN` slot the new
            disk will be formatted, mounted and verified at independently
            of the old one (Q71), submitted back unchanged to `upgradeDisk`.
        steps:
          type: array
          items:
            type: string
          description: >-
            The copy/verify/remount steps (data) or copy/verify/switch/check
            steps (parity) this plan's own apply call runs, in order.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `upgradeDisk` requires for this plan:
            `ERASE <replacementDevice>`.

    UpgradeDiskRequest:
      type: object
      required: [mountpoint, device, confirmation]
      properties:
        mountpoint:
          type: string
        device:
          type: string
        filesystem:
          $ref: '#/components/schemas/ArrayDiskFilesystem'
        newMountpoint:
          type: string
          description: >-
            Required, and must equal the matching `planDiskUpgrade` call's
            own `newMountpoint`, when `mountpoint` names a parity slot.
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planDiskUpgrade`
            call. A wrong or missing string is refused and formats
            nothing.

    RebalanceMove:
      type: object
      description: One file a rebalance or evacuation plan moves (doc 09 §3-4).
      required: [share, relPath, sourceBranch, targetBranch, sizeBytes]
      properties:
        share:
          type: string
        relPath:
          type: string
          description: Path relative to the share root.
        sourceBranch:
          type: string
          description: >-
            The share-scoped branch directory the file currently lives on,
            e.g. `/mnt/disk1/media`.
        targetBranch:
          type: string
        sizeBytes:
          type: integer
          format: int64

    RebalanceWarning:
      type: object
      description: >-
        A condition a rebalance or evacuation plan surfaces for review
        before it runs (doc 09 §3's path-preserving caveat) — never
        something the plan itself acts on.
      required: [share, reason]
      properties:
        share:
          type: string
        reason:
          type: string

    RebalancePlan:
      type: object
      required: [moves, warnings, confirmation]
      properties:
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `startRebalance` requires for this
            plan (`REBALANCE`).

    StartRebalanceRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching `planRebalance`
            call (`REBALANCE`). A wrong or missing string is refused and
            nothing runs.

    EvacuationPlan:
      type: object
      required: [mountpoint, moves, warnings, confirmation]
      properties:
        mountpoint:
          type: string
        moves:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceMove'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RebalanceWarning'
        confirmation:
          type: string
          description: >-
            Exact typed confirmation `evacuateDisk` requires for this
            plan (`REMOVE <mountpoint>`).

    EvacuateDiskPlanRequest:
      type: object
      required: [mountpoint]
      properties:
        mountpoint:
          type: string
          description: The data disk slot to evacuate, e.g. `/mnt/disk3`.

    EvacuateDiskRequest:
      type: object
      required: [mountpoint, confirmation]
      properties:
        mountpoint:
          type: string
        confirmation:
          type: string
          description: >-
            Exact typed confirmation from the matching
            `planDiskEvacuation` call. A wrong or missing string is
            refused and nothing runs.

    ParityFreshness:
      type: string
      description: Parity age from `snapraid status` (doc 02 §2).
      enum: [green, amber, red]

    ParityGuardTrigger:
      type: string
      enum: [removed-count, removed-updated-percent, zero-files]

    ParityZeroFilesDisk:
      type: object
      required: [disk, filesBefore]
      properties:
        disk:
          type: string
          description: Data-disk mount point.
        filesBefore:
          type: integer
          format: int32

    ParityGuardState:
      type: object
      required: [wouldBlock]
      properties:
        wouldBlock:
          type: boolean
          description: True when the threshold guard would block a sync (doc 02 §2).
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/ParityGuardTrigger'
        removedCount:
          type: integer
          format: int32
          description: Accounted-for removals compared against the removed-count threshold.
        removedUpdatedPercent:
          type: number
          format: float
          description: Accounted removals plus updated, as a percent of files before the diff.
        zeroFilesDisks:
          type: array
          items:
            $ref: '#/components/schemas/ParityZeroFilesDisk'
        summary:
          type: string
          description: Plain-language why the guard would block, when wouldBlock is true.

    ParityDiffCategory:
      type: string
      description: One doc 02 §2 diff group; moved-by-Hoserva is Q15's relocation manifest match.
      enum: [removed, updated, added, moved, copied, moved_by_hoserva]

    ParityDiffGroup:
      type: object
      required: [category, count, paths]
      properties:
        category:
          $ref: '#/components/schemas/ParityDiffCategory'
        count:
          type: integer
          format: int32
        paths:
          type: array
          items:
            type: string
          description: >-
            `mount/relative` paths when SnapRAID named individual files.
            Empty when only an aggregate count is known (updated, moved).

    ParitySnapshot:
      type: object
      required: [freshness]
      properties:
        freshness:
          $ref: '#/components/schemas/ParityFreshness'
        lastSyncAt:
          type: string
          format: date-time
          description: Last successful sync, when known.
        changedSinceSync:
          type: integer
          format: int32
          description: Files changed since last sync (`status` / change journal).
        dataDisks:
          type: integer
          format: int32
        parityDisks:
          type: integer
          format: int32
        guard:
          $ref: '#/components/schemas/ParityGuardState'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
          description: Present after the last explicit run-diff; omitted until then.

    ParityDiffResult:
      type: object
      required: [groups, guard]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ParityDiffGroup'
        guard:
          $ref: '#/components/schemas/ParityGuardState'

    StartSyncRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        confirm:
          type: boolean
          default: false
          description: Required true to sync past a tripped threshold guard.

    StartScrubRequest:
      type: object
      properties:
        percent:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Scrub percentage cap (doc 01 §3 `hoserva scrub [--percent N]`).

    StartFixRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — fix rewrites data from parity.
        disk:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Data disk number N (`/mnt/diskN`), fixed only on that disk
            (`hoserva fix --disk N`).

    StartShareRelocationRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [cache, array]
          description: >-
            Relocation direction (doc 09 §2, `hoserva share relocate
            <share> --to cache|array`).

    StopArrayRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: >-
            Must be true after reviewing the Q70 stop list the `/storage`
            confirm dialog already shows: refuse new jobs and interrupt
            non-resumable jobs, shut down running VMs, stop containers,
            stop Samba and NFS, then unmount share paths, the catch-all
            and data disks.

    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256

    ShareName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
      description: >-
        A share name is a single path segment on every branch and under
        `/mnt/user` (`pool.ValidateShareName`).

    ShareCacheMode:
      type: string
      description: Per-share cache mode (doc 02 §3, Q12).
      enum: [cache-then-move, cache-only, array-only]

    ShareSMB:
      type: object
      required: [enabled, guest, readOnly, browseable, recycle, timeMachine]
      properties:
        enabled:
          type: boolean
        guest:
          type: boolean
        readOnly:
          type: boolean
        browseable:
          type: boolean
        recycle:
          type: boolean
        timeMachine:
          type: boolean
        timeMachineMaxSize:
          type:
            - string
            - "null"
          description: >-
            Samba `fruit:time machine max size` (Q73), e.g. `500G`.
            Required when timeMachine is true; omitted otherwise.

    ShareNFS:
      type: object
      required: [enabled, hosts, squash]
      properties:
        enabled:
          type: boolean
        hosts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 253
          description: >-
            Allowed NFS clients: DNS hostnames, IPv4 or IPv6 addresses,
            or CIDR subnets (doc 03 §4.2). Required when enabled is true.
        squash:
          type: string
          description: NFS squash option (doc 03 §4.2).
          enum: [root_squash, no_root_squash, all_squash]
        fsid:
          type: string
          format: uuid
          readOnly: true
          description: >-
            The fsid= value RenderNFSExports writes for this share's
            export line (#350, #351). Derived from the share name only;
            ignored on a create or update request. Always present on a
            response — a draft preview can use the saved share's fsid
            because a share cannot be renamed.

    ShareDiskUsage:
      type: object
      required: [disk, bytes]
      properties:
        disk:
          type: string
          description: Data disk mount point currently holding files for this share.
        bytes:
          type: integer
          format: int64
          minimum: 0

    ShareUsage:
      type: object
      required: [totalBytes, perDisk, asOf]
      description: >-
        Bytes used and per-disk distribution as of the last sync
        (doc 02 §1 line 78, doc 03 §4.1-4.2, #223) — computed once as a
        step of the sync job, from SnapRAID's own tracked state, never a
        live directory walk.
      properties:
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        perDisk:
          type: array
          items:
            $ref: '#/components/schemas/ShareDiskUsage'
          description: >-
            Which disks currently hold this share's files, and how much
            (doc 03 §4.2). A disk this share does not currently occupy is
            simply absent, not a zero entry.
        asOf:
          type: string
          format: date-time
          description: When the sync that produced these figures completed.

    MoverSkippedEntry:
      type: object
      required: [share, path, result]
      description: >-
        One file the mover chose not to move (or could not move), with
        why (doc 09 §2, doc 03 §3.6's skipped-because-in-use list).
      properties:
        share:
          type: string
        path:
          type: string
          description: Path relative to the share root.
        bytes:
          type: integer
          format: int64
          minimum: 0
        result:
          type: string
          description: >-
            The mover's own result code (e.g. skipped_open,
            skipped_grace_period, conflict).
        reason:
          type: string
          description: Optional human detail (error text or skip reason).

    MoverRunResult:
      type: object
      required: [startedAt, finishedAt, durationMs, filesMoved, bytesMoved, interrupted, skipped]
      description: >-
        Structured outcome of one finished mover run (#273, doc 09 §2),
        persisted in SQLite rather than only in the job log.
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
        filesMoved:
          type: integer
          format: int32
          minimum: 0
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
        interrupted:
          type: boolean
          description: True when the run stopped early (cancel, stop, or context).
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MoverSkippedEntry'

    CacheUsageBreakdown:
      type: object
      required: [appdataBytes, pendingMovesBytes, otherBytes, computedAt]
      description: >-
        Cache disk byte breakdown for the cache page (doc 03 §3.6),
        computed as a by-product of each mover run (Q87) — never a live
        directory walk on a timer (Q13).
      properties:
        appdataBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes under cache-only shares (appdata and similar).
        pendingMovesBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Bytes still under cache-then-move shares, waiting for a
            future mover pass.
        otherBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Remaining used bytes on the cache filesystem (statfs used
            minus appdata and pending), including non-share paths.
        computedAt:
          type: string
          format: date-time

    Share:
      type: object
      required: [name, path, cacheMode, createPolicy, smb, nfs, usage, createdAt, updatedAt]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        path:
          type: string
          description: The share's mount path (`/mnt/user/<name>`, D10).
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ShareUsage'
          description: >-
            Null when this share has not been through a sync since it was
            created — an honest "not yet synced" state (doc 03 §4.1-4.2),
            never a zero or placeholder that looks like real data.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateShareRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ShareName'
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    UpdateShareRequest:
      type: object
      properties:
        cacheMode:
          $ref: '#/components/schemas/ShareCacheMode'
        createPolicy:
          $ref: '#/components/schemas/ArrayCreatePolicy'
        smb:
          $ref: '#/components/schemas/ShareSMB'
        nfs:
          $ref: '#/components/schemas/ShareNFS'

    ConfirmShareRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true — removes the share definition only.

    DeleteShareDataRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must equal the share name (doc 03 §4.2 typed-confirm).

    ShareBrowseEntry:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, directory]
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        disk:
          type: string
          description: >-
            Holding disk from mergerfs `user.mergerfs.basepath`. Empty
            when the xattr is absent.

    ShareBrowseResult:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
          description: Listed directory, relative to the share root.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShareBrowseEntry'

    UserSummary:
      type: object
      required: [id, username, role, totpEnrolled, hasCredential, lastLogin, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        totpEnrolled:
          type: boolean
          description: Whether TOTP is confirmed and active on this account.
        hasCredential:
          type: boolean
          description: >-
            Whether a Samba/password credential (SMB access) is currently
            provisioned for this account (doc 03 §7). Set the first time
            setUserPassword succeeds for it; there is no separate action
            that clears it short of deleting the account.
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this account last completed sign-in, tracked at
            authentication time — never derived from whether a session is
            still live (doc 03 §7). Null when it has never signed in.
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        role:
          type: string
          description: Defaults to share-only when omitted (Q27).
          enum: [viewer, share-only]

    UpdateUserRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, share-only]

    SetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 127
          description: >-
            Capped at 127 characters, not LoginRequest's 1024: this
            password is also written to the Samba passdb entry, and
            smbpasswd/pdbedit's own NTLM hash has never supported more.

    ShareAccessLevel:
      type: string
      description: Q27, doc 03 §7 — a user or group's access to one share.
      enum: [none, read-only, read-write]

    UserSharePermission:
      type: object
      required: [shareName, access]
      properties:
        shareName:
          $ref: '#/components/schemas/ShareName'
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    UserSharePermissionsResult:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UpdateUserSharePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/UserSharePermission'

    UserPermissionEntry:
      type: object
      required: [userId, username, access]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    GroupPermissionEntry:
      type: object
      required: [groupId, name, access]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        access:
          $ref: '#/components/schemas/ShareAccessLevel'

    SharePermissionsResult:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserPermissionEntry'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPermissionEntry'

    UpdateSharePermissionsRequest:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            type: object
            required: [userId, access]
            properties:
              userId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'
        groups:
          type: array
          items:
            type: object
            required: [groupId, access]
            properties:
              groupId:
                type: string
                format: uuid
              access:
                $ref: '#/components/schemas/ShareAccessLevel'

    UserGroup:
      type: object
      required: [id, name, memberUserIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberUserIds:
          type: array
          items:
            type: string
            format: uuid

    CreateUserGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    SetUserGroupMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid

    Session:
      type: object
      required: [id, userId, username, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: The session's token hash — never the raw session token.
        userId:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ApiTokenRole:
      type: string
      description: >-
        Q43: a token's own scope, always admin or viewer — never
        share-only, since a share-only account has no API access to
        scope (Q27).
      enum: [admin, viewer]

    CreateApiTokenRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A caller-chosen label distinguishing this token from an account's others.
        role:
          $ref: '#/components/schemas/ApiTokenRole'

    ApiTokenSummary:
      type: object
      required: [id, userId, username, name, role, createdAt]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time

    ApiTokenCreated:
      type: object
      required: [id, userId, username, name, role, createdAt, token]
      properties:
        id:
          type: string
          description: The token's own hash — never the raw token value.
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/ApiTokenRole'
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: >-
            The raw bearer value — shown once, on creation, and never
            retrievable again (doc 01 §7).
