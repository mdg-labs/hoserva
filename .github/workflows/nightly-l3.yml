name: Nightly L3

# The L3 VM end-to-end suite (doc 06 §4, §7, Q79, issue #43): install,
# onboarding, array setup, disk yank and reconstruction, `virsh destroy`
# mid-sync recovery, reboot persistence, config backup/restore, the
# Playwright journeys (journey 5 above all — it must never be skipped),
# spindown, and the array stop/start sequence (issue #146).
#
# Runs on a GitHub-hosted runner, matching every other workflow in this
# repository (Q42, D20): there are no self-hosted runners, and S9 (issue
# #10, doc 08 §9) confirmed a single, non-nested QEMU/KVM guest boots
# with real acceleration on a pinned ubuntu-24.04 hosted runner — exactly
# what this suite needs (Q79: "L3 ... run nightly on GitHub-hosted
# runners wherever S9 ... confirm support"). S9 did not exercise libvirt
# itself (its probe drove qemu-system-x86_64 directly) or a full guest
# OS boot, only /dev/kvm access and QMP-confirmed acceleration for a
# minimal initramfs guest — this workflow is this project's first attempt
# at the rest (libvirtd under qemu:///session, a full Debian boot, SSH),
# and its own first run is this workflow's de facto validation of that
# gap, the same way s9-hosted-probe.yml validated the rest of L3's
# prerequisites before ci.yml depended on them.
#
# workflow_dispatch lets the maintainer run it on demand (e.g. before a
# release, per Q79's "required step before every release" fallback);
# schedule runs it nightly against main. Never runs on `pull_request` —
# this is exactly the privileged, slow, resource-heavy job class Q42
# keeps off of untrusted PR code.
#
# workflow_dispatch's own l3_steps input (issue #391) runs only the named
# steps of scripts/vm/run-l3-suite.sh, after its always-run setup — doc 06
# §4 lists the ids. Left empty (the default), every step runs, exactly
# like a full nightly. The schedule trigger has no such input at all, so
# it always runs the full suite regardless of what l3_steps was last set
# to on a manual run.
#
# The l3 job runs as a matrix (issue #392), computed by l3-matrix below
# (scripts/vm/l3-build-matrix.sh): an explicit l3_steps selection runs as
# a single "selected" job, unsplit; no selection (a schedule run, or a
# manual run left at its default) splits into two parallel jobs, each
# with its own runner, VM, HOSERVA_LAB_ID, setup and teardown — one for
# the spindown step's own ~34.5-minute observation window, one for every
# other step — so wall time tracks whichever group takes longer rather
# than their sum. scripts/vm/l3-group-coverage-check.sh fails l3-matrix
# before either group's VM is created if a step in run-l3-suite.sh's own
# L3_STEP_ORDER is missing from both groups, or listed in both.
#
# Every job writes JUnit XML under TEST_REPORT_DIR and uploads it as the
# artifact test-results-<job>[-<group>] (doc 06 §7, issue #632); the
# test-report job renders them all into this run's summary, with each job's
# conclusion. Reporting never gates: the suites keep their own exit status.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      l3_steps:
        description: "Comma-separated L3 step ids to run (doc 06 §4); empty runs every step"
        required: false
        default: ""

permissions:
  contents: read

env:
  TEST_REPORT_DIR: ${{ github.workspace }}/test-results

jobs:
  # Every //go:build lab Go test (issue #328, doc 06 §3): compile on the
  # host with -tags lab, run each binary inside a loop-device lab. Separate
  # from the L3 VM jobs below — no KVM needed, and a lab-test regression
  # turns the nightly red without waiting on either of them (issue #392).
  # The merge-gate lab job in ci.yml also reaches these via `make
  # test-integration`; this job is the nightly signal the issue asked for.
  lab-go:
    name: Lab Go tests (-tags lab)
    if: github.repository == 'mdg-labs/hoserva'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Derive this run's lab id
        id: lab
        run: echo "id=nightly-lab-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: lab-up
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-up

      # test-integration runs smb-check then test-lab (issue #328), so a
      # lab-tagged Go regression fails this job the same way a local
      # `make test-integration HOSERVA_LAB_ID=…` would.
      - name: test-integration
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make test-integration

      - name: lab-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-destroy

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-lab-go
          path: ${{ env.TEST_REPORT_DIR }}
          if-no-files-found: ignore

  # Computes the l3 job's own matrix (issue #392) and fails fast — before
  # either group's VM is created — if run-l3-suite.sh's own step registry
  # and this workflow's two groups have drifted apart. No KVM, no VM,
  # done in well under a minute.
  l3-matrix:
    name: L3 matrix (groups)
    if: github.repository == 'mdg-labs/hoserva'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every L3 step is in exactly one nightly-l3.yml group
        run: scripts/devenv/junit-step.sh l3-matrix l3-group-coverage-check.sh -- scripts/vm/l3-group-coverage-check.sh

      - name: Check a malformed l3_steps selection is refused
        run: scripts/devenv/junit-step.sh l3-matrix l3-step-selection-check.sh -- scripts/vm/l3-step-selection-check.sh

      - name: Build this run's matrix
        id: matrix
        env:
          L3_STEPS_INPUT: ${{ github.event.inputs.l3_steps }}
        run: scripts/vm/l3-build-matrix.sh >> "$GITHUB_OUTPUT"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-l3-matrix
          path: ${{ env.TEST_REPORT_DIR }}
          if-no-files-found: ignore

  l3:
    name: L3 VM suite (${{ matrix.group }})
    needs: l3-matrix
    if: github.repository == 'mdg-labs/hoserva'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.l3-matrix.outputs.matrix) }}
    # Per-entry backstop (l3-build-matrix.sh's job_timeout field): the
    # vm-suite step's own group-sized bound plus this job's setup and
    # teardown, so the job never cancels a step still within that bound.
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      # fetch-depth: 0 — the default (1) skips tags entirely (fetch-tags
      # defaults to false), which would make the vm-suite step's own
      # `git tag --list 'v*'` fallback check below always find nothing
      # and always build the placeholder v0.0.0-beta.1, even once a real
      # release tag exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Distinct per matrix entry (doc 06 §7): two groups running at once
      # must never share a domain name, disk image or forwarded port.
      - name: Derive this run's lab id
        id: lab
        run: echo "id=nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}" >> "$GITHUB_OUTPUT"

      # The same rule s9-hosted-probe.yml's kvm job validated (issue #10,
      # doc 08 §9) — written before triggering, per the community caveat
      # that a late trigger can leave /dev/kvm unwritable.
      - name: Apply the kvm udev rule and settle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-hoserva-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm

      # libvirt is not on the default ubuntu-24.04 image; qemu-utils and
      # xorriso are this harness's own dependencies (create-vm.sh).
      # Installed here, on the ephemeral hosted runner's own passwordless
      # sudo (Q42) — never on the dev host, which deliberately has none
      # of this (CLAUDE.md: no package-manager install there, ever).
      - name: Install libvirt and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libvirt-daemon-system libvirt-clients qemu-system-x86 qemu-utils xorriso
          sudo adduser "$(id -un)" libvirt
          sudo adduser "$(id -un)" kvm

      - name: Start this user's own session libvirtd
        # qemu:///session (never qemu:///system, D20) needs a per-user
        # libvirtd reachable over its own unix socket. No systemd unit
        # ships one: libvirt-daemon-system installs only the system-wide
        # libvirtd.service/.socket, and this image's package set has no
        # virtqemud at all — systemctl --user start virtqemud.socket /
        # libvirtd.socket both fail with "Unit ... not found" every time.
        # None of that is needed: libvirt's client library auto-spawns a
        # per-user libvirtd on first qemu:///session connection when no
        # socket exists yet, with no systemd or root involved — this
        # call is that first connection. loginctl enable-linger keeps the
        # runner's login session (and this auto-spawned daemon under it)
        # alive for the rest of the job rather than tied to one step's
        # process lifetime.
        run: |
          sudo loginctl enable-linger "$(id -un)"
          virsh -c qemu:///session list --all

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc

      - name: Install the .deb build toolchain
        # CI installs the tools deploy.sh's .deb build needs here, the same
        # way the dev host has them for local L3. build-essential is
        # required by dpkg-checkbuilddeps regardless of debian/control's
        # own Build-Depends (Debian policy assumes it's always present);
        # dpkg-dev provides dpkg-buildpackage itself.
        run: sudo apt-get install -y -qq --no-install-recommends debhelper dpkg-dev fakeroot build-essential

      - name: vm-suite
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
          L3_STEPS: ${{ matrix.l3_steps }}
          L3_GROUP: ${{ matrix.group }}
        # timeout-minutes here, not only the job's own backstop above,
        # is what actually gives each group its own group-sized
        # bound (l3-build-matrix.sh's own timeout field): 75 for the
        # spindown group, 60 for the rest group, 105 for an explicit
        # workflow_dispatch selection.
        timeout-minutes: ${{ matrix.timeout }}
        # deploy.sh (rightly) refuses to build against a hand-maintained
        # version string — it wants the latest released 'v*' tag, or an
        # explicit TAG=. Pre-1.0, no tag exists yet, so every nightly run
        # would refuse outright without this fallback. Same placeholder
        # ci.yml's own .deb build job already uses to prove the package
        # keeps building on every push. Once a real tag exists, this
        # condition is false and deploy.sh picks that tag itself instead.
        run: |
          if ! git -C "$GITHUB_WORKSPACE" tag --list 'v*' | grep -q .; then
            export TAG=v0.0.0-beta.1
          fi
          make vm-suite

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-l3-${{ matrix.group }}
          path: ${{ env.TEST_REPORT_DIR }}
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # Runs before vm-destroy tears the guest down. Only the client-side
      # symptom (e.g. an EOF from a dropped connection) reaches vm-suite's
      # own output; the server-side evidence — a panic in hoservad's own
      # journal, or `hoserva doctor`'s report if the daemon is still
      # reachable — only exists on the guest (#222).
      - name: Collect hoservad diagnostics
        if: failure()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: scripts/vm/collect-diagnostics.sh "$GITHUB_WORKSPACE/.vm-diagnostics"

      - name: Upload hoservad diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoservad-diagnostics-${{ matrix.group }}
          path: .vm-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: vm-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make vm-destroy

  # One combined report of every job above (doc 06 §7). It runs whether they
  # passed or not, lists each job's conclusion — a job that failed before it
  # wrote a report still has a row — and succeeds whenever it rendered a
  # summary: the suites own the gate, this job only reports. The artifacts it
  # reads are data, never code.
  test-report:
    name: Test report (doc 06 §7)
    needs: [lab-go, l3-matrix, l3]
    if: always() && github.repository == 'mdg-labs/hoserva'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # No artifact at all (every job died before its upload) is not an error
      # here: the renderer then says no reports were found.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/test-results

      - name: Render the combined report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"
          go run ./scripts/devenv/testreport -needs "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/test-results" > "$RUNNER_TEMP/test-summary.md"
          cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-summary
          path: ${{ runner.temp }}/test-summary.md
