name: CI

# The every-push part of doc 06 §7's pipeline (Q42, R11). This repository is
# public, so a pull request from a fork can make any job here run arbitrary
# code. Every job below runs only on GitHub-hosted, ephemeral runners — there
# are no self-hosted runners (D20, Q79) and none is ever referenced — and
# triggers on `pull_request`, never `pull_request_target`, so PR code never
# runs with base-branch permissions or secrets.
#
# ! Repository setting the maintainer must enable by hand — no workflow or
# ! `gh` call can flip it from in here:
# !   Settings -> Actions -> General -> Fork pull request workflows for
# !   the mdg-labs organisation, or Actions -> General on the repo itself ->
# !   "Require approval for first-time contributors"
#
# The `deb` job below builds the .deb for both architectures on every
# gated run (issue #42, packaging/, Q5) with a fixed placeholder version —
# it only proves the package still builds; publishing a real release only
# happens from release.yml, on a `v*` tag push. Tag pushes do not run
# this workflow.
#
# ! Another repository setting the maintainer must enable by hand: the
# ! `dco` job below only reports pass/fail on the commit — making it a
# ! *required* check (Settings -> Rules -> Rulesets) is a manual pick, and
# ! only once GitHub has seen it report at least once, so it can't be
# ! added until after this job first runs. Require it on the `beta`
# ! ruleset, not just `main`'s: contributor pull requests target `beta`
# ! (CONTRIBUTING.md), so `beta` is where an unsigned commit must actually
# ! be blocked. Keep it required on `main` too if direct changes there
# ! ever bypass the beta -> main promotion PR.
#
# ! Dropping the former Cross-compile (amd64) / Cross-compile (arm64)
# ! jobs means those names must be removed from the `main` (and `beta`,
# ! if present) required-checks ruleset, or the promotion PR cannot
# ! merge. The amd64/arm64 compile-and-package gate is the `deb` matrix;
# ! mockapi compiles in `lint-and-unit`. Same class of hand setting as
# ! the DCO note above.

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to go.mod's `go` directive — update both together.
  GO_VERSION: "1.27.1"
  # For api/'s own tooling (openapi-typescript, Spectral — Q63);
  # api/package.json pins the exact package versions this runs against.
  # web/'s Node version is pinned separately, in web/.nvmrc (Q8, issue #21).
  NODE_VERSION: "24.21.0"

jobs:
  release-signing-pubkey:
    name: Release signing pubkey integrity (Q66, Q67)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare EmbeddedPublicKey to Actions variable
        env:
          HOSERVA_RELEASE_SIGNING_PUBKEY: ${{ vars.HOSERVA_RELEASE_SIGNING_PUBKEY }}
        run: |
          if [ -z "${HOSERVA_RELEASE_SIGNING_PUBKEY:-}" ]; then
            echo "ci.yml: HOSERVA_RELEASE_SIGNING_PUBKEY variable is not set — see scripts/release/lib.sh" >&2
            exit 1
          fi
          pub_file="$(mktemp)"
          trap 'rm -f "$pub_file"' EXIT
          printf '%s' "$HOSERVA_RELEASE_SIGNING_PUBKEY" >"$pub_file"
          result="$(scripts/release/compare-release-pubkey.sh internal/update/pubkey.go "$pub_file")"
          echo "$result"
          [ "$result" = match ]

  dco:
    name: DCO sign-off (CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — check-dco.sh needs the base commit itself, not
      # just the range, to exist locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A fork PR's checkout is the PR's own merge commit, so its copy of
      # scripts/check-dco.sh is attacker-controlled: a contributor could
      # rewrite it to always exit 0 and pass this required check without
      # a real Signed-off-by trailer. Run the base branch's copy instead —
      # untouchable by the PR — falling back to the checked-out copy only
      # when the base doesn't have the script yet (a same-repo, non-fork
      # promotion PR, e.g. beta -> main before this check first lands).
      - name: Resolve a trusted copy of check-dco.sh
        run: |
          base="${{ github.event.pull_request.base.sha || github.sha }}"
          if git cat-file -e "$base:scripts/check-dco.sh" 2>/dev/null; then
            git show "$base:scripts/check-dco.sh" > /tmp/check-dco.sh
          else
            cp scripts/check-dco.sh /tmp/check-dco.sh
          fi
          chmod +x /tmp/check-dco.sh
      # `pull_request`'s own github.sha is a synthetic merge commit
      # (refs/pull/N/merge), not anything a contributor actually signed —
      # check the PR's real head/base instead. Falls back to the push
      # event's before/after range otherwise (covers orchestrate's direct
      # pushes to beta, not just contributor PRs).
      - run: >-
          /tmp/check-dco.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"

  lint-and-unit:
    name: Lint, vet, unit tests (L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Binary install of the pinned release (the action's default). The
      # Go toolchain on PATH is GO_VERSION from setup-go above, so this
      # module (go 1.27.1) loads. Local `make lint` still runs web lint
      # and typecheck; CI's web job owns those. `make lint-go` still
      # fails this job if golangci-lint is missing (issue #130).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - run: make lint-go
      - run: make test-go
      - run: make packaging-test
      # mockapi is not in the .deb; compiling it here keeps that binary
      # gated after the Cross-compile matrix was dropped.
      - run: CGO_ENABLED=0 go build -o /tmp/mockapi ./cmd/mockapi
      # Migration checksums, schema drift and the data-safety scan (D16,
      # Q60) — a plain Go check, no lab or Node needed.
      - run: make db-check

  api:
    name: API contract (D18, Q63)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — api-check's oasdiff step (make api-check) looks up
      # the last release's `v*` tag with `git tag`/`git show`; the default
      # shallow, tag-less checkout would hide any tag once one exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      # Regenerates api/gen/ from api/openapi.yaml and fails if that changes
      # anything committed — the "CI fails if committed output is stale"
      # half of issue #17 — then lints the spec and runs the breaking-change
      # diff (skipped cleanly until a release tag exists, Q63).
      - run: make api-check

  deb:
    name: .deb build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # debhelper, dpkg-dev, fakeroot and build-essential are the tools
      # packaging/debian/rules needs beyond Go and Node, both already set
      # up above — everything else (dpkg-buildpackage, dh, dpkg-deb) ships
      # with Ubuntu's base image. dpkg-checkbuilddeps always requires
      # build-essential regardless of what debian/control declares (Debian
      # policy assumes every build environment has it), so it must be
      # installed here even though this package's own Build-Depends never
      # names it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper dpkg-dev fakeroot build-essential
      # A fixed placeholder tag: this job is the amd64/arm64
      # compile-and-package gate (Q5). release.yml builds and publishes
      # the real thing from an actual `v*` tag.
      - run: scripts/release/build-deb.sh v0.0.0-beta.1 ${{ matrix.arch }} dist

  web:
    name: Web (Q8, D15, issue #21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test
        working-directory: web
      # npm run build is `tsc -b && vite build` — the typecheck gate
      # remains; `npm run typecheck` is kept for local use.
      - run: npm run build
        working-directory: web
      # No outbound request may be baked into the built app (Q49) — SVG/XML
      # namespace URIs and error-message URLs in minified library code
      # (react-router, Base UI, React, Recharts' prop-types, react-router's
      # useSearchParams IE11 polyfill pointer) are not requests and are
      # exempted by name; anything else here is a real regression.
      - name: Check the build makes no outbound request
        working-directory: web
        run: |
          allowed='(www\.w3\.org|react\.dev/errors|base-ui\.com/production-error|react\.i18next\.com|reactrouter\.com|^https?://github\.com/ungap/url-search-params(\.|[?#].*)?$|^https?://fb\.me/use-check-prop-types([?#].*)?$|localhost)'
          found="$(grep -rEho "https?://[^\"'\) ]+" dist | grep -Ev "$allowed" || true)"
          if [ -n "$found" ]; then
            echo "$found"
            echo "web: the build embeds an outbound request Hoserva did not intend (Q49)" >&2
            exit 1
          fi

  lab:
    name: Loop-device lab (L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # test-integration's gen-smb-conf step (issue #219) runs on this
      # runner, not inside the lab container — the lab image itself carries
      # no Go toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Every lab is namespaced by HOSERVA_LAB_ID (Q45); this run's id and
      # attempt number make it unique across concurrent workflow runs on
      # this same runner pool.
      - name: Derive this run's lab id
        id: lab
        run: echo "id=ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: lab-up
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-up
      - name: lab-seed
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-seed
      - name: lab-verify-refusal
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-verify-refusal
      # The lab image carries snapraid (issue #121), so CI exercises one real
      # sync rather than only building and destroying the array.
      - name: lab-snapraid-check
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-snapraid-check
      # The lab image carries samba and smbclient (issue #219), so CI
      # exercises a real smbd against a Hoserva-generated smb.conf rather
      # than only ever running this by hand.
      - name: test-integration
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make test-integration
      # Always tears down, even if a step above failed — an ephemeral
      # hosted runner is destroyed after the job anyway, but leaving this
      # conditional would mean a failed run never proves teardown works.
      - name: lab-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-destroy

  pages-site:
    name: Pages site assembly (Q66)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release/test-pages-site.sh
