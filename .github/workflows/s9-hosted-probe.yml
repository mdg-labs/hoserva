name: S9 hosted-runner probe

# One-off diagnostic workflow for spike S9 (issue #10, doc 08 §9, doc 13
# Q42/Q79) — not part of the merge gate, not run on push or pull_request.
# It exists to answer the one half of S9 the existing `ci.yml` `lab` job
# cannot: whether a hosted runner's /dev/kvm supports a real guest boot.
# The lab half is included too, extended with the one thing ci.yml's own
# lab job doesn't exercise (a SnapRAID sync — snapraid isn't in the
# standing lab image, scripts/devenv/ is out of this spike's scope, so it
# is installed for this job only, the same "spike-only, not baked into the
# image" pattern spikes/s5 and spikes/s7 already use) and an explicit
# apparmor=unconfined necessity check.
#
# Findings land in docs/internal/08-spike-findings.md and spikes/s9/ by
# hand after a run — this workflow's job summaries are the source, not a
# replacement for that write-up (CLAUDE.md, "Spikes").
#
# workflow_dispatch only: never runs on a fork's pull request, never sees
# a secret, and pins ubuntu-24.04 (not ubuntu-latest) so a result stays
# reproducible against a named image (Q42, doc 06 §7).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Loop-device lab + SnapRAID sync (L2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm

      - name: Derive this run's lab id
        # Moved ahead of the AppArmor step after run 35056076616: this step
        # used to sit after it, so when the AppArmor step failed (exit 1),
        # `steps.lab.outputs.id` was never set and the `if: always()`
        # lab-destroy step ran with an empty HOSERVA_LAB_ID, which
        # `lab-require-id` correctly refuses ("set HOSERVA_LAB_ID ...",
        # Makefile:90) — teardown died with a *second*, unrelated failure.
        # Deriving the id first means lab-destroy always has a real id to
        # tear down, whether or not lab-up ever ran; `make lab-destroy`
        # already treats "container does not exist" as a no-op
        # (Makefile lab-destroy target), so this is a safe no-op when
        # lab-up was never reached.
        #
        # Three distinct lab ids are derived from this one base, so the
        # AppArmor experiment's two ephemeral arms and this job's own
        # standing lab-up/lab-seed/lab-verify-refusal/SnapRAID-sync run can
        # never collide: `<id>-apparmor-ctrl`, `<id>-apparmor-var`, and
        # `<id>` itself.
        id: lab
        run: echo "id=s9-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # --- AppArmor necessity check (issue #10) ---
      #
      # Six prior attempts (runs 35049304081, 35056076616, 35057453620,
      # 35068617498, 35071011877, 35075054897) hand-rolled the lab's own
      # recipe — raw `docker run`, manual `mknod`, `losetup`, `mkfs.xfs`,
      # `mount` — in a disposable probe script, to test a property of the
      # REAL lab. CLAUDE.md's first architecture rule is "orchestrate,
      # never reimplement the storage engine", and every one of those six
      # voids traced to a bug in the hand-rolled replica (a missing
      # `mknod`, an undersized image, an EBUSY misread as a denial, a
      # `set -e` abort, a stale result file, and finally a correct-but-
      # inconclusive EBUSY) — never to an actual AppArmor finding. A
      # parallel host-side `sudo dmesg`/`journalctl -k` audit-log capture,
      # added to try to corroborate a denial, also proved nothing: Docker's
      # default AppArmor profile denies with a plain `deny mount,` rule,
      # and in AppArmor a plain `deny` suppresses the audit record — only
      # `audit deny` logs — so "0 denials found" in that capture was never
      # evidence of anything.
      #
      # This rewrite retires all of that (spikes/s9/scripts/
      # apparmor-loop-probe.sh, apparmor-tmpfs-probe.sh,
      # apparmor-classify.sh, run-apparmor-check.sh,
      # test-apparmor-classify.sh, and the host audit capture) and instead
      # runs the REAL lab twice through the real `make lab-up`/
      # `make lab-destroy` targets, with exactly one variable:
      # docker-compose.dev.yml (the artifact under test, never edited for
      # this) already sets `security_opt: [apparmor=unconfined]` — the
      # control arm below runs it completely unmodified; the variant arm
      # adds `-f scripts/devenv/docker-compose.apparmor-default.yml` (via
      # the Makefile's own `LAB_COMPOSE_EXTRA` hook), which puts the lab
      # container back on Docker's default AppArmor profile instead
      # (rendered and read with `docker compose ... config` before being
      # trusted — spikes/s9/results/compose-config-{control,variant}.txt).
      #
      # The success criterion is the one the real lab recipe already has:
      # `scripts/devenv/create-array.sh` runs under `set -euo pipefail`,
      # calls `die` on any failure, and prints "lab <id> ready:" only on
      # success — `make lab-up` already fails loudly (nonzero exit) on
      # anything short of that, so no separate text classification of
      # stderr is needed or attempted here.
      #
      # Verdict discipline, unchanged from every prior attempt:
      #   - control fails  -> the job fails at THIS step, and that failure
      #     is self-evidently not an AppArmor result: the control step
      #     doesn't vary AppArmor at all, it's byte-for-byte today's
      #     already-confirmed lab recipe (run 35057453620). A failure here
      #     means the recipe itself is broken on this runner — investigate
      #     that, not AppArmor.
      #   - variant fails, control succeeded -> reported as REQUIRED,
      #     without failing the job (a concluded finding is not a workflow
      #     failure) — `continue-on-error: true` on the variant step lets
      #     its own real `make lab-up` output stand as the actual error
      #     text, never re-classified or assumed to be a denial.
      #   - both succeed -> NOT-REQUIRED.
      - name: "AppArmor necessity check: control arm (docker-compose.dev.yml unmodified, apparmor=unconfined)"
        id: apparmor_control
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}-apparmor-ctrl
        run: make lab-up

      - name: "AppArmor necessity check: control arm teardown"
        # always(): tears the control lab down whether lab-up above
        # succeeded or failed (a failed lab-up can still have created a
        # container/mounts partway through) — the same reasoning as the
        # standing lab-destroy step at the end of this job.
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}-apparmor-ctrl
        run: make lab-destroy

      - name: "AppArmor necessity check: variant arm (scripts/devenv/docker-compose.apparmor-default.yml added — Docker's default AppArmor profile)"
        # This step only runs if the control step above succeeded (GitHub
        # Actions' default `if: success()` for a step with no `if:`) — a
        # failed control already stopped the job before this point, so the
        # variant is never evaluated against a broken recipe.
        id: apparmor_variant
        continue-on-error: true
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}-apparmor-var
          LAB_COMPOSE_EXTRA: scripts/devenv/docker-compose.apparmor-default.yml
        run: make lab-up

      - name: "AppArmor necessity check: variant arm teardown"
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}-apparmor-var
          LAB_COMPOSE_EXTRA: scripts/devenv/docker-compose.apparmor-default.yml
        run: make lab-destroy

      - name: "AppArmor necessity check: verdict"
        # Exits 0 either way: NOT-REQUIRED and REQUIRED are both real,
        # concluded answers (the check's job is to reach one, not to
        # prefer one) — a VOID (the control step failing, above) has
        # already failed the job loudly before this step is ever reached.
        run: |
          if [ "${{ steps.apparmor_variant.outcome }}" = "success" ]; then
            echo "AppArmor necessity check: NOT-REQUIRED — control (apparmor=unconfined) and variant (Docker's default AppArmor profile) both ran the real lab recipe (make lab-up) to completion on this runner."
          else
            echo "AppArmor necessity check: REQUIRED — control (apparmor=unconfined) succeeded; the variant (Docker's default AppArmor profile) failed. See the 'variant arm' step's own log above for its actual error text — this verdict is read directly from that failure, never assumed or re-classified."
          fi

      - name: lab-up
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-up

      - name: lab-seed
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-seed

      - name: lab-verify-refusal
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-verify-refusal

      - name: SnapRAID sync against the standing array (spike-only install)
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: bash spikes/s9/scripts/hosted-snapraid-check.sh

      - name: lab-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-destroy

  kvm:
    name: /dev/kvm probe + minimal guest boot (L3 precursor, S9/S10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u || echo "no vmx/svm flag found"

      - name: /dev/kvm before any udev rule
        run: |
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm: absent before rule"

      - name: Apply the kvm udev rule and settle
        # The exact rule GitHub's 2024-04-02 changelog entry documents —
        # the issue's own upstream research. Written before triggering, not
        # after, per the community caveat the issue cites: a late trigger
        # can leave /dev/kvm unwritable.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-hoserva-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm

      - name: Boot a minimal guest with KVM acceleration
        run: bash spikes/s9/scripts/kvm-boot-check.sh
