name: S9 hosted-runner probe

# One-off diagnostic workflow for spike S9 (issue #10, doc 08 §9, doc 13
# Q42/Q79) — not part of the merge gate, not run on push or pull_request.
# It exists to answer the one half of S9 the existing `ci.yml` `lab` job
# cannot: whether a hosted runner's /dev/kvm supports a real guest boot.
# The lab half is included too, extended with the one thing ci.yml's own
# lab job doesn't exercise (a SnapRAID sync — snapraid isn't in the
# standing lab image, scripts/devenv/ is out of this spike's scope, so it
# is installed for this job only, the same "spike-only, not baked into the
# image" pattern spikes/s5 and spikes/s7 already use) and an explicit
# apparmor=unconfined necessity check.
#
# Findings land in docs/internal/08-spike-findings.md and spikes/s9/ by
# hand after a run — this workflow's job summaries are the source, not a
# replacement for that write-up (CLAUDE.md, "Spikes").
#
# workflow_dispatch only: never runs on a fork's pull request, never sees
# a secret, and pins ubuntu-24.04 (not ubuntu-latest) so a result stays
# reproducible against a named image (Q42, doc 06 §7).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Loop-device lab + SnapRAID sync (L2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm

      - name: Derive this run's lab id
        # Moved ahead of the AppArmor step after run 35056076616: this step
        # used to sit after it, so when the AppArmor step failed (exit 1),
        # `steps.lab.outputs.id` was never set and the `if: always()`
        # lab-destroy step ran with an empty HOSERVA_LAB_ID, which
        # `lab-require-id` correctly refuses ("set HOSERVA_LAB_ID ...",
        # Makefile:90) — teardown died with a *second*, unrelated failure.
        # Deriving the id first means lab-destroy always has a real id to
        # tear down, whether or not lab-up ever ran; `make lab-destroy`
        # already treats "container does not exist" as a no-op
        # (Makefile lab-destroy target), so this is a safe no-op when
        # lab-up was never reached.
        id: lab
        run: echo "id=s9-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: AppArmor necessity check (disposable, not the standing lab)
        # Mirrors the raw `docker run` recipe doc 08's dev-host S9 finding
        # used, not `make lab-up` — this checks one flag in isolation, so
        # it must not touch docker-compose.dev.yml (out of scope) or the
        # namespaced lab directories a real `make lab-up` owns.
        #
        # Full fix history (runs 35049304081, 35056076616, and this
        # rewrite's own reason — run 35057453620) lives in
        # spikes/s9/scripts/apparmor-classify.sh's header, not repeated
        # here: three void verdicts in a row, never from AppArmor. The
        # short version of the third: the variant's `mount` failed with
        # libmount's EBUSY message ("already mounted or mount point
        # busy") and the step's old `else` branch called that "required"
        # anyway — but an EBUSY means the kernel's AppArmor mount
        # mediation (`security_sb_mount()`) already let the call through;
        # it says nothing about AppArmor at all.
        #
        # This step no longer classifies anything inline. All of the logic
        # — failure classification (never inferred from exit status
        # alone), device attribution (`scripts/devenv/lib.sh`'s own
        # `lab_assert_own_loop()`, reused rather than reinvented), a
        # verified detach barrier between branches, a second loop-free
        # `mount -t tmpfs` mediation probe run alongside the faithful one,
        # and an order-reversal consistency check — lives in
        # spikes/s9/scripts/run-apparmor-check.sh and the scripts it calls,
        # specifically so the pure-text classification part
        # (spikes/s9/scripts/apparmor-classify.sh) can be exercised
        # directly and cheaply, without Docker or a loop device, by
        # spikes/s9/scripts/test-apparmor-classify.sh — see
        # spikes/s9/results/apparmor-classify-test.log for that run,
        # committed alongside this change.
        #
        # Exit status is the verdict: 0 for a concluded NOT-REQUIRED or
        # REQUIRED (either is a real answer — this step's job is to reach
        # one, not to prefer one), 1 for VOID — loud by design, unchanged
        # from the original step's own "abort loudly instead of asserting
        # anything" discipline.
        run: bash spikes/s9/scripts/run-apparmor-check.sh

      - name: lab-up
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-up

      - name: lab-seed
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-seed

      - name: lab-verify-refusal
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-verify-refusal

      - name: SnapRAID sync against the standing array (spike-only install)
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: bash spikes/s9/scripts/hosted-snapraid-check.sh

      - name: lab-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-destroy

  kvm:
    name: /dev/kvm probe + minimal guest boot (L3 precursor, S9/S10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u || echo "no vmx/svm flag found"

      - name: /dev/kvm before any udev rule
        run: |
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm: absent before rule"

      - name: Apply the kvm udev rule and settle
        # The exact rule GitHub's 2024-04-02 changelog entry documents —
        # the issue's own upstream research. Written before triggering, not
        # after, per the community caveat the issue cites: a late trigger
        # can leave /dev/kvm unwritable.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-hoserva-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm

      - name: Boot a minimal guest with KVM acceleration
        run: bash spikes/s9/scripts/kvm-boot-check.sh
