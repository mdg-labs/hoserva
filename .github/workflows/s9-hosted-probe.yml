name: S9 hosted-runner probe

# One-off diagnostic workflow for spike S9 (issue #10, doc 08 §9, doc 13
# Q42/Q79) — not part of the merge gate, not run on push or pull_request.
# It exists to answer the one half of S9 the existing `ci.yml` `lab` job
# cannot: whether a hosted runner's /dev/kvm supports a real guest boot.
# The lab half is included too, extended with the one thing ci.yml's own
# lab job doesn't exercise (a SnapRAID sync — snapraid isn't in the
# standing lab image, scripts/devenv/ is out of this spike's scope, so it
# is installed for this job only, the same "spike-only, not baked into the
# image" pattern spikes/s5 and spikes/s7 already use) and an explicit
# apparmor=unconfined necessity check.
#
# Findings land in docs/internal/08-spike-findings.md and spikes/s9/ by
# hand after a run — this workflow's job summaries are the source, not a
# replacement for that write-up (CLAUDE.md, "Spikes").
#
# workflow_dispatch only: never runs on a fork's pull request, never sees
# a secret, and pins ubuntu-24.04 (not ubuntu-latest) so a result stays
# reproducible against a named image (Q42, doc 06 §7).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Loop-device lab + SnapRAID sync (L2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm

      - name: Derive this run's lab id
        # Moved ahead of the AppArmor step after run 35056076616: this step
        # used to sit after it, so when the AppArmor step failed (exit 1),
        # `steps.lab.outputs.id` was never set and the `if: always()`
        # lab-destroy step ran with an empty HOSERVA_LAB_ID, which
        # `lab-require-id` correctly refuses ("set HOSERVA_LAB_ID ...",
        # Makefile:90) — teardown died with a *second*, unrelated failure.
        # Deriving the id first means lab-destroy always has a real id to
        # tear down, whether or not lab-up ever ran; `make lab-destroy`
        # already treats "container does not exist" as a no-op
        # (Makefile lab-destroy target), so this is a safe no-op when
        # lab-up was never reached.
        id: lab
        run: echo "id=s9-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: AppArmor necessity check (disposable, not the standing lab)
        # Mirrors the raw `docker run` recipe doc 08's dev-host S9 finding
        # used, not `make lab-up` — this checks one flag in isolation, so
        # it must not touch docker-compose.dev.yml (out of scope) or the
        # namespaced lab directories a real `make lab-up` owns.
        #
        # Fixed after run 35049304081: the original probe never `mknod`-ed
        # the container's own /dev/loopN nodes the way the real lab's
        # scripts/devenv/entrypoint.sh does, so `losetup` failed identically
        # in both the with- and without-apparmor=unconfined branches
        # ("device node /dev/loop0 (7:0) is lost") — and the step still
        # printed a confident-sounding "apparmor=unconfined is required"
        # verdict from a control that had itself failed. Fixed by mknod-ing
        # the loop nodes inline (matching the real recipe), giving each
        # branch its own fresh image (a second mkfs.xfs on a reused image
        # refuses with "appears to contain an existing filesystem"), and
        # treating the with-unconfined branch as this experiment's control:
        # if the control itself fails, the recipe is broken and the step
        # aborts loudly instead of asserting anything about AppArmor.
        #
        # Fixed after run 35056076616: with the mknod bug fixed, the control
        # branch reached `mkfs.xfs` for the first time and that exposed the
        # next latent bug — the images were `truncate -s 64M`, but
        # `mkfs.xfs` refuses anything under ~300MB ("Filesystem must be
        # larger than 300MB."). Sized at 512M instead, matching the lab's
        # own LAB_CACHE_SIZE convention (scripts/devenv/create-array.sh) and
        # validated directly against xfsprogs in a disposable container
        # (spikes/s9/results/mkfs-xfs-size-check.log): 256M still refuses,
        # 300M is the first size that succeeds, 512M passes with margin.
        run: |
          set -euo pipefail

          run_probe() {
            local img="$1"; shift
            docker run --rm \
              --cap-add SYS_ADMIN --device /dev/loop-control \
              --device-cgroup-rule 'b 7:* rmw' \
              "$@" \
              -v "$img:/probe.img" debian:trixie-slim bash -c '
                set -euo pipefail
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends util-linux xfsprogs >/dev/null
                for i in $(seq 0 15); do
                  [[ -e "/dev/loop$i" ]] || mknod -m 660 "/dev/loop$i" b 7 "$i"
                done
                dev=$(losetup --find --show /probe.img)
                mkfs.xfs -q "$dev"
                mkdir -p /mnt/probe
                mount "$dev" /mnt/probe
                echo ok > /mnt/probe/marker
                umount /mnt/probe
                losetup -d "$dev"
              '
          }

          img_control="$(mktemp -d)/control.img"
          truncate -s 512M "$img_control"
          echo "## Control: apparmor=unconfined (matches the standing lab's own security_opt)"
          if run_probe "$img_control" --security-opt apparmor=unconfined; then
            echo "control (with-unconfined): succeeded"
          else
            echo "FAIL: the control itself failed with apparmor=unconfined set — the probe recipe (mknod/loop/xfs mechanics) is broken, not an AppArmor result. This step's AppArmor verdict is VOID." >&2
            exit 1
          fi

          img_variant="$(mktemp -d)/variant.img"
          truncate -s 512M "$img_variant"
          echo "## Variant: default Docker AppArmor profile (no apparmor=unconfined)"
          if run_probe "$img_variant"; then
            echo "without-unconfined: succeeded — apparmor=unconfined is NOT required on this runner image for this recipe"
          else
            echo "without-unconfined: FAILED — apparmor=unconfined IS required on this runner image for this recipe"
          fi

      - name: lab-up
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-up

      - name: lab-seed
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-seed

      - name: lab-verify-refusal
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-verify-refusal

      - name: SnapRAID sync against the standing array (spike-only install)
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: bash spikes/s9/scripts/hosted-snapraid-check.sh

      - name: lab-destroy
        if: always()
        env:
          HOSERVA_LAB_ID: ${{ steps.lab.outputs.id }}
        run: make lab-destroy

  kvm:
    name: /dev/kvm probe + minimal guest boot (L3 precursor, S9/S10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          uname -srm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u || echo "no vmx/svm flag found"

      - name: /dev/kvm before any udev rule
        run: |
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm: absent before rule"

      - name: Apply the kvm udev rule and settle
        # The exact rule GitHub's 2024-04-02 changelog entry documents —
        # the issue's own upstream research. Written before triggering, not
        # after, per the community caveat the issue cites: a late trigger
        # can leave /dev/kvm unwritable.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-hoserva-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm

      - name: Boot a minimal guest with KVM acceleration
        run: bash spikes/s9/scripts/kvm-boot-check.sh
