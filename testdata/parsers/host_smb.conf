[global]
   workgroup = WORKGROUP
   server string = already in use

[media]
   path = /srv/media
   browseable = yes
   read only = no

# [ignored]
#    path = /not-a-share

[homes]
   comment = Home Directories
   browseable = no

[printers]
   comment = All Printers
   path = /var/tmp/printers

[print$]
   path = /var/lib/samba/printers
